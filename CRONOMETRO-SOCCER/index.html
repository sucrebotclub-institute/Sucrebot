<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Cronómetro Soccer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  
  <!-- CSS compartido -->
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  
  <style>
    body { background: #ffffff; color: #1a1a2e; }
    main { min-height: calc(100vh - 174px); padding-bottom: 40px; background: #ffffff; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ═══ HERO ═══ */
    .page-hero { padding: 56px 0 32px; text-align: center; }
    .page-hero-badge { 
      display: inline-flex; align-items: center; gap: 8px; 
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%);
      border: 1px solid var(--cyan-dim); color: #ffffff; 
      font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; 
      letter-spacing: 3px; padding: 8px 20px; border-radius: 24px; 
      margin-bottom: 16px; text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(91,200,240,0.3);
    }
    .page-hero-badge-dot { 
      width: 7px; height: 7px; border-radius: 50%; 
      background: var(--cyan); animation: blink 1.6s infinite; 
    }
    @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
    
    .page-hero h1 { 
      font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; 
      letter-spacing: 4px; color: #1a3a6e; line-height: 1; margin: 0 0 12px;
    }
    .page-hero h1 span { color: var(--cyan); }
    .page-hero-sub { 
      display: flex; align-items: center; justify-content: center; 
      gap: 16px; margin-top: 16px; 
    }
    .page-hero-line { 
      flex: 0 0 50px; height: 3px; 
      background: linear-gradient(90deg, transparent, var(--cyan), transparent); 
      border-radius: 2px; 
    }
    .page-hero p { 
      font-size: 13px; color: var(--muted); 
      letter-spacing: 1px; text-transform: uppercase; 
    }

    /* ═══ LAYOUT PRINCIPAL ═══ */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      margin-top: 32px;
    }

    /* ═══ CANCHA (COLUMNA IZQUIERDA) ═══ */
    .cancha-card {
      background: #f8f9fa;
      border-radius: 20px;
      border: 2px solid #e0e7ef;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(26,92,168,0.1);
    }

    .cancha-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e0e7ef;
    }

    .cancha-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--cyan);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .tiempo-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      background: var(--blue);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
    }

    /* ═══ MARCADOR ═══ */
    .marcador {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 24px;
      align-items: center;
      margin-bottom: 32px;
      padding: 24px;
      background: #ffffff;
      border-radius: 16px;
      border: 2px solid #e0e7ef;
      box-shadow: 0 2px 12px rgba(26,92,168,0.08);
    }

    .equipo {
      text-align: center;
    }

    .equipo-nombre {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .equipo-robot {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: #1a3a6e;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .goles-display {
      font-family: 'Orbitron', monospace;
      font-size: 4rem;
      font-weight: 900;
      color: var(--cyan);
      line-height: 1;
      text-shadow: 0 0 20px rgba(91,200,240,0.5);
    }

    .vs-separator {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--muted);
      opacity: 0.5;
    }

    /* ═══ CRONÓMETRO ═══ */
    .cronometro-display {
      text-align: center;
      margin-bottom: 24px;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      border: 2px solid #e0e7ef;
      box-shadow: 0 2px 12px rgba(26,92,168,0.08);
    }

    .tiempo-numero {
      font-family: 'Orbitron', monospace;
      font-size: 6rem;
      font-weight: 900;
      color: var(--cyan);
      line-height: 1;
      letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(91,200,240,0.6);
    }

    .tiempo-numero.alerta {
      color: #ff6b6b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }

    .tiempo-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ═══ CONTROLES ═══ */
    .controles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-control {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-iniciar {
      background: linear-gradient(135deg, #00d95f 0%, #00a046 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0,217,95,0.3);
    }

    .btn-iniciar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,217,95,0.4);
    }

    .btn-pausar {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(251,191,36,0.3);
    }

    .btn-pausar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251,191,36,0.4);
    }

    .btn-reiniciar {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(26,92,168,0.3);
    }

    .btn-reiniciar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,92,168,0.4);
    }

    .btn-terminar {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(239,68,68,0.3);
      grid-column: span 2;
    }

    .btn-terminar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239,68,68,0.4);
    }

    .btn-control:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-gol {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-dim) 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(91,200,240,0.3);
    }

    .btn-gol:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91,200,240,0.4);
    }

    /* ═══ PANEL DERECHO ═══ */
    .panel-derecho {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .config-card, .historial-card {
      background: #f8f9fa;
      border-radius: 20px;
      border: 2px solid #e0e7ef;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(26,92,168,0.1);
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 700;
      padding-bottom: 12px;
      border-bottom: 2px solid #e0e7ef;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      background: #ffffff;
      border: 2px solid #e0e7ef;
      color: #1a3a6e;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      padding: 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(91,200,240,0.1);
    }

    .btn-configurar {
      width: 100%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%);
      color: #ffffff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 16px rgba(26,92,168,0.3);
    }

    .btn-configurar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,92,168,0.4);
    }

    /* ═══ HISTORIAL ═══ */
    .gol-item {
      background: #ffffff;
      border: 2px solid #e0e7ef;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .gol-item:hover {
      border-color: var(--cyan);
      box-shadow: 0 2px 8px rgba(91,200,240,0.2);
    }

    .gol-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gol-emoji {
      font-size: 1.5rem;
    }

    .gol-equipo {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.85rem;
      color: #1a3a6e;
      font-weight: 600;
    }

    .gol-tiempo {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #6b7280;
      background: #f3f4f6;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .empty-hist {
      text-align: center;
      padding: 24px;
      color: #6b7280;
      font-size: 0.85rem;
    }

    /* ═══ TOAST ═══ */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: rgba(0,0,0,0.92);
      color: var(--cyan);
      padding: 16px 28px;
      border-radius: 12px;
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      font-weight: 600;
      z-index: 10000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border: 2px solid rgba(91,200,240,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .panel-derecho {
        order: -1;
      }
    }

    @media (max-width: 768px) {
      .page-hero h1 { font-size: 2.5rem; }
      .tiempo-numero { font-size: 4rem; }
      .goles-display { font-size: 3rem; }
      .equipo-robot { font-size: 1.4rem; }
      .controles-grid { grid-template-columns: 1fr; }
      .btn-terminar { grid-column: span 1; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    
    <!-- HERO -->
    <div class="page-hero">
      <div class="page-hero-badge">
        <div class="page-hero-badge-dot"></div>
        SUCREBOT 2026 · ROBOT SOCCER
      </div>
      <h1>CRONÓMETRO <span>PARTIDO</span></h1>
      <div class="page-hero-sub">
        <div class="page-hero-line"></div>
        <p>Gestión de partidos en tiempo real</p>
        <div class="page-hero-line"></div>
      </div>
    </div>

    <!-- GRID PRINCIPAL -->
    <div class="main-grid">
      
      <!-- COLUMNA IZQUIERDA: CANCHA -->
      <div class="cancha-card">
        <div class="cancha-header">
          <div class="cancha-title">⚽ PARTIDO EN VIVO</div>
          <span class="tiempo-badge" id="tiempo-actual">CONFIGURACIÓN</span>
        </div>

        <!-- MARCADOR -->
        <div class="marcador">
          <div class="equipo">
            <div class="equipo-nombre">Equipo A</div>
            <div class="equipo-robot" id="nombre-equipo-a">—</div>
            <div class="goles-display" id="goles-a">0</div>
          </div>
          
          <div class="vs-separator">VS</div>
          
          <div class="equipo">
            <div class="equipo-nombre">Equipo B</div>
            <div class="equipo-robot" id="nombre-equipo-b">—</div>
            <div class="goles-display" id="goles-b">0</div>
          </div>
        </div>

        <!-- CRONÓMETRO -->
        <div class="cronometro-display">
          <div class="tiempo-numero" id="tiempo-display">05:00</div>
          <div class="tiempo-label">MINUTOS RESTANTES</div>
        </div>

        <!-- CONTROLES -->
        <div class="controles-grid">
          <button class="btn-control btn-iniciar" id="btn-iniciar" onclick="iniciarTiempo()">
            ▶️ Iniciar
          </button>
          <button class="btn-control btn-pausar" id="btn-pausar" onclick="pausarTiempo()" disabled>
            ⏸️ Pausar
          </button>
          <button class="btn-control btn-gol" onclick="registrarGol('A')">
            ⚽ Gol Equipo A
          </button>
          <button class="btn-control btn-gol" onclick="registrarGol('B')">
            ⚽ Gol Equipo B
          </button>
          <button class="btn-control btn-reiniciar" onclick="reiniciarTiempo()" style="grid-column: span 2;">
            🔄 Reiniciar tiempo
          </button>
          <button class="btn-control btn-terminar" id="btn-terminar" onclick="terminarPartido()">
            🏁 Terminar partido
          </button>
        </div>
      </div>

      <!-- COLUMNA DERECHA: PANEL -->
      <div class="panel-derecho">
        
        <!-- CONFIGURACIÓN -->
        <div class="config-card">
          <div class="card-title">⚙️ CONFIGURACIÓN</div>
          
          <div class="form-group">
            <label>Nombre Equipo A</label>
            <input type="text" id="input-equipo-a" placeholder="Robot Equipo A" />
          </div>
          
          <div class="form-group">
            <label>Nombre Equipo B</label>
            <input type="text" id="input-equipo-b" placeholder="Robot Equipo B" />
          </div>
          
          <div class="form-group">
            <label>Duración por tiempo (minutos)</label>
            <input type="number" id="input-duracion" value="5" min="1" max="10" />
          </div>
          
          <button class="btn-configurar" onclick="configurarPartido()">
            ✓ Aplicar configuración
          </button>
        </div>

        <!-- HISTORIAL DE GOLES -->
        <div class="historial-card">
          <div class="card-title">📊 HISTORIAL DE GOLES</div>
          <div id="historial-goles">
            <div class="empty-hist">No hay goles registrados</div>
          </div>
        </div>

      </div>

    </div>

  </div>
</main>

<div data-include="../shared/components/footer.html"></div>

<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();

  // ═══════════════════════════════════════════════════════════
  // VARIABLES DE ESTADO
  // ═══════════════════════════════════════════════════════════
  
  let equipoA = '';
  let equipoB = '';
  let golesA = 0;
  let golesB = 0;
  let duracionMinutos = 5;
  let tiempoRestanteSegundos = 0;
  let tiempoActual = 'config'; // 'config' | 'tiempo1' | 'descanso' | 'tiempo2' | 'finalizado'
  let corriendo = false;
  let intervalId = null;
  let historialGoles = [];

  // ═══════════════════════════════════════════════════════════
  // CONFIGURACIÓN
  // ═══════════════════════════════════════════════════════════

  function configurarPartido() {
    const inputA = document.getElementById('input-equipo-a').value.trim();
    const inputB = document.getElementById('input-equipo-b').value.trim();
    const inputDur = parseInt(document.getElementById('input-duracion').value);

    if (!inputA || !inputB) {
      showToast('⚠️ Ingresa los nombres de ambos equipos', true);
      return;
    }

    if (inputDur < 1 || inputDur > 10) {
      showToast('⚠️ La duración debe estar entre 1 y 10 minutos', true);
      return;
    }

    equipoA = inputA;
    equipoB = inputB;
    duracionMinutos = inputDur;
    tiempoRestanteSegundos = duracionMinutos * 60;

    // Actualizar UI
    document.getElementById('nombre-equipo-a').textContent = equipoA;
    document.getElementById('nombre-equipo-b').textContent = equipoB;
    actualizarDisplayTiempo();

    // Resetear goles e historial
    golesA = 0;
    golesB = 0;
    historialGoles = [];
    actualizarMarcador();
    renderHistorial();

    tiempoActual = 'tiempo1';
    document.getElementById('tiempo-actual').textContent = 'TIEMPO 1';
    document.getElementById('btn-iniciar').disabled = false;

    showToast('✓ Configuración guardada. ¡Listo para empezar!');
  }

  // ═══════════════════════════════════════════════════════════
  // CONTROL DE TIEMPO
  // ═══════════════════════════════════════════════════════════

  function iniciarTiempo() {
    if (!equipoA || !equipoB) {
      showToast('⚠️ Primero configura el partido', true);
      return;
    }

    corriendo = true;
    document.getElementById('btn-iniciar').disabled = true;
    document.getElementById('btn-pausar').disabled = false;

    if (intervalId) clearInterval(intervalId);

    intervalId = setInterval(() => {
      if (tiempoRestanteSegundos > 0) {
        tiempoRestanteSegundos--;
        actualizarDisplayTiempo();

        // Alerta cuando quedan 30 segundos
        if (tiempoRestanteSegundos === 30) {
          showToast('⚠️ ¡30 segundos restantes!', true);
        }
      } else {
        // Tiempo terminado
        pausarTiempo();
        showToast('⏱️ ¡Tiempo terminado!');
        
        if (tiempoActual === 'tiempo1') {
          // Pasar a descanso
          tiempoActual = 'descanso';
          document.getElementById('tiempo-actual').textContent = 'DESCANSO';
          showToast('⏸️ Descanso. Presiona Iniciar para el Tiempo 2');
          tiempoRestanteSegundos = duracionMinutos * 60;
          actualizarDisplayTiempo();
          document.getElementById('btn-iniciar').disabled = false;
          
          // Al iniciar de nuevo, será tiempo 2
          setTimeout(() => {
            if (tiempoActual === 'descanso') {
              tiempoActual = 'tiempo2';
              document.getElementById('tiempo-actual').textContent = 'TIEMPO 2';
            }
          }, 100);
        } else if (tiempoActual === 'tiempo2') {
          // Partido finalizado
          finalizarPartidoAutomatico();
        }
      }
    }, 1000);
  }

  function pausarTiempo() {
    corriendo = false;
    if (intervalId) clearInterval(intervalId);
    document.getElementById('btn-iniciar').disabled = false;
    document.getElementById('btn-pausar').disabled = true;
    document.getElementById('btn-iniciar').innerHTML = '▶️ Reanudar';
  }

  function reiniciarTiempo() {
    if (confirm('¿Reiniciar el tiempo actual?')) {
      pausarTiempo();
      tiempoRestanteSegundos = duracionMinutos * 60;
      actualizarDisplayTiempo();
      document.getElementById('btn-iniciar').innerHTML = '▶️ Iniciar';
      showToast('🔄 Tiempo reiniciado');
    }
  }

  function actualizarDisplayTiempo() {
    const minutos = Math.floor(tiempoRestanteSegundos / 60);
    const segundos = tiempoRestanteSegundos % 60;
    const display = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
    
    const displayEl = document.getElementById('tiempo-display');
    displayEl.textContent = display;

    // Alerta visual en últimos 30 segundos
    if (tiempoRestanteSegundos <= 30 && tiempoRestanteSegundos > 0) {
      displayEl.classList.add('alerta');
    } else {
      displayEl.classList.remove('alerta');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // GOLES
  // ═══════════════════════════════════════════════════════════

  function registrarGol(equipo) {
    if (!equipoA || !equipoB) {
      showToast('⚠️ Primero configura el partido', true);
      return;
    }

    const minutos = Math.floor((duracionMinutos * 60 - tiempoRestanteSegundos) / 60);
    const segundos = (duracionMinutos * 60 - tiempoRestanteSegundos) % 60;
    const momentoGol = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;

    if (equipo === 'A') {
      golesA++;
      historialGoles.unshift({
        equipo: equipoA,
        momento: momentoGol,
        tiempo: tiempoActual === 'tiempo1' ? 'T1' : 'T2'
      });
      showToast(`⚽ ¡Gol de ${equipoA}!`);
    } else {
      golesB++;
      historialGoles.unshift({
        equipo: equipoB,
        momento: momentoGol,
        tiempo: tiempoActual === 'tiempo1' ? 'T1' : 'T2'
      });
      showToast(`⚽ ¡Gol de ${equipoB}!`);
    }

    actualizarMarcador();
    renderHistorial();
  }

  function actualizarMarcador() {
    document.getElementById('goles-a').textContent = golesA;
    document.getElementById('goles-b').textContent = golesB;
  }

  function renderHistorial() {
    const container = document.getElementById('historial-goles');
    
    if (historialGoles.length === 0) {
      container.innerHTML = '<div class="empty-hist">No hay goles registrados</div>';
      return;
    }

    container.innerHTML = historialGoles.map(g => `
      <div class="gol-item">
        <div class="gol-info">
          <div class="gol-emoji">⚽</div>
          <div class="gol-equipo">${g.equipo}</div>
        </div>
        <div class="gol-tiempo">${g.tiempo} ${g.momento}</div>
      </div>
    `).join('');
  }

  // ═══════════════════════════════════════════════════════════
  // FINALIZAR PARTIDO
  // ═══════════════════════════════════════════════════════════

  function finalizarPartidoAutomatico() {
    tiempoActual = 'finalizado';
    document.getElementById('tiempo-actual').textContent = 'FINALIZADO';
    document.getElementById('btn-iniciar').disabled = true;
    document.getElementById('btn-pausar').disabled = true;
    
    const ganador = golesA > golesB ? equipoA : golesB > golesA ? equipoB : 'Empate';
    showToast(`🏁 Partido finalizado. Ganador: ${ganador}`);
    
    guardarResultado();
  }

  async function terminarPartido() {
    if (!equipoA || !equipoB) {
      showToast('⚠️ No hay partido configurado', true);
      return;
    }

    if (!confirm('¿Terminar el partido y guardar resultado?')) {
      return;
    }

    pausarTiempo();
    tiempoActual = 'finalizado';
    document.getElementById('tiempo-actual').textContent = 'FINALIZADO';
    
    await guardarResultado();
  }

  async function guardarResultado() {
    try {
      const ganador = golesA > golesB ? equipoA : golesB > golesA ? equipoB : 'Empate';
      
      const resultado = {
        action: 'pushResultado',
        categoria: 'Robot soccer',
        robot: `${equipoA} vs ${equipoB}`,
        nombre: `Partido Soccer`,
        tiempo: `${golesA}-${golesB}`,
        ronda: tiempoActual === 'tiempo1' ? 'Tiempo 1' : tiempoActual === 'tiempo2' ? 'Tiempo 2' : 'Final',
        intento: 1,
        estado: 'completado',
        nota: `Ganador: ${ganador}`
      };

      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(resultado)
      });

      const data = await response.json();

      if (data.ok) {
        showToast('✓ Resultado guardado correctamente');
      } else {
        throw new Error(data.error || 'Error al guardar');
      }
    } catch (error) {
      console.error('Error al guardar resultado:', error);
      showToast('❌ Error al guardar resultado', true);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // UTILIDADES
  // ═══════════════════════════════════════════════════════════

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ═══════════════════════════════════════════════════════════
  // INICIALIZACIÓN
  // ═══════════════════════════════════════════════════════════

  window.addEventListener('DOMContentLoaded', () => {
    // Verificar autenticación staff
    const user = JSON.parse(localStorage.getItem('sucrebot_user') || '{}');
    const STAFF_EMAILS = window.STAFF_EMAILS || [];
    
    if (!user.email || !STAFF_EMAILS.includes(user.email)) {
      showToast('⚠️ Acceso solo para staff', true);
      setTimeout(() => {
        window.location.href = '../INICIO/';
      }, 2000);
    }
  });
</script>
