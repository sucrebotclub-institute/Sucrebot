<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Torneo Soccer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  
  <style>
    body { background: #ffffff; color: #1a1a2e; }
    main { min-height: calc(100vh - 174px); padding-bottom: 40px; background: #ffffff; }
    .wrapper { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

    /* HERO */
    .page-hero { padding: 56px 0 32px; text-align: center; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%); border: 1px solid var(--cyan-dim); color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 8px 20px; border-radius: 24px; margin-bottom: 16px; text-transform: uppercase; box-shadow: 0 4px 16px rgba(91,200,240,0.3); }
    .page-hero-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
    .page-hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 4px; color: #1a3a6e; line-height: 1; margin: 0 0 12px; }
    .page-hero h1 span { color: var(--cyan); }
    .page-hero-sub { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
    .page-hero-line { flex: 0 0 50px; height: 3px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); border-radius: 2px; }
    .page-hero p { font-size: 13px; color: #6b7280; letter-spacing: 1px; text-transform: uppercase; }

    /* VISTAS */
    .vista { display: none; }
    .vista.active { display: block; }

    /* ═══ VISTA BRACKET ═══ */
    .bracket-container { max-width: 1200px; margin: 32px auto; }

    .equipos-card { background: #f8f9fa; border-radius: 16px; border: 2px solid #e0e7ef; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(26,92,168,0.1); }
    .equipos-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e0e7ef; }
    .equipos-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: #1a3a6e; letter-spacing: 1px; }
    .equipos-count { font-family: 'DM Mono', monospace; font-size: 0.85rem; background: var(--blue); color: #ffffff; padding: 6px 14px; border-radius: 20px; font-weight: 700; }

    .equipos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .equipo-item { background: #ffffff; border: 2px solid #e0e7ef; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .equipo-item:hover { border-color: var(--cyan); box-shadow: 0 2px 12px rgba(91,200,240,0.2); }
    .equipo-emoji { font-size: 1.5rem; }
    .equipo-info { flex: 1; }
    .equipo-nombre-item { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: #1a3a6e; letter-spacing: 0.5px; }
    .equipo-robots { font-size: 0.75rem; color: #6b7280; }

    .btn-generar-bracket { width: 100%; background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%); color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 16px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 16px rgba(26,92,168,0.3); margin-bottom: 12px; }
    .btn-generar-bracket:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,92,168,0.4); }
    .btn-generar-bracket:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .btn-reset-torneo { width: 100%; background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.85rem; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
    .btn-reset-torneo:hover { transform: translateY(-1px); }

    /* Bracket visual */
    .bracket-visual { background: #f8f9fa; border-radius: 16px; border: 2px solid #e0e7ef; padding: 32px; overflow-x: auto; box-shadow: 0 4px 20px rgba(26,92,168,0.1); }
    .bracket-fases { display: flex; gap: 48px; min-width: max-content; }
    .bracket-fase { display: flex; flex-direction: column; gap: 20px; min-width: 280px; }
    .fase-title { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--blue); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; text-align: center; margin-bottom: 12px; }

    .partido-bracket { background: #ffffff; border: 2px solid #e0e7ef; border-radius: 12px; padding: 16px; transition: all 0.2s; }
    .partido-bracket:hover { border-color: var(--cyan); box-shadow: 0 4px 16px rgba(91,200,240,0.2); transform: translateX(4px); }
    .partido-bracket.finalizado { border-color: #00d95f; background: #f0fdf4; }
    .partido-bracket.en-curso { border-color: #fbbf24; background: #fffbeb; }

    .partido-equipos { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .partido-equipo { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e0e7ef; }
    .partido-equipo.ganador { background: #e8f5e9; border-color: #00d95f; font-weight: 700; }
    .partido-equipo-nombre { font-family: 'Exo 2', sans-serif; font-size: 0.9rem; color: #1a3a6e; font-weight: 600; }
    .partido-equipo-goles { font-family: 'Orbitron', monospace; font-size: 1.2rem; color: var(--cyan); font-weight: 700; }

    .btn-jugar-partido { width: 100%; background: linear-gradient(135deg, #00d95f 0%, #00a046 100%); color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.85rem; font-weight: 700; padding: 10px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn-jugar-partido:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,217,95,0.4); }
    .btn-jugar-partido:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .partido-bye { background: #fffbeb; border: 2px dashed #fbbf24; border-radius: 12px; padding: 16px; text-align: center; }
    .bye-equipo { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: #1a3a6e; margin-bottom: 4px; }
    .bye-badge { display: inline-block; background: #fbbf24; color: #78350f; font-family: 'DM Mono', monospace; font-size: 0.7rem; padding: 4px 12px; border-radius: 12px; font-weight: 700; letter-spacing: 0.05em; }

    /* ═══ VISTA PARTIDO ═══ */
    .partido-grid { display: grid; grid-template-columns: 1fr 400px; gap: 24px; margin-top: 32px; }

    .cancha-card { background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%); border-radius: 20px; border: 1px solid rgba(91,200,240,0.2); padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .cancha-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid rgba(91,200,240,0.2); }
    .cancha-title { font-family: 'Orbitron', monospace; font-size: 0.75rem; color: var(--cyan); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; }
    .tiempo-badge { font-family: 'DM Mono', monospace; font-size: 0.75rem; background: var(--blue); color: #ffffff; padding: 6px 16px; border-radius: 20px; font-weight: 700; }

    .marcador { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; margin-bottom: 32px; padding: 24px; background: rgba(10,25,60,0.4); border-radius: 16px; border: 1px solid rgba(91,200,240,0.15); }
    .equipo { text-align: center; }
    .equipo-nombre { font-family: 'Exo 2', sans-serif; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .equipo-robot { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--text); letter-spacing: 1px; margin-bottom: 12px; }
    .goles-display { font-family: 'Orbitron', monospace; font-size: 4rem; font-weight: 900; color: var(--cyan); line-height: 1; text-shadow: 0 0 20px rgba(91,200,240,0.5); }
    .vs-separator { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--muted); opacity: 0.5; }

    .cronometro-display { text-align: center; margin-bottom: 24px; padding: 32px; background: rgba(10,25,60,0.4); border-radius: 16px; border: 2px solid rgba(91,200,240,0.2); }
    .tiempo-numero { font-family: 'Orbitron', monospace; font-size: 6rem; font-weight: 900; color: var(--cyan); line-height: 1; letter-spacing: 0.05em; text-shadow: 0 0 30px rgba(91,200,240,0.6); }
    .tiempo-numero.alerta { color: #ff6b6b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.8;transform:scale(1.02)} }
    .tiempo-label { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.1em; text-transform: uppercase; }

    .controles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .btn-control { font-family: 'Exo 2', sans-serif; font-size: 0.9rem; font-weight: 700; padding: 16px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-iniciar { background: linear-gradient(135deg, #00d95f 0%, #00a046 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(0,217,95,0.3); }
    .btn-iniciar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,217,95,0.4); }
    .btn-pausar { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(251,191,36,0.3); }
    .btn-pausar:hover { transform: translateY(-2px); }
    .btn-reiniciar { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(26,92,168,0.3); }
    .btn-reiniciar:hover { transform: translateY(-2px); }
    .btn-terminar { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(239,68,68,0.3); grid-column: span 2; }
    .btn-terminar:hover { transform: translateY(-2px); }
    .btn-gol { background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-dim) 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(91,200,240,0.3); }
    .btn-gol:hover { transform: translateY(-2px); }
    .btn-control:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    .btn-volver { width: 100%; background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.85rem; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 12px; }
    .btn-volver:hover { transform: translateY(-1px); }

    .panel-derecho { display: flex; flex-direction: column; gap: 24px; }
    .config-card, .historial-card { background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%); border-radius: 20px; border: 1px solid rgba(91,200,240,0.2); padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .card-title { font-family: 'Orbitron', monospace; font-size: 0.7rem; color: var(--cyan); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid rgba(91,200,240,0.2); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; font-weight: 700; }
    .form-group input { width: 100%; background: rgba(10,25,60,0.55); border: 1px solid rgba(91,200,240,0.3); color: var(--text); font-family: 'Exo 2', sans-serif; font-size: 0.9rem; padding: 12px; border-radius: 8px; transition: all 0.2s; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(91,200,240,0.1); }
    .btn-configurar { width: 100%; background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%); color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.85rem; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 16px rgba(26,92,168,0.3); }
    .btn-configurar:hover { transform: translateY(-2px); }

    .gol-item { background: rgba(10,25,60,0.4); border: 1px solid rgba(91,200,240,0.15); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .gol-info { display: flex; align-items: center; gap: 12px; }
    .gol-emoji { font-size: 1.5rem; }
    .gol-equipo { font-family: 'Exo 2', sans-serif; font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .gol-tiempo { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); background: rgba(91,200,240,0.1); padding: 4px 10px; border-radius: 6px; }
    .empty-hist { text-align: center; padding: 24px; color: var(--muted); font-size: 0.85rem; }

    /* Panel penales */
    .penales-panel { background: rgba(251,191,36,0.1); border: 2px solid #fbbf24; border-radius: 16px; padding: 24px; margin-bottom: 16px; display: none; }
    .penales-panel.visible { display: block; }
    .penales-title { font-family: 'Orbitron', monospace; font-size: 0.75rem; color: #fbbf24; letter-spacing: 0.15em; margin-bottom: 16px; font-weight: 700; text-align: center; }
    .penales-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .penal-equipo { text-align: center; }
    .penal-nombre { font-family: 'Exo 2', sans-serif; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .penal-count { font-family: 'Orbitron', monospace; font-size: 3rem; font-weight: 900; color: #fbbf24; line-height: 1; margin-bottom: 8px; }
    .btn-penal { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-family: 'Exo 2', sans-serif; font-weight: 700; cursor: pointer; font-size: 0.85rem; width: 100%; transition: all 0.2s; }
    .btn-penal:hover { transform: translateY(-1px); }
    .btn-definir { width: 100%; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; border: none; border-radius: 10px; padding: 12px; font-family: 'Exo 2', sans-serif; font-weight: 700; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .btn-definir:hover { transform: translateY(-1px); }

    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55); border: 2px solid rgba(0,255,136,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 1024px) { .partido-grid { grid-template-columns: 1fr; } .panel-derecho { order: -1; } }
    @media (max-width: 768px) { .page-hero h1 { font-size: 2.5rem; } .tiempo-numero { font-size: 4rem; } .goles-display { font-size: 3rem; } .equipo-robot { font-size: 1.4rem; } .controles-grid { grid-template-columns: 1fr; } .btn-terminar { grid-column: span 1; } .bracket-fases { gap: 24px; } .bracket-fase { min-width: 220px; } }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    
    <div class="page-hero">
      <div class="page-hero-badge">
        <div class="page-hero-badge-dot"></div>
        SUCREBOT 2026 · ROBOT SOCCER
      </div>
      <h1 id="hero-title">TORNEO <span>SOCCER</span></h1>
      <div class="page-hero-sub">
        <div class="page-hero-line"></div>
        <p id="hero-subtitle">Gestión completa del torneo</p>
        <div class="page-hero-line"></div>
      </div>
    </div>

    <!-- ═══ VISTA BRACKET ═══ -->
    <div class="vista active" id="vista-bracket">
      <div class="bracket-container">
        
        <div class="equipos-card" id="equipos-list-section">
          <div class="equipos-header">
            <div class="equipos-title">⚽ EQUIPOS REGISTRADOS</div>
            <span class="equipos-count" id="equipos-count">0</span>
          </div>
          <div class="equipos-grid" id="equipos-grid"></div>
          <button class="btn-generar-bracket" id="btn-generar" onclick="generarBracket()">
            🏆 Generar Bracket Automático
          </button>
          <button class="btn-reset-torneo" onclick="resetearTorneo()">
            🗑️ Resetear torneo completo
          </button>
        </div>

        <div class="bracket-visual" id="bracket-section" style="display:none;">
          <div id="bracket-content"></div>
          <div style="margin-top:24px;text-align:right;">
            <button class="btn-reset-torneo" style="width:auto;padding:12px 24px;" onclick="resetearTorneo()">
              🗑️ Resetear torneo
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ═══ VISTA PARTIDO ═══ -->
    <div class="vista" id="vista-partido">
      <div class="partido-grid">
        
        <div class="cancha-card">
          <div class="cancha-header">
            <div class="cancha-title">⚽ PARTIDO EN VIVO</div>
            <span class="tiempo-badge" id="tiempo-actual">CONFIGURACIÓN</span>
          </div>

          <div class="marcador">
            <div class="equipo">
              <div class="equipo-nombre">Equipo A</div>
              <div class="equipo-robot" id="nombre-equipo-a-partido">—</div>
              <div class="goles-display" id="goles-a-partido">0</div>
            </div>
            <div class="vs-separator">VS</div>
            <div class="equipo">
              <div class="equipo-nombre">Equipo B</div>
              <div class="equipo-robot" id="nombre-equipo-b-partido">—</div>
              <div class="goles-display" id="goles-b-partido">0</div>
            </div>
          </div>

          <div class="cronometro-display">
            <div class="tiempo-numero" id="tiempo-display">05:00</div>
            <div class="tiempo-label" id="tiempo-fase-label">MINUTOS RESTANTES</div>
          </div>

          <!-- Panel penales (oculto hasta empate) -->
          <div class="penales-panel" id="panel-penales">
            <div class="penales-title">⚽ DEFINICIÓN POR PENALES</div>
            <div class="penales-grid">
              <div class="penal-equipo">
                <div class="penal-nombre" id="penal-nombre-a">Equipo A</div>
                <div class="penal-count" id="pen-a-display">0</div>
                <button class="btn-penal" onclick="registrarPenal('A')" id="btn-penal-a">+ Penal</button>
              </div>
              <div class="penal-equipo">
                <div class="penal-nombre" id="penal-nombre-b">Equipo B</div>
                <div class="penal-count" id="pen-b-display">0</div>
                <button class="btn-penal" onclick="registrarPenal('B')" id="btn-penal-b">+ Penal</button>
              </div>
            </div>
            <button class="btn-definir" onclick="terminarPenales()">🏁 Definir ganador por penales</button>
          </div>

          <div class="controles-grid">
            <button class="btn-control btn-iniciar" id="btn-iniciar-partido" onclick="iniciarTiempo()">▶️ Iniciar</button>
            <button class="btn-control btn-pausar" id="btn-pausar-partido" onclick="pausarTiempo()" disabled>⏸️ Pausar</button>
            <button class="btn-control btn-gol" onclick="registrarGol('A')" id="btn-gol-a">⚽ Gol Equipo A</button>
            <button class="btn-control btn-gol" onclick="registrarGol('B')" id="btn-gol-b">⚽ Gol Equipo B</button>
            <button class="btn-control btn-reiniciar" onclick="reiniciarTiempo()" style="grid-column:span 2;">🔄 Reiniciar tiempo</button>
            <button class="btn-control btn-terminar" id="btn-terminar-partido" onclick="terminarPartido()">🏁 Terminar partido</button>
          </div>
          
          <button class="btn-volver" onclick="volverABracket()">← Volver al Bracket</button>
        </div>

        <div class="panel-derecho">
          <div class="config-card">
            <div class="card-title">⚙️ CONFIGURACIÓN</div>
            <div class="form-group">
              <label>Duración por tiempo (minutos)</label>
              <input type="number" id="input-duracion-partido" value="5" min="1" max="15" />
            </div>
            <button class="btn-configurar" onclick="configurarDuracion()">✓ Aplicar configuración</button>
          </div>

          <div class="historial-card">
            <div class="card-title">📊 HISTORIAL DE GOLES</div>
            <div id="historial-goles-partido"><div class="empty-hist">No hay goles registrados</div></div>
          </div>
        </div>

      </div>
    </div>

  </div>
</main>

<div data-include="../shared/components/footer.html"></div>
<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();

  // ══════════════════════════════════════════════════════════════
  // ESTADO GLOBAL
  // ══════════════════════════════════════════════════════════════
  let vistaActual = 'bracket';
  let equiposRegistrados = [];
  let bracketGenerado = null;
  let partidoActual = null;
  let bracketBloqueado = false;

  // Cronómetro
  let duracionMinutos = 5;
  let tiempoRestanteSegundos = 0;
  let tiempoActual = 'config'; // config | tiempo1 | tiempo2 | penales | finalizado
  let corriendo = false;
  let intervalId = null;
  let historialGoles = [];
  let golesA = 0;
  let golesB = 0;
  let penalesA = 0;
  let penalesB = 0;

  // ══════════════════════════════════════════════════════════════
  // INIT — espera auth.js antes de verificar staff
  // ══════════════════════════════════════════════════════════════
  window.addEventListener('DOMContentLoaded', async () => {
    await cargarEquipos();
  });

  function verificarStaff() {
    const user = JSON.parse(localStorage.getItem('sucrebot_user') || '{}');
    const STAFF = window.STAFF_EMAILS || [];
    if (!user.email || !STAFF.includes(user.email)) {
      showToast('⚠️ Solo personal autorizado — inicia sesión', true);
      return false;
    }
    return true;
  }

  // ══════════════════════════════════════════════════════════════
  // CARGAR EQUIPOS Y BRACKET
  // ══════════════════════════════════════════════════════════════
  async function cargarEquipos() {
    try {
      const r = await fetch(GAS_URL + '?' + new URLSearchParams({ action: 'getEquiposSoccer' }));
      const data = await r.json();

      if (data.ok && Array.isArray(data.equipos)) {
        equiposRegistrados = data.equipos.filter(e => e.estado === 'ACTIVO');
        bracketGenerado = data.bracket || null;
        bracketBloqueado = !!bracketGenerado;
      } else {
        equiposRegistrados = [];
        bracketGenerado = null;
        bracketBloqueado = false;
      }

      renderEquipos();
      if (bracketGenerado) mostrarBracket();

    } catch (e) {
      console.error('Error cargarEquipos:', e);
      showToast('❌ Error al cargar equipos', true);
    }
  }

  // ══════════════════════════════════════════════════════════════
  // RENDER EQUIPOS
  // ══════════════════════════════════════════════════════════════
  function renderEquipos() {
    const grid = document.getElementById('equipos-grid');
    const count = document.getElementById('equipos-count');
    const btn = document.getElementById('btn-generar');

    count.textContent = equiposRegistrados.length;

    if (equiposRegistrados.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#6b7280;padding:24px;">No hay equipos registrados. Ve al Escáner Soccer para agregar equipos.</p>';
      btn.disabled = true;
      btn.textContent = '🏆 Generar Bracket Automático';
      return;
    }

    grid.innerHTML = equiposRegistrados.map(eq => `
      <div class="equipo-item">
        <div class="equipo-emoji">⚽</div>
        <div class="equipo-info">
          <div class="equipo-nombre-item">${eq.nombre}</div>
          <div class="equipo-robots">${eq.robots.length} robots · ${eq.robots.map(r => r.robot || r.id).join(', ')}</div>
        </div>
      </div>
    `).join('');

    if (bracketBloqueado) {
      btn.disabled = true;
      btn.textContent = '🔒 Bracket ya generado';
    } else {
      btn.disabled = equiposRegistrados.length < 2;
      btn.textContent = '🏆 Generar Bracket Automático';
    }
  }

  // ══════════════════════════════════════════════════════════════
  // GENERAR BRACKET
  // ══════════════════════════════════════════════════════════════
  async function generarBracket() {
    if (!verificarStaff()) return;
    if (equiposRegistrados.length < 2) { showToast('⚠️ Se necesitan al menos 2 equipos', true); return; }
    if (bracketBloqueado) { showToast('⚠️ El bracket ya fue generado', true); return; }
    if (!confirm(`¿Generar bracket con ${equiposRegistrados.length} equipos?\nLos emparejamientos serán aleatorios e inmutables.`)) return;

    try {
      const resp = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'generarBracketSoccer', equipos: equiposRegistrados.map(e => e.id) })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Error al generar bracket');

      bracketGenerado = data.bracket;
      bracketBloqueado = true;
      showToast('✓ Bracket generado');
      mostrarBracket();
    } catch (e) {
      console.error(e);
      showToast('❌ Error al generar bracket', true);
    }
  }

  function mostrarBracket() {
    document.getElementById('equipos-list-section').style.display = 'none';
    document.getElementById('bracket-section').style.display = 'block';
    renderBracket();
  }

  function renderBracket() {
    const content = document.getElementById('bracket-content');
    if (!bracketGenerado?.fases) { content.innerHTML = '<p style="color:#6b7280;">Error: Bracket no válido</p>'; return; }

    const fasesHTML = bracketGenerado.fases.map(fase => {
      const partidosHTML = fase.partidos.map(p => {
        if (p.tipo === 'BYE') return `
          <div class="partido-bye">
            <div class="bye-equipo">${p.equipoNombre}</div>
            <div class="bye-badge">BYE — Pasa directo</div>
          </div>`;

        const claseEstado = p.estado === 'FINALIZADO' ? 'finalizado' : p.estado === 'EN_CURSO' ? 'en-curso' : '';
        const golesArr = p.marcador ? p.marcador.split('-') : ['', ''];
        const puedeJugar = p.estado === 'PENDIENTE' && p.equipo_a_id && p.equipo_b_id;

        return `
          <div class="partido-bracket ${claseEstado}">
            <div class="partido-equipos">
              <div class="partido-equipo ${p.ganador_id === p.equipo_a_id ? 'ganador' : ''}">
                <span class="partido-equipo-nombre">${p.equipoA_nombre || '— Por definir —'}</span>
                ${p.marcador ? `<span class="partido-equipo-goles">${golesArr[0]}</span>` : ''}
              </div>
              <div class="partido-equipo ${p.ganador_id === p.equipo_b_id ? 'ganador' : ''}">
                <span class="partido-equipo-nombre">${p.equipoB_nombre || '— Por definir —'}</span>
                ${p.marcador ? `<span class="partido-equipo-goles">${golesArr[1]}</span>` : ''}
              </div>
            </div>
            ${puedeJugar ? `<button class="btn-jugar-partido" onclick='iniciarPartido(${JSON.stringify(p)})'>▶️ Jugar Partido</button>` : ''}
            ${p.estado === 'FINALIZADO' ? `<div style="text-align:center;font-family:'DM Mono',monospace;font-size:0.7rem;color:#00a046;margin-top:8px;font-weight:700;">✓ FINALIZADO ${p.marcador}</div>` : ''}
          </div>`;
      }).join('');

      return `<div class="bracket-fase"><div class="fase-title">${fase.nombre}</div>${partidosHTML}</div>`;
    }).join('');

    content.innerHTML = `<div class="bracket-fases">${fasesHTML}</div>`;
  }

  // ══════════════════════════════════════════════════════════════
  // RESET TORNEO
  // ══════════════════════════════════════════════════════════════
  async function resetearTorneo() {
    if (!verificarStaff()) return;
    if (!confirm('⚠️ ¿Resetear TODO el torneo?\nSe eliminarán todos los equipos y el bracket.\nEsta acción NO se puede deshacer.')) return;

    try {
      const resp = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'resetearTorneoSoccer' })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Error al resetear');

      equiposRegistrados = [];
      bracketGenerado = null;
      bracketBloqueado = false;

      document.getElementById('bracket-section').style.display = 'none';
      document.getElementById('equipos-list-section').style.display = 'block';

      renderEquipos();
      cambiarVista('bracket');
      showToast('✓ Torneo reseteado correctamente');
    } catch (e) {
      console.error(e);
      showToast('❌ Error al resetear: ' + e.message, true);
    }
  }

  // ══════════════════════════════════════════════════════════════
  // CAMBIAR VISTA
  // ══════════════════════════════════════════════════════════════
  function cambiarVista(vista) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
    document.getElementById(`vista-${vista}`).classList.add('active');
    vistaActual = vista;
    if (vista === 'bracket') {
      document.getElementById('hero-title').innerHTML = 'TORNEO <span>SOCCER</span>';
      document.getElementById('hero-subtitle').textContent = 'Gestión completa del torneo';
    } else {
      document.getElementById('hero-title').innerHTML = 'PARTIDO <span>EN VIVO</span>';
      document.getElementById('hero-subtitle').textContent = 'Cronómetro y marcador';
    }
  }

  function volverABracket() {
    if (corriendo && !confirm('¿Volver al bracket? El partido se pausará.')) return;
    if (corriendo) pausarTiempo();
    cambiarVista('bracket');
    cargarEquipos();
  }

  // ══════════════════════════════════════════════════════════════
  // INICIAR PARTIDO
  // ══════════════════════════════════════════════════════════════
  function iniciarPartido(partido) {
    if (!verificarStaff()) return;
    partidoActual = partido;

    document.getElementById('nombre-equipo-a-partido').textContent = partido.equipoA_nombre;
    document.getElementById('nombre-equipo-b-partido').textContent = partido.equipoB_nombre;
    document.getElementById('btn-gol-a').textContent = `⚽ Gol ${partido.equipoA_nombre}`;
    document.getElementById('btn-gol-b').textContent = `⚽ Gol ${partido.equipoB_nombre}`;
    document.getElementById('penal-nombre-a').textContent = partido.equipoA_nombre;
    document.getElementById('penal-nombre-b').textContent = partido.equipoB_nombre;
    document.getElementById('btn-penal-a').textContent = `+ Penal ${partido.equipoA_nombre}`;
    document.getElementById('btn-penal-b').textContent = `+ Penal ${partido.equipoB_nombre}`;

    golesA = 0; golesB = 0; penalesA = 0; penalesB = 0;
    historialGoles = [];
    actualizarMarcadorPartido();
    renderHistorialPartido();
    document.getElementById('panel-penales').classList.remove('visible');

    duracionMinutos = parseInt(document.getElementById('input-duracion-partido').value) || 5;
    tiempoRestanteSegundos = duracionMinutos * 60;
    tiempoActual = 'tiempo1';
    actualizarDisplayTiempo();

    document.getElementById('tiempo-actual').textContent = 'TIEMPO 1';
    document.getElementById('tiempo-fase-label').textContent = 'MINUTOS RESTANTES — TIEMPO 1';
    document.getElementById('btn-iniciar-partido').disabled = false;
    document.getElementById('btn-iniciar-partido').innerHTML = '▶️ Iniciar';
    document.getElementById('btn-pausar-partido').disabled = true;

    cambiarVista('partido');
  }

  // ══════════════════════════════════════════════════════════════
  // CRONÓMETRO
  // ══════════════════════════════════════════════════════════════
  function configurarDuracion() {
    const val = parseInt(document.getElementById('input-duracion-partido').value);
    if (val < 1 || val > 15) { showToast('⚠️ Entre 1 y 15 minutos', true); return; }
    duracionMinutos = val;
    tiempoRestanteSegundos = duracionMinutos * 60;
    actualizarDisplayTiempo();
    showToast('✓ Duración configurada');
  }

  function iniciarTiempo() {
    corriendo = true;
    document.getElementById('btn-iniciar-partido').disabled = true;
    document.getElementById('btn-pausar-partido').disabled = false;
    if (intervalId) clearInterval(intervalId);

    intervalId = setInterval(() => {
      if (tiempoRestanteSegundos > 0) {
        tiempoRestanteSegundos--;
        actualizarDisplayTiempo();
        if (tiempoRestanteSegundos === 30) showToast('⚠️ ¡30 segundos restantes!', true);
      } else {
        pausarTiempo();
        manejarFinDeTiempo();
      }
    }, 1000);
  }

  function manejarFinDeTiempo() {
    showToast('⏱️ ¡Tiempo terminado!');

    if (tiempoActual === 'tiempo1') {
      tiempoActual = 'tiempo2';
      tiempoRestanteSegundos = duracionMinutos * 60;
      actualizarDisplayTiempo();
      document.getElementById('tiempo-actual').textContent = 'TIEMPO 2';
      document.getElementById('tiempo-fase-label').textContent = 'MINUTOS RESTANTES — TIEMPO 2';
      document.getElementById('btn-iniciar-partido').disabled = false;
      document.getElementById('btn-iniciar-partido').innerHTML = '▶️ Iniciar T2';
      showToast('⏸️ Fin T1. Presiona Iniciar para el Tiempo 2');

    } else if (tiempoActual === 'tiempo2') {
      if (golesA === golesB) {
        tiempoActual = 'penales';
        document.getElementById('tiempo-actual').textContent = 'PENALES';
        document.getElementById('tiempo-fase-label').textContent = 'DEFINICIÓN POR PENALES';
        document.getElementById('panel-penales').classList.add('visible');
        document.getElementById('btn-iniciar-partido').disabled = true;
        showToast('⚽ ¡Empate! Definición por penales');
      } else {
        finalizarPartidoAutomatico();
      }
    }
  }

  function pausarTiempo() {
    corriendo = false;
    if (intervalId) clearInterval(intervalId);
    document.getElementById('btn-iniciar-partido').disabled = false;
    document.getElementById('btn-pausar-partido').disabled = true;
    document.getElementById('btn-iniciar-partido').innerHTML = '▶️ Reanudar';
  }

  function reiniciarTiempo() {
    if (!confirm('¿Reiniciar el tiempo actual?')) return;
    pausarTiempo();
    tiempoRestanteSegundos = duracionMinutos * 60;
    actualizarDisplayTiempo();
    document.getElementById('btn-iniciar-partido').innerHTML = '▶️ Iniciar';
    showToast('🔄 Tiempo reiniciado');
  }

  function actualizarDisplayTiempo() {
    const m = Math.floor(tiempoRestanteSegundos / 60);
    const s = tiempoRestanteSegundos % 60;
    const el = document.getElementById('tiempo-display');
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('alerta', tiempoRestanteSegundos <= 30 && tiempoRestanteSegundos > 0);
  }

  // ══════════════════════════════════════════════════════════════
  // GOLES
  // ══════════════════════════════════════════════════════════════
  function registrarGol(equipo) {
    if (tiempoActual === 'penales' || tiempoActual === 'finalizado') return;
    const transcurrido = duracionMinutos * 60 - tiempoRestanteSegundos;
    const m = Math.floor(transcurrido / 60);
    const s = transcurrido % 60;
    const momento = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const nombreEq = equipo === 'A' ? partidoActual.equipoA_nombre : partidoActual.equipoB_nombre;

    if (equipo === 'A') golesA++; else golesB++;
    historialGoles.unshift({ equipo: nombreEq, momento, tiempo: tiempoActual === 'tiempo1' ? 'T1' : 'T2' });
    actualizarMarcadorPartido();
    renderHistorialPartido();
    showToast(`⚽ ¡Gol de ${nombreEq}!`);
  }

  function actualizarMarcadorPartido() {
    document.getElementById('goles-a-partido').textContent = golesA;
    document.getElementById('goles-b-partido').textContent = golesB;
  }

  function renderHistorialPartido() {
    const c = document.getElementById('historial-goles-partido');
    if (!historialGoles.length) { c.innerHTML = '<div class="empty-hist">No hay goles registrados</div>'; return; }
    c.innerHTML = historialGoles.map(g => `
      <div class="gol-item">
        <div class="gol-info"><div class="gol-emoji">⚽</div><div class="gol-equipo">${g.equipo}</div></div>
        <div class="gol-tiempo">${g.tiempo} ${g.momento}</div>
      </div>`).join('');
  }

  // ══════════════════════════════════════════════════════════════
  // PENALES
  // ══════════════════════════════════════════════════════════════
  function registrarPenal(equipo) {
    if (equipo === 'A') { penalesA++; document.getElementById('pen-a-display').textContent = penalesA; }
    else { penalesB++; document.getElementById('pen-b-display').textContent = penalesB; }
    const nombre = equipo === 'A' ? partidoActual.equipoA_nombre : partidoActual.equipoB_nombre;
    showToast(`⚽ Penal anotado: ${nombre}`);
  }

  function terminarPenales() {
    if (penalesA === penalesB) { showToast('⚠️ Sigue el empate en penales. Continúa anotando.', true); return; }
    finalizarPartidoAutomatico();
  }

  // ══════════════════════════════════════════════════════════════
  // FINALIZAR PARTIDO
  // ══════════════════════════════════════════════════════════════
  function finalizarPartidoAutomatico() {
    tiempoActual = 'finalizado';
    document.getElementById('tiempo-actual').textContent = 'FINALIZADO';
    document.getElementById('btn-iniciar-partido').disabled = true;
    document.getElementById('btn-pausar-partido').disabled = true;
    const esPenales = penalesA > 0 || penalesB > 0;
    const ganador = esPenales
      ? (penalesA > penalesB ? partidoActual.equipoA_nombre : partidoActual.equipoB_nombre)
      : (golesA > golesB ? partidoActual.equipoA_nombre : partidoActual.equipoB_nombre);
    showToast(`🏆 Ganador: ${ganador}`);
    guardarResultado();
  }

  async function terminarPartido() {
    if (!verificarStaff()) return;
    if (!partidoActual) { showToast('⚠️ No hay partido en curso', true); return; }
    if (tiempoActual === 'penales' && penalesA === penalesB) { showToast('⚠️ Debes definir el ganador en penales', true); return; }
    if (golesA === golesB && tiempoActual !== 'penales' && tiempoActual !== 'finalizado') {
      showToast('⚠️ Hay empate — espera el fin del T2 o define por penales', true); return;
    }
    if (!confirm('¿Terminar el partido y guardar resultado?')) return;
    pausarTiempo();
    await guardarResultado();
  }

  async function guardarResultado() {
    const esPenales = penalesA > 0 || penalesB > 0;
    let ganador_id, marcador;

    if (esPenales) {
      if (penalesA === penalesB) { showToast('⚠️ Empate en penales. Continúa.', true); return; }
      ganador_id = penalesA > penalesB ? partidoActual.equipo_a_id : partidoActual.equipo_b_id;
      marcador = `${golesA}-${golesB} (pen ${penalesA}-${penalesB})`;
    } else {
      if (golesA === golesB) { showToast('⚠️ No puede haber empate sin penales.', true); return; }
      ganador_id = golesA > golesB ? partidoActual.equipo_a_id : partidoActual.equipo_b_id;
      marcador = `${golesA}-${golesB}`;
    }

    const ganadorNombre = ganador_id === partidoActual.equipo_a_id
      ? partidoActual.equipoA_nombre : partidoActual.equipoB_nombre;

    try {
      const resp = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'registrarResultadoSoccer', partido_id: partidoActual.id, ganador_id, marcador })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Error al guardar');
      showToast(`✓ Ganador: ${ganadorNombre}`);
      setTimeout(() => volverABracket(), 2000);
    } catch (e) {
      console.error(e);
      showToast('❌ Error al guardar resultado', true);
    }
  }

  // ══════════════════════════════════════════════════════════════
  // UTILIDADES
  // ══════════════════════════════════════════════════════════════
  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>

</body>
</html>
