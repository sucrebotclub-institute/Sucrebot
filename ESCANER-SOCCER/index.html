<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Escáner Soccer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="../shared/js/config.js"></script>
  
  <!-- CSS compartido -->
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  
  <style>
    /* Fondo blanco */
    body { background: #ffffff !important; color: #1a1a2e !important; }
    main { min-height: calc(100vh - 174px); background: #ffffff; }

    /* ── ESTILOS ESCÁNER ── */
    .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
    
    /* Page hero */
    .page-hero { 
      padding: 56px 0 24px; 
      border-bottom: 1px solid rgba(26,92,168,0.15); 
      margin-bottom: 24px;
    }
    .page-hero-content { width: 100%; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; border: 1px solid #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

    /* Grid principal */
    .main-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    /* ── VIDEO ESCÁNER ── */
    .video-card {
      background: #f8f9fa;
      border-radius: 16px;
      border: 2px solid #e0e7ef;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(26,92,168,0.1);
    }

    .video-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #1a5ca8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 700;
    }

    #qr-reader {
      width: 100%;
      background: #0d2a4a;
      border-radius: 12px;
      overflow: hidden;
      min-height: 320px;
      position: relative;
    }

    #qr-video {
      width: 100%;
      display: none;
      border-radius: 12px;
    }

    #qr-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 320px;
      color: rgba(255,255,255,0.5);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      flex-direction: column;
      gap: 12px;
    }

    .btn-camera {
      width: 100%;
      margin-top: 16px;
      background: #1a5ca8;
      border: none;
      color: #ffffff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(26,92,168,0.3);
    }

    .btn-camera:hover {
      background: #0e4a8f;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(26,92,168,0.4);
    }

    .btn-camera.active {
      background: #d93025;
    }

    .btn-camera.active:hover {
      background: #b71c1c;
    }

    /* ── EQUIPOS ── */
    .equipos-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .equipo-card {
      background: #f8f9fa;
      border-radius: 16px;
      border: 2px solid #e0e7ef;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(26,92,168,0.1);
      transition: all 0.3s;
    }

    .equipo-card.completo {
      border-color: #00d95f;
      background: #f0fdf4;
    }

    .equipo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e0e7ef;
    }

    .equipo-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: #1a3a6e;
      letter-spacing: 1px;
    }

    .equipo-status {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .equipo-status.incompleto {
      background: #fff3cd;
      color: #856404;
    }

    .equipo-status.completo {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .robot-slot {
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .robot-slot.empty {
      border-style: dashed;
    }

    .robot-slot.filled {
      border-style: solid;
      border-color: #1a5ca8;
      background: #ffffff;
    }

    .robot-slot-empty {
      text-align: center;
      color: #94a3b8;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .robot-info {
      flex: 1;
    }

    .robot-nombre {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .robot-robot {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: #1a3a6e;
      letter-spacing: 0.5px;
    }

    .robot-institucion {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .btn-remove {
      background: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Exo 2', sans-serif;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    /* ── CONTROLES ── */
    .controles-card {
      background: #f8f9fa;
      border-radius: 16px;
      border: 2px solid #e0e7ef;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(26,92,168,0.1);
      margin-top: 24px;
    }

    .btn-action {
      width: 100%;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .btn-reset {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(107,114,128,0.3);
    }

    .btn-reset:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(107,114,128,0.4);
    }

    .btn-iniciar {
      background: linear-gradient(135deg, #00d95f 0%, #00a046 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0,217,95,0.3);
    }

    .btn-iniciar:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,217,95,0.4);
    }

    .btn-iniciar:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 2px solid rgba(0,255,136,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .page-hero h2 { font-size: 2rem; }
      .video-card { padding: 16px; }
      .equipo-card { padding: 16px; }
      .controles-card { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    <div class="page-hero">
      <div class="page-hero-content">
        <div class="page-hero-badge">
          <div class="page-hero-badge-dot"></div>
          SUCREBOT 2026 · ROBOT SOCCER
        </div>
        <h2>ESCÁNER <span>EQUIPOS</span></h2>
        <div class="page-hero-sub">
          <div class="page-hero-line"></div>
          <p>FORMACIÓN DE EQUIPOS 2 VS 2</p>
        </div>
      </div>
    </div>

    <div class="main-grid">
      
      <!-- COLUMNA IZQUIERDA: ESCÁNER -->
      <div class="video-card">
        <div class="video-label">📷 ESCÁNER QR</div>
        <div id="qr-reader">
          <video id="qr-video" playsinline></video>
          <div id="qr-placeholder">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>PRESIONA ACTIVAR CÁMARA</span>
          </div>
        </div>
        <button class="btn-camera" id="btn-camera" onclick="toggleScanner()">📷 Activar cámara</button>
      </div>

      <!-- COLUMNA DERECHA: EQUIPOS -->
      <div class="equipos-container">
        
        <!-- EQUIPO A -->
        <div class="equipo-card" id="card-equipo-a">
          <div class="equipo-header">
            <div class="equipo-title">⚽ EQUIPO A</div>
            <span class="equipo-status incompleto" id="status-a">0/2</span>
          </div>
          
          <div class="robot-slot empty" id="slot-a1">
            <div class="robot-slot-empty">
              <div>🤖 ROBOT 1</div>
              <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
            </div>
          </div>
          
          <div class="robot-slot empty" id="slot-a2">
            <div class="robot-slot-empty">
              <div>🤖 ROBOT 2</div>
              <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
            </div>
          </div>
        </div>

        <!-- EQUIPO B -->
        <div class="equipo-card" id="card-equipo-b">
          <div class="equipo-header">
            <div class="equipo-title">⚽ EQUIPO B</div>
            <span class="equipo-status incompleto" id="status-b">0/2</span>
          </div>
          
          <div class="robot-slot empty" id="slot-b1">
            <div class="robot-slot-empty">
              <div>🤖 ROBOT 1</div>
              <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
            </div>
          </div>
          
          <div class="robot-slot empty" id="slot-b2">
            <div class="robot-slot-empty">
              <div>🤖 ROBOT 2</div>
              <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- CONTROLES -->
    <div class="controles-card">
      <button class="btn-action btn-reset" onclick="resetearEquipos()">
        🔄 Resetear equipos
      </button>
      <button class="btn-action btn-iniciar" id="btn-iniciar" onclick="enviarACronometro()" disabled>
        🚀 Iniciar partido (0/4 escaneados)
      </button>
    </div>

  </div>
</main>

<div data-include="../shared/components/footer.html"></div>

<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  
  // ══════════════════════════════════════════════════════════════
  // ESTADO DE EQUIPOS
  // ══════════════════════════════════════════════════════════════
  
  let equipoA = [null, null]; // [robot1, robot2]
  let equipoB = [null, null]; // [robot1, robot2]
  
  let codeReader = null;
  let videoStream = null;
  let scannerActivo = false;
  
  let ultimoQrProcesado = null;
  let tiempoUltimoQr = 0;
  
  // Cache de participantes
  let cacheParticipantes = [];
  
  // ══════════════════════════════════════════════════════════════
  // CARGAR CACHE
  // ══════════════════════════════════════════════════════════════
  
  window.addEventListener('DOMContentLoaded', async () => {
    await actualizarCache();
  });
  
  async function actualizarCache() {
    console.log('🔄 Cargando participantes...');
    try {
      const qs = new URLSearchParams({ action: 'getParticipantes' }).toString();
      const r = await fetch(GAS_URL + '?' + qs);
      const participantes = await r.json();
      
      if (Array.isArray(participantes) && participantes.length > 0) {
        // Filtrar solo categoría Soccer
        cacheParticipantes = participantes.filter(p => 
          p.categoria === 'Robot soccer' && p.aprobado === 'APROBADO'
        );
        console.log(`✅ ${cacheParticipantes.length} participantes de Soccer disponibles`);
      }
    } catch (error) {
      console.error('❌ Error al cargar participantes:', error);
      showToast('Error al cargar participantes', true);
    }
  }
  
  // ══════════════════════════════════════════════════════════════
  // ESCÁNER
  // ══════════════════════════════════════════════════════════════
  
  async function toggleScanner() {
    if (scannerActivo) {
      stopScanner();
    } else {
      await iniciarScanner();
    }
  }
  
  async function iniciarScanner() {
    try {
      codeReader = new ZXing.BrowserMultiFormatReader();
      const videoInputDevices = await codeReader.listVideoInputDevices();
      
      if (videoInputDevices.length === 0) {
        showToast('No se detectaron cámaras', true);
        return;
      }
      
      let selectedDeviceId = null;
      const backCamera = videoInputDevices.find(device =>
        /back|rear|environment|trasera/i.test(device.label)
      );
      
      if (backCamera) {
        selectedDeviceId = backCamera.deviceId;
      } else if (videoInputDevices.length > 1) {
        selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
      } else {
        selectedDeviceId = videoInputDevices[0].deviceId;
      }
      
      document.getElementById('qr-placeholder').style.display = 'none';
      document.getElementById('qr-video').style.display = 'block';
      
      codeReader.decodeFromVideoDevice(selectedDeviceId, 'qr-video', (result, err) => {
        if (result) {
          procesarQR(result.text);
        }
      });
      
      const video = document.getElementById('qr-video');
      videoStream = video.srcObject;
      
      scannerActivo = true;
      const btn = document.getElementById('btn-camera');
      btn.textContent = '⏸ Detener cámara';
      btn.classList.add('active');
      
    } catch (error) {
      console.error('Error al iniciar escáner:', error);
      showToast('Error al iniciar la cámara', true);
    }
  }
  
  function stopScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    
    if (videoStream) {
      const tracks = videoStream.getTracks();
      tracks.forEach(track => track.stop());
      videoStream = null;
    }
    
    const video = document.getElementById('qr-video');
    if (video.srcObject) {
      video.srcObject = null;
    }
    
    document.getElementById('qr-video').style.display = 'none';
    document.getElementById('qr-placeholder').style.display = 'flex';
    
    scannerActivo = false;
    const btn = document.getElementById('btn-camera');
    btn.textContent = '📷 Activar cámara';
    btn.classList.remove('active');
  }
  
  // ══════════════════════════════════════════════════════════════
  // PROCESAR QR
  // ══════════════════════════════════════════════════════════════
  
  async function procesarQR(qrData) {
    console.log('QR escaneado (RAW):', qrData);
    
    // Evitar duplicados
    const ahora = Date.now();
    if (qrData === ultimoQrProcesado && (ahora - tiempoUltimoQr) < 1500) {
      console.log('⏭ Ignorando QR duplicado');
      return;
    }
    
    ultimoQrProcesado = qrData;
    tiempoUltimoQr = ahora;
    
    try {
      // Extraer ID
      let codigo = extraerIdDelQR(qrData);
      console.log('ID extraído:', codigo);
      
      if (!codigo) {
        showToast('⚠️ QR inválido', true);
        return;
      }
      
      // Buscar en cache
      let participante = cacheParticipantes.find(p => p.id === codigo);
      
      if (!participante) {
        showToast('⚠️ Participante no encontrado o no aprobado', true);
        return;
      }
      
      // Verificar que sea de Soccer
      if (participante.categoria !== 'Robot soccer') {
        showToast('⚠️ Este participante no es de Robot Soccer', true);
        return;
      }
      
      // Verificar si ya fue agregado
      const yaAgregado = [...equipoA, ...equipoB].some(r => r && r.id === participante.id);
      if (yaAgregado) {
        showToast('⚠️ Este robot ya fue escaneado', true);
        return;
      }
      
      // Agregar al primer slot disponible
      agregarRobot(participante);
      
    } catch (error) {
      console.error('❌ Error al procesar QR:', error);
      showToast('❌ Error al procesar QR', true);
    }
  }
  
  function extraerIdDelQR(rawText) {
    if (!rawText) return null;
    
    let texto = String(rawText).trim();
    
    // JSON
    try {
      const json = JSON.parse(texto);
      if (json && json.id) return String(json.id).trim();
    } catch(e) {}
    
    // URL
    if (texto.includes('?id=') || texto.includes('&id=')) {
      const matchUrl = texto.match(/[?&]id=([^&\s]+)/i);
      if (matchUrl) return decodeURIComponent(matchUrl[1]).trim();
    }
    
    // Etiqueta
    const matchEtiqueta = texto.match(/ID\s*[:=]\s*([^\|\n\r]+)/i);
    if (matchEtiqueta) return matchEtiqueta[1].trim();
    
    // Patrón sb-YYYY-XXX-NNN
    const matchPatron = texto.match(/sb-\d{4}-[a-z_]+-\d{3}/i);
    if (matchPatron) return matchPatron[0].toLowerCase().trim();
    
    // Fallback
    const limpio = texto.replace(/[\r\n]+/g, '').trim();
    if (limpio && limpio.length < 100 && !limpio.includes(' ')) {
      return limpio;
    }
    
    return null;
  }
  
  // ══════════════════════════════════════════════════════════════
  // GESTIÓN DE EQUIPOS
  // ══════════════════════════════════════════════════════════════
  
  function agregarRobot(participante) {
    // Buscar primer slot vacío en Equipo A
    if (equipoA[0] === null) {
      equipoA[0] = participante;
      renderSlot('a1', participante);
      showToast(`✓ ${participante.robot} → Equipo A (Robot 1)`);
    } else if (equipoA[1] === null) {
      equipoA[1] = participante;
      renderSlot('a2', participante);
      showToast(`✓ ${participante.robot} → Equipo A (Robot 2)`);
    }
    // Buscar primer slot vacío en Equipo B
    else if (equipoB[0] === null) {
      equipoB[0] = participante;
      renderSlot('b1', participante);
      showToast(`✓ ${participante.robot} → Equipo B (Robot 1)`);
    } else if (equipoB[1] === null) {
      equipoB[1] = participante;
      renderSlot('b2', participante);
      showToast(`✓ ${participante.robot} → Equipo B (Robot 2)`);
    } else {
      showToast('⚠️ Todos los slots están llenos', true);
      return;
    }
    
    actualizarEstados();
  }
  
  function renderSlot(slotId, participante) {
    const slot = document.getElementById(`slot-${slotId}`);
    slot.className = 'robot-slot filled';
    slot.innerHTML = `
      <div class="robot-info">
        <div class="robot-nombre">${participante.nombre || '—'}</div>
        <div class="robot-robot">${participante.robot || '—'}</div>
        <div class="robot-institucion">${participante.institucion || '—'}</div>
      </div>
      <button class="btn-remove" onclick="removerRobot('${slotId}')">✕</button>
    `;
  }
  
  function removerRobot(slotId) {
    const [equipo, pos] = slotId.split('');
    const index = parseInt(pos) - 1;
    
    if (equipo === 'a') {
      equipoA[index] = null;
    } else {
      equipoB[index] = null;
    }
    
    const slot = document.getElementById(`slot-${slotId}`);
    slot.className = 'robot-slot empty';
    slot.innerHTML = `
      <div class="robot-slot-empty">
        <div>🤖 ROBOT ${parseInt(pos)}</div>
        <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
      </div>
    `;
    
    actualizarEstados();
    showToast('Robot removido');
  }
  
  function resetearEquipos() {
    if (!confirm('¿Resetear todos los equipos?')) return;
    
    equipoA = [null, null];
    equipoB = [null, null];
    
    ['a1', 'a2', 'b1', 'b2'].forEach(slotId => {
      const slot = document.getElementById(`slot-${slotId}`);
      const pos = slotId.charAt(1);
      slot.className = 'robot-slot empty';
      slot.innerHTML = `
        <div class="robot-slot-empty">
          <div>🤖 ROBOT ${pos}</div>
          <div style="font-size:0.65rem;margin-top:4px;">Esperando escaneo...</div>
        </div>
      `;
    });
    
    actualizarEstados();
    showToast('Equipos reseteados');
  }
  
  function actualizarEstados() {
    // Equipo A
    const countA = equipoA.filter(r => r !== null).length;
    const statusA = document.getElementById('status-a');
    statusA.textContent = `${countA}/2`;
    statusA.className = countA === 2 ? 'equipo-status completo' : 'equipo-status incompleto';
    
    const cardA = document.getElementById('card-equipo-a');
    cardA.className = countA === 2 ? 'equipo-card completo' : 'equipo-card';
    
    // Equipo B
    const countB = equipoB.filter(r => r !== null).length;
    const statusB = document.getElementById('status-b');
    statusB.textContent = `${countB}/2`;
    statusB.className = countB === 2 ? 'equipo-status completo' : 'equipo-status incompleto';
    
    const cardB = document.getElementById('card-equipo-b');
    cardB.className = countB === 2 ? 'equipo-card completo' : 'equipo-card';
    
    // Botón iniciar
    const total = countA + countB;
    const btnIniciar = document.getElementById('btn-iniciar');
    btnIniciar.textContent = `🚀 Iniciar partido (${total}/4 escaneados)`;
    btnIniciar.disabled = total !== 4;
  }
  
  // ══════════════════════════════════════════════════════════════
  // ENVIAR A CRONÓMETRO
  // ══════════════════════════════════════════════════════════════
  
  async function enviarACronometro() {
    const total = [...equipoA, ...equipoB].filter(r => r !== null).length;
    
    if (total !== 4) {
      showToast('⚠️ Debes escanear 4 robots (2 por equipo)', true);
      return;
    }
    
    try {
      // Preparar datos para enviar
      const datosPartido = {
        action: 'setActivo',
        ruta: 'SOC', // Ruta para Soccer
        partido: {
          equipoA: equipoA.map(r => ({
            id: r.id,
            robot: r.robot,
            nombre: r.nombre,
            institucion: r.institucion
          })),
          equipoB: equipoB.map(r => ({
            id: r.id,
            robot: r.robot,
            nombre: r.nombre,
            institucion: r.institucion
          })),
          timestamp: Date.now()
        }
      };
      
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datosPartido)
      });
      
      const data = await response.json();
      
      if (data.ok) {
        showToast('✓ Equipos enviados al cronómetro');
        
        // Redirigir al cronómetro Soccer
        setTimeout(() => {
          window.location.href = '../CRONOMETRO-SOCCER/';
        }, 1500);
      } else {
        throw new Error(data.error || 'Error al enviar');
      }
      
    } catch (error) {
      console.error('Error al enviar:', error);
      showToast('❌ Error al enviar equipos', true);
    }
  }
  
  // ══════════════════════════════════════════════════════════════
  // UTILIDADES
  // ══════════════════════════════════════════════════════════════
  
  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
