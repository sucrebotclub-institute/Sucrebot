<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Certificados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    body { background: #ffffff !important; color: #1a1c28 !important; }
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; position: relative; }

    .page-hero { padding: 40px 0 32px; border-bottom: 1px solid #e0e4ea; margin-bottom: 32px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Exo 2', sans-serif; font-size: 2.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #1a3a6b; line-height: 1; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #4a5568; margin-top: 10px; }

    .filtros-bar { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; background: #f8f9fb; padding: 16px 20px; border-radius: 12px; border: 1px solid #e0e4ea; }
    .filtros-bar label { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: #4a5568; letter-spacing: 1px; white-space: nowrap; }
    .filtro-select, .busqueda-input { padding: 10px 14px; border: 2px solid #e0e4ea; border-radius: 8px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; color: #1a3a6b; outline: none; transition: border-color 0.2s; background: #ffffff; }
    .filtro-select { cursor: pointer; min-width: 220px; }
    .busqueda-input { flex: 1; min-width: 200px; }
    .filtro-select:focus, .busqueda-input:focus { border-color: #1a5ca8; }
    .busqueda-input::placeholder { color: #aab0be; font-weight: 400; }

    .resultados-contador { font-family: 'Orbitron', monospace; font-size: 11px; color: #7a7a8c; margin-bottom: 20px; letter-spacing: 1px; }
    .resultados-contador span { color: #1a5ca8; font-weight: 700; }

    .certs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

    .cert-card { background: #ffffff; border: 2px solid #e0e4ea; border-radius: 16px; padding: 22px; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 14px; }
    .cert-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(26,92,168,0.15); border-color: #1a5ca8; }

    .cert-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .cert-tipo { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 5px 12px; border-radius: 8px; white-space: nowrap; }
    .cert-tipo.participacion { background: #e8f4ff; color: #1a5ca8; }
    .cert-tipo.primer  { background: #ffd700; color: #8b6914; }
    .cert-tipo.segundo { background: #d8d8d8; color: #4a4a4a; }
    .cert-tipo.tercer  { background: #cd7f32; color: #ffffff; }
    .cert-codigo { font-family: 'Exo 2', monospace; font-size: 10px; color: #aab0be; background: #f4f7fb; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }

    .cert-nombre { font-family: 'Exo 2', sans-serif; font-size: 19px; font-weight: 900; color: #1a3a6b; }
    .cert-categoria { font-size: 13px; color: #1a5ca8; font-weight: 700; margin-top: 2px; }
    .cert-institucion { font-size: 12px; color: #7a7a8c; margin-top: 2px; }
    .cert-fecha { font-size: 11px; color: #aab0be; font-family: 'Exo 2', sans-serif; }

    .btn-ver-diploma { display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #1a5ca8 0%, #0f3d75 100%); color: #ffffff; border: none; padding: 12px 20px; border-radius: 10px; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-decoration: none; box-shadow: 0 4px 12px rgba(26,92,168,0.3); }
    .btn-ver-diploma:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,92,168,0.5); }
    .btn-ver-diploma.pendiente { background: #e0e4ea; color: #aab0be; cursor: not-allowed; box-shadow: none; }
    .btn-ver-diploma.pendiente:hover { transform: none; }

    .vacio-msg { text-align: center; padding: 80px 20px; color: #7a7a8c; font-size: 14px; grid-column: 1 / -1; }
    .vacio-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; display: block; }

    .loading { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
    .loading-spinner { width: 40px; height: 40px; border: 4px solid #e0e4ea; border-top-color: #1a5ca8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 30px; left: 30px; transform: translateY(100px); opacity: 0; background: #1e2438; border-radius: 12px; border-left: 5px solid #3dd68c; color: #f0f4ff; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 600; padding: 14px 18px; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; z-index: 9999; max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 768px) {
      .filtros-bar { flex-direction: column; align-items: stretch; }
      .filtro-select, .busqueda-input { width: 100%; min-width: unset; }
      .certs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<div class="wrapper">
  <div class="page-hero">
    <div class="page-hero-badge">
      <div class="page-hero-badge-dot"></div>
      SucreBot 2026 · Certificados
    </div>
    <h2>CERTIFICADOS DE <span>PARTICIPACIÓN</span></h2>
    <p>Busca y descarga tu diploma del Torneo SucreBot 2026</p>
  </div>

  <div class="filtros-bar">
    <label>🔍 FILTRAR:</label>
    <input type="text" class="busqueda-input" id="busqueda" placeholder="Busca por nombre o robot...">
    <label>📂 CATEGORÍA:</label>
    <select class="filtro-select" id="filtro-categoria">
      <option value="">Todas las categorías</option>
      <optgroup label="🏅 AMATEUR">
        <option value="Insectos">Insectos</option>
        <option value="Trepador (Amateur)">Trepador (Amateur)</option>
        <option value="Seguidor de línea ST (Amateur)">Seguidor de línea ST (Amateur)</option>
      </optgroup>
      <optgroup label="🏆 PRO">
        <option value="Seguidor de línea ST (Pro)">Seguidor de línea ST (Pro)</option>
        <option value="Minisumo Autónomo">Minisumo Autónomo</option>
        <option value="Minisumo RC">Minisumo RC</option>
        <option value="Bailarín">Bailarín</option>
        <option value="Batalla">Batalla</option>
        <option value="Trepador (Pro)">Trepador (Pro)</option>
        <option value="Robot soccer">Robot soccer</option>
      </optgroup>
      <optgroup label="⭐ EXTRA">
        <option value="Cubo Rubik">Cubo Rubik</option>
      </optgroup>
    </select>
    <label>🏅 TIPO:</label>
    <select class="filtro-select" id="filtro-tipo" style="min-width:160px;">
      <option value="">Todos los tipos</option>
      <option value="participacion">Participación</option>
      <option value="1er">Primer Lugar</option>
      <option value="2do">Segundo Lugar</option>
      <option value="3er">Tercer Lugar</option>
    </select>
  </div>

  <div class="resultados-contador" id="contador">Cargando...</div>

  <div class="certs-grid" id="certs-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      Cargando certificados...
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div data-include="../shared/components/footer.html"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  let todosCerts = [];

  async function cargarTodosCertificados() {
    try {
      // Intentar primero obtenerTodosCertificados
      try {
        const resCerts = await fetch(GAS_URL + '?action=obtenerTodosCertificados');
        const certs = await resCerts.json();
        if (Array.isArray(certs) && certs.length > 0) {
          todosCerts = certs;
          renderCerts(todosCerts);
          return;
        }
      } catch(e) {
        console.warn('obtenerTodosCertificados no disponible, usando fallback');
      }

      // Fallback: participantes aprobados
      const resParts = await fetch(GAS_URL + '?action=getParticipantes');
      const participantes = await resParts.json();

      if (!Array.isArray(participantes)) throw new Error('Respuesta inválida');

      todosCerts = participantes
        .filter(p => p.aprobado === 'APROBADO')
        .map(p => ({
          nombre_completo: p.nombre,
          categoria: p.categoria,
          institucion: p.institucion,
          tipo_certificado: 'participacion',
          archivoUrl: '',
          codigo_verificacion: '',
          fecha_generacion: '',
          robot: p.robot
        }));

      renderCerts(todosCerts);

    } catch (e) {
      console.error('Error:', e);
      document.getElementById('certs-grid').innerHTML =
        '<div class="vacio-msg"><span class="vacio-icon">⚠️</span>Error al cargar certificados.<br>Intenta nuevamente más tarde.</div>';
      document.getElementById('contador').textContent = '';
    }
  }

  function renderCerts(lista) {
    const grid    = document.getElementById('certs-grid');
    const counter = document.getElementById('contador');

    if (lista.length === 0) {
      grid.innerHTML = '<div class="vacio-msg"><span class="vacio-icon">📭</span>No se encontraron certificados con esos filtros.</div>';
      counter.innerHTML = 'Mostrando <span>0</span> certificados';
      return;
    }

    counter.innerHTML = 'Mostrando <span>' + lista.length + '</span> certificado' + (lista.length !== 1 ? 's' : '');

    grid.innerHTML = lista.map(cert => {
      let tipoClass = 'participacion', tipoTexto = '🏅 PARTICIPACIÓN';
      if (cert.tipo_certificado === '1er') { tipoClass = 'primer';  tipoTexto = '🥇 PRIMER LUGAR'; }
      if (cert.tipo_certificado === '2do') { tipoClass = 'segundo'; tipoTexto = '🥈 SEGUNDO LUGAR'; }
      if (cert.tipo_certificado === '3er') { tipoClass = 'tercer';  tipoTexto = '🥉 TERCER LUGAR'; }

      const boton = cert.archivoUrl
        ? `<a class="btn-ver-diploma" href="${cert.archivoUrl}" target="_blank" rel="noopener">
             <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
               <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
               <polyline points="7 10 12 15 17 10"/>
               <line x1="12" y1="15" x2="12" y2="3"/>
             </svg>
             Descargar Diploma
           </a>`
        : `<div class="btn-ver-diploma pendiente">
             <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <circle cx="12" cy="12" r="10"/>
               <line x1="12" y1="8" x2="12" y2="12"/>
               <line x1="12" y1="16" x2="12.01" y2="16"/>
             </svg>
             Pendiente de generación
           </div>`;

      return `
        <div class="cert-card">
          <div class="cert-card-top">
            <span class="cert-tipo ${tipoClass}">${tipoTexto}</span>
            ${cert.codigo_verificacion ? '<span class="cert-codigo">' + cert.codigo_verificacion + '</span>' : ''}
          </div>
          <div>
            <div class="cert-nombre">${cert.nombre_completo || '—'}</div>
            <div class="cert-categoria">📂 ${cert.categoria || '—'}</div>
            <div class="cert-institucion">🎓 ${cert.institucion || '—'}</div>
          </div>
          ${cert.fecha_generacion ? '<div class="cert-fecha">Generado: ' + cert.fecha_generacion + '</div>' : ''}
          ${boton}
        </div>
      `;
    }).join('');
  }

  function filtrar() {
    const busqueda  = document.getElementById('busqueda').value.toLowerCase().trim();
    const categoria = document.getElementById('filtro-categoria').value;
    const tipo      = document.getElementById('filtro-tipo').value;

    const filtrados = todosCerts.filter(c => {
      const matchBusqueda = !busqueda ||
        (c.nombre_completo || '').toLowerCase().includes(busqueda) ||
        (c.robot || '').toLowerCase().includes(busqueda) ||
        (c.institucion || '').toLowerCase().includes(busqueda);
      const matchCategoria = !categoria || c.categoria === categoria;
      const matchTipo      = !tipo      || c.tipo_certificado === tipo;
      return matchBusqueda && matchCategoria && matchTipo;
    });

    renderCerts(filtrados);
  }

  document.getElementById('busqueda').addEventListener('input', filtrar);
  document.getElementById('filtro-categoria').addEventListener('change', filtrar);
  document.getElementById('filtro-tipo').addEventListener('change', filtrar);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  document.addEventListener('componentsLoaded', cargarTodosCertificados);
</script>

</body>
</html>
