<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Certificados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/auspiciantes.js"></script>
  <script src="../shared/js/auspiciantes-splash.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    body {
      background: #f0f4fa !important;
      font-family: 'Exo 2', sans-serif;
      color: #1a2a4a;
      padding-top: 0 !important;
    }
    main { padding-top: 174px; min-height: 100vh; background: #f0f4fa; }
    .wrapper { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px; position: relative; }

    .page-hero { padding: 48px 0 24px; margin-bottom: 24px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #5bc8f0; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue'; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6b; line-height: 1; position: relative; padding-bottom: 8px; }
    .page-hero h2::after { content:""; position:absolute; bottom:4px; left:0; width:120px; height:3px; background:linear-gradient(90deg,transparent,#5bc8f0,transparent); border-radius:2px; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; margin-top: 14px; }

    .filtros-bar { display:flex; gap:10px; align-items:center; margin-bottom:28px; flex-wrap:nowrap; background:#1a5ca8; padding:16px 24px; border-radius:12px; max-width:100%; overflow-x:auto; }
    .filtros-bar label { font-family:'Orbitron'; font-size:9px; font-weight:700; color:rgba(255,255,255,.8); letter-spacing:1px; white-space:nowrap; flex-shrink:0; }
    .filtro-select, .busqueda-input { padding:8px 12px; border:2px solid rgba(255,255,255,.25); border-radius:8px; font-family:'Exo 2'; font-size:13px; font-weight:600; color:#1a3a6b; outline:none; transition:border-color .2s; background:#fff; flex-shrink:0; }
    .filtro-select { cursor:pointer; }
    #filtro-evento   { width:150px; }
    #busqueda        { width:200px; flex-shrink:1; }
    #filtro-categoria { width:200px; }
    #filtro-tipo     { width:160px; }
    .filtro-select:focus, .busqueda-input:focus { border-color:#5bc8f0; box-shadow:0 0 0 3px rgba(91,200,240,.3); }
    .busqueda-input::placeholder { color:#aab0be; font-weight:400; }

    .resultados-contador { font-family:'Orbitron'; font-size:11px; color:#7a7a8c; margin-bottom:20px; letter-spacing:1px; }
    .resultados-contador span { color:#1a5ca8; font-weight:700; }

    .certs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }

    /* ── TARJETA REDISEÑADA ── */
    .cert-card {
      background: linear-gradient(145deg, #0e2a5a 0%, #1a5ca8 100%);
      border: 1px solid rgba(91,200,240,0.25);
      border-radius: 16px;
      padding: 0;
      transition: all .3s;
      box-shadow: 0 4px 16px rgba(14,42,90,0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .cert-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(91,200,240,0.08);
      pointer-events: none;
    }
    .cert-card::after {
      content: '';
      position: absolute;
      bottom: -30px; left: -30px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(91,200,240,0.06);
      pointer-events: none;
    }
    .cert-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 36px rgba(14,42,90,0.4);
      border-color: rgba(91,200,240,0.5);
    }

    /* Franja superior con tipo */
    .cert-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(91,200,240,0.15);
      background: rgba(0,0,0,0.15);
    }
    .cert-tipo {
      font-family: 'Orbitron';
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .cert-tipo.participacion { background: rgba(91,200,240,0.2); color: #5bc8f0; border: 1px solid rgba(91,200,240,0.4); }
    .cert-tipo.primer  { background: rgba(253,212,0,0.2);  color: #ffd700; border: 1px solid rgba(253,212,0,0.5); }
    .cert-tipo.segundo { background: rgba(192,192,192,0.2); color: #d0d8e4; border: 1px solid rgba(192,192,192,0.4); }
    .cert-tipo.tercer  { background: rgba(205,127,50,0.2);  color: #f4a460; border: 1px solid rgba(205,127,50,0.4); }
    .cert-codigo {
      font-family: 'DM Mono';
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }

    /* Cuerpo de la tarjeta */
    .cert-card-body { padding: 18px 18px 14px; flex: 1; position: relative; z-index: 1; }
    .cert-nombre {
      font-family: 'Exo 2';
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .cert-meta { display: flex; flex-direction: column; gap: 5px; }
    .cert-meta-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
    }
    .cert-meta-item span { color: #5bc8f0; font-size: 13px; }
    .cert-fecha {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      font-family: 'DM Mono';
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    /* Botón descargar */
    .cert-card-footer { padding: 0 18px 18px; position: relative; z-index: 1; }
    .btn-ver-diploma {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(91,200,240,0.15);
      color: #5bc8f0;
      border: 1.5px solid rgba(91,200,240,0.4);
      padding: 11px 20px;
      border-radius: 10px;
      font-family: 'Exo 2';
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      width: 100%;
      letter-spacing: 0.5px;
    }
    .btn-ver-diploma:hover {
      background: #5bc8f0;
      color: #0e2a5a;
      border-color: #5bc8f0;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(91,200,240,0.35);
    }

    .vacio-msg { text-align:center; padding:80px 20px; color:#7a7a8c; font-size:14px; grid-column:1/-1; }
    .vacio-icon { font-size:64px; margin-bottom:16px; opacity:.3; display:block; }

    .loading { text-align:center; padding:60px 20px; grid-column:1/-1; color:#7a7a8c; }
    .loading-spinner { width:40px; height:40px; border:4px solid #e0e4ea; border-top-color:#1a5ca8; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .toast { position:fixed; bottom:30px; left:30px; transform:translateY(100px); opacity:0; background:#1e2438; border-radius:12px; border-left:5px solid #3dd68c; color:#f0f4ff; font-family:'Exo 2'; font-size:13px; font-weight:600; padding:14px 18px; transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s; z-index:9999; max-width:320px; }
    .toast.show { transform:translateY(0); opacity:1; }

    @media(max-width:900px) {
      .filtros-bar { flex-wrap:wrap; }
      #busqueda, #filtro-evento, #filtro-categoria, #filtro-tipo { width:100%; }
      .certs-grid { grid-template-columns:1fr; }
      .page-hero h2 { font-size:2rem; }
    }
  </style>
</head>
<body>
<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
<div class="wrapper">
  <div class="page-hero">
    <div class="page-hero-badge">
      <div class="page-hero-badge-dot"></div>
      SucreBot 2026 · Torneo de Robótica
    </div>
    <h2>CERTIFICADOS DE <span>PARTICIPACIÓN</span></h2>
    <p>BUSCA Y DESCARGA TU DIPLOMA DEL TORNEO SUCREBOT</p>
  </div>

  <div class="filtros-bar">
    <label>🏆 EDICIÓN:</label>
    <select class="filtro-select" id="filtro-evento">
      <option value="">Todas las ediciones</option>
      <option value="SucreBot 2026" selected>SucreBot 2026</option>
    </select>
    <label>🔍 BUSCAR:</label>
    <input type="text" class="busqueda-input" id="busqueda" placeholder="Nombre, robot o institución...">
    <label>📂 CATEGORÍA:</label>
    <select class="filtro-select" id="filtro-categoria">
      <option value="">Todas las categorías</option>
      <optgroup label="🏅 AMATEUR">
        <option value="Insectos">Insectos</option>
        <option value="Trepador (Amateur)">Trepador (Amateur)</option>
        <option value="Seguidor de línea ST (Amateur)">Seguidor de línea ST (Amateur)</option>
      </optgroup>
      <optgroup label="🏆 PRO">
        <option value="Seguidor de línea ST (Pro)">Seguidor de línea ST (Pro)</option>
        <option value="Minisumo Autónomo">Minisumo Autónomo</option>
        <option value="Minisumo RC">Minisumo RC</option>
        <option value="Bailarín">Bailarín</option>
        <option value="Batalla">Batalla</option>
        <option value="Trepador (Pro)">Trepador (Pro)</option>
        <option value="Robot soccer">Robot soccer</option>
        <option value="Impacto Tecnológico">Impacto Tecnológico</option>
      </optgroup>
      <optgroup label="⭐ EXTRA">
        <option value="Cubo Rubik">Cubo Rubik</option>
        <option value="Lego Kids">Lego Kids</option>
      </optgroup>
    </select>
    <label>🏅 TIPO:</label>
    <select class="filtro-select" id="filtro-tipo" style="min-width:160px;">
      <option value="">Todos los tipos</option>
      <option value="participacion">Participación</option>
      <option value="1er">Primer Lugar</option>
      <option value="2do">Segundo Lugar</option>
      <option value="3er">Tercer Lugar</option>
      <option value="GANADOR">Ganador</option>
      <option value="SUBCAMPEÓN">Subcampeón</option>
      <option value="TERCER LUGAR">Tercer Lugar (bracket)</option>
    </select>
  </div>

  <div class="resultados-contador" id="contador">Cargando...</div>

  <div class="certs-grid" id="certs-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      Cargando certificados...
    </div>
  </div>
</div>
</main>

<div class="toast" id="toast"></div>
<div data-include="../shared/components/footer.html"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
const GAS_URL = CONFIG.GAS_URL();
let todosCerts = [];

const TIPO_INFO = {
  'participacion': { clase: 'participacion', texto: '🏅 PARTICIPACIÓN' },
  '1er':           { clase: 'primer',        texto: '🥇 PRIMER LUGAR' },
  '2do':           { clase: 'segundo',       texto: '🥈 SEGUNDO LUGAR' },
  '3er':           { clase: 'tercer',        texto: '🥉 TERCER LUGAR' },
  'GANADOR':       { clase: 'primer',        texto: '🥇 PRIMER LUGAR' },
  'SUBCAMPEÓN':    { clase: 'segundo',       texto: '🥈 SEGUNDO LUGAR' },
  'FINALISTA':     { clase: 'segundo',       texto: '🥈 SEGUNDO LUGAR' },
  'TERCER LUGAR':  { clase: 'tercer',        texto: '🥉 TERCER LUGAR' },
  'TERCER_LUGAR':  { clase: 'tercer',        texto: '🥉 TERCER LUGAR' },
};

async function cargarTodosCertificados() {
  try {
    const resCerts = await fetch(GAS_URL + '?action=obtenerTodosCertificados');
    const certs = await resCerts.json();
    if (Array.isArray(certs)) {
      todosCerts = certs.filter(c => c.archivoUrl && c.archivoUrl.trim());
    } else {
      todosCerts = [];
    }
    filtrar();
  } catch(e) {
    console.error('Error cargando certificados:', e);
    document.getElementById('certs-grid').innerHTML =
      '<div class="vacio-msg"><span class="vacio-icon">⚠️</span>Error al cargar certificados.<br>Intenta nuevamente más tarde.</div>';
    document.getElementById('contador').textContent = '';
  }
}

function actualizarFiltroEdiciones() {
  const ediciones = [...new Set(todosCerts.map(c => c.evento).filter(Boolean))].sort().reverse();
  const select = document.getElementById('filtro-evento');
  const valorActual = select.value;
  select.innerHTML = '<option value="">Todas las ediciones</option>';
  ediciones.forEach(ed => {
    const opt = document.createElement('option');
    opt.value = ed; opt.textContent = ed;
    select.appendChild(opt);
  });
  select.value = valorActual || 'SucreBot 2026';
}

function renderCerts(lista) {
  const grid    = document.getElementById('certs-grid');
  const counter = document.getElementById('contador');

  if (lista.length === 0) {
    grid.innerHTML = '<div class="vacio-msg"><span class="vacio-icon">📭</span>No se encontraron certificados con esos filtros.</div>';
    counter.innerHTML = 'Mostrando <span>0</span> certificados';
    return;
  }

  counter.innerHTML = 'Mostrando <span>' + lista.length + '</span> certificado' + (lista.length !== 1 ? 's' : '');

  grid.innerHTML = lista.map(cert => {
    const info = TIPO_INFO[cert.tipo_certificado] || TIPO_INFO['participacion'];

    return `
      <div class="cert-card">
        <div class="cert-card-header">
          <span class="cert-tipo ${info.clase}">${info.texto}</span>
          ${cert.codigo_verificacion ? '<span class="cert-codigo">' + cert.codigo_verificacion + '</span>' : ''}
        </div>
        <div class="cert-card-body">
          <div class="cert-nombre">${cert.nombre_completo || '—'}</div>
          <div class="cert-meta">
            <div class="cert-meta-item"><span>📂</span> ${cert.categoria || '—'}</div>
            <div class="cert-meta-item"><span>🎓</span> ${cert.institucion || '—'}</div>
            ${cert.evento ? '<div class="cert-meta-item"><span>🏆</span> ' + cert.evento + '</div>' : ''}
          </div>
          ${cert.fecha_generacion ? '<div class="cert-fecha">Generado: ' + cert.fecha_generacion + '</div>' : ''}
        </div>
        <div class="cert-card-footer">
          <a class="btn-ver-diploma" href="${cert.archivoUrl}" target="_blank" rel="noopener">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Descargar Diploma
          </a>
        </div>
      </div>`;
  }).join('');
}

function filtrar() {
  if (todosCerts.length > 0) actualizarFiltroEdiciones();

  const busqueda  = document.getElementById('busqueda').value.toLowerCase().trim();
  const categoria = document.getElementById('filtro-categoria').value;
  const tipo      = document.getElementById('filtro-tipo').value;
  const evento    = document.getElementById('filtro-evento').value;

  const filtrados = todosCerts.filter(c => {
    const matchBusqueda  = !busqueda  ||
      (c.nombre_completo || '').toLowerCase().includes(busqueda) ||
      (c.institucion || '').toLowerCase().includes(busqueda);
    const matchCategoria = !categoria || c.categoria === categoria;
    const matchTipo      = !tipo      || c.tipo_certificado === tipo;
    const matchEvento    = !evento    || (c.evento || '') === evento;
    return matchBusqueda && matchCategoria && matchTipo && matchEvento;
  });

  renderCerts(filtrados);
}

document.getElementById('busqueda').addEventListener('input', filtrar);
document.getElementById('filtro-categoria').addEventListener('change', filtrar);
document.getElementById('filtro-tipo').addEventListener('change', filtrar);
document.getElementById('filtro-evento').addEventListener('change', filtrar);

document.addEventListener('componentsLoaded', cargarTodosCertificados);
</script>
</body>
</html>
