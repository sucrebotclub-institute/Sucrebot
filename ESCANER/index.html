<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Escáner QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="../shared/js/config.js"></script>
  
  <!-- CSS compartido -->
  <link rel="stylesheet" href="../shared/css/styles.css">
  
  <!-- CSS específico de ESCANER -->
  <style>
    /* Mantener fondo blanco como el original */
    body {
      background: #ffffff !important;
      color: #1a1a2e !important;
    }
    main { min-height: calc(100vh - 174px); background: #ffffff; }

    /* ── ESTILOS ESCÁNER ── */
    .wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
    
    /* Page hero igual que participantes */
    .page-hero { padding: 40px 0 32px; border-bottom: 1px solid rgba(26,92,168,0.15); margin-bottom: 32px; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
    .page-hero-content { flex: 1; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; border: 1px solid #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

    /* ── ROBOT ESCÁNER ANIMADO ── */
    .robot-scanner-wrapper { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
    .glow-effect { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; background: radial-gradient(circle, rgba(26,92,168,0.15) 0%, transparent 70%); border-radius: 50%; animation: glow-pulse 3s ease-in-out infinite; pointer-events: none; z-index: -1; }
    @keyframes glow-pulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5} 50%{transform:translate(-50%,-50%) scale(1.1);opacity:0.8} }
    .robot-scanner { width: 180px; height: auto; filter: drop-shadow(0 8px 24px rgba(26,92,168,0.4)); animation: float-robot 4s ease-in-out infinite; z-index: 1; }
    @keyframes float-robot { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-16px) rotate(2deg)} }
    .qr-icon { position: absolute; top: -10px; right: -10px; font-size: 48px; z-index: 2; animation: qr-bounce 2s ease-in-out infinite; filter: drop-shadow(0 4px 12px rgba(91,200,240,0.6)); }
    @keyframes qr-bounce { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-8px) rotate(5deg)} }

    /* Contenedor con fondo azul degradado */
    .escaner-container {
      background: linear-gradient(135deg, #2a5a9e 0%, #1a4580 50%, #0f3566 100%);
      border-radius: 20px;
      padding: 36px 32px;
      margin-top: 24px;
      box-shadow: 0 12px 40px rgba(26,92,168,0.35);
      position: relative;
      overflow: hidden;
    }

    .escaner-container > * {
      position: relative;
      z-index: 1;
    }

    /* ── VIDEO ESCÁNER ── */
    .video-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .video-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #1a5ca8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 700;
    }

    #qr-reader {
      width: 100%;
      background: #0d2a4a;
      border-radius: 12px;
      overflow: hidden;
      min-height: 320px;
      position: relative;
    }

    #qr-video {
      width: 100%;
      display: none;
      border-radius: 12px;
    }

    #qr-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 320px;
      color: rgba(255,255,255,0.5);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      flex-direction: column;
      gap: 12px;
    }

    .btn-camera {
      width: 100%;
      margin-top: 16px;
      background: #1a5ca8;
      border: none;
      color: #ffffff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(26,92,168,0.3);
    }

    .btn-camera:hover {
      background: #0e4a8f;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(26,92,168,0.4);
    }

    .btn-camera.active {
      background: #d93025;
    }

    .btn-camera.active:hover {
      background: #b71c1c;
    }

    /* ── RESULTADO ── */
    .result-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      margin-bottom: 24px;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f4f8;
    }

    .result-robot {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: #1a5ca8;
      letter-spacing: 0.05em;
    }

    .result-nombre {
      font-size: 0.9rem;
      color: #7a7a8c;
      margin-top: 4px;
    }

    .result-status {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .result-status.idle {
      background: #e8eef5;
      color: #5a6478;
    }

    .result-status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .result-field label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #5a6478;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .result-field .value {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.95rem;
      color: #1a2035;
      font-weight: 600;
    }

    .result-field.full {
      grid-column: span 2;
    }

    .cat-badge {
      display: inline-block;
      background: linear-gradient(135deg, #1a5ca8 0%, #0e4a8f 100%);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-enviar {
      width: 100%;
      background: linear-gradient(135deg, #00d95f 0%, #00a046 100%);
      border: none;
      color: #ffffff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(0,217,95,0.3);
    }

    .btn-enviar:hover {
      background: linear-gradient(135deg, #00ff6f 0%, #00c054 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,217,95,0.4);
    }

    .btn-enviar.inactivo {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── HISTORIAL ── */
    .hist-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .hist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f4f8;
    }

    .hist-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #1a5ca8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hist-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: #1a5ca8;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .hist-item {
      background: #f8fafc;
      border: 1px solid #e8eef5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .hist-item:hover {
      background: #e8f0ff;
      border-color: #1a5ca8;
    }

    .hist-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .hist-robot {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a3a6e;
    }

    .hist-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #7a7a8c;
    }

    .hist-nombre {
      font-size: 0.75rem;
      color: #5a6478;
    }

    .empty-hist {
      text-align: center;
      padding: 24px;
      color: #7a7a8c;
      font-size: 0.85rem;
    }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 2px solid rgba(0,255,136,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .wrapper { padding: 0 12px 40px; }
      
      /* Hero */
      .page-hero { 
        grid-template-columns: 1fr; 
        gap: 20px; 
        padding: 24px 0 20px;
        margin-bottom: 20px;
      }
      .page-hero h2 { font-size: 2rem; }
      .page-hero p { font-size: 11px; }
      .page-hero-badge { font-size: 8px; padding: 5px 12px; }
      
      /* Robot */
      .robot-scanner-wrapper { width: 140px; height: 140px; margin: 0 auto; }
      .robot-scanner { width: 120px; }
      .qr-icon { font-size: 36px; top: -8px; right: -8px; }
      .glow-effect { width: 160px; height: 160px; }
      
      /* Contenedor escáner */
      .escaner-container { 
        padding: 20px 12px; 
        border-radius: 16px;
        margin-top: 16px;
      }
      
      /* Video card */
      .video-card { 
        padding: 16px; 
        margin-bottom: 16px;
      }
      
      .video-label { font-size: 0.65rem; margin-bottom: 12px; }
      
      #qr-reader { min-height: 240px; }
      
      #qr-placeholder { 
        height: 240px; 
        font-size: 0.75rem;
      }
      
      #qr-placeholder svg { width: 48px; height: 48px; }
      
      .btn-camera { 
        font-size: 0.85rem; 
        padding: 14px;
        margin-top: 12px;
      }
      
      /* Result card */
      .result-card { 
        padding: 20px 16px; 
        margin-bottom: 16px;
      }
      
      .result-robot { font-size: 1.5rem; }
      .result-nombre { font-size: 0.8rem; }
      .result-status { font-size: 0.65rem; padding: 5px 12px; }
      
      .result-grid { 
        grid-template-columns: 1fr; 
        gap: 16px;
        margin-bottom: 20px;
      }
      
      .result-field label { font-size: 0.6rem; }
      .result-field .value { font-size: 0.85rem; }
      
      .cat-badge { 
        font-size: 0.8rem; 
        padding: 6px 14px;
      }
      
      .btn-enviar { 
        font-size: 0.85rem; 
        padding: 14px;
      }
      
      /* Historial */
      .hist-card { 
        padding: 16px; 
      }
      
      .hist-title { font-size: 0.65rem; }
      .hist-count { font-size: 0.75rem; padding: 3px 10px; }
      
      .hist-item { padding: 10px; margin-bottom: 6px; }
      .hist-robot { font-size: 0.85rem; }
      .hist-time { font-size: 0.6rem; }
      .hist-nombre { font-size: 0.7rem; }
      
      /* Toast */
      .toast { 
        bottom: 20px; 
        font-size: 12px; 
        padding: 12px 20px;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    <div class="page-hero">
      <div class="page-hero-content">
        <div class="page-hero-badge">
          <div class="page-hero-badge-dot"></div>
          SUCREBOT 2026 · MESA DE CONTROL
        </div>
        <h2>ESCÁNER <span>QR</span></h2>
        <div class="page-hero-sub">
          <div class="page-hero-line"></div>
          <p>REGISTRO DE PARTICIPANTES EN TIEMPO REAL</p>
        </div>
      </div>
      <div class="robot-scanner-wrapper">
        <div class="glow-effect"></div>
        <div class="qr-icon">📱</div>
        <img src="../shared/images/robot-campeon.png" alt="Robot Escáner" class="robot-scanner">
      </div>
    </div>

    <div class="escaner-container">
      <div class="video-card">
        <div class="video-label">📷 ESCÁNER QR</div>
        <div id="qr-reader">
          <video id="qr-video" playsinline></video>
          <div id="qr-placeholder">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>PRESIONA ACTIVAR CÁMARA</span>
          </div>
        </div>
        <button class="btn-camera" id="btn-camera" onclick="toggleScanner()">📷 Activar cámara</button>
      </div>

      <div class="result-card">
        <div class="result-header">
          <div>
            <div class="result-robot" id="res-robot">Sin escanear</div>
            <div class="result-nombre" id="res-nombre">Apunta la cámara a un código QR</div>
          </div>
          <span class="result-status idle" id="res-status">ESPERANDO</span>
        </div>
        <div class="result-grid" id="res-grid" style="display:none">
          <div class="result-field">
            <label>Institución</label>
            <div class="value" id="res-inst">—</div>
          </div>
          <div class="result-field">
            <label>Ciudad</label>
            <div class="value" id="res-ciudad">—</div>
          </div>
          <div class="result-field full">
            <label>Categoría</label>
            <div><span class="cat-badge" id="res-cat">—</span></div>
          </div>
        </div>
        <button class="btn-enviar inactivo" id="btn-enviar" onclick="enviarAlCronometro()">⚡ Enviar al cronómetro</button>
      </div>

      <div class="hist-card">
        <div class="hist-header">
          <div class="hist-title">ESCANEADOS HOY</div>
          <span class="hist-count" id="hist-count">0</span>
        </div>
        <div id="historial">
          <p class="empty-hist">Ningún QR escaneado aún</p>
        </div>
      </div>
    </div>
  </div>
</main>

<div data-include="../shared/components/footer.html"></div>

<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  
  let codeReader = null;
  let videoStream = null;
  let scannerActivo = false;
  let participanteActual = null;
  let historial = [];

  async function toggleScanner() {
    if (scannerActivo) {
      stopScanner();
    } else {
      await iniciarScanner();
    }
  }

  async function iniciarScanner() {
    try {
      codeReader = new ZXing.BrowserMultiFormatReader();
      const videoInputDevices = await codeReader.listVideoInputDevices();

      if (videoInputDevices.length === 0) {
        showToast('No se detectaron cámaras', true);
        return;
      }

      let selectedDeviceId = null;
      const backCamera = videoInputDevices.find(device =>
        /back|rear|environment|trasera/i.test(device.label)
      );

      if (backCamera) {
        selectedDeviceId = backCamera.deviceId;
      } else if (videoInputDevices.length > 1) {
        selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
      } else {
        selectedDeviceId = videoInputDevices[0].deviceId;
      }

      document.getElementById('qr-placeholder').style.display = 'none';
      document.getElementById('qr-video').style.display = 'block';

      codeReader.decodeFromVideoDevice(selectedDeviceId, 'qr-video', (result, err) => {
        if (result) {
          procesarQR(result.text);
        }
      });

      const video = document.getElementById('qr-video');
      videoStream = video.srcObject;

      scannerActivo = true;
      const btn = document.getElementById('btn-camera');
      btn.textContent = '⏸ Detener cámara';
      btn.classList.add('active');

    } catch (error) {
      console.error('Error al iniciar escáner:', error);
      showToast('Error al iniciar la cámara', true);
    }
  }

  function stopScanner() {
    if (codeReader) {
      codeReader.reset();
    }

    if (videoStream) {
      const tracks = videoStream.getTracks();
      tracks.forEach(track => track.stop());
      videoStream = null;
    }

    const video = document.getElementById('qr-video');
    if (video.srcObject) {
      video.srcObject = null;
    }

    document.getElementById('qr-video').style.display = 'none';
    document.getElementById('qr-placeholder').style.display = 'flex';

    scannerActivo = false;
    const btn = document.getElementById('btn-camera');
    btn.textContent = '📷 Activar cámara';
    btn.classList.remove('active');
  }

  async function procesarQR(qrData) {
    try {
      const participante = JSON.parse(qrData);

      if (!participante.id) {
        showToast('QR inválido - No tiene ID', true);
        return;
      }

      participanteActual = participante;

      document.getElementById('res-robot').textContent = participante.robot || '—';
      document.getElementById('res-nombre').textContent = participante.nombre || '—';
      document.getElementById('res-inst').textContent = participante.institucion || '—';
      document.getElementById('res-ciudad').textContent = participante.ciudad || '—';
      document.getElementById('res-cat').textContent = participante.categoria || '—';
      
      document.getElementById('res-grid').style.display = 'grid';
      document.getElementById('res-status').textContent = 'ESCANEADO';
      document.getElementById('res-status').className = 'result-status success';
      document.getElementById('btn-enviar').classList.remove('inactivo');

      agregarAlHistorial(participante);
      showToast('✓ QR escaneado: ' + participante.robot);

    } catch (error) {
      console.error('Error al procesar QR:', error);
      showToast('QR inválido - Formato incorrecto', true);
      
      document.getElementById('res-status').textContent = 'ERROR';
      document.getElementById('res-status').className = 'result-status idle';
    }
  }

  async function enviarAlCronometro() {
    const btn = document.getElementById('btn-enviar');
    if (btn.classList.contains('inactivo')) {
      showToast('⚠️ No hay participante escaneado', true);
      return;
    }

    if (!participanteActual) {
      showToast('⚠️ No hay participante para enviar', true);
      return;
    }

    btn.disabled = true;
    const textoOriginal = btn.textContent;
    btn.textContent = '⏳ Enviando...';

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'setActivo',
          ruta: participanteActual.categoria || 'general',
          participante: participanteActual
        })
      });

      const data = await response.json();

      if (data.ok) {
        showToast('✓ Enviado al cronómetro');
        btn.textContent = '✓ Enviado';
        
        setTimeout(() => {
          stopScanner();
          btn.textContent = textoOriginal;
          btn.disabled = false;
        }, 1500);
      } else {
        throw new Error(data.error || 'Error desconocido');
      }
    } catch (error) {
      showToast('Error al enviar: ' + error.message, true);
      btn.textContent = textoOriginal;
      btn.disabled = false;
    }
  }

  function agregarAlHistorial(p) {
    const ahora = new Date();
    const hora = ahora.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
    
    historial.unshift({ ...p, hora });
    
    if (historial.length > 10) {
      historial = historial.slice(0, 10);
    }
    
    renderHistorial();
  }

  function renderHistorial() {
    const container = document.getElementById('historial');
    const count = document.getElementById('hist-count');
    
    count.textContent = historial.length;
    
    if (historial.length === 0) {
      container.innerHTML = '<p class="empty-hist">Ningún QR escaneado aún</p>';
      return;
    }
    
    container.innerHTML = historial.map(h => `
      <div class="hist-item">
        <div class="hist-item-top">
          <div class="hist-robot">${h.robot || '—'}</div>
          <div class="hist-time">${h.hora}</div>
        </div>
        <div class="hist-nombre">${h.nombre || '—'}</div>
      </div>
    `).join('');
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>

</body>
</html>
