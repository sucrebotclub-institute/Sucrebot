<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Escáner QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    body { background: #ffffff !important; color: #1a1a2e !important; }
    main { min-height: calc(100vh - 174px); background: #ffffff; }
    .wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
    .page-hero { padding: 56px 0 24px; border-bottom: 1px solid rgba(26,92,168,0.15); margin-bottom: 24px; }
    .page-hero-content { width: 100%; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; border: 1px solid #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }
    .escaner-container { background: linear-gradient(135deg, #2a5a9e 0%, #1a4580 50%, #0f3566 100%); border-radius: 20px; padding: 36px 32px; margin-top: 24px; box-shadow: 0 12px 40px rgba(26,92,168,0.35); position: relative; overflow: hidden; }
    .escaner-container > * { position: relative; z-index: 1; }
    .video-card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .video-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: #1a5ca8; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px; font-weight: 700; }
    #qr-reader { width: 100%; background: #0d2a4a; border-radius: 12px; overflow: hidden; min-height: 320px; position: relative; }
    #qr-video { width: 100%; display: none; border-radius: 12px; }
    #qr-placeholder { display: flex; align-items: center; justify-content: center; height: 320px; color: rgba(255,255,255,0.5); font-family: 'DM Mono', monospace; font-size: 0.85rem; letter-spacing: 0.08em; flex-direction: column; gap: 12px; }
    .btn-camera { width: 100%; margin-top: 16px; background: #1a5ca8; border: none; color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 12px rgba(26,92,168,0.3); }
    .btn-camera:hover { background: #0e4a8f; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(26,92,168,0.4); }
    .btn-camera.active { background: #d93025; }
    .btn-camera.active:hover { background: #b71c1c; }
    .result-card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 24px; transition: border 0.3s; }
    .result-card.success { border: 2px solid #00d95f; }
    .result-card.warning { border: 2px solid #fbbf24; }
    .result-card.error { border: 2px solid #ff8080; }
    .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #f0f4f8; }
    .result-robot { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: #1a5ca8; letter-spacing: 0.05em; }
    .result-nombre { font-size: 0.9rem; color: #7a7a8c; margin-top: 4px; }
    .result-status { font-family: 'DM Mono', monospace; font-size: 0.7rem; padding: 6px 14px; border-radius: 20px; font-weight: 700; letter-spacing: 0.1em; }
    .result-status.idle { background: #e8eef5; color: #5a6478; }
    .result-status.success { background: #e8f5e9; color: #2e7d32; }
    .result-status.warning { background: #fff3cd; color: #856404; }
    .result-status.error { background: #ffe8e8; color: #d93025; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .result-field label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: #5a6478; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 700; }
    .result-field .value { font-family: 'Exo 2', sans-serif; font-size: 0.95rem; color: #1a2035; font-weight: 600; }
    .result-field.full { grid-column: span 2; }
    .cat-badge { display: inline-block; background: linear-gradient(135deg, #1a5ca8 0%, #0e4a8f 100%); color: #ffffff; padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; }
    .btn-enviar { width: 100%; background: linear-gradient(135deg, #00d95f 0%, #00a046 100%); border: none; color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 12px rgba(0,217,95,0.3); }
    .btn-enviar:hover { background: linear-gradient(135deg, #00ff6f 0%, #00c054 100%); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,217,95,0.4); }
    .btn-enviar.inactivo { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn-enviar.sent { background: linear-gradient(135deg, #1a5ca8 0%, #0e4a8f 100%); }
    .icon-revisar { display: inline-block; width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; margin-top: -2px; }
    .hist-card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .hist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #f0f4f8; }
    .hist-title { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: #1a5ca8; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; }
    .hist-count { font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 700; background: #1a5ca8; color: #ffffff; padding: 4px 12px; border-radius: 20px; }
    .hist-item { background: #f8fafc; border: 1px solid #e8eef5; border-radius: 10px; padding: 12px; margin-bottom: 8px; transition: all 0.2s; }
    .hist-item:nth-child(even) { background: #ffffff; }
    .hist-item:hover { background: #e8f0ff; border-color: #1a5ca8; transform: translateX(4px); }
    .hist-item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .hist-robot { font-size: 0.9rem; font-weight: 700; color: #1a3a6e; }
    .hist-time { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: #1a5ca8; font-weight: 600; background: rgba(26,92,168,0.1); padding: 3px 8px; border-radius: 6px; }
    .hist-nombre { font-size: 0.75rem; color: #5a6478; }
    .empty-hist { text-align: center; padding: 24px; color: #7a7a8c; font-size: 0.85rem; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 2px solid rgba(0,255,136,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 768px) {
      .wrapper { padding: 0 12px 40px; }
      .page-hero { padding: 20px 0 16px; margin-bottom: 16px; }
      .page-hero h2 { font-size: 2rem; }
      .page-hero p { font-size: 11px; }
      .page-hero-badge { font-size: 8px; padding: 5px 12px; }
      .page-hero-line { flex: 0 0 32px; height: 2px; }
      .escaner-container { padding: 20px 12px; border-radius: 16px; margin-top: 12px; }
      .video-card { padding: 16px; margin-bottom: 16px; }
      .video-label { font-size: 0.65rem; margin-bottom: 12px; }
      #qr-reader { min-height: 240px; }
      #qr-placeholder { height: 240px; font-size: 0.75rem; }
      #qr-placeholder svg { width: 48px; height: 48px; }
      .btn-camera { font-size: 0.85rem; padding: 14px; margin-top: 12px; }
      .result-card { padding: 20px 16px; margin-bottom: 16px; }
      .result-robot { font-size: 1.5rem; }
      .result-nombre { font-size: 0.8rem; }
      .result-status { font-size: 0.65rem; padding: 5px 12px; }
      .result-grid { grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
      .result-field label { font-size: 0.6rem; }
      .result-field .value { font-size: 0.85rem; }
      .cat-badge { font-size: 0.8rem; padding: 6px 14px; }
      .btn-enviar { font-size: 0.85rem; padding: 14px; }
      .hist-card { padding: 16px; }
      .hist-title { font-size: 0.65rem; }
      .hist-count { font-size: 0.75rem; padding: 3px 10px; }
      .hist-item { padding: 10px; margin-bottom: 6px; }
      .hist-robot { font-size: 0.85rem; }
      .hist-time { font-size: 0.6rem; }
      .hist-nombre { font-size: 0.7rem; }
      .toast { bottom: 20px; font-size: 12px; padding: 12px 20px; max-width: 90%; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    <div class="page-hero">
      <div class="page-hero-content">
        <div class="page-hero-badge">
          <div class="page-hero-badge-dot"></div>
          SUCREBOT 2026 · MESA DE CONTROL
        </div>
        <h2>ESCÁNER <span>QR</span></h2>
        <div class="page-hero-sub">
          <div class="page-hero-line"></div>
          <p>REGISTRO DE PARTICIPANTES EN TIEMPO REAL</p>
        </div>
      </div>
    </div>

    <div class="escaner-container">
      <div class="video-card">
        <div class="video-label">📷 ESCÁNER QR</div>
        <div id="qr-reader">
          <video id="qr-video" playsinline></video>
          <div id="qr-placeholder">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>PRESIONA ACTIVAR CÁMARA</span>
          </div>
        </div>
        <button class="btn-camera" id="btn-camera" onclick="toggleScanner()">📷 Activar cámara</button>
      </div>

      <div class="result-card" id="result-card">
        <div class="result-header">
          <div>
            <div class="result-robot" id="res-robot">Sin escanear</div>
            <div class="result-nombre" id="res-nombre">Apunta la cámara a un código QR</div>
          </div>
          <span class="result-status idle" id="res-status">ESPERANDO</span>
        </div>
        <div class="result-grid" id="res-grid" style="display:none">
          <div class="result-field">
            <label>Institución</label>
            <div class="value" id="res-inst">—</div>
          </div>
          <div class="result-field">
            <label>Ciudad</label>
            <div class="value" id="res-ciudad">—</div>
          </div>
          <div class="result-field full">
            <label>Categoría</label>
            <div><span class="cat-badge" id="res-cat">—</span></div>
          </div>
        </div>
        <button class="btn-enviar inactivo" id="btn-enviar" onclick="enviarAlCronometro()">
          <svg class="icon-revisar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="15" y2="17"></line>
            <circle cx="10" cy="18" r="3"></circle>
            <line x1="12.5" y1="20.5" x2="15" y2="23"></line>
          </svg>
          Enviar a revisión
        </button>
      </div>

      <div class="hist-card">
        <div class="hist-header">
          <div class="hist-title">ESCANEADOS HOY</div>
          <span class="hist-count" id="hist-count">0</span>
        </div>
        <div id="historial">
          <p class="empty-hist">Ningún QR escaneado aún</p>
        </div>
      </div>
    </div>
  </div>
</main>

<div data-include="../shared/components/footer.html"></div>
<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();

  const RUTAS_SCANNER = {
    'Insectos': 'ins',
    'Trepador (Amateur)': 'trp_a',
    'Seguidor de línea ST (Amateur)': 'sl_a',
    'Seguidor de línea ST (Pro)': 'sl_p',
    'Minisumo Autónomo': 'ms_a',
    'Minisumo RC': 'ms_rc',
    'Bailarín': 'bai',
    'Batalla': 'bat',
    'Trepador (Pro)': 'trp_p',
    'Robot soccer': 'soc',
    'Cubo Rubik': 'cr',
    'Lego Kids': 'lk',
    'Desarrollo Tecnológico': 'dt'
  };

  let codeReader = null;
  let videoStream = null;
  let scannerActivo = false;
  let participanteActual = null;
  let historial = [];
  let ultimoQrProcesado = null;
  let tiempoUltimoQr = 0;

  let cacheParticipantes = [];
  let cacheCategoriasActivas = [];
  let ultimaActualizacionCache = 0;
  const INTERVALO_CACHE = 5 * 60 * 1000;

  window.addEventListener('DOMContentLoaded', async () => {
    await actualizarCache();
    setInterval(actualizarCache, INTERVALO_CACHE);
  });

  async function actualizarCache() {
    try {
      const rP = await fetch(GAS_URL + '?' + new URLSearchParams({ action: 'getParticipantes' }));
      const participantes = await rP.json();
      if (Array.isArray(participantes) && participantes.length > 0) {
        cacheParticipantes = participantes;
        localStorage.setItem('participantes_cache', JSON.stringify(participantes));
      }
      const rC = await fetch(GAS_URL + '?' + new URLSearchParams({ action: 'getCategoriasActivas' }));
      const categorias = await rC.json();
      if (Array.isArray(categorias)) cacheCategoriasActivas = categorias;
      ultimaActualizacionCache = Date.now();
    } catch (error) {
      const cached = localStorage.getItem('participantes_cache');
      if (cached) cacheParticipantes = JSON.parse(cached);
    }
  }

  async function toggleScanner() {
    if (scannerActivo) stopScanner();
    else await iniciarScanner();
  }

  async function iniciarScanner() {
    try {
      codeReader = new ZXing.BrowserMultiFormatReader();
      const videoInputDevices = await codeReader.listVideoInputDevices();
      if (videoInputDevices.length === 0) { showToast('No se detectaron cámaras', true); return; }
      let selectedDeviceId = null;
      const backCamera = videoInputDevices.find(d => /back|rear|environment|trasera/i.test(d.label));
      if (backCamera) selectedDeviceId = backCamera.deviceId;
      else if (videoInputDevices.length > 1) selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
      else selectedDeviceId = videoInputDevices[0].deviceId;
      document.getElementById('qr-placeholder').style.display = 'none';
      document.getElementById('qr-video').style.display = 'block';
      codeReader.decodeFromVideoDevice(selectedDeviceId, 'qr-video', (result, err) => {
        if (result) procesarQR(result.text);
      });
      const video = document.getElementById('qr-video');
      videoStream = video.srcObject;
      scannerActivo = true;
      const btn = document.getElementById('btn-camera');
      btn.textContent = '⏸ Detener cámara';
      btn.classList.add('active');
    } catch (error) {
      showToast('Error al iniciar la cámara', true);
    }
  }

  function stopScanner() {
    if (codeReader) codeReader.reset();
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    const video = document.getElementById('qr-video');
    if (video.srcObject) video.srcObject = null;
    document.getElementById('qr-video').style.display = 'none';
    document.getElementById('qr-placeholder').style.display = 'flex';
    scannerActivo = false;
    const btn = document.getElementById('btn-camera');
    btn.textContent = '📷 Activar cámara';
    btn.classList.remove('active');
  }

  async function procesarQR(qrData) {
    const ahora = Date.now();
    if (qrData === ultimoQrProcesado && (ahora - tiempoUltimoQr) < 1000) return;
    ultimoQrProcesado = qrData;
    tiempoUltimoQr = ahora;

    try {
      let codigo = extraerIdDelQR(qrData);
      if (!codigo) {
        showToast('⚠️ QR inválido', true);
        mostrarEstadoError('QR INVÁLIDO', 'No se pudo leer un ID válido del código QR');
        return;
      }

      let participante = cacheParticipantes.find(p => p.id === codigo);
      if (!participante) {
        showToast('⚠️ ID no encontrado en el sistema', true);
        mostrarEstadoError('NO REGISTRADO', 'El ID "' + codigo + '" no está en el sistema');
        return;
      }

      const categoriaParticipante = participante.categoria;
      if (!categoriaParticipante) {
        showToast('⚠️ El participante no tiene categoría asignada', true);
        mostrarEstadoError('SIN CATEGORÍA', 'Este participante no tiene categoría asignada');
        return;
      }

      const categoriaBloqueada = cacheCategoriasActivas.find(c => {
        const catActiva  = String(c.categoria || '').toLowerCase().trim();
        const catBuscada = String(categoriaParticipante || '').toLowerCase().trim();
        return catActiva === catBuscada;
      });

      if (!categoriaBloqueada) {
        // ── CAMBIO: mensaje "INHABILITADA" en lugar de "NO ACTIVA" ──
        showToast(`⚠️ Categoría "${categoriaParticipante}" inhabilitada`, true);
        mostrarCategoriaInhabilitada(categoriaParticipante);
        return;
      }

      const yaEnviado = historial.find(h => h.id === participante.id);
      stopScanner();
      participanteActual = participante;

      const card = document.getElementById('result-card');
      card.className = 'result-card ' + (yaEnviado ? 'warning' : 'success');
      document.getElementById('res-robot').textContent  = participante.robot || '—';
      document.getElementById('res-nombre').textContent = participante.nombre || '—';
      document.getElementById('res-inst').textContent   = participante.institucion || '—';
      document.getElementById('res-ciudad').textContent = participante.ciudad || '—';
      document.getElementById('res-cat').textContent    = participante.categoria || '—';
      document.getElementById('res-grid').style.display = 'grid';

      const statusEl  = document.getElementById('res-status');
      const btnEnviar = document.getElementById('btn-enviar');
      const iconSVG   = iconRevisar();

      if (yaEnviado) {
        statusEl.textContent  = 'YA ENVIADO';
        statusEl.className    = 'result-status warning';
        btnEnviar.innerHTML   = iconSVG + ' Enviar de nuevo a revisión';
        btnEnviar.classList.remove('inactivo');
      } else {
        statusEl.textContent  = 'LISTO';
        statusEl.className    = 'result-status success';
        btnEnviar.innerHTML   = iconSVG + ' Enviar a revisión';
        btnEnviar.classList.remove('inactivo');
      }
      showToast((yaEnviado ? '⚠ ' : '✓ ') + 'QR leído: ' + (participante.robot || participante.nombre), yaEnviado);

    } catch (error) {
      showToast('❌ Error: ' + error.message, true);
      mostrarEstadoError('ERROR', error.message);
    }
  }

  // ── NUEVO: mostrar estado categoría inhabilitada ──
  function mostrarCategoriaInhabilitada(categoria) {
    const card = document.getElementById('result-card');
    card.className = 'result-card error';
    document.getElementById('res-robot').textContent  = '🚫 CATEGORÍA INHABILITADA';
    document.getElementById('res-nombre').textContent = `La categoría "${categoria}" no está habilitada. Solicita al staff que la habilite.`;
    document.getElementById('res-inst').textContent   = '';
    document.getElementById('res-ciudad').textContent = '';
    document.getElementById('res-cat').textContent    = categoria;
    document.getElementById('res-grid').style.display = 'grid';
    document.getElementById('res-status').textContent = 'INHABILITADA';
    document.getElementById('res-status').className   = 'result-status error';
    document.getElementById('btn-enviar').classList.add('inactivo');
    participanteActual = null;
  }

  function extraerIdDelQR(rawText) {
    if (!rawText) return null;
    let texto = String(rawText).trim();
    if (texto.includes('~')) {
      const id = texto.split('~')[0].trim();
      if (id) return id.toLowerCase();
    }
    try {
      const json = JSON.parse(texto);
      if (json && json.id) return String(json.id).trim();
    } catch(e) {}
    if (texto.includes('?id=') || texto.includes('&id=')) {
      const m = texto.match(/[?&]id=([^&\s]+)/i);
      if (m) return decodeURIComponent(m[1]).trim();
    }
    const mEtiqueta = texto.match(/ID\s*[:=]\s*([^\|\n\r~]+)/i);
    if (mEtiqueta) return mEtiqueta[1].trim();
    const mPatron = texto.match(/sb-\d{4}-[a-z_]+-\d{3}/i);
    if (mPatron) return mPatron[0].toLowerCase().trim();
    const limpio = texto.replace(/[\r\n]+/g, '').trim();
    if (limpio && limpio.length < 50 && !limpio.includes(' ') && !limpio.includes('~'))
      return limpio.toLowerCase();
    return null;
  }

  async function enviarAlCronometro() {
    const btn = document.getElementById('btn-enviar');
    if (btn.classList.contains('inactivo') || !participanteActual) {
      showToast('⚠️ No hay participante para enviar', true); return;
    }
    btn.disabled = true; btn.classList.add('inactivo');
    btn.textContent = '⏳ Enviando...';
    try {
      const ruta = RUTAS_SCANNER[participanteActual.categoria] || 'general';
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'setActivo', ruta,
          participante: {
            id: participanteActual.id, robot: participanteActual.robot,
            nombre: participanteActual.nombre || '', institucion: participanteActual.institucion || '',
            ciudad: participanteActual.ciudad || '', categoria: participanteActual.categoria || '',
            timestamp: Date.now()
          }
        })
      });
      const data = await response.json();
      if (data.ok) {
        showToast('✓ ' + participanteActual.robot + ' → enviado a revisión');
        btn.innerHTML = '<svg class="icon-revisar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Enviado';
        btn.classList.add('sent');
        document.getElementById('res-status').textContent = 'ENVIADO';
        document.getElementById('res-status').className   = 'result-status success';
        agregarAlHistorial(participanteActual);
        setTimeout(() => {
          btn.innerHTML = iconRevisar() + ' Enviar a revisión';
          btn.disabled = false; btn.classList.remove('sent');
        }, 2000);
      } else { throw new Error(data.error || 'Error desconocido'); }
    } catch (error) {
      showToast('Error: ' + error.message, true);
      btn.innerHTML = iconRevisar() + ' Enviar a revisión';
      btn.disabled = false; btn.classList.remove('inactivo');
    }
  }

  function iconRevisar() {
    return `<svg class="icon-revisar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="9" y1="13" x2="15" y2="13"></line>
      <line x1="9" y1="17" x2="15" y2="17"></line>
    </svg>`;
  }

  function agregarAlHistorial(p) {
    const hora = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
    const existeIdx = historial.findIndex(h => h.id === p.id);
    if (existeIdx >= 0) { const item = historial.splice(existeIdx, 1)[0]; item.hora = hora; historial.unshift(item); }
    else historial.unshift({ ...p, hora });
    if (historial.length > 10) historial = historial.slice(0, 10);
    renderHistorial();
  }

  function renderHistorial() {
    const container = document.getElementById('historial');
    document.getElementById('hist-count').textContent = historial.length;
    if (historial.length === 0) { container.innerHTML = '<p class="empty-hist">Ningún QR escaneado aún</p>'; return; }
    container.innerHTML = historial.map(h => `
      <div class="hist-item">
        <div class="hist-item-top">
          <div class="hist-robot">${h.robot || '—'}</div>
          <div class="hist-time">${h.hora}</div>
        </div>
        <div class="hist-nombre">${h.nombre || '—'}</div>
      </div>`).join('');
  }

  function mostrarEstadoError(titulo, mensaje) {
    const card = document.getElementById('result-card');
    card.className = 'result-card error';
    document.getElementById('res-robot').textContent  = titulo;
    document.getElementById('res-nombre').textContent = mensaje;
    document.getElementById('res-grid').style.display = 'none';
    document.getElementById('res-status').textContent = 'ERROR';
    document.getElementById('res-status').className   = 'result-status error';
    document.getElementById('btn-enviar').classList.add('inactivo');
    participanteActual = null;
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent    = msg;
    t.style.color    = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
