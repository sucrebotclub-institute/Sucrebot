<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reglamento - SucreBot 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/styles.css">
    <link rel="stylesheet" href="../shared/css/mobile-fix.css">
    <style>
        body {
            background: #ffffff !important;
            color: #1a1c28 !important;
        }

        /* Panel lateral izquierdo decorativo */
        .reglamento-wrapper::before {
            content: '';
            position: absolute;
            left: -600px;
            top: 0;
            bottom: 0;
            width: 580px;
            background: 
                linear-gradient(135deg, rgba(26,92,168,0.85) 0%, rgba(18,20,26,0.90) 100%),
                url('https://github.com/sucrebotclub-institute/Sucrebot/blob/main/shared/images/image_reglamento.jpg?raw=true') 5% center / cover no-repeat;
            border-radius: 0 16px 16px 0;
            box-shadow: 0 8px 32px rgba(26,92,168,0.3);
            border-right: 2px solid rgba(91,200,240,0.3);
            z-index: 1;
        }

        .reglamento-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            overflow: visible;
        }

        /* ── Hero ── */
        .page-hero {
            padding: 80px 0 32px;
            margin-bottom: 32px;
            text-align: left;
        }

        .page-hero-badge {
            display: block;
            width: fit-content;
            background: #1a5ca8;
            border: 1px solid #1a5ca8;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .page-hero-badge-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            animation: blink 1.6s infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

        .page-hero h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 3px;
            color: #1a3a6e;
            line-height: 1;
            position: relative;
            display: block;
            margin-bottom: 20px;
        }

        .page-hero h2 span { color: #1a5ca8; white-space: nowrap; }

        .page-hero h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #5bc8f0 50%, transparent 100%);
            border-radius: 2px;
        }

        .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

        /* ── Layout ── */
        .reglamento-layout {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 60px;
            position: relative;
            padding-left: 100px;
            padding-right: 40px;
        }

        .reglamento-container {
            flex: 0 0 800px;
            width: 800px;
            position: relative;
            z-index: 1;
        }

        .reglamento-robot {
            flex: 0 0 280px;
            position: sticky;
            top: 420px;
            align-self: flex-start;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 50px;
        }

        .reglamento-robot img {
            width: 100%;
            max-width: 280px;
            height: auto;
            filter: drop-shadow(0 8px 32px rgba(26,92,168,0.25));
            animation: float-robot 4s ease-in-out infinite;
        }

        @keyframes float-robot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* ── Loading / Error ── */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #7a7a8c;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e8f0;
            border-top-color: #1a5ca8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            color: #856404;
            text-align: center;
        }

        /* ── Sección de categoría ── */
        .seccion-categoria {
            margin-bottom: 36px;
        }

        .seccion-titulo {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #1a5ca8;
            padding: 8px 0 10px;
            margin-bottom: 14px;
            border-bottom: 2px solid #1a5ca8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .seccion-titulo::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
        }

        /* ── Acordeón ── */
        .reglamento-item {
            background: #1a5ca8;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #2b6bb8;
        }

        .reglamento-item:hover {
            box-shadow: 0 4px 20px rgba(26,92,168,0.4);
            background: #1e6ec0;
        }

        .reglamento-question {
            padding: 18px 22px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            gap: 12px;
        }

        .reglamento-question h3 {
            margin: 0;
            font-size: 1rem;
            color: #ffffff;
            font-weight: 700;
            flex: 1;
        }

        .reglamento-icon {
            font-size: 1.3rem;
            color: #00d4ff;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .reglamento-item.active .reglamento-icon {
            transform: rotate(180deg);
            color: #ffffff;
        }

        .reglamento-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 22px;
            background: #1e6ec0;
        }

        .reglamento-item.active .reglamento-answer {
            max-height: 700px;
            padding: 0 22px 20px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        /* ── Acciones del archivo ── */
        .archivo-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-accion {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Exo 2', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-descargar {
            background: #00d4ff;
            color: #0a2a5a;
        }

        .btn-descargar:hover {
            background: #00b8e0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,212,255,0.3);
        }

        .btn-preview {
            background: rgba(255,255,255,0.12);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .btn-preview:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-1px);
        }

        /* ── Preview iframe ── */
        .pdf-preview-container {
            margin-top: 14px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            background: #fff;
        }

        .pdf-preview-container.visible { display: block; }

        .pdf-preview-container iframe {
            width: 100%;
            height: 480px;
            border: none;
            display: block;
        }

        .pdf-preview-header {
            background: rgba(0,0,0,0.25);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-preview-header span {
            color: #e8f0ff;
            font-size: 12px;
            font-family: 'Exo 2', sans-serif;
        }

        .btn-cerrar-preview {
            background: none;
            border: none;
            color: #00d4ff;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            line-height: 1;
        }

        .btn-cerrar-preview:hover { color: #ffffff; }

        @media (max-width: 1100px) {
            .reglamento-layout { flex-direction: column; align-items: center; }
            .reglamento-robot { display: none; }
            .reglamento-container { flex: 1; max-width: 100%; width: 100%; }
            .reglamento-wrapper::before { display: none; }
            .reglamento-layout { padding-left: 0; padding-right: 0; }
            .page-hero { padding: 40px 0 24px; }
            .page-hero h2 { font-size: 2rem; }
            .reglamento-question h3 { font-size: 0.95rem; }
            .pdf-preview-container iframe { height: 320px; }
        }
    </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<div class="reglamento-wrapper">
    <div class="reglamento-layout">
        <div class="reglamento-container">

            <!-- Hero -->
            <div class="page-hero">
                <div class="page-hero-badge">
                    <div class="page-hero-badge-dot"></div>
                    SUCREBOT 2026 · TORNEO DE ROBÓTICA
                </div>
                <h2>REGLA<span>MENTO</span></h2>
                <div class="page-hero-sub">
                    <p>NORMAS Y REGLAS OFICIALES DEL TORNEO SUCREBOT 2026</p>
                </div>
            </div>

            <!-- Contenedor dinámico -->
            <div id="reglamentos-content">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Cargando reglamentos...</p>
                </div>
            </div>

        </div>

        <!-- Imagen flotante del robot -->
        <div class="reglamento-robot">
            <img src="../shared/images/REFEBOT-removebg-preview.png" alt="Robot Refebot" />
        </div>
    </div>
</div>

<div data-include="../shared/components/footer.html"></div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>
<script>
// ── Iconos por sección ──────────────────────────────
const SECCION_ICONOS = {
    'amateur':   '🤖',
    'profesional': '⚙️',
    'abierta':   '🏆',
    'default':   '📋'
};

function getIconoSeccion(nombre) {
    const n = nombre.toLowerCase();
    if (n.includes('amateur'))      return SECCION_ICONOS.amateur;
    if (n.includes('profesional'))  return SECCION_ICONOS.profesional;
    if (n.includes('abierta'))      return SECCION_ICONOS.abierta;
    return SECCION_ICONOS.default;
}

// Limpiar prefijo numérico del nombre (ej: "01-AMATEUR" → "AMATEUR")
function limpiarNombre(nombre) {
    return nombre.replace(/^\d+-/, '').trim();
}

function limpiarNombreArchivo(nombre) {
    // Quitar extensión
    return nombre.replace(/\.[^.]+$/, '');
}

// ── Render ──────────────────────────────────────────
function renderReglamentos(secciones) {
    const container = document.getElementById('reglamentos-content');

    if (!secciones || secciones.length === 0) {
        container.innerHTML = `<div class="error-state">No se encontraron reglamentos disponibles aún.</div>`;
        return;
    }

    let html = '';

    secciones.forEach((seccion, si) => {
        const nombreLimpio = limpiarNombre(seccion.seccion);
        const icono = getIconoSeccion(seccion.seccion);
        html += `<div class="seccion-categoria">
            <div class="seccion-titulo">${icono} CATEGORÍA ${nombreLimpio}</div>`;

        if (!seccion.archivos || seccion.archivos.length === 0) {
            html += `<p style="color:#7a7a8c;font-size:13px;padding:10px 0;">Reglamento pendiente de publicación.</p>`;
        } else {
            seccion.archivos.forEach((archivo, ai) => {
                const itemId = `reg-${si}-${ai}`;
                const previewId = `prev-${si}-${ai}`;
                const nombreArch = limpiarNombreArchivo(archivo.nombre);
                const esPDF = archivo.mimeType && archivo.mimeType.includes('pdf');

                html += `
                <div class="reglamento-item" id="${itemId}">
                    <div class="reglamento-question" onclick="toggleItem('${itemId}')">
                        <h3>📄 ${nombreArch}</h3>
                        <span class="reglamento-icon">▼</span>
                    </div>
                    <div class="reglamento-answer">
                        <div class="archivo-actions">
                            <a class="btn-accion btn-descargar"
                               href="https://drive.google.com/uc?export=download&id=${archivo.id}"
                               target="_blank" rel="noopener">
                                ⬇ Descargar PDF
                            </a>
                            ${esPDF ? `<button class="btn-accion btn-preview" onclick="togglePreview('${previewId}', '${archivo.viewUrl}', this)">
                                👁 Vista previa
                            </button>` : ''}
                        </div>
                        ${esPDF ? `
                        <div class="pdf-preview-container" id="${previewId}">
                            <div class="pdf-preview-header">
                                <span>${nombreArch}</span>
                                <button class="btn-cerrar-preview" onclick="cerrarPreview('${previewId}', event)">✕</button>
                            </div>
                            <iframe src="" allowfullscreen loading="lazy"></iframe>
                        </div>` : ''}
                    </div>
                </div>`;
            });
        }

        html += `</div>`;
    });

    container.innerHTML = html;
}

// ── Acordeón ────────────────────────────────────────
function toggleItem(itemId) {
    const item = document.getElementById(itemId);
    const isActive = item.classList.contains('active');
    // Cerrar todos
    document.querySelectorAll('.reglamento-item.active').forEach(el => {
        el.classList.remove('active');
        // Cerrar previews abiertas dentro
        const preview = el.querySelector('.pdf-preview-container');
        if (preview) preview.classList.remove('visible');
    });
    if (!isActive) item.classList.add('active');
}

// ── Vista previa PDF ─────────────────────────────────
function togglePreview(previewId, viewUrl, btn) {
    const container = document.getElementById(previewId);
    const iframe = container.querySelector('iframe');
    const visible = container.classList.contains('visible');

    if (visible) {
        container.classList.remove('visible');
        iframe.src = '';
        btn.textContent = '👁 Vista previa';
    } else {
        // Cargar src solo al abrir
        if (!iframe.src || iframe.src === window.location.href) {
            iframe.src = viewUrl;
        }
        container.classList.add('visible');
        btn.textContent = '🔼 Ocultar';
    }
}

function cerrarPreview(previewId, e) {
    e.stopPropagation();
    const container = document.getElementById(previewId);
    container.classList.remove('visible');
    container.querySelector('iframe').src = '';
    const btn = container.closest('.reglamento-answer').querySelector('.btn-preview');
    if (btn) btn.textContent = '👁 Vista previa';
}

// ── Carga desde GAS ─────────────────────────────────
async function cargarReglamentos() {
    const container = document.getElementById('reglamentos-content');
    try {
        const url = `https://script.google.com/macros/s/${CONFIG.DEPLOYMENT_ID}/exec?action=getReglamentos`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok) {
            renderReglamentos(data.data);
        } else {
            container.innerHTML = `<div class="error-state">⚠️ Error al cargar reglamentos: ${data.error || 'Error desconocido'}</div>`;
        }
    } catch (e) {
        container.innerHTML = `<div class="error-state">⚠️ No se pudo conectar al servidor. Intenta de nuevo más tarde.</div>`;
    }
}

document.addEventListener('componentsLoaded', cargarReglamentos);
</script>

</body>
</html>
