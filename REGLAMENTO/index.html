<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Reglamentos - SucreBot 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="../shared/js/config.js"></script>
  <script src="../shared/js/auspiciantes.js"></script>
  <script src="../shared/js/auspiciantes-splash.js"></script>
    <link rel="stylesheet" href="../shared/css/styles.css">
    <link rel="stylesheet" href="../shared/css/mobile-fix.css">
    <style>
        body { background: #ffffff !important; color: #1a1c28 !important; }

        .reglamento-wrapper::before {
            content: '';
            position: absolute;
            left: -600px; top: 0; bottom: 0; width: 580px;
            background:
                linear-gradient(135deg, rgba(26,92,168,0.85) 0%, rgba(18,20,26,0.90) 100%),
                url('https://github.com/sucrebotclub-institute/Sucrebot/blob/main/shared/images/image_reglamento.jpg?raw=true') 5% center / cover no-repeat;
            border-radius: 0 16px 16px 0;
            box-shadow: 0 8px 32px rgba(26,92,168,0.3);
            border-right: 2px solid rgba(91,200,240,0.3);
            z-index: 1;
        }

        .reglamento-wrapper {
            max-width: 1100px; margin: 0 auto;
            padding: 0 20px 60px; position: relative; overflow: visible;
        }

        .page-hero { padding: 80px 0 32px; margin-bottom: 32px; text-align: left; }
        .page-hero-badge {
            display: block; width: fit-content;
            background: #1a5ca8; border: 1px solid #1a5ca8; color: #fff;
            font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700;
            letter-spacing: 3px; padding: 6px 16px; border-radius: 20px;
            margin-bottom: 14px; text-transform: uppercase;
        }
        .page-hero-badge-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #fff; animation: blink 1.6s infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
        .page-hero h2 {
            font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem;
            letter-spacing: 3px; color: #1a3a6e; line-height: 1;
            position: relative; display: block; margin-bottom: 20px;
        }
        .page-hero h2 span { color: #1a5ca8; }
        .page-hero h2::after {
            content: ''; position: absolute; bottom: -10px; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent 0%, #5bc8f0 50%, transparent 100%);
            border-radius: 2px;
        }
        .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

        .reg-card-meta {
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 5px; flex-shrink: 0;
        }
        .reg-card-fecha {
            font-family: 'Exo 2', sans-serif; font-size: .68rem;
            color: rgba(255,255,255,0.55); white-space: nowrap;
        }

        .reglamento-layout {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 60px;
            position: relative; padding-left: 100px; padding-right: 40px;
        }
        .reglamento-container { flex: 0 0 800px; width: 800px; position: relative; z-index: 1; }
        .reglamento-robot {
            flex: 0 0 280px; position: sticky; top: 420px;
            align-self: flex-start; z-index: 0;
            display: flex; justify-content: center; align-items: center; padding-left: 50px;
        }
        .reglamento-robot img {
            width: 100%; max-width: 280px; height: auto;
            filter: drop-shadow(0 8px 32px rgba(26,92,168,0.25));
            animation: float-robot 4s ease-in-out infinite;
        }
        @keyframes float-robot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

        /* ── Nivel badge ── */
        .nivel-label {
            font-family: 'Orbitron', monospace; font-size: 9px;
            letter-spacing: 3px; color: #1a5ca8; text-transform: uppercase;
            margin: 28px 0 10px; padding-left: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .nivel-label::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(26,92,168,0.3), transparent);
        }

        /* ── Tarjeta de categoría ── */
        .reg-card {
            background: #1a5ca8; border: 1px solid #2b6bb8;
            border-radius: 10px; margin-bottom: 12px; overflow: hidden;
            transition: all .25s;
        }
        .reg-card:hover { box-shadow: 0 4px 20px rgba(26,92,168,0.4); background: #1e6ec0; }

        .reg-card-header {
            padding: 16px 20px; display: flex;
            align-items: center; justify-content: space-between; gap: 12px;
        }
        .reg-card-titulo {
            display: flex; align-items: center; gap: 10px; flex: 1;
        }
        .reg-card-emoji { font-size: 1.3rem; flex-shrink: 0; }
        .reg-card-nombre {
            font-family: 'Orbitron', monospace; font-size: .72rem;
            font-weight: 700; letter-spacing: 2px; color: #fff;
            text-transform: uppercase;
        }
        .reg-card-desc { font-size: .78rem; color: rgba(255,255,255,0.6); margin-top: 3px; }

        /* Estado del reglamento */
        .reg-estado {
            font-family: 'Orbitron', monospace; font-size: .52rem;
            letter-spacing: 1.5px; padding: 4px 10px; border-radius: 20px;
            white-space: nowrap; flex-shrink: 0;
        }
        .reg-estado.pendiente {
            background: rgba(243,156,18,0.15); color: #f39c12;
            border: 1px solid rgba(243,156,18,0.35);
        }
        .reg-estado.disponible {
            background: rgba(46,204,113,0.15); color: #2ecc71;
            border: 1px solid rgba(46,204,113,0.35);
        }

        /* Botones de acción (ocultos hasta que haya PDF) */
        .reg-acciones {
            display: none; padding: 0 20px 16px;
            gap: 10px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 14px;
        }
        .reg-acciones.show { display: flex; }
        .btn-reg {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 18px; border-radius: 6px; font-family: 'Exo 2', sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer;
            text-decoration: none; border: none; transition: all .2s;
        }
        .btn-reg-descargar { background: #00d4ff; color: #0a2a5a; }
        .btn-reg-descargar:hover { background: #00b8e0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,212,255,0.3); }
        .btn-reg-audio { background: #ff6ec7; color: #2a0a1a; }
        .btn-reg-audio:hover { background: #e055ac; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,110,199,0.3); }
        .btn-reg-preview { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
        .btn-reg-preview:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .btn-reg-preview-pista { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
        .btn-reg-preview-pista:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .btn-reg-pista { background: #7ee787; color: #0a2a12; }
        .btn-reg-pista:hover { background: #63d16c; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(126,231,135,0.3); }

        /* Preview imagen de pista */
        .reg-imagen-wrap {
            display: none; margin: 0 20px 16px;
            border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .reg-imagen-wrap.show { display: block; }
        .reg-imagen-wrap img { width: 100%; display: block; background: #fff; }

        /* Preview iframe */
        .reg-iframe-wrap {
            display: none; margin: 0 20px 16px;
            border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .reg-iframe-wrap.show { display: block; }
        .reg-iframe-header {
            background: rgba(0,0,0,0.25); padding: 7px 14px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .reg-iframe-header span { color: #e8f0ff; font-size: 12px; font-family: 'Exo 2', sans-serif; }
        .btn-cerrar-iframe { background: none; border: none; color: #00d4ff; cursor: pointer; font-size: 18px; padding: 0 4px; }
        .reg-iframe-wrap iframe { width: 100%; height: 460px; border: none; display: block; background: #fff; }

        /* Nota pendiente */
        .reg-pendiente-nota {
            padding: 0 20px 14px;
            font-size: .8rem; color: rgba(255,255,255,0.5);
            font-style: italic;
        }

        /* ── Edición (solo visible para Organizador/Admin logueado) ── */
        .reg-loading-msg { color: #7a7a8c; font-size: .9rem; padding: 12px 4px; }
        .btn-reg-editar {
            display: none;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            border-radius: 6px;
            padding: 5px 12px;
            font-family: 'Exo 2', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-reg-editar:hover { background: rgba(255,255,255,0.28); }
        body.staff-mode .btn-reg-editar { display: inline-flex; }

        .reg-add-wrap { display: none; margin-top: 20px; }
        body.staff-mode .reg-add-wrap { display: block; }

        .reg-card-oculta { display: none; }
        body.staff-mode .reg-card-oculta { display: block; opacity: .6; }
        .reg-badge-oculta {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 20px;
            font-family: 'Orbitron', monospace;
            font-size: .5rem;
            letter-spacing: 1px;
            padding: 2px 8px;
            margin-left: 6px;
            vertical-align: middle;
            white-space: nowrap;
        }
        .reg-btn-add {
            background: #1a5ca8;
            color: #ffffff;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 12px 20px;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            width: 100%;
        }
        .reg-btn-add:hover { background: #1e6ec0; }

        .reg-modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(14,18,30,0.7);
            backdrop-filter: blur(4px);
            z-index: 99999;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .reg-modal-overlay.show { display: flex; }
        .reg-modal {
            background: #fff; border-radius: 14px;
            width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
            padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .reg-modal h4 {
            font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
            letter-spacing: 1px; color: #1a3a6e; margin: 0 0 18px;
        }
        .reg-modal-check {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Exo 2', sans-serif; font-size: .9rem; color: #1a1c28;
            margin-bottom: 20px; cursor: pointer;
        }
        .reg-modal > label {
            display: block;
            font-family: 'Orbitron', monospace; font-size: .62rem;
            letter-spacing: 1.5px; color: #1a5ca8; text-transform: uppercase;
            margin: 14px 0 6px;
        }
        .reg-modal > input[type="text"],
        .reg-modal > select {
            display: block; width: 100%; box-sizing: border-box;
            border: 1px solid #d5dae5; border-radius: 8px;
            padding: 10px 12px; font-family: 'Exo 2', sans-serif;
            font-size: .92rem; color: #1a1c28; background: #fff;
        }
        .reg-modal-seccion {
            border-top: 1px solid #eef1f7;
            padding-top: 16px; margin-top: 16px;
        }
        .reg-modal-seccion label {
            display: block;
            font-family: 'Orbitron', monospace; font-size: .62rem;
            letter-spacing: 1.5px; color: #1a5ca8; text-transform: uppercase;
            margin-bottom: 8px;
        }
        .reg-modal-archivo-actual { font-size: .82rem; margin-bottom: 8px; }
        .reg-modal-archivo-actual a { color: #1a5ca8; }
        .reg-modal-sin-archivo { color: #b0b0bc; font-style: italic; }
        .reg-modal-seccion input[type="file"] {
            width: 100%; box-sizing: border-box; font-size: .8rem;
            margin-bottom: 8px;
        }
        .reg-modal-seccion .reg-modal-botones { display: flex; gap: 8px; flex-wrap: wrap; }
        .reg-modal-seccion button {
            border: none; border-radius: 6px; padding: 8px 14px;
            font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: .78rem;
            cursor: pointer;
        }
        .reg-btn-subir { background: #1a5ca8; color: #fff; }
        .reg-btn-subir:hover { background: #1e6ec0; }
        .reg-btn-subir:disabled { opacity: .6; cursor: default; }
        .reg-btn-quitar { background: #fdecec; color: #c0392b; }
        .reg-btn-quitar:hover { background: #fbdada; }
        .reg-modal-cerrar {
            width: 100%; margin-top: 22px; padding: 12px;
            border-radius: 8px; background: #ffffff; color: #1a5ca8;
            border: 2px solid #1a5ca8; font-family: 'Exo 2', sans-serif; font-weight: 700;
            font-size: .88rem; cursor: pointer;
        }
        .reg-modal-cerrar:hover { background: #1a5ca8; color: #ffffff; }

        .reg-modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .reg-modal-actions button { width: auto; flex: 1; margin-top: 0; }

        .reg-modal-fecha-fila { display: flex; gap: 8px; align-items: center; }
        .reg-modal-fecha-fila input[type="date"] {
            flex: 1; border: 1px solid #d5dae5; border-radius: 8px;
            padding: 9px 12px; font-family: 'Exo 2', sans-serif; font-size: .85rem;
            color: #1a1c28;
        }

        @media (max-width: 1100px) {
            .reglamento-layout { flex-direction: column; align-items: center; }
            .reglamento-robot { display: none; }
            .reglamento-container { flex: 1; max-width: 100%; width: 100%; }
            .reglamento-wrapper::before { display: none; }
            .reglamento-layout { padding-left: 0; padding-right: 0; }
            .page-hero { padding: 40px 0 24px; }
            .page-hero h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<div class="reglamento-wrapper">
    <div class="reglamento-layout">
        <div class="reglamento-container">

            <div class="page-hero">
                <div class="page-hero-badge">
                    <div class="page-hero-badge-dot"></div>
                    SUCREBOT 2026 · TORNEO DE ROBÓTICA
                </div>
                <h2>REGLA<span>MENTOS</span></h2>
                <div class="page-hero-sub">
                    <p>NORMAS Y REGLAS OFICIALES DEL TORNEO SUCREBOT 2026</p>
                </div>
            </div>

            <div id="reglamentos-content"></div>

        </div>

        <div class="reglamento-robot">
            <img src="../shared/images/REFEBOT-removebg-preview.png" alt="Robot Refebot" />
        </div>
    </div>
</div>

<div class="reg-modal-overlay" id="regModalOverlay">
    <div class="reg-modal">
        <h4 id="regModalTitulo">Editar archivos</h4>

        <label class="reg-modal-check">
            <input type="checkbox" id="regModalDisponible" onchange="cambiarDisponibleReglamento()">
            Reglamento disponible al público
        </label>

        <label class="reg-modal-check">
            <input type="checkbox" id="regModalOculta" onchange="cambiarOcultaReglamento()">
            🙈 Ocultar esta categoría del público (vos la seguís viendo así, atenuada)
        </label>

        <label for="regModalFecha">Fecha de "Actualizado"</label>
        <div class="reg-modal-fecha-fila">
            <input type="date" id="regModalFecha">
            <button class="reg-btn-subir" id="regModalFechaBtn" onclick="guardarFechaModal()">💾 Guardar fecha</button>
        </div>

        <div class="reg-modal-seccion">
            <label>PDF del reglamento</label>
            <div class="reg-modal-archivo-actual" id="regModalPdfActual"></div>
            <input type="file" id="regModalPdfInput" accept="application/pdf">
            <div class="reg-modal-botones">
                <button class="reg-btn-subir" id="regModalPdfBtn" onclick="subirArchivoModal('pdf')">📤 Subir / Reemplazar</button>
            </div>
        </div>

        <div class="reg-modal-seccion">
            <label>Música (opcional — Bailarín)</label>
            <div class="reg-modal-archivo-actual" id="regModalAudioActual"></div>
            <input type="file" id="regModalAudioInput" accept="audio/*">
            <div class="reg-modal-botones">
                <button class="reg-btn-subir" id="regModalAudioBtn" onclick="subirArchivoModal('audio')">📤 Subir / Reemplazar</button>
                <button class="reg-btn-quitar" id="regModalAudioQuitar" onclick="quitarArchivoModal('audio')">🗑️ Quitar música</button>
            </div>
        </div>

        <div class="reg-modal-seccion">
            <label>Imagen de pista (opcional — Seguidor de línea)</label>
            <div class="reg-modal-archivo-actual" id="regModalPistaActual"></div>
            <input type="file" id="regModalPistaInput" accept="image/*">
            <div class="reg-modal-botones">
                <button class="reg-btn-subir" id="regModalPistaBtn" onclick="subirArchivoModal('pista')">📤 Subir / Reemplazar</button>
                <button class="reg-btn-quitar" id="regModalPistaQuitar" onclick="quitarArchivoModal('pista')">🗑️ Quitar pista</button>
            </div>
        </div>

        <div class="reg-modal-seccion" id="regModalZonaPeligro" style="display:none;">
            <label>Zona de peligro</label>
            <button class="reg-btn-quitar" style="width:100%;" onclick="eliminarCategoriaModal()">🗑️ Eliminar esta categoría</button>
        </div>

        <button class="reg-modal-cerrar" onclick="cerrarModalReglamento()">Cerrar</button>
    </div>
</div>

<div class="reg-modal-overlay" id="regNuevaCatOverlay">
    <div class="reg-modal">
        <h4>Agregar categoría</h4>

        <label for="regNuevaCatNivel">Nivel</label>
        <select id="regNuevaCatNivel">
            <option value="🏅 Amateur">🏅 Amateur</option>
            <option value="🏆 Pro">🏆 Pro</option>
            <option value="🌟 Open">🌟 Open</option>
        </select>

        <label for="regNuevaCatEmoji">Emoji</label>
        <input type="text" id="regNuevaCatEmoji" placeholder="Ej: 🤖" maxlength="8">

        <label for="regNuevaCatNombre">Nombre</label>
        <input type="text" id="regNuevaCatNombre" placeholder="Nombre de la categoría">

        <label for="regNuevaCatDesc">Descripción</label>
        <input type="text" id="regNuevaCatDesc" placeholder="Descripción breve">

        <div class="reg-modal-actions">
            <button class="reg-modal-cerrar" onclick="cerrarModalNuevaCategoria()">Cancelar</button>
            <button class="reg-btn-subir" style="width:100%;" onclick="crearCategoriaModal()">➕ Crear categoría</button>
        </div>
    </div>
</div>

<div data-include="../shared/components/footer.html"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>
<script>
// ── Definición de categorías ──────────────────────────────────
// Datos fijos (emoji/nombre/desc) -- coinciden con CATEGORIA_MAP de Code.gs,
// no se agregan/quitan categorías desde acá. Lo editable (driveId del PDF,
// audioId, pistaId de la imagen de pista, disponible, actualizado) vive en
// la hoja 'reglamentos_config' y se carga vía getReglamentosConfig, ver
// REGLAMENTOS_CONFIG/cargarReglamentosConfig más abajo.
const CATEGORIAS = [
  {
    nivel: '🏅 Amateur',
    items: [
      { emoji: '🐛', nombre: 'Insectos',                         desc: 'Robots de combate pequeño formato' },
      { emoji: '🧗', nombre: 'Trepador (Amateur)',               desc: 'Ascenso de estructura vertical' },
      { emoji: '➡️', nombre: 'Seguidor de línea ST (Amateur)',   desc: 'Seguimiento autónomo de trayectoria' },
    ]
  },
  {
    nivel: '🏆 Pro',
    items: [
      { emoji: '➡️', nombre: 'Seguidor de línea ST (Pro)',       desc: 'Seguimiento autónomo avanzado' },
      { emoji: '⚔️', nombre: 'Minisumo Autónomo',               desc: 'Combate autónomo en ring circular' },
      { emoji: '🕹️', nombre: 'Minisumo RC',                     desc: 'Combate con control remoto' },
      { emoji: '💃', nombre: 'Bailarín',                         desc: 'Coreografía sincronizada con música' },
      { emoji: '🥊', nombre: 'Batalla',                          desc: 'Combate por criterios de jurado' },
      { emoji: '🧗', nombre: 'Trepador (Pro)',                   desc: 'Ascenso de estructura vertical Pro' },
      { emoji: '⚽', nombre: 'Robot Soccer',                     desc: 'Fútbol robótico por equipos' },
    ]
  },
  {
    nivel: '🌟 Open',
    items: [
      { emoji: '🟥', nombre: 'Cubo Rubik',                       desc: 'Resolución de cubo Rubik' },
      { emoji: '🧱', nombre: 'Lego Kids',                        desc: 'Ensamble y carrera con Lego' },
      { emoji: '💡', nombre: 'Impacto Tecnológico',              desc: 'Proyecto de innovación y tecnología' },
    ]
  }
];

const GAS_URL = CONFIG.GAS_URL();
const REG_CACHE_KEY = 'sucrebot_reglamentos_cache';
let REGLAMENTOS_CONFIG = {}; // nombre de categoría -> {driveId, audioId, pistaId, disponible, actualizado}
let regEditCategoria = null; // nombre de la categoría abierta en el modal

function buscarCategoriaBase(nombre) {
  for (const grupo of CATEGORIAS) {
    const item = grupo.items.find(i => i.nombre === nombre);
    if (item) return item;
  }
  return null;
}

function categoriaCompleta(nombre) {
  const base = buscarCategoriaBase(nombre); // null si es una categoría personalizada (no vive en el array CATEGORIAS)
  const cfg  = REGLAMENTOS_CONFIG[nombre] || {};
  return {
    nombre,
    emoji: (base && base.emoji) || cfg.emoji || '📄',
    desc: (base && base.desc) || cfg.desc || '',
    driveId: cfg.driveId || '',
    audioId: cfg.audioId || '',
    pistaId: cfg.pistaId || '',
    disponible: cfg.disponible === true,
    actualizado: cfg.actualizado || '',
    personalizada: !base && cfg.personalizada === true,
    oculta: cfg.oculta === true
  };
}

async function cargarReglamentosConfig(forzar) {
  if (!forzar) {
    try {
      const cache = JSON.parse(localStorage.getItem(REG_CACHE_KEY) || 'null');
      if (cache && cache.data) { REGLAMENTOS_CONFIG = cache.data; renderReglamentos(); }
    } catch (e) {}
  }
  try {
    const r = await fetch(GAS_URL + '?action=getReglamentosConfig', { cache: 'no-store' }).then(x => x.json());
    if (r && r.ok) {
      REGLAMENTOS_CONFIG = {};
      (r.data || []).forEach(c => { REGLAMENTOS_CONFIG[c.categoria] = c; });
      localStorage.setItem(REG_CACHE_KEY, JSON.stringify({ data: REGLAMENTOS_CONFIG }));
      renderReglamentos();
    }
  } catch (e) {
    console.error('Error cargando reglamentos', e);
    if (!Object.keys(REGLAMENTOS_CONFIG).length) {
      document.getElementById('reglamentos-content').innerHTML =
        '<div class="reg-loading-msg">⚠️ No se pudieron cargar los reglamentos. Intenta recargar la página.</div>';
    }
  }
}

function renderReglamentos() {
  const container = document.getElementById('reglamentos-content');
  if (!Object.keys(REGLAMENTOS_CONFIG).length) {
    container.innerHTML = '<div class="reg-loading-msg">Cargando reglamentos...</div>';
    return;
  }
  let html = '';

  // Categorías personalizadas (creadas desde "➕ Agregar categoría") agrupadas
  // por su propio campo 'nivel' -- se agregan al final de la sección que
  // corresponda, junto a las 13 categorías fijas de ese mismo nivel.
  const nombresFijos = new Set();
  CATEGORIAS.forEach(g => g.items.forEach(i => nombresFijos.add(i.nombre)));
  const personalizadasPorNivel = {};
  Object.keys(REGLAMENTOS_CONFIG).forEach(nombre => {
    const cfg = REGLAMENTOS_CONFIG[nombre];
    if (!nombresFijos.has(nombre) && cfg.personalizada) {
      const niv = cfg.nivel || '🌟 Open';
      if (!personalizadasPorNivel[niv]) personalizadasPorNivel[niv] = [];
      personalizadasPorNivel[niv].push(nombre);
    }
  });

  CATEGORIAS.forEach(grupo => {
    html += `<div class="nivel-label">${grupo.nivel}</div>`;
    const nombresDelGrupo = grupo.items.map(i => i.nombre).concat(personalizadasPorNivel[grupo.nivel] || []);
    nombresDelGrupo.forEach((nombreCat, i) => {
      const cat = categoriaCompleta(nombreCat);
      // La visibilidad de '.reg-card-oculta' es 100% CSS (display:none por
      // defecto, visible atenuada solo con body.staff-mode) -- así no
      // depende de si este render corrió antes o después de que se
      // resuelva esperarRol()/staff-mode, igual que los botones de editar.
      const id = `reg-${grupo.nivel.replace(/\s/g,'-')}-${i}`;
      const iframeId = `iframe-${id}`;
      const imgWrapId = `img-${id}`;
      const nombreSeguro = cat.nombre.replace(/'/g, "\\'");
      html += `
      <div class="reg-card${cat.oculta ? ' reg-card-oculta' : ''}" id="${id}">
        <div class="reg-card-header">
          <div class="reg-card-titulo">
            <span class="reg-card-emoji">${cat.emoji}</span>
            <div>
              <div class="reg-card-nombre">${cat.nombre}${cat.oculta ? ' <span class="reg-badge-oculta">🙈 Oculta al público</span>' : ''}</div>
              <div class="reg-card-desc">${cat.desc}</div>
            </div>
          </div>
          <div class="reg-card-meta">
            <span class="reg-estado ${cat.disponible ? 'disponible' : 'pendiente'}">
              ${cat.disponible ? '✓ Disponible' : '⏳ Próximamente'}
            </span>
            ${cat.disponible && cat.actualizado ? `<span class="reg-card-fecha">Actualizado: ${formatearFecha(cat.actualizado)}</span>` : ''}
            <button class="btn-reg-editar" onclick="abrirModalReglamento('${nombreSeguro}')">🔧 Editar archivos</button>
          </div>
        </div>
        ${cat.disponible && cat.driveId ? `
        <div class="reg-acciones show">
          <a class="btn-reg btn-reg-descargar"
             href="https://drive.google.com/uc?export=download&id=${cat.driveId}"
             target="_blank" rel="noopener">⬇ Descargar PDF</a>
          ${cat.audioId ? `
          <a class="btn-reg btn-reg-audio"
             href="https://drive.google.com/uc?export=download&id=${cat.audioId}"
             target="_blank" rel="noopener">🎵 Descargar Música</a>
          ` : ''}
          <button class="btn-reg btn-reg-preview" onclick="togglePreview('${iframeId}', '${cat.driveId}', this)">
            👁 Vista previa
          </button>
          ${cat.pistaId ? `
          <a class="btn-reg btn-reg-pista"
             href="https://drive.google.com/uc?export=download&id=${cat.pistaId}"
             target="_blank" rel="noopener">🗺️ Descargar Pista</a>
          <button class="btn-reg btn-reg-preview-pista" onclick="toggleImagenPista('${imgWrapId}', '${cat.pistaId}', this)">
            👁 Ver Pista
          </button>
          ` : ''}
        </div>
        ${cat.pistaId ? `
        <div class="reg-imagen-wrap" id="${imgWrapId}">
          <div class="reg-iframe-header">
            <span>Pista · ${cat.nombre}</span>
            <button class="btn-cerrar-iframe" onclick="cerrarImagenPista('${imgWrapId}', event)">✕</button>
          </div>
          <img src="" alt="Pista ${cat.nombre}" loading="lazy" />
        </div>
        ` : ''}
        <div class="reg-iframe-wrap" id="${iframeId}">
          <div class="reg-iframe-header">
            <span>${cat.nombre}</span>
            <button class="btn-cerrar-iframe" onclick="cerrarIframe('${iframeId}', event)">✕</button>
          </div>
          <iframe src="" allowfullscreen loading="lazy"></iframe>
        </div>
        ` : `
        <div class="reg-pendiente-nota">El reglamento de esta categoría será publicado próximamente.</div>
        `}
      </div>`;
    });
  });

  html += `
  <div class="reg-add-wrap">
    <button class="reg-btn-add" onclick="abrirModalNuevaCategoria()">➕ Agregar categoría</button>
  </div>`;

  container.innerHTML = html;
}

function togglePreview(iframeId, driveId, btn) {
  const wrap = document.getElementById(iframeId);
  const iframe = wrap.querySelector('iframe');
  const visible = wrap.classList.contains('show');
  if (visible) {
    wrap.classList.remove('show');
    iframe.src = '';
    btn.textContent = '👁 Vista previa';
  } else {
    iframe.src = `https://drive.google.com/file/d/${driveId}/preview`;
    wrap.classList.add('show');
    btn.textContent = '🔼 Ocultar';
  }
}

function cerrarIframe(iframeId, e) {
  e.stopPropagation();
  const wrap = document.getElementById(iframeId);
  wrap.classList.remove('show');
  wrap.querySelector('iframe').src = '';
  const btn = wrap.previousElementSibling?.querySelector('.btn-reg-preview');
  if (btn) btn.textContent = '👁 Vista previa';
}

function toggleImagenPista(imgWrapId, pistaId, btn) {
  const wrap = document.getElementById(imgWrapId);
  const img = wrap.querySelector('img');
  const visible = wrap.classList.contains('show');
  if (visible) {
    wrap.classList.remove('show');
    img.src = '';
    btn.textContent = '👁 Ver Pista';
  } else {
    img.src = `https://drive.google.com/uc?export=view&id=${pistaId}`;
    wrap.classList.add('show');
    btn.textContent = '🔼 Ocultar';
  }
}

function cerrarImagenPista(imgWrapId, e) {
  e.stopPropagation();
  const wrap = document.getElementById(imgWrapId);
  wrap.classList.remove('show');
  wrap.querySelector('img').src = '';
  const btn = wrap.previousElementSibling?.querySelector('.btn-reg-preview-pista');
  if (btn) btn.textContent = '👁 Ver Pista';
}

function formatearFecha(fechaStr) {
  const [anio, mes, dia] = fechaStr.split('-').map(Number);
  const fecha = new Date(anio, mes - 1, dia); // evita desfase de zona horaria
  return fecha.toLocaleDateString('es-EC', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
}

// ═══════════════════════════════════════════════════════
//  Edición de archivos -- editable para Organizador/Admin
// ═══════════════════════════════════════════════════════
function gasPostReglamento(body) {
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, staffToken: localStorage.getItem('sucrebot_staff_token') || '' })
  }).then(r => r.json());
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function capitalizar(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function actualizarEstadoArchivoModal(tipo, id) {
  const cont = document.getElementById('regModal' + capitalizar(tipo) + 'Actual');
  cont.innerHTML = id
    ? `<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">📄 Ver archivo actual</a>`
    : '<span class="reg-modal-sin-archivo">Sin archivo</span>';
  const btnQuitar = document.getElementById('regModal' + capitalizar(tipo) + 'Quitar');
  if (btnQuitar) btnQuitar.style.display = id ? 'inline-flex' : 'none';
}

function abrirModalReglamento(nombre) {
  regEditCategoria = nombre;
  const cat = categoriaCompleta(nombre);
  document.getElementById('regModalTitulo').textContent = 'Editar archivos — ' + cat.nombre;
  document.getElementById('regModalDisponible').checked = cat.disponible;
  document.getElementById('regModalOculta').checked = cat.oculta;
  document.getElementById('regModalFecha').value = cat.actualizado || '';
  actualizarEstadoArchivoModal('pdf', cat.driveId);
  actualizarEstadoArchivoModal('audio', cat.audioId);
  actualizarEstadoArchivoModal('pista', cat.pistaId);
  document.getElementById('regModalPdfInput').value = '';
  document.getElementById('regModalAudioInput').value = '';
  document.getElementById('regModalPistaInput').value = '';
  document.getElementById('regModalZonaPeligro').style.display = cat.personalizada ? 'block' : 'none';
  document.getElementById('regModalOverlay').classList.add('show');
}

function cerrarModalReglamento() {
  document.getElementById('regModalOverlay').classList.remove('show');
  regEditCategoria = null;
}

async function cambiarDisponibleReglamento() {
  const checkbox = document.getElementById('regModalDisponible');
  const disponible = checkbox.checked;
  checkbox.disabled = true;
  try {
    const r = await gasPostReglamento({ action: 'setDisponibleReglamento', categoria: regEditCategoria, disponible });
    if (!r || !r.ok) { alert('Error: ' + (r && r.error || 'desconocido')); checkbox.checked = !disponible; return; }
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error: ' + e.message);
    checkbox.checked = !disponible;
  }
  checkbox.disabled = false;
}

async function cambiarOcultaReglamento() {
  const checkbox = document.getElementById('regModalOculta');
  const oculta = checkbox.checked;
  checkbox.disabled = true;
  try {
    const r = await gasPostReglamento({ action: 'setOcultaReglamento', categoria: regEditCategoria, oculta });
    if (!r || !r.ok) { alert('Error: ' + (r && r.error || 'desconocido')); checkbox.checked = !oculta; return; }
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error: ' + e.message);
    checkbox.checked = !oculta;
  }
  checkbox.disabled = false;
}

async function guardarFechaModal() {
  const input = document.getElementById('regModalFecha');
  const fecha = input.value;
  if (!fecha) { alert('Selecciona una fecha primero.'); return; }
  const btn = document.getElementById('regModalFechaBtn');
  btn.disabled = true;
  try {
    const r = await gasPostReglamento({ action: 'setFechaReglamento', categoria: regEditCategoria, fecha });
    if (!r || !r.ok) { alert('Error: ' + (r && r.error || 'desconocido')); return; }
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error: ' + e.message);
  }
  btn.disabled = false;
}

async function subirArchivoModal(tipo) {
  const input = document.getElementById('regModal' + capitalizar(tipo) + 'Input');
  const file = input.files[0];
  if (!file) { alert('Selecciona un archivo primero.'); return; }
  const btn = document.getElementById('regModal' + capitalizar(tipo) + 'Btn');
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Subiendo...';
  try {
    const base64 = await fileToBase64(file);
    const r = await gasPostReglamento({
      action: 'subirArchivoReglamento',
      categoria: regEditCategoria,
      tipo,
      fileName: file.name,
      mimeType: file.type,
      base64
    });
    if (!r || !r.ok) { alert('Error al subir: ' + (r && r.error || 'desconocido')); return; }
    actualizarEstadoArchivoModal(tipo, r.driveId);
    input.value = '';
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error al subir: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = textoOriginal;
}

async function quitarArchivoModal(tipo) {
  if (!confirm('¿Quitar este archivo?')) return;
  try {
    const r = await gasPostReglamento({ action: 'eliminarArchivoReglamento', categoria: regEditCategoria, tipo });
    if (!r || !r.ok) { alert('Error al quitar: ' + (r && r.error || 'desconocido')); return; }
    actualizarEstadoArchivoModal(tipo, '');
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error al quitar: ' + e.message);
  }
}

async function eliminarCategoriaModal() {
  if (!confirm('¿Eliminar la categoría "' + regEditCategoria + '" y todos sus archivos? Esta acción no se puede deshacer.')) return;
  try {
    const r = await gasPostReglamento({ action: 'eliminarCategoriaReglamento', categoria: regEditCategoria });
    if (!r || !r.ok) { alert('Error al eliminar: ' + (r && r.error || 'desconocido')); return; }
    cerrarModalReglamento();
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error al eliminar: ' + e.message);
  }
}

function abrirModalNuevaCategoria() {
  document.getElementById('regNuevaCatNivel').value = '🏅 Amateur';
  document.getElementById('regNuevaCatEmoji').value = '';
  document.getElementById('regNuevaCatNombre').value = '';
  document.getElementById('regNuevaCatDesc').value = '';
  document.getElementById('regNuevaCatOverlay').classList.add('show');
}

function cerrarModalNuevaCategoria() {
  document.getElementById('regNuevaCatOverlay').classList.remove('show');
}

async function crearCategoriaModal() {
  const nivel  = document.getElementById('regNuevaCatNivel').value;
  const emoji  = document.getElementById('regNuevaCatEmoji').value.trim();
  const nombre = document.getElementById('regNuevaCatNombre').value.trim();
  const desc   = document.getElementById('regNuevaCatDesc').value.trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }
  try {
    const r = await gasPostReglamento({ action: 'crearCategoriaReglamento', nombre, emoji, desc, nivel });
    if (!r || !r.ok) { alert('Error al crear: ' + (r && r.error || 'desconocido')); return; }
    cerrarModalNuevaCategoria();
    await cargarReglamentosConfig(true);
  } catch (e) {
    alert('Error al crear: ' + e.message);
  }
}

cargarReglamentosConfig(false);

(async () => {
  if (window.esperarRol) await window.esperarRol();
  if (window.esStaffCompleto && window.esStaffCompleto()) {
    document.body.classList.add('staff-mode');
  }
})();
</script>
