<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Mis Certificados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- CSS compartido -->
  <link rel="stylesheet" href="../shared/css/styles.css">
  
  <!-- CSS específico de MIS-CERTIFICADOS -->
  <style>
    body {
      background: #f4f7fb !important;
      color: #1a1a2e !important;
    }
    main { min-height: calc(100vh - 174px); background: #f4f7fb; }

    /* ── WRAPPER ── */
    .wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
    
    /* ── PAGE HERO ── */
    .page-hero { padding: 40px 0 32px; border-bottom: 1px solid rgba(26,92,168,0.15); margin-bottom: 32px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; border: 1px solid #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

    /* ── PANTALLA LOGIN ── */
    .login-screen { background: linear-gradient(135deg, #2a5a9e 0%, #1a4580 50%, #0f3566 100%); border-radius: 20px; padding: 60px 40px; text-align: center; box-shadow: 0 12px 40px rgba(26,92,168,0.35); max-width: 480px; margin: 0 auto; }
    .login-icon { font-size: 72px; margin-bottom: 24px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); }
    .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; color: #ffffff; margin-bottom: 12px; }
    .login-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 32px; line-height: 1.6; }
    .btn-google { background: #ffffff; color: #1a3a6e; font-family: 'Exo 2', sans-serif; font-size: 15px; font-weight: 700; padding: 14px 32px; border: none; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; transition: all 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
    .btn-google img { width: 20px; height: 20px; }

    /* ── CONTENEDOR CERTIFICADOS ── */
    .certificados-container { background: #ffffff; border-radius: 20px; padding: 36px 32px; box-shadow: 0 4px 24px rgba(26,92,168,0.1); }
    .user-info { display: flex; align-items: center; gap: 16px; padding: 20px; background: linear-gradient(135deg, #e8f4ff 0%, #d4e8ff 100%); border-radius: 12px; margin-bottom: 32px; border-left: 4px solid #1a5ca8; }
    .user-avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #1a5ca8; }
    .user-details { flex: 1; }
    .user-name { font-family: 'Exo 2', sans-serif; font-size: 16px; font-weight: 700; color: #1a3a6e; margin-bottom: 2px; }
    .user-email { font-size: 12px; color: #7a7a8c; }
    .btn-logout { background: #ff3b3b; color: #ffffff; border: none; padding: 8px 16px; border-radius: 8px; font-family: 'Exo 2', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { background: #d92845; transform: translateY(-1px); }

    /* ── LISTA CERTIFICADOS ── */
    .certificados-titulo { font-family: 'Exo 2', sans-serif; font-size: 18px; font-weight: 700; color: #1a3a6e; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e8f0ff; }
    .certificados-grid { display: grid; gap: 20px; }
    .certificado-card { background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%); border: 2px solid #e8f0ff; border-radius: 16px; padding: 24px; transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; }
    .certificado-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(26,92,168,0.2); border-color: #1a5ca8; }
    .certificado-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
    .certificado-tipo { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 6px 14px; border-radius: 8px; }
    .certificado-tipo.participacion { background: #e8f4ff; color: #1a5ca8; }
    .certificado-tipo.primer { background: #ffd700; color: #8b6914; }
    .certificado-tipo.segundo { background: #c0c0c0; color: #4a4a4a; }
    .certificado-tipo.tercer { background: #cd7f32; color: #ffffff; }
    .certificado-codigo { font-family: 'DM Mono', monospace; font-size: 11px; color: #7a7a8c; background: #f4f7fb; padding: 4px 10px; border-radius: 6px; }
    .certificado-info { margin-bottom: 20px; }
    .certificado-evento { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: #1a3a6e; margin-bottom: 8px; }
    .certificado-detalles { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 13px; }
    .certificado-label { color: #7a7a8c; font-weight: 600; }
    .certificado-value { color: #2a3f5f; font-weight: 700; }
    .certificado-actions { display: flex; gap: 12px; }
    .btn-descargar { flex: 1; background: linear-gradient(135deg, #1a5ca8 0%, #0f3d75 100%); color: #ffffff; border: none; padding: 12px 20px; border-radius: 10px; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-descargar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,92,168,0.4); }

    .vacio-msg { text-align: center; padding: 60px 20px; color: #7a7a8c; font-size: 14px; }
    .vacio-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 2px solid rgba(0,255,136,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { color: #ff3b3b; border-color: rgba(255,59,59,0.4); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .login-screen { padding: 40px 24px; }
      .certificados-container { padding: 24px 16px; }
      .user-info { flex-direction: column; text-align: center; }
      .certificado-card-header { flex-direction: column; gap: 12px; }
      .certificado-detalles { grid-template-columns: 1fr; }
      .certificado-label::after { content: ': '; }
    }

    /* ── PLANTILLA CERTIFICADO (OCULTA) ── */
    #certificado-template { position: absolute; left: -9999px; top: -9999px; width: 1200px; height: 900px; }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    <div class="page-hero">
      <div class="page-hero-badge">
        <div class="page-hero-badge-dot"></div>
        SUCREBOT 2026 · CERTIFICADOS
      </div>
      <h2>MIS <span>CERTIFICADOS</span></h2>
      <div class="page-hero-sub">
        <div class="page-hero-line"></div>
        <p>CONSULTA Y DESCARGA TUS CERTIFICADOS DE PARTICIPACIÓN</p>
      </div>
    </div>

    <!-- PANTALLA LOGIN -->
    <div id="login-screen" class="login-screen">
      <div class="login-icon">🎓</div>
      <h3 class="login-title">ACCESO A CERTIFICADOS</h3>
      <p class="login-subtitle">Inicia sesión con tu cuenta de Google para ver tus certificados de SucreBot</p>
      <div id="google-signin-button"></div>
    </div>

    <!-- CONTENEDOR CERTIFICADOS (oculto inicialmente) -->
    <div id="certificados-container" class="certificados-container" style="display:none;">
      <div class="user-info">
        <img id="user-avatar" src="" alt="Avatar" class="user-avatar">
        <div class="user-details">
          <div class="user-name" id="user-name">—</div>
          <div class="user-email" id="user-email">—</div>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>

      <div class="certificados-titulo">📜 Tus Certificados</div>
      <div class="certificados-grid" id="certificados-lista">
        <div class="vacio-msg">
          <div class="vacio-icon">⏳</div>
          Cargando certificados...
        </div>
      </div>
    </div>
  </div>
</main>

<div data-include="../shared/components/footer.html"></div>

<div class="toast" id="toast"></div>

<!-- PLANTILLA CERTIFICADO OCULTA (para generar PDF) -->
<div id="certificado-template">
  <!-- Aquí irá el diseño del certificado para convertir a PDF -->
</div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  let userEmail = '';

  // Callback de Google Sign-In
  function handleCredentialResponse(response) {
    const credential = response.credential;
    const payload = parseJwt(credential);
    
    userEmail = payload.email;
    
    // Guardar en localStorage (igual que auth.js)
    const userData = {
      name: payload.name,
      email: payload.email,
      picture: payload.picture
    };
    localStorage.setItem('sucrebot_user', JSON.stringify(userData));
    
    // Mostrar UI de certificados
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('certificados-container').style.display = 'block';
    document.getElementById('user-avatar').src = payload.picture;
    document.getElementById('user-name').textContent = payload.name;
    document.getElementById('user-email').textContent = payload.email;
    
    // Cargar certificados
    cargarCertificados();
  }

  function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }

  function cerrarSesion() {
    localStorage.removeItem('sucrebot_user');
    window.location.reload();
  }

  async function cargarCertificados() {
    const lista = document.getElementById('certificados-lista');
    lista.innerHTML = '<div class="vacio-msg"><div class="vacio-icon">⏳</div>Cargando certificados...</div>';
    
    try {
      const response = await fetch(GAS_URL + '?action=obtenerCertificados&correo=' + encodeURIComponent(userEmail));
      const certificados = await response.json();
      
      if (!Array.isArray(certificados) || certificados.length === 0) {
        lista.innerHTML = `
          <div class="vacio-msg">
            <div class="vacio-icon">📭</div>
            No tienes certificados registrados aún.<br>
            Los certificados se generan después del evento.
          </div>
        `;
        return;
      }
      
      lista.innerHTML = certificados.map(cert => {
        let tipoClass = 'participacion';
        let tipoTexto = '🏅 PARTICIPACIÓN';
        
        if (cert.tipo_certificado === '1er') {
          tipoClass = 'primer';
          tipoTexto = '🥇 PRIMER LUGAR';
        } else if (cert.tipo_certificado === '2do') {
          tipoClass = 'segundo';
          tipoTexto = '🥈 SEGUNDO LUGAR';
        } else if (cert.tipo_certificado === '3er') {
          tipoClass = 'tercer';
          tipoTexto = '🥉 TERCER LUGAR';
        }
        
        return `
          <div class="certificado-card">
            <div class="certificado-card-header">
              <span class="certificado-tipo ${tipoClass}">${tipoTexto}</span>
              <span class="certificado-codigo">${cert.codigo_verificacion || '—'}</span>
            </div>
            <div class="certificado-info">
              <div class="certificado-evento">${cert.evento || 'SucreBot 2026'}</div>
              <div class="certificado-detalles">
                <span class="certificado-label">Categoría</span>
                <span class="certificado-value">${cert.categoria || '—'}</span>
                <span class="certificado-label">Institución</span>
                <span class="certificado-value">${cert.institucion || '—'}</span>
                <span class="certificado-label">Fecha del evento</span>
                <span class="certificado-value">${cert.fecha_evento || '—'}</span>
                <span class="certificado-label">Generado el</span>
                <span class="certificado-value">${cert.fecha_generacion || '—'}</span>
              </div>
            </div>
            <div class="certificado-actions">
              <button class="btn-descargar" onclick='descargarCertificado(${JSON.stringify(cert).replace(/'/g, "&apos;")})'>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
                Descargar PDF
              </button>
            </div>
          </div>
        `;
      }).join('');
      
    } catch (e) {
      console.error('Error al cargar certificados:', e);
      lista.innerHTML = `
        <div class="vacio-msg">
          <div class="vacio-icon">⚠️</div>
          Error al cargar certificados.<br>
          Intenta nuevamente más tarde.
        </div>
      `;
      showToast('Error al cargar certificados: ' + e.message, true);
    }
  }

  function descargarCertificado(cert) {
    showToast('🎨 Generando certificado en PDF...');
    
    // Aquí implementaremos la generación del PDF
    // Por ahora solo mostramos un mensaje
    setTimeout(() => {
      showToast('✅ Certificado generado (función en desarrollo)');
    }, 1500);
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (error ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Inicializar Google Sign-In
  window.onload = function() {
    // Verificar si ya hay sesión
    const savedUser = localStorage.getItem('sucrebot_user');
    if (savedUser) {
      try {
        const userData = JSON.parse(savedUser);
        userEmail = userData.email;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('certificados-container').style.display = 'block';
        document.getElementById('user-avatar').src = userData.picture;
        document.getElementById('user-name').textContent = userData.name;
        document.getElementById('user-email').textContent = userData.email;
        cargarCertificados();
      } catch (e) {
        localStorage.removeItem('sucrebot_user');
      }
    } else {
      // Renderizar botón de Google
      google.accounts.id.initialize({
        client_id: '14154960360-fofn56epv2rsiq882sni5ku0q1idemg4.apps.googleusercontent.com',
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('google-signin-button'),
        { 
          theme: 'filled_blue', 
          size: 'large',
          text: 'signin_with',
          locale: 'es'
        }
      );
    }
  };
</script>

</body>
</html>
