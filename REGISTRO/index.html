<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Registro de Participantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  
  <!-- CSS compartido -->
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  
  <!-- CSS específico de REGISTRO -->
  <style>
    /* Mantener tema claro (fondo blanco) como el original */
    body {
      background: #ffffff !important;
      color: #1a1c28 !important;
    }
    
    /* Estilos únicos para la página de registro */
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; position: relative; }
    .page-hero { padding: 40px 0 32px; border-bottom: 1px solid #e0e4ea; margin-bottom: 32px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; border: 1px solid #1a5ca8; color: #ffffff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; animation: blink 1.6s infinite; }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero h2 { font-family: 'Exo 2', sans-serif; font-size: 2.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #1a3a6b; line-height: 1; }
    .page-hero p { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #4a5568; }
    .reg-layout { display: flex; align-items: flex-start; gap: 40px; position: relative; min-height: 680px; }
    .reg-robot { position: absolute; right: -80px; top: -20px; pointer-events: none; z-index: 0; }
    .reg-robot img { width: 680px; height: auto; filter: drop-shadow(0 8px 32px rgba(91,200,240,0.25)); animation: float-robot 4s ease-in-out infinite; opacity: 0.95; }
    @keyframes float-robot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .form-card { background: var(--sucre-blue); border: 1.5px solid #1a5ca8; border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(26,92,168,0.25); flex: 0 0 520px; max-width: 520px; position: relative; z-index: 1; }
    .form-title { font-family: 'Orbitron', monospace; font-size: 0.7rem; letter-spacing: 0.12em; color: #a0aec0; margin-bottom: 20px; }
    .form-section-title { font-family: 'Orbitron', monospace; font-size: 0.62rem; letter-spacing: 0.14em; color: rgba(255,255,255,0.5); text-transform: uppercase; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }
    .field { position: relative; }
    .field label { display: block; font-size: 0.72rem; color: rgba(255,255,255,0.65); margin-bottom: 6px; letter-spacing: 0.06em; }
    .field-icon { position: absolute; left: 12px; bottom: 11px; width: 16px; height: 16px; color: #7a9cc8; pointer-events: none; }
    .field input, .field select { width: 100%; background: rgba(10,25,60,0.55); border: 1.5px solid rgba(255,255,255,0.12); color: #e8f0ff; font-family: 'Exo 2', sans-serif; font-size: 0.88rem; padding: 10px 14px 10px 36px; border-radius: 8px; outline: none; transition: border-color 0.2s, background 0.2s; }
    .field input:focus, .field select:focus { border-color: rgba(255,255,255,0.45); background: rgba(10,25,60,0.75); }
    .field input::placeholder { color: rgba(255,255,255,0.3); }
    .field input[type="file"] { border: 1.5px dashed rgba(255,255,255,0.2); cursor: pointer; padding-left: 36px; }
    .field select { background: rgba(10,25,60,0.55); }
    .field select option { background: #0f2044; color: #e8f0ff; }
    .btn-register { width: 100%; margin-top: 16px; background: #1a3a6b; border: none; color: #ffffff; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 14px; border-radius: 10px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.04em; box-shadow: 0 4px 16px rgba(26,92,168,0.4); }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,92,168,0.6); }
    .btn-register:active { transform: translateY(0); }
    .toast { position: fixed; bottom: 30px; left: 30px; transform: translateY(100px); opacity: 0; background: #1e2438; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); border-left: 5px solid var(--green); color: #f0f4ff; font-family: 'Exo 2', sans-serif; font-size: 0.84rem; font-weight: 600; padding: 14px 18px; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; z-index: 9999; max-width: 320px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    @media (max-width: 860px) { .reg-layout { flex-direction: column; } .reg-robot { display: none; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     COMPONENTES COMPARTIDOS
     ═══════════════════════════════════════════════════════════════ -->

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     CONTENIDO ÚNICO DE LA PÁGINA DE REGISTRO
     ═══════════════════════════════════════════════════════════════ -->

<div class="wrapper">
  <div class="page-hero">
    <div class="page-hero-badge">
      <div class="page-hero-badge-dot"></div>
      SucreBot 2026 · Torneo de Robótica
    </div>
    <h2>REGISTRO DE <span>PARTICIPANTES</span></h2>
    <div class="page-hero-sub">
      <div class="page-hero-line"></div>
      <p>INSCRIPCIÓN AL TORNEO SUCREBOT 2026</p>
    </div>
  </div>
  
  <div class="reg-layout">
    <div class="form-card">
      <div class="form-title">REGISTRO DE PARTICIPANTE</div>

      <!-- SECCIÓN: Datos personales -->
      <div class="form-section-title">👤 Datos Personales</div>
      <div class="form-grid">
        <div class="field">
          <label>NOMBRE COMPLETO</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="f-nombre" placeholder="Juan Pérez">
        </div>
        <div class="field">
          <label>INSTITUCIÓN / CLUB</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <input type="text" id="f-institucion" placeholder="Universidad / Club de Robótica">
        </div>
        <div class="field">
          <label>CIUDAD</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <input type="text" id="f-ciudad" placeholder="Quito">
        </div>
        <div class="field">
          <label>NÚMERO DE CONTACTO</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.4A2 2 0 0 1 3.55 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.06 6.06l1.3-1.3a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="f-contacto" placeholder="0991234567">
        </div>
        <div class="field">
          <label>CORREO ELECTRÓNICO</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
          <input type="email" id="f-correo" placeholder="juan@gmail.com">
        </div>
      </div>

      <!-- SECCIÓN: Datos del robot -->
      <div class="form-section-title">🤖 Datos del Robot</div>
      <div class="form-grid">
        <div class="field">
          <label>NOMBRE DEL ROBOT</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
          <input type="text" id="f-robot" placeholder="RoboX-1">
        </div>
        <div class="field">
          <label>CATEGORÍA DE COMPETENCIA</label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          <select id="f-categoria">
            <option value="">— Seleccione —</option>
            <option value="Seguidor velocidad sin turbina">Seguidor velocidad sin turbina</option>
            <option value="Seguidor velocidad con turbina">Seguidor velocidad con turbina</option>
            <option value="Robot laberinto">Robot laberinto</option>
            <option value="Robot Balancín">Robot Balancín</option>
            <option value="Robot trepador">Robot trepador</option>
            <option value="Seguidor destreza">Seguidor destreza</option>
            <option value="Drones">Drones</option>
            <option value="Insectos">Insectos</option>
          </select>
        </div>
      </div>

      <!-- SECCIÓN: Comprobante -->
      <div class="form-section-title">📎 Comprobante de Pago</div>
      <div class="field" style="margin-bottom:4px;">
        <label>IMAGEN O PDF</label>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <input type="file" id="f-archivo" accept="image/*,.pdf" />
      </div>

      <button class="btn-register" onclick="registrarParticipante()">⚡ Registrar Participante</button>
    </div>
    <div class="reg-robot"><img src="../shared/images/robot-inss.png" alt="Robot inscribiendo" /></div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toast-icon">✓</span>
  <span id="toast-msg"></span>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     FOOTER COMPARTIDO
     ═══════════════════════════════════════════════════════════════ -->

<div data-include="../shared/components/footer.html"></div>

<!-- ═══════════════════════════════════════════════════════════════
     SCRIPTS COMPARTIDOS
     ═══════════════════════════════════════════════════════════════ -->

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<!-- ═══════════════════════════════════════════════════════════════
     SCRIPTS ESPECÍFICOS DE REGISTRO
     ═══════════════════════════════════════════════════════════════ -->

<script>
  const GAS_URL = CONFIG.GAS_URL();
  const IMGBB_API_KEY = 'd4391c4e1ace3b11e8a9dcb82da814e0';

  async function gasPost(data) {
    const r = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(data), redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'} });
    return r.json();
  }

  function generarId(nombre) {
    return nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }

  async function subirArchivoImgBB(archivo) {
    const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(archivo); });
    const form = new FormData();
    form.append('key', IMGBB_API_KEY); 
    form.append('image', base64); 
    form.append('name', archivo.name);
    form.append('album', 'V2CfsH'); // Álbum TRANSFERENCIAS
    const res = await fetch('https://api.imgbb.com/1/upload', {method:'POST',body:form});
    const data = await res.json();
    if (data.success) return data.data.url;
    throw new Error('Error subiendo imagen');
  }

  async function registrarParticipante() {
    const nombre=document.getElementById('f-nombre').value.trim();
    const institucion=document.getElementById('f-institucion').value.trim();
    const ciudad=document.getElementById('f-ciudad').value.trim();
    const robot=document.getElementById('f-robot').value.trim();
    const contacto=document.getElementById('f-contacto').value.trim();
    const correo=document.getElementById('f-correo').value.trim();
    const categoria=document.getElementById('f-categoria').value;
    const archivoInput=document.getElementById('f-archivo');
    const archivo=archivoInput.files[0]||null;
    
    if (!nombre) { showToast('El nombre completo es obligatorio',true); return; }
    if (!institucion) { showToast('La institución es obligatoria',true); return; }
    if (!ciudad) { showToast('La ciudad es obligatoria',true); return; }
    if (!robot) { showToast('El nombre del robot es obligatorio',true); return; }
    if (!contacto) { showToast('El número de contacto es obligatorio',true); return; }
    if (contacto.length < 10) { showToast('El número debe tener al menos 10 dígitos (ej: 0991234567)',true); return; }
    if (!correo) { showToast('El correo electrónico es obligatorio',true); return; }
    if (!categoria) { showToast('Selecciona una categoría',true); return; }
    if (!archivo) { showToast('Debes adjuntar el comprobante de pago',true); return; }
    
    const btn=document.querySelector('.btn-register');
    btn.disabled=true; btn.textContent='⏳ Subiendo comprobante...';
    
    try {
      let archivoUrl='';
      try { archivoUrl=await subirArchivoImgBB(archivo); } 
      catch(e) { showToast('Error al subir comprobante: '+e.message,true); btn.disabled=false; btn.textContent='⚡ Registrar Participante'; return; }
      
      btn.textContent='⏳ Registrando...';
      const id=generarId(nombre);
      await gasPost({action:'setParticipante',id,nombre,institucion,ciudad,robot,contacto,correo,categoria,archivoUrl});
      
      const lista=JSON.parse(localStorage.getItem('participantes')||'[]');
      const idx=lista.findIndex(p=>p.id===id);
      const datosLocal={id,nombre,institucion,ciudad,robot,contacto,correo,categoria};
      if(idx>=0) lista[idx]=datosLocal; else lista.push(datosLocal);
      localStorage.setItem('participantes',JSON.stringify(lista));
      
      showToast('✅ Participante registrado correctamente',false);
      ['f-nombre','f-institucion','f-ciudad','f-robot','f-contacto','f-correo'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('f-categoria').value=''; archivoInput.value='';
    } catch(e) { 
      showToast('Error al registrar: '+e.message,true); 
    } finally { 
      btn.disabled=false; 
      btn.textContent='⚡ Registrar Participante'; 
    }
  }

  let toastTimer=null;
  function showToast(msg,error=false) {
    const t=document.getElementById('toast'), icon=document.getElementById('toast-icon'), text=document.getElementById('toast-msg');
    text.textContent=msg;
    if(error){ 
      icon.textContent='⚠'; 
      t.style.borderLeftColor='#e05555'; 
      t.style.color='#ffb3b3'; 
      t.style.background='#2a1a1a'; 
    } else { 
      icon.textContent='✓'; 
      t.style.borderLeftColor='#3dd68c'; 
      t.style.color='#d0f5e8'; 
      t.style.background='#1e2438'; 
    }
    if(toastTimer){ clearTimeout(toastTimer); t.classList.remove('show'); }
    requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
    toastTimer=setTimeout(()=>{ t.classList.remove('show'); toastTimer=null; },3500);
  }
</script>

</body>
</html>
