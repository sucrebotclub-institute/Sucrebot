<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Estadísticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background: #07111e !important; font-family: 'Exo 2', sans-serif; color: #c8d8f0; padding-top: 0 !important; }
    main { padding-top: 120px; min-height: 100vh; background: #07111e; }
    .wrapper { max-width: 1440px; margin: 0 auto; padding: 0 32px 80px; }

    /* ── HERO ── */
    .page-hero { padding: 28px 0 20px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 11px; font-weight: 700; letter-spacing: 3px; padding: 7px 18px; border-radius: 20px; margin-bottom: 14px; }
    .page-hero-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #5bc8f0; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue'; font-size: 3.2rem; letter-spacing: 4px; color: #e0eaff; line-height: 1; position: relative; margin-bottom: 8px; }
    .page-hero h2 span { color: #5bc8f0; }
    .page-hero h2::after { content:''; position:absolute; bottom:-8px; left:0; width:100%; height:3px; background:linear-gradient(90deg,transparent,#5bc8f0,transparent); }
    .page-hero-meta { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
    .page-hero-meta span { font-family: 'DM Mono'; font-size: 13px; color: #5a7a9a; }
    .btn-refresh { display: inline-flex; align-items: center; gap: 6px; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 10px; font-weight: 700; letter-spacing: 2px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: background .2s; }
    .btn-refresh:hover { background: #1a3a6e; }
    .btn-refresh.loading { opacity: .6; pointer-events: none; }
    .btn-excel { display: inline-flex; align-items: center; gap: 7px; background: #155c2a; color: #4ade80; font-family: 'Orbitron'; font-size: 10px; font-weight: 700; letter-spacing: 2px; padding: 10px 20px; border-radius: 8px; border: 1px solid #22c55e44; cursor: pointer; transition: background .2s; }
    .btn-excel:hover { background: #1a7a38; }
    .btn-excel:disabled { opacity: .5; pointer-events: none; }

    /* ── ACCESO DENEGADO ── */
    .acceso-denegado { background: linear-gradient(135deg,#ff3b3b,#c41e3a); border-radius: 16px; padding: 60px 40px; text-align: center; max-width: 600px; margin: 60px auto; color: #fff; }
    .acceso-denegado h3 { font-family: 'Orbitron'; font-size: 1.8rem; margin-bottom: 12px; }

    /* ── SECCIÓN HEADERS ── */
    .seccion-titulo { font-family: 'Bebas Neue'; font-size: 1.9rem; letter-spacing: 4px; color: #7ec8f0; margin: 40px 0 18px; display: flex; align-items: center; gap: 12px; }
    .seccion-titulo::after { content:''; flex:1; height:2px; background:linear-gradient(90deg,#1a5ca8,transparent); }

    /* ── KPI CARDS ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin-bottom: 10px; }
    .kpi-card { background: #0f2035; border-radius: 16px; padding: 24px 22px; border: 1px solid #1a3a5a; box-shadow: 0 2px 16px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background: var(--accent, #1a5ca8); }
    .kpi-label { font-family: 'Orbitron'; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #5a7a9a; text-transform: uppercase; margin-bottom: 10px; }
    .kpi-value { font-family: 'Bebas Neue'; font-size: 3.2rem; color: var(--accent, #5bc8f0); line-height: 1; }
    .kpi-sub { font-family: 'DM Mono'; font-size: 12px; color: #4a6a8a; margin-top: 6px; }
    .kpi-icon { position: absolute; right: 16px; top: 18px; font-size: 1.8rem; opacity: .2; }

    .kpi-card.verde  { --accent: #34d399; }
    .kpi-card.rojo   { --accent: #f87171; }
    .kpi-card.amber  { --accent: #fbbf24; }
    .kpi-card.violet { --accent: #a78bfa; }
    .kpi-card.cyan   { --accent: #38bdf8; }
    .kpi-card.pink   { --accent: #f472b6; }

    /* ── PROGRESS BAR ── */
    .prog-item { margin-bottom: 14px; }
    .prog-header { display: flex; justify-content: space-between; font-family: 'Exo 2'; font-size: 14px; font-weight: 700; color: #a0c0e0; margin-bottom: 6px; }
    .prog-bar-bg { background: #0d1f33; border-radius: 8px; height: 12px; overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #1a5ca8, #5bc8f0); transition: width .6s ease; }

    /* ── CHART GRID ── */
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; margin-bottom: 10px; }
    .chart-card { background: #0f2035; border-radius: 16px; padding: 24px; border: 1px solid #1a3a5a; box-shadow: 0 2px 16px rgba(0,0,0,0.5); }
    .chart-title { font-family: 'Orbitron'; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #5bc8f0; text-transform: uppercase; margin-bottom: 18px; }
    .chart-canvas-wrap { position: relative; height: 260px; }

    /* ── TABLA INSTITUCIONES ── */
    .inst-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .inst-table th { font-family: 'Orbitron'; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #4a7a9a; text-transform: uppercase; padding: 12px 16px; border-bottom: 2px solid #1a3a5a; text-align: left; }
    .inst-table td { padding: 12px 16px; border-bottom: 1px solid #0d1f33; font-family: 'Exo 2'; color: #b0cce8; font-weight: 600; font-size: 14px; }
    .inst-table tr:hover td { background: #132840; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; font-family: 'Orbitron'; font-size: 11px; font-weight: 700; }
    .rank-badge.r1 { background: #3a2800; color: #fbbf24; }
    .rank-badge.r2 { background: #222; color: #9ca3af; }
    .rank-badge.r3 { background: #3a1800; color: #fb923c; }
    .rank-badge.rn { background: #0d2040; color: #5bc8f0; }

    /* ── ESTADO CATEGORÍAS ── */
    .cat-estado-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .cat-estado-card { background: #0d1f33; border-radius: 10px; padding: 14px 16px; border: 1px solid #1a3a5a; display: flex; align-items: center; gap: 12px; }
    .cat-estado-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cat-estado-dot.activa    { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .cat-estado-dot.finalizada{ background: #5bc8f0; }
    .cat-estado-dot.inactiva  { background: #2a3a4a; }
    .cat-estado-nombre { font-family: 'Exo 2'; font-size: 14px; font-weight: 700; color: #a0c8e8; flex: 1; }
    .cat-estado-label { font-family: 'DM Mono'; font-size: 11px; }
    .cat-estado-label.activa    { color: #4ade80; }
    .cat-estado-label.finalizada{ color: #38bdf8; }
    .cat-estado-label.inactiva  { color: #3a5a7a; }

    /* ── LOADING ── */
    .loading-msg { text-align: center; padding: 40px; font-family: 'DM Mono'; font-size: 13px; color: #4a7a9a; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #1a3a5a; border-top-color: #5bc8f0; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ÚLTIMO ACTUALIZADO ── */
    .actualizado-bar { background: #0d2040; border-radius: 8px; padding: 8px 14px; font-family: 'DM Mono'; font-size: 11px; color: #5bc8f0; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; border: 1px solid #1a3a5a; }
  </style>
</head>
<body>
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>

  <main>
    <div class="wrapper">

      <div id="acceso-denegado" style="display:none;">
        <div class="acceso-denegado">
          <h3>🔒 Acceso restringido</h3>
          <p>Solo personal autorizado del staff puede ver esta página.</p>
        </div>
      </div>

      <div id="contenido-staff" style="display:none;">

        <!-- HERO -->
        <div class="page-hero">
          <div class="page-hero-badge">
            <span class="page-hero-badge-dot"></span>
            STAFF ONLY
          </div>
          <h2>ESTADÍSTICAS <span>SUCREBOT 2026</span></h2>
          <div class="page-hero-meta">
            <span id="txt-actualizado">Cargando datos...</span>
            <button class="btn-refresh" id="btn-refresh" onclick="cargarTodo()">
              🔄 Actualizar
            </button>
            <button class="btn-excel" id="btn-excel" onclick="exportarExcel()" disabled>
              📊 Exportar Excel
            </button>
          </div>
        </div>

        <div id="contenido-datos">
          <div class="loading-msg"><span class="spinner"></span> Cargando estadísticas...</div>
        </div>

      </div><!-- /contenido-staff -->
    </div>
  </main>

  <div data-include="../shared/components/footer.html"></div>
  <script src="../shared/js/load-components.js"></script>
  <script src="../shared/js/auth.js"></script>

  <script>
  const GAS_URL   = CONFIG.GAS_URL();
  const JSON_URL  = 'https://raw.githubusercontent.com/sucrebotclub-institute/Sucrebot/main/RESULTADOS/resultados.json';
  const STAFF_TOKEN = 'SucreBot2026-CMI-Sucre-x7k9mQ';

  const CATS_NOMBRES = {
    ins:'Insectos', trp_a:'Trepador Amateur', trp_p:'Trepador Pro',
    sl_a:'Seguidor Línea Amateur', sl_p:'Seguidor Línea Pro',
    ms_a:'Minisumo Autónomo', ms_rc:'Minisumo RC', bai:'Bailarín',
    bat:'Batalla', dev:'Impacto Tecnológico', soc:'Robot Soccer',
    cr:'Cubo Rubik', lk:'Lego Kids'
  };

  let _charts = {};
  let _globalData = null; // stores last loaded data for Excel export

  function gasGet(params) {
    const qs = new URLSearchParams(params).toString();
    return fetch(GAS_URL + '?' + qs).then(r => r.json());
  }

  function show(id) { document.getElementById(id).style.display = 'block'; }

  document.addEventListener('componentsLoaded', () => {
    const token = localStorage.getItem('sucrebot_staff_token');
    if (token !== STAFF_TOKEN) { show('acceso-denegado'); return; }
    show('contenido-staff');
    cargarTodo();
  });

  async function fetchJSON() {
    try {
      const r = await fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      return JSON.parse(text);
    } catch(e) {
      console.warn('No se pudo cargar resultados.json:', e.message);
      return {};
    }
  }

  async function cargarTodo() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');
    btn.textContent = '⏳ Cargando...';

    try {
      const [participantes, certificados, jsonVivo, estadoCats] = await Promise.all([
        gasGet({ action: 'getParticipantes' }).catch(() => []),
        gasGet({ action: 'obtenerTodosCertificados' }).catch(() => []),
        fetchJSON(),
        gasGet({ action: 'getEstadoCategorias' }).catch(() => ({}))
      ]);

      const parrRaw = Array.isArray(participantes) ? participantes : [];
      const parr = parrRaw.filter(p => !String(p.nombre || '').startsWith('[DEV]'));
      const carr = Array.isArray(certificados)  ? certificados  : [];

      renderTodo(parr, carr, jsonVivo || {}, estadoCats || {});
      _globalData = { parr, carr, json: jsonVivo || {}, estadoCats: estadoCats || {} };
      document.getElementById('btn-excel').disabled = false;

      document.getElementById('txt-actualizado').textContent =
        '📅 Actualizado: ' + new Date().toLocaleTimeString('es-EC');
    } catch(e) {
      document.getElementById('contenido-datos').innerHTML =
        '<div class="loading-msg">⚠️ Error al cargar datos: ' + e.message + '</div>';
    }

    btn.classList.remove('loading');
    btn.textContent = '🔄 Actualizar';
  }

  function destroyCharts() {
    Object.values(_charts).forEach(c => { try { c.destroy(); } catch(e){} });
    _charts = {};
  }

  function renderTodo(parr, carr, json, estadoCats) {
    destroyCharts();

    // ── Cálculos base ──────────────────────────────────────────
    const total      = parr.length;
    const aprobados  = parr.filter(p => p.aprobado === 'APROBADO').length;
    const enRevision = parr.filter(p => p.aprobado === 'EN REVISION').length;
    const noCumple   = parr.filter(p => p.aprobado === 'NO CUMPLE').length;
    const manillas   = parr.filter(p => p.manilla === 'ENTREGADA').length;
    const conEquipo  = parr.filter(p => p.miembro2 && String(p.miembro2).trim()).length;

    // Por categoría
    const porCat = {};
    parr.forEach(p => {
      const c = p.categoria || 'Sin categoría';
      porCat[c] = (porCat[c] || 0) + 1;
    });

    // Por institución
    const porInst = {};
    parr.forEach(p => {
      const i = String(p.institucion || 'Sin institución').trim();
      if (!porInst[i]) porInst[i] = { total: 0, aprobados: 0 };
      porInst[i].total++;
      if (p.aprobado === 'APROBADO') porInst[i].aprobados++;
    });
    const instList = Object.entries(porInst).sort((a,b) => b[1].total - a[1].total);

    // Por ciudad
    const porCiudad = {};
    parr.forEach(p => {
      const c = String(p.ciudad || 'Sin ciudad').trim();
      porCiudad[c] = (porCiudad[c] || 0) + 1;
    });
    const ciudadList = Object.entries(porCiudad).sort((a,b) => b[1]-a[1]).slice(0,8);

    // Certificados
    const certTotal    = carr.length;
    const certConUrl   = carr.filter(c => c.archivoUrl && String(c.archivoUrl).trim()).length;
    const certSinUrl   = certTotal - certConUrl;
    const certGanador  = carr.filter(c => String(c.tipo_certificado||'').toUpperCase() === 'GANADOR').length;
    const certSub      = carr.filter(c => ['SUBCAMPEÓN','SUBCAMPEON'].includes(String(c.tipo_certificado||'').toUpperCase())).length;
    const certTercer   = carr.filter(c => String(c.tipo_certificado||'').toUpperCase() === 'TERCER LUGAR').length;
    const certPart     = carr.filter(c => ['PARTICIPACIÓN','PARTICIPACION'].includes(String(c.tipo_certificado||'').toUpperCase())).length;

    // Resultados cronómetro
    const resultados = json.resultados || {};
    const CATS_CRONO = ['ins','trp_a','trp_p','sl_a','sl_p','cr'];
    let totalIntentos = 0;
    let totalDNF = 0;
    CATS_CRONO.forEach(cat => {
      const arr = resultados[cat] || [];
      totalIntentos += arr.length;
      totalDNF += arr.filter(r => r.tiempo === 'DNF').length;
    });

    // Estado categorías
    const estadoObj   = estadoCats || {};
    const catsActivas = Object.entries(estadoObj).filter(([,v]) => v.estado === 'activa').length;
    const catsFin     = Object.entries(estadoObj).filter(([,v]) => v.estado === 'finalizada').length;
    const totalCats   = 13;

    // Bracket stats
    const bracket = json.bracket || {};
    let bracketPartidosJugados = 0, bracketPartidosPendientes = 0;
    ['ms_a','ms_rc','bat'].forEach(cat => {
      const b = bracket[cat];
      if (!b || !b.fases) return;
      b.fases.forEach(f => {
        f.partidos.forEach(p => {
          if (p.tipo === 'BYE') return;
          if (p.estado === 'FINALIZADO') bracketPartidosJugados++;
          else bracketPartidosPendientes++;
        });
      });
    });

    // Soccer stats
    const soccer = json.soccer;
    let socJugados = 0, socPendientes = 0;
    if (soccer && soccer.partidos) {
      soccer.partidos.forEach(p => {
        if (!p.equipo_a_id) return;
        if (p.estado === 'FINALIZADO') socJugados++;
        else socPendientes++;
      });
    }

    // Ranking instituciones del JSON
    const rankInst = json.ranking_instituciones || [];

    // ── HTML ──────────────────────────────────────────────────
    let html = '';

    // ══ SECCIÓN 1: REGISTRO ══
    html += `<div class="seccion-titulo">📋 REGISTRO</div>`;
    html += `<div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">👥</div>
        <div class="kpi-label">Total inscritos</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-sub">${instList.length} instituciones · ${Object.keys(porCiudad).length} provincias</div>
      </div>
      <div class="kpi-card verde">
        <div class="kpi-icon">✅</div>
        <div class="kpi-label">Aprobados</div>
        <div class="kpi-value">${aprobados}</div>
        <div class="kpi-sub">${total > 0 ? Math.round(aprobados/total*100) : 0}% del total</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-icon">⏳</div>
        <div class="kpi-label">En revisión</div>
        <div class="kpi-value">${enRevision}</div>
        <div class="kpi-sub">Pendientes de aprobar</div>
      </div>
      <div class="kpi-card rojo">
        <div class="kpi-icon">❌</div>
        <div class="kpi-label">No cumple</div>
        <div class="kpi-value">${noCumple}</div>
        <div class="kpi-sub">Rechazados</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-icon">🏷️</div>
        <div class="kpi-label">Manillas entregadas</div>
        <div class="kpi-value">${manillas}</div>
        <div class="kpi-sub">de ${aprobados} aprobados</div>
      </div>
      <div class="kpi-card violet">
        <div class="kpi-icon">👥</div>
        <div class="kpi-label">Con subcapitán</div>
        <div class="kpi-value">${conEquipo}</div>
        <div class="kpi-sub">${total - conEquipo} individuales</div>
      </div>
    </div>`;

    // Barra progreso aprobación
    html += `<div class="chart-card" style="margin-bottom:20px;">
      <div class="chart-title">Progreso de aprobación</div>
      <div class="prog-item">
        <div class="prog-header"><span>✅ Aprobados</span><span>${aprobados}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?aprobados/total*100:0}%;background:linear-gradient(90deg,#0e9f6e,#34d399)"></div></div>
      </div>
      <div class="prog-item">
        <div class="prog-header"><span>⏳ En revisión</span><span>${enRevision}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?enRevision/total*100:0}%;background:linear-gradient(90deg,#d97706,#fbbf24)"></div></div>
      </div>
      <div class="prog-item">
        <div class="prog-header"><span>❌ No cumple</span><span>${noCumple}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?noCumple/total*100:0}%;background:linear-gradient(90deg,#e74c3c,#fc8181)"></div></div>
      </div>
      <div class="prog-item" style="margin-top:14px;">
        <div class="prog-header"><span>🏷️ Manillas entregadas</span><span>${manillas} / ${aprobados}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${aprobados?manillas/aprobados*100:0}%;background:linear-gradient(90deg,#0891b2,#38bdf8)"></div></div>
      </div>
    </div>`;

    // Gráficas registro
    html += `<div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Participantes por categoría</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-cat"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top 8 instituciones</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-inst"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Distribución por provincia</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-ciudad"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Estado de registros</div>
        <div class="chart-canvas-wrap"><canvas id="chart-estados"></canvas></div>
      </div>
    </div>`;

    // Tabla instituciones
    html += `<div class="chart-card" style="margin-bottom:8px;">
      <div class="chart-title">Tabla completa de instituciones</div>
      <table class="inst-table">
        <thead><tr>
          <th>#</th><th>Institución</th><th>Total</th><th>Aprobados</th><th>% Aprob.</th>
        </tr></thead>
        <tbody>`;
    instList.forEach(([inst, datos], i) => {
      const rClass = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
      const pct = datos.total > 0 ? Math.round(datos.aprobados/datos.total*100) : 0;
      html += `<tr>
        <td><span class="rank-badge ${rClass}">${i+1}</span></td>
        <td>${inst}</td>
        <td><strong>${datos.total}</strong></td>
        <td>${datos.aprobados}</td>

  // ════════════════════════════════════════════════════════
  //  EXPORTAR EXCEL
  // ════════════════════════════════════════════════════════
  function exportarExcel() {
    if (!_globalData) return;
    const { parr, carr, json, estadoCats } = _globalData;
    const resultados = json.resultados || {};
    const bracket    = json.bracket    || {};
    const soccer     = json.soccer;
    const rankInst   = json.ranking_instituciones || [];

    const wb = XLSX.utils.book_new();
    const FECHA = new Date().toLocaleDateString('es-EC');
    const HORA  = new Date().toLocaleTimeString('es-EC');

    // ── Estilo helpers ──────────────────────────────────────
    function hdr(v)  { return { v, t:'s', s:{ font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1A5CA8'}}, alignment:{horizontal:'center'} } }; }
    function subhdr(v){ return { v, t:'s', s:{ font:{bold:true,color:{rgb:'1A3A6E'}}, fill:{fgColor:{rgb:'D0E4FF'}}, alignment:{horizontal:'left'} } }; }
    function num(v)  { return { v: Number(v)||0, t:'n' }; }
    function pct(v)  { return { v: (Number(v)||0)/100, t:'n', z:'0.0%' }; }
    function lbl(v)  { return { v: String(v||''), t:'s' }; }
    function bold(v) { return { v: String(v||''), t:'s', s:{ font:{bold:true} } }; }

    // ── Hoja 1: RESUMEN EJECUTIVO ───────────────────────────
    const aprobados  = parr.filter(p => p.aprobado === 'APROBADO').length;
    const enRevision = parr.filter(p => p.aprobado === 'EN REVISION').length;
    const noCumple   = parr.filter(p => p.aprobado === 'NO CUMPLE').length;
    const manillas   = parr.filter(p => p.manilla  === 'ENTREGADA').length;
    const conEquipo  = parr.filter(p => p.miembro2 && String(p.miembro2).trim()).length;
    const porInst    = {};
    const porCat     = {};
    const porCiudad  = {};
    parr.forEach(p => {
      const inst = String(p.institucion||'Sin institución').trim();
      const cat  = p.categoria || 'Sin categoría';
      const ciu  = String(p.ciudad||'Sin ciudad').trim();
      porInst[inst]  = (porInst[inst]  || 0) + 1;
      porCat[cat]    = (porCat[cat]    || 0) + 1;
      porCiudad[ciu] = (porCiudad[ciu] || 0) + 1;
    });

    const CATS_CRONO = ['ins','trp_a','trp_p','sl_a','sl_p','cr'];
    let totalIntentos = 0, totalDNF = 0;
    CATS_CRONO.forEach(c => {
      const arr = resultados[c] || [];
      totalIntentos += arr.length;
      totalDNF += arr.filter(r => r.tiempo === 'DNF').length;
    });
    let bracketJugados = 0, bracketPend = 0;
    ['ms_a','ms_rc','bat'].forEach(c => {
      const b = bracket[c];
      if (!b || !b.fases) return;
      b.fases.forEach(f => f.partidos.forEach(p => {
        if (p.tipo === 'BYE') return;
        p.estado === 'FINALIZADO' ? bracketJugados++ : bracketPend++;
      }));
    });
    let socJugados = 0, socPend = 0;
    if (soccer && soccer.partidos) soccer.partidos.forEach(p => {
      if (!p.equipo_a_id) return;
      p.estado === 'FINALIZADO' ? socJugados++ : socPend++;
    });
    const catsFin  = Object.values(estadoCats).filter(v => v.estado === 'finalizada').length;
    const catsAct  = Object.values(estadoCats).filter(v => v.estado === 'activa').length;

    const wsResumen = XLSX.utils.aoa_to_sheet([
      [hdr('INFORME DE ESTADÍSTICAS — SUCREBOT 2026')],
      [lbl('Generado:'), lbl(FECHA + ' ' + HORA)],
      [],
      [subhdr('📋 REGISTRO DE PARTICIPANTES')],
      [bold('Indicador'), bold('Valor'), bold('Detalle')],
      [lbl('Total inscritos'),      num(parr.length),   lbl('')],
      [lbl('Aprobados'),            num(aprobados),     pct(parr.length ? aprobados/parr.length : 0)],
      [lbl('En revisión'),          num(enRevision),    pct(parr.length ? enRevision/parr.length : 0)],
      [lbl('No cumple'),            num(noCumple),      pct(parr.length ? noCumple/parr.length : 0)],
      [lbl('Manillas entregadas'),  num(manillas),      lbl(`de ${aprobados} aprobados`)],
      [lbl('Con subcapitán'),       num(conEquipo),     lbl(`${parr.length - conEquipo} individuales`)],
      [lbl('Instituciones'),        num(Object.keys(porInst).length),  lbl('')],
      [lbl('Provincias'),           num(Object.keys(porCiudad).length), lbl('')],
      [],
      [subhdr('⚡ EVENTO EN VIVO')],
      [bold('Indicador'), bold('Valor'), bold('Detalle')],
      [lbl('Categorías finalizadas'), num(catsFin),     lbl(`de 13`)],
      [lbl('Categorías en curso'),    num(catsAct),     lbl('')],
      [lbl('Sin iniciar'),            num(13-catsFin-catsAct), lbl('')],
      [lbl('Intentos cronómetro'),   num(totalIntentos), lbl('')],
      [lbl('DNFs'),                  num(totalDNF),      pct(totalIntentos ? totalDNF/totalIntentos : 0)],
      [lbl('Partidos bracket jugados'), num(bracketJugados), lbl(`${bracketPend} pendientes`)],
      [lbl('Partidos soccer jugados'),  num(socJugados),     lbl(`${socPend} pendientes`)],
      [],
      [subhdr('📜 CERTIFICADOS')],
      [bold('Indicador'), bold('Valor')],
      [lbl('Total generados'),   num(carr.length)],
      [lbl('Con PDF subido'),    num(carr.filter(c => c.archivoUrl && String(c.archivoUrl).trim()).length)],
      [lbl('Sin PDF'),           num(carr.filter(c => !c.archivoUrl || !String(c.archivoUrl).trim()).length)],
      [lbl('Ganadores'),         num(carr.filter(c => String(c.tipo_certificado||'').toUpperCase()==='GANADOR').length)],
      [lbl('Subcampeones'),      num(carr.filter(c => ['SUBCAMPEÓN','SUBCAMPEON'].includes(String(c.tipo_certificado||'').toUpperCase())).length)],
      [lbl('Tercer lugar'),      num(carr.filter(c => String(c.tipo_certificado||'').toUpperCase()==='TERCER LUGAR').length)],
      [lbl('Participación'),     num(carr.filter(c => ['PARTICIPACIÓN','PARTICIPACION'].includes(String(c.tipo_certificado||'').toUpperCase())).length)],
    ]);
    wsResumen['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:4} }];
    wsResumen['!cols'] = [{wch:32},{wch:12},{wch:22}];
    XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

    // ── Hoja 2: PARTICIPANTES ───────────────────────────────
    const parRows = [[
      hdr('ID'), hdr('Nombre'), hdr('Robot'), hdr('Categoría'),
      hdr('Institución'), hdr('Provincia'), hdr('Correo'), hdr('Contacto'),
      hdr('Subcapitán'), hdr('Estado'), hdr('Manilla'), hdr('Equipo')
    ]];
    parr.forEach(p => parRows.push([
      lbl(p.id), lbl(p.nombre), lbl(p.robot), lbl(p.categoria),
      lbl(p.institucion), lbl(p.ciudad), lbl(p.correo), lbl(p.contacto),
      lbl(p.miembro2 || ''), lbl(p.aprobado), lbl(p.manilla || ''), lbl(p.equipo || '')
    ]));
    const wsPar = XLSX.utils.aoa_to_sheet(parRows);
    wsPar['!cols'] = [{wch:20},{wch:22},{wch:22},{wch:24},{wch:36},{wch:16},{wch:28},{wch:16},{wch:22},{wch:14},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsPar, 'Participantes');

    // ── Hoja 3: POR CATEGORÍA ──────────────────────────────
    const catRows = [[ hdr('Categoría'), hdr('Participantes'), hdr('% del total') ]];
    Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([c,n]) =>
      catRows.push([lbl(c), num(n), pct(parr.length ? n/parr.length : 0)])
    );
    catRows.push([]);
    catRows.push([bold('TOTAL'), num(parr.length), pct(1)]);
    const wsCat = XLSX.utils.aoa_to_sheet(catRows);
    wsCat['!cols'] = [{wch:30},{wch:18},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsCat, 'Por Categoría');

    // ── Hoja 4: POR INSTITUCIÓN ────────────────────────────
    const instRows = [[ hdr('#'), hdr('Institución'), hdr('Total'), hdr('Aprobados'), hdr('No aprobados'), hdr('% Aprobación') ]];
    Object.entries(porInst).sort((a,b)=>b[1]-a[1]).forEach(([inst, n], i) => {
      const aprobInst = parr.filter(p => String(p.institucion||'').trim()===inst && p.aprobado==='APROBADO').length;
      instRows.push([num(i+1), lbl(inst), num(n), num(aprobInst), num(n-aprobInst), pct(n ? aprobInst/n : 0)]);
    });
    const wsInst = XLSX.utils.aoa_to_sheet(instRows);
    wsInst['!cols'] = [{wch:6},{wch:40},{wch:10},{wch:14},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsInst, 'Por Institución');

    // ── Hoja 5: POR PROVINCIA ──────────────────────────────
    const provRows = [[ hdr('Provincia'), hdr('Participantes'), hdr('% del total') ]];
    Object.entries(porCiudad).sort((a,b)=>b[1]-a[1]).forEach(([c,n]) =>
      provRows.push([lbl(c), num(n), pct(parr.length ? n/parr.length : 0)])
    );
    const wsProv = XLSX.utils.aoa_to_sheet(provRows);
    wsProv['!cols'] = [{wch:22},{wch:18},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsProv, 'Por Provincia');

    // ── Hoja 6: CERTIFICADOS ───────────────────────────────
    const certRows = [[
      hdr('Código'), hdr('Nombre'), hdr('Categoría'), hdr('Institución'),
      hdr('Tipo'), hdr('Fecha evento'), hdr('Fecha generación'), hdr('PDF')
    ]];
    carr.forEach(c => certRows.push([
      lbl(c.codigo_verificacion), lbl(c.nombre_completo), lbl(c.categoria),
      lbl(c.institucion), lbl(c.tipo_certificado), lbl(c.fecha_evento),
      lbl(c.fecha_generacion), lbl(c.archivoUrl ? 'SÍ' : 'NO')
    ]));
    const wsCert = XLSX.utils.aoa_to_sheet(certRows);
    wsCert['!cols'] = [{wch:18},{wch:26},{wch:24},{wch:36},{wch:16},{wch:16},{wch:22},{wch:6}];
    XLSX.utils.book_append_sheet(wb, wsCert, 'Certificados');

    // ── Hoja 7: RESULTADOS CRONÓMETRO ─────────────────────
    const CRONO_LABEL = { ins:'Insectos', trp_a:'Trepador Amateur', trp_p:'Trepador Pro', sl_a:'Seguidor Línea Amateur', sl_p:'Seguidor Línea Pro', cr:'Cubo Rubik' };
    const cronoRows = [[ hdr('Categoría'), hdr('Robot'), hdr('Tiempo'), hdr('Ronda'), hdr('Intento') ]];
    CATS_CRONO.forEach(cat => {
      const arr = resultados[cat] || [];
      arr.forEach(r => cronoRows.push([lbl(CRONO_LABEL[cat]||cat), lbl(r.robot), lbl(r.tiempo), lbl(r.ronda||''), lbl(r.intento||'')]));
    });
    const wsCrono = XLSX.utils.aoa_to_sheet(cronoRows);
    wsCrono['!cols'] = [{wch:24},{wch:24},{wch:12},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsCrono, 'Cronómetro');

    // ── Hoja 8: BRACKET COMBATE ───────────────────────────
    const BRKT_LABEL = { ms_a:'Minisumo Autónomo', ms_rc:'Minisumo RC', bat:'Batalla' };
    const brkRows = [[ hdr('Categoría'), hdr('Fase'), hdr('Partido ID'), hdr('Equipo A'), hdr('Equipo B'), hdr('Ganador'), hdr('Marcador'), hdr('Estado') ]];
    ['ms_a','ms_rc','bat'].forEach(cat => {
      const b = bracket[cat];
      if (!b || !b.fases) return;
      b.fases.forEach(f => f.partidos.forEach(p => {
        if (p.tipo === 'BYE') return;
        brkRows.push([
          lbl(BRKT_LABEL[cat]||cat), lbl(f.nombre), lbl(p.partido_id),
          lbl(p.equipo_a_nombre), lbl(p.equipo_b_nombre),
          lbl(p.ganador_id === p.equipo_a_id ? p.equipo_a_nombre : p.ganador_id === p.equipo_b_id ? p.equipo_b_nombre : ''),
          lbl(p.marcador||''), lbl(p.estado)
        ]);
      }));
    });
    const wsBrkt = XLSX.utils.aoa_to_sheet(brkRows);
    wsBrkt['!cols'] = [{wch:20},{wch:20},{wch:16},{wch:22},{wch:22},{wch:22},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsBrkt, 'Bracket Combate');

    // ── Hoja 9: SOCCER ────────────────────────────────────
    const socRows = [[ hdr('Grupo'), hdr('Partido ID'), hdr('Equipo A'), hdr('Equipo B'), hdr('Ganador'), hdr('Marcador'), hdr('Estado') ]];
    if (soccer && soccer.partidos) {
      soccer.partidos.forEach(p => {
        if (!p.equipo_a_id) return;
        socRows.push([
          lbl(p.grupo), lbl(p.partido_id),
          lbl(p.equipo_a_nombre), lbl(p.equipo_b_nombre),
          lbl(p.ganador_id === p.equipo_a_id ? p.equipo_a_nombre : p.ganador_id === p.equipo_b_id ? p.equipo_b_nombre : ''),
          lbl(p.marcador||''), lbl(p.estado)
        ]);
      });
    }
    const wsSoc = XLSX.utils.aoa_to_sheet(socRows);
    wsSoc['!cols'] = [{wch:14},{wch:14},{wch:22},{wch:22},{wch:22},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsSoc, 'Soccer');

    // ── Hoja 10: RANKING INSTITUCIONES ────────────────────
    const rkRows = [[ hdr('#'), hdr('Institución'), hdr('Puntos'), hdr('🥇 Oros'), hdr('🥈 Platas'), hdr('🥉 Bronces') ]];
    rankInst.forEach((r, i) => rkRows.push([num(i+1), lbl(r.institucion), num(r.puntos), num(r.oros), num(r.platas), num(r.bronces)]));
    const wsRk = XLSX.utils.aoa_to_sheet(rkRows);
    wsRk['!cols'] = [{wch:6},{wch:40},{wch:10},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsRk, 'Ranking Instituciones');

    // ── Descargar ──────────────────────────────────────────
    const fechaFile = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `SucreBot2026_Estadisticas_${fechaFile}.xlsx`);
  }
  </script>
</body>
</html>
