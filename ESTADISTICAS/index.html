<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Estadísticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    body { background: #f0f4fa !important; font-family: 'Exo 2', sans-serif; color: #1a2a4a; padding-top: 0 !important; }
    main { padding-top: 174px; min-height: 100vh; background: #f0f4fa; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── HERO ── */
    .page-hero { padding: 36px 0 24px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #5bc8f0; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue'; font-size: 2.6rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; position: relative; margin-bottom: 8px; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero h2::after { content:''; position:absolute; bottom:-8px; left:0; width:100%; height:3px; background:linear-gradient(90deg,transparent,#5bc8f0,transparent); }
    .page-hero-meta { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
    .page-hero-meta span { font-family: 'DM Mono'; font-size: 11px; color: #7a8a9a; }
    .btn-refresh { display: inline-flex; align-items: center; gap: 6px; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 2px; padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; transition: background .2s; }
    .btn-refresh:hover { background: #1a3a6e; }
    .btn-refresh.loading { opacity: .6; pointer-events: none; }

    /* ── ACCESO DENEGADO ── */
    .acceso-denegado { background: linear-gradient(135deg,#ff3b3b,#c41e3a); border-radius: 16px; padding: 60px 40px; text-align: center; max-width: 600px; margin: 60px auto; color: #fff; }
    .acceso-denegado h3 { font-family: 'Orbitron'; font-size: 1.8rem; margin-bottom: 12px; }

    /* ── SECCIÓN HEADERS ── */
    .seccion-titulo { font-family: 'Bebas Neue'; font-size: 1.5rem; letter-spacing: 3px; color: #1a3a6e; margin: 36px 0 16px; display: flex; align-items: center; gap: 10px; }
    .seccion-titulo::after { content:''; flex:1; height:2px; background:linear-gradient(90deg,#1a5ca8,transparent); }

    /* ── KPI CARDS ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 8px; }
    .kpi-card { background: #fff; border-radius: 14px; padding: 20px 18px; border: 1px solid #e0e8f4; box-shadow: 0 2px 8px rgba(26,92,168,0.07); position: relative; overflow: hidden; }
    .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--accent, #1a5ca8); }
    .kpi-label { font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #7a8a9a; text-transform: uppercase; margin-bottom: 8px; }
    .kpi-value { font-family: 'Bebas Neue'; font-size: 2.4rem; color: var(--accent, #1a5ca8); line-height: 1; }
    .kpi-sub { font-family: 'DM Mono'; font-size: 10px; color: #9aa0aa; margin-top: 4px; }
    .kpi-icon { position: absolute; right: 14px; top: 16px; font-size: 1.4rem; opacity: .15; }

    .kpi-card.verde  { --accent: #0e9f6e; }
    .kpi-card.rojo   { --accent: #e74c3c; }
    .kpi-card.amber  { --accent: #d97706; }
    .kpi-card.violet { --accent: #7c3aed; }
    .kpi-card.cyan   { --accent: #0891b2; }
    .kpi-card.pink   { --accent: #db2777; }

    /* ── PROGRESS BAR ── */
    .prog-item { margin-bottom: 10px; }
    .prog-header { display: flex; justify-content: space-between; font-family: 'Exo 2'; font-size: 12px; font-weight: 600; color: #1a3a6e; margin-bottom: 4px; }
    .prog-bar-bg { background: #e8ecf4; border-radius: 6px; height: 8px; overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #1a5ca8, #5bc8f0); transition: width .6s ease; }

    /* ── CHART GRID ── */
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 8px; }
    .chart-card { background: #fff; border-radius: 14px; padding: 20px; border: 1px solid #e0e8f4; box-shadow: 0 2px 8px rgba(26,92,168,0.07); }
    .chart-title { font-family: 'Orbitron'; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #1a5ca8; text-transform: uppercase; margin-bottom: 16px; }
    .chart-canvas-wrap { position: relative; height: 220px; }

    /* ── TABLA INSTITUCIONES ── */
    .inst-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .inst-table th { font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #7a8a9a; text-transform: uppercase; padding: 10px 12px; border-bottom: 2px solid #e8ecf4; text-align: left; }
    .inst-table td { padding: 10px 12px; border-bottom: 1px solid #f0f4fa; font-family: 'Exo 2'; color: #1a2a4a; font-weight: 600; }
    .inst-table tr:hover td { background: #f8fbff; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; font-family: 'Orbitron'; font-size: 10px; font-weight: 700; }
    .rank-badge.r1 { background: #fef3c7; color: #d97706; }
    .rank-badge.r2 { background: #f0f0f0; color: #6b7280; }
    .rank-badge.r3 { background: #fce8e0; color: #c2410c; }
    .rank-badge.rn { background: #e8f0ff; color: #1a5ca8; }

    /* ── ESTADO CATEGORÍAS ── */
    .cat-estado-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .cat-estado-card { background: #fff; border-radius: 10px; padding: 12px 14px; border: 1px solid #e0e8f4; display: flex; align-items: center; gap: 10px; }
    .cat-estado-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cat-estado-dot.activa    { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .cat-estado-dot.finalizada{ background: #1a5ca8; }
    .cat-estado-dot.inactiva  { background: #d1d5db; }
    .cat-estado-nombre { font-family: 'Exo 2'; font-size: 12px; font-weight: 700; color: #1a3a6e; flex: 1; }
    .cat-estado-label { font-family: 'DM Mono'; font-size: 10px; }
    .cat-estado-label.activa    { color: #16a34a; }
    .cat-estado-label.finalizada{ color: #1a5ca8; }
    .cat-estado-label.inactiva  { color: #9ca3af; }

    /* ── LOADING ── */
    .loading-msg { text-align: center; padding: 40px; font-family: 'DM Mono'; font-size: 13px; color: #7a8a9a; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #e0e8f4; border-top-color: #1a5ca8; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ÚLTIMO ACTUALIZADO ── */
    .actualizado-bar { background: #e8f0ff; border-radius: 8px; padding: 8px 14px; font-family: 'DM Mono'; font-size: 11px; color: #1a5ca8; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>

  <main>
    <div class="wrapper">

      <div id="acceso-denegado" style="display:none;">
        <div class="acceso-denegado">
          <h3>🔒 Acceso restringido</h3>
          <p>Solo personal autorizado del staff puede ver esta página.</p>
        </div>
      </div>

      <div id="contenido-staff" style="display:none;">

        <!-- HERO -->
        <div class="page-hero">
          <div class="page-hero-badge">
            <span class="page-hero-badge-dot"></span>
            STAFF ONLY
          </div>
          <h2>ESTADÍSTICAS <span>SUCREBOT 2026</span></h2>
          <div class="page-hero-meta">
            <span id="txt-actualizado">Cargando datos...</span>
            <button class="btn-refresh" id="btn-refresh" onclick="cargarTodo()">
              🔄 Actualizar
            </button>
          </div>
        </div>

        <div id="contenido-datos">
          <div class="loading-msg"><span class="spinner"></span> Cargando estadísticas...</div>
        </div>

      </div><!-- /contenido-staff -->
    </div>
  </main>

  <div data-include="../shared/components/footer.html"></div>
  <script src="../shared/js/load-components.js"></script>
  <script src="../shared/js/auth.js"></script>

  <script>
  const GAS_URL   = CONFIG.GAS_URL();
  const JSON_URL  = 'https://raw.githubusercontent.com/sucrebotclub-institute/Sucrebot/main/RESULTADOS/resultados.json';
  const STAFF_TOKEN = 'SucreBot2026-CMI-Sucre-x7k9mQ';

  const CATS_NOMBRES = {
    ins:'Insectos', trp_a:'Trepador Amateur', trp_p:'Trepador Pro',
    sl_a:'Seguidor Línea Amateur', sl_p:'Seguidor Línea Pro',
    ms_a:'Minisumo Autónomo', ms_rc:'Minisumo RC', bai:'Bailarín',
    bat:'Batalla', dev:'Impacto Tecnológico', soc:'Robot Soccer',
    cr:'Cubo Rubik', lk:'Lego Kids'
  };

  let _charts = {};

  function gasGet(params) {
    const qs = new URLSearchParams(params).toString();
    return fetch(GAS_URL + '?' + qs).then(r => r.json());
  }

  function show(id) { document.getElementById(id).style.display = 'block'; }

  document.addEventListener('componentsLoaded', () => {
    const token = localStorage.getItem('sucrebot_staff_token');
    if (token !== STAFF_TOKEN) { show('acceso-denegado'); return; }
    show('contenido-staff');
    cargarTodo();
  });

  async function cargarTodo() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');
    btn.textContent = '⏳ Cargando...';

    try {
      const [participantes, certificados, jsonVivo, estadoCats] = await Promise.all([
        gasGet({ action: 'getParticipantes' }),
        gasGet({ action: 'obtenerTodosCertificados' }),
        fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()),
        gasGet({ action: 'getEstadoCategorias' })
      ]);

      const parr = Array.isArray(participantes) ? participantes : [];
      const carr = Array.isArray(certificados)  ? certificados  : [];

      renderTodo(parr, carr, jsonVivo, estadoCats);

      document.getElementById('txt-actualizado').textContent =
        '📅 Actualizado: ' + new Date().toLocaleTimeString('es-EC');
    } catch(e) {
      document.getElementById('contenido-datos').innerHTML =
        '<div class="loading-msg">⚠️ Error al cargar datos: ' + e.message + '</div>';
    }

    btn.classList.remove('loading');
    btn.textContent = '🔄 Actualizar';
  }

  function destroyCharts() {
    Object.values(_charts).forEach(c => { try { c.destroy(); } catch(e){} });
    _charts = {};
  }

  function renderTodo(parr, carr, json, estadoCats) {
    destroyCharts();

    // ── Cálculos base ──────────────────────────────────────────
    const total      = parr.length;
    const aprobados  = parr.filter(p => p.aprobado === 'APROBADO').length;
    const enRevision = parr.filter(p => p.aprobado === 'EN REVISION').length;
    const noCumple   = parr.filter(p => p.aprobado === 'NO CUMPLE').length;
    const manillas   = parr.filter(p => p.manilla === 'ENTREGADA').length;
    const conEquipo  = parr.filter(p => p.miembro2 && String(p.miembro2).trim()).length;

    // Por categoría
    const porCat = {};
    parr.forEach(p => {
      const c = p.categoria || 'Sin categoría';
      porCat[c] = (porCat[c] || 0) + 1;
    });

    // Por institución
    const porInst = {};
    parr.forEach(p => {
      const i = String(p.institucion || 'Sin institución').trim();
      if (!porInst[i]) porInst[i] = { total: 0, aprobados: 0 };
      porInst[i].total++;
      if (p.aprobado === 'APROBADO') porInst[i].aprobados++;
    });
    const instList = Object.entries(porInst).sort((a,b) => b[1].total - a[1].total);

    // Por ciudad
    const porCiudad = {};
    parr.forEach(p => {
      const c = String(p.ciudad || 'Sin ciudad').trim();
      porCiudad[c] = (porCiudad[c] || 0) + 1;
    });
    const ciudadList = Object.entries(porCiudad).sort((a,b) => b[1]-a[1]).slice(0,8);

    // Certificados
    const certTotal    = carr.length;
    const certConUrl   = carr.filter(c => c.archivoUrl && String(c.archivoUrl).trim()).length;
    const certSinUrl   = certTotal - certConUrl;
    const certGanador  = carr.filter(c => String(c.tipo_certificado||'').toUpperCase() === 'GANADOR').length;
    const certSub      = carr.filter(c => ['SUBCAMPEÓN','SUBCAMPEON'].includes(String(c.tipo_certificado||'').toUpperCase())).length;
    const certTercer   = carr.filter(c => String(c.tipo_certificado||'').toUpperCase() === 'TERCER LUGAR').length;
    const certPart     = carr.filter(c => ['PARTICIPACIÓN','PARTICIPACION'].includes(String(c.tipo_certificado||'').toUpperCase())).length;

    // Resultados cronómetro
    const resultados = json.resultados || {};
    const CATS_CRONO = ['ins','trp_a','trp_p','sl_a','sl_p','cr'];
    let totalIntentos = 0;
    let totalDNF = 0;
    CATS_CRONO.forEach(cat => {
      const arr = resultados[cat] || [];
      totalIntentos += arr.length;
      totalDNF += arr.filter(r => r.tiempo === 'DNF').length;
    });

    // Estado categorías
    const estadoObj   = estadoCats || {};
    const catsActivas = Object.entries(estadoObj).filter(([,v]) => v.estado === 'activa').length;
    const catsFin     = Object.entries(estadoObj).filter(([,v]) => v.estado === 'finalizada').length;
    const totalCats   = 13;

    // Bracket stats
    const bracket = json.bracket || {};
    let bracketPartidosJugados = 0, bracketPartidosPendientes = 0;
    ['ms_a','ms_rc','bat'].forEach(cat => {
      const b = bracket[cat];
      if (!b || !b.fases) return;
      b.fases.forEach(f => {
        f.partidos.forEach(p => {
          if (p.tipo === 'BYE') return;
          if (p.estado === 'FINALIZADO') bracketPartidosJugados++;
          else bracketPartidosPendientes++;
        });
      });
    });

    // Soccer stats
    const soccer = json.soccer;
    let socJugados = 0, socPendientes = 0;
    if (soccer && soccer.partidos) {
      soccer.partidos.forEach(p => {
        if (!p.equipo_a_id) return;
        if (p.estado === 'FINALIZADO') socJugados++;
        else socPendientes++;
      });
    }

    // Ranking instituciones del JSON
    const rankInst = json.ranking_instituciones || [];

    // ── HTML ──────────────────────────────────────────────────
    let html = '';

    // ══ SECCIÓN 1: REGISTRO ══
    html += `<div class="seccion-titulo">📋 REGISTRO</div>`;
    html += `<div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">👥</div>
        <div class="kpi-label">Total inscritos</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-sub">${instList.length} instituciones · ${Object.keys(porCiudad).length} provincias</div>
      </div>
      <div class="kpi-card verde">
        <div class="kpi-icon">✅</div>
        <div class="kpi-label">Aprobados</div>
        <div class="kpi-value">${aprobados}</div>
        <div class="kpi-sub">${total > 0 ? Math.round(aprobados/total*100) : 0}% del total</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-icon">⏳</div>
        <div class="kpi-label">En revisión</div>
        <div class="kpi-value">${enRevision}</div>
        <div class="kpi-sub">Pendientes de aprobar</div>
      </div>
      <div class="kpi-card rojo">
        <div class="kpi-icon">❌</div>
        <div class="kpi-label">No cumple</div>
        <div class="kpi-value">${noCumple}</div>
        <div class="kpi-sub">Rechazados</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-icon">🏷️</div>
        <div class="kpi-label">Manillas entregadas</div>
        <div class="kpi-value">${manillas}</div>
        <div class="kpi-sub">de ${aprobados} aprobados</div>
      </div>
      <div class="kpi-card violet">
        <div class="kpi-icon">👥</div>
        <div class="kpi-label">Con subcapitán</div>
        <div class="kpi-value">${conEquipo}</div>
        <div class="kpi-sub">${total - conEquipo} individuales</div>
      </div>
    </div>`;

    // Barra progreso aprobación
    html += `<div class="chart-card" style="margin-bottom:20px;">
      <div class="chart-title">Progreso de aprobación</div>
      <div class="prog-item">
        <div class="prog-header"><span>✅ Aprobados</span><span>${aprobados}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?aprobados/total*100:0}%;background:linear-gradient(90deg,#0e9f6e,#34d399)"></div></div>
      </div>
      <div class="prog-item">
        <div class="prog-header"><span>⏳ En revisión</span><span>${enRevision}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?enRevision/total*100:0}%;background:linear-gradient(90deg,#d97706,#fbbf24)"></div></div>
      </div>
      <div class="prog-item">
        <div class="prog-header"><span>❌ No cumple</span><span>${noCumple}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${total?noCumple/total*100:0}%;background:linear-gradient(90deg,#e74c3c,#fc8181)"></div></div>
      </div>
      <div class="prog-item" style="margin-top:14px;">
        <div class="prog-header"><span>🏷️ Manillas entregadas</span><span>${manillas} / ${aprobados}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${aprobados?manillas/aprobados*100:0}%;background:linear-gradient(90deg,#0891b2,#38bdf8)"></div></div>
      </div>
    </div>`;

    // Gráficas registro
    html += `<div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Participantes por categoría</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-cat"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top 8 instituciones</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-inst"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Distribución por provincia</div>
        <div class="chart-canvas-wrap"><canvas id="chart-por-ciudad"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Estado de registros</div>
        <div class="chart-canvas-wrap"><canvas id="chart-estados"></canvas></div>
      </div>
    </div>`;

    // Tabla instituciones
    html += `<div class="chart-card" style="margin-bottom:8px;">
      <div class="chart-title">Tabla completa de instituciones</div>
      <table class="inst-table">
        <thead><tr>
          <th>#</th><th>Institución</th><th>Total</th><th>Aprobados</th><th>% Aprob.</th>
        </tr></thead>
        <tbody>`;
    instList.forEach(([inst, datos], i) => {
      const rClass = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
      const pct = datos.total > 0 ? Math.round(datos.aprobados/datos.total*100) : 0;
      html += `<tr>
        <td><span class="rank-badge ${rClass}">${i+1}</span></td>
        <td>${inst}</td>
        <td><strong>${datos.total}</strong></td>
        <td>${datos.aprobados}</td>
        <td><span style="color:${pct>=70?'#0e9f6e':pct>=40?'#d97706':'#e74c3c'};font-weight:700;">${pct}%</span></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;

    // ══ SECCIÓN 2: EVENTO EN VIVO ══
    html += `<div class="seccion-titulo">⚡ EVENTO EN VIVO</div>`;

    // Estado categorías
    html += `<div class="chart-card" style="margin-bottom:20px;">
      <div class="chart-title">Estado de categorías</div>
      <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi-card verde" style="padding:14px;">
          <div class="kpi-label">Finalizadas</div>
          <div class="kpi-value">${catsFin}</div>
          <div class="kpi-sub">de ${totalCats} categorías</div>
        </div>
        <div class="kpi-card amber" style="padding:14px;">
          <div class="kpi-label">En curso</div>
          <div class="kpi-value">${catsActivas}</div>
          <div class="kpi-sub">Actualmente activas</div>
        </div>
        <div class="kpi-card" style="padding:14px;">
          <div class="kpi-label">Sin iniciar</div>
          <div class="kpi-value">${totalCats - catsFin - catsActivas}</div>
          <div class="kpi-sub">Pendientes de comenzar</div>
        </div>
      </div>
      <div class="cat-estado-grid" id="cat-estado-grid"></div>
    </div>`;

    // Cronómetro stats
    html += `<div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">⏱️</div>
        <div class="kpi-label">Intentos registrados</div>
        <div class="kpi-value">${totalIntentos}</div>
        <div class="kpi-sub">Categorías de tiempo</div>
      </div>
      <div class="kpi-card rojo">
        <div class="kpi-icon">🚫</div>
        <div class="kpi-label">DNFs</div>
        <div class="kpi-value">${totalDNF}</div>
        <div class="kpi-sub">${totalIntentos > 0 ? Math.round(totalDNF/totalIntentos*100) : 0}% de intentos</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-icon">🥊</div>
        <div class="kpi-label">Partidos bracket</div>
        <div class="kpi-value">${bracketPartidosJugados}</div>
        <div class="kpi-sub">${bracketPartidosPendientes} pendientes</div>
      </div>
      <div class="kpi-card verde">
        <div class="kpi-icon">⚽</div>
        <div class="kpi-label">Partidos soccer</div>
        <div class="kpi-value">${socJugados}</div>
        <div class="kpi-sub">${socPendientes} pendientes</div>
      </div>
    </div>`;

    // Mejores tiempos
    html += `<div class="chart-card" style="margin:20px 0;">
      <div class="chart-title">Mejores tiempos por categoría (cronómetro)</div>
      <table class="inst-table">
        <thead><tr><th>Categoría</th><th>Robot</th><th>Mejor tiempo</th><th>Intentos</th></tr></thead>
        <tbody id="tbody-tiempos"></tbody>
      </table>
    </div>`;

    // Gráfica cronómetro
    html += `<div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Intentos por categoría (cronómetro)</div>
        <div class="chart-canvas-wrap"><canvas id="chart-crono"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Avance del evento</div>
        <div class="chart-canvas-wrap"><canvas id="chart-avance"></canvas></div>
      </div>
    </div>`;

    // ══ SECCIÓN 3: CERTIFICADOS ══
    html += `<div class="seccion-titulo">📜 CERTIFICADOS</div>`;
    html += `<div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">📄</div>
        <div class="kpi-label">Total generados</div>
        <div class="kpi-value">${certTotal}</div>
        <div class="kpi-sub">${certConUrl} con PDF subido</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-icon">⏳</div>
        <div class="kpi-label">Sin PDF</div>
        <div class="kpi-value">${certSinUrl}</div>
        <div class="kpi-sub">Pendientes de subir</div>
      </div>
      <div class="kpi-card" style="--accent:#d97706;">
        <div class="kpi-icon">🥇</div>
        <div class="kpi-label">Ganadores</div>
        <div class="kpi-value">${certGanador}</div>
      </div>
      <div class="kpi-card" style="--accent:#6b7280;">
        <div class="kpi-icon">🥈</div>
        <div class="kpi-label">Subcampeones</div>
        <div class="kpi-value">${certSub}</div>
      </div>
      <div class="kpi-card" style="--accent:#c2410c;">
        <div class="kpi-icon">🥉</div>
        <div class="kpi-label">Tercer lugar</div>
        <div class="kpi-value">${certTercer}</div>
      </div>
      <div class="kpi-card violet">
        <div class="kpi-icon">🏅</div>
        <div class="kpi-label">Participación</div>
        <div class="kpi-value">${certPart}</div>
      </div>
    </div>`;

    // Gráfica certs
    html += `<div class="chart-grid" style="margin-top:20px;">
      <div class="chart-card">
        <div class="chart-title">Distribución de certificados</div>
        <div class="chart-canvas-wrap"><canvas id="chart-cert-tipo"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Estado de PDFs</div>
        <div class="chart-canvas-wrap"><canvas id="chart-cert-pdf"></canvas></div>
      </div>
    </div>`;

    // ══ SECCIÓN 4: RANKING INSTITUCIONES ══
    html += `<div class="seccion-titulo">🏫 RANKING INSTITUCIONES</div>`;
    if (rankInst.length > 0) {
      html += `<div class="chart-card" style="margin-bottom:8px;">
        <div class="chart-title">Tabla de puntos (10 oro · 5 plata · 1 bronce)</div>
        <table class="inst-table">
          <thead><tr><th>#</th><th>Institución</th><th>Puntos</th><th>🥇</th><th>🥈</th><th>🥉</th></tr></thead>
          <tbody>`;
      rankInst.slice(0, 15).forEach((r, i) => {
        const rClass = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
        html += `<tr>
          <td><span class="rank-badge ${rClass}">${i+1}</span></td>
          <td>${r.institucion}</td>
          <td><strong style="color:#1a5ca8;font-family:'Orbitron';font-size:13px;">${r.puntos}</strong></td>
          <td>${r.oros}</td><td>${r.platas}</td><td>${r.bronces}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;

      html += `<div class="chart-grid" style="margin-top:20px;">
        <div class="chart-card">
          <div class="chart-title">Top 8 instituciones por puntos</div>
          <div class="chart-canvas-wrap"><canvas id="chart-rank-inst"></canvas></div>
        </div>
      </div>`;
    } else {
      html += `<div class="loading-msg" style="padding:20px;">Sin datos de ranking todavía — se generan al guardar certificados.</div>`;
    }

    // Renderizar
    document.getElementById('contenido-datos').innerHTML = html;

    // ── Poblar estado categorías ──
    const catGrid = document.getElementById('cat-estado-grid');
    if (catGrid) {
      const CATS_LABEL = {
        ins:'Insectos', trp_a:'Trepador A', trp_p:'Trepador Pro',
        sl_a:'Seg. Línea A', sl_p:'Seg. Línea Pro',
        ms_a:'Minisumo A', ms_rc:'Minisumo RC', bai:'Bailarín',
        bat:'Batalla', dev:'Impacto Tec.', soc:'Soccer',
        cr:'Cubo Rubik', lk:'Lego Kids'
      };
      const CATS_ALL = ['ins','trp_a','sl_a','sl_p','ms_a','ms_rc','bai','bat','dev','trp_p','soc','cr','lk'];
      catGrid.innerHTML = CATS_ALL.map(cat => {
        const e = estadoObj[cat] || { estado: 'inactiva' };
        const est = e.estado || 'inactiva';
        return `<div class="cat-estado-card">
          <div class="cat-estado-dot ${est}"></div>
          <div class="cat-estado-nombre">${CATS_LABEL[cat]}</div>
          <div class="cat-estado-label ${est}">${est === 'activa' ? '▶ Activa' : est === 'finalizada' ? '✓ Final.' : '— Espera'}</div>
        </div>`;
      }).join('');
    }

    // ── Mejores tiempos ──
    const tbodyT = document.getElementById('tbody-tiempos');
    if (tbodyT) {
      const CRONO_CATS = { ins:'Insectos', trp_a:'Trepador A', trp_p:'Trepador Pro', sl_a:'Seg. Línea A', sl_p:'Seg. Línea Pro', cr:'Cubo Rubik' };
      let rowsT = '';
      Object.entries(CRONO_CATS).forEach(([cat, nombre]) => {
        const arr = (resultados[cat] || []).filter(r => r.tiempo !== 'DNF' && r.tiempo !== '—');
        const dnfs = (resultados[cat] || []).filter(r => r.tiempo === 'DNF').length;
        const total_int = (resultados[cat] || []).length;
        if (arr.length === 0) {
          rowsT += `<tr><td>${nombre}</td><td colspan="3" style="color:#9ca3af;font-style:italic;">Sin resultados</td></tr>`;
        } else {
          arr.sort((a,b) => String(a.tiempo).localeCompare(String(b.tiempo)));
          const mejor = arr[0];
          rowsT += `<tr>
            <td><strong>${nombre}</strong></td>
            <td style="font-family:'DM Mono'">${mejor.robot}</td>
            <td><span style="font-family:'DM Mono';color:#0891b2;font-weight:700;">${mejor.tiempo}</span></td>
            <td>${total_int} <span style="color:#e74c3c;font-size:11px;">(${dnfs} DNF)</span></td>
          </tr>`;
        }
      });
      tbodyT.innerHTML = rowsT;
    }

    // ── CHARTS ──
    const BLUE_PALETTE = [
      '#1a5ca8','#2e86de','#5bc8f0','#0e9f6e','#d97706',
      '#7c3aed','#db2777','#0891b2','#c2410c','#16a34a',
      '#6b7280','#e74c3c','#f59e0b'
    ];

    // Chart: por categoría
    const catLabels = Object.keys(porCat);
    const catData   = catLabels.map(c => porCat[c]);
    _charts['por-cat'] = new Chart(document.getElementById('chart-por-cat'), {
      type: 'bar',
      data: { labels: catLabels, datasets: [{ data: catData, backgroundColor: BLUE_PALETTE, borderRadius: 6, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { font: { family: 'DM Mono', size: 10 } }, grid: { color: '#f0f4fa' } }, x: { ticks: { font: { family: 'Exo 2', size: 10 }, maxRotation: 45 } } } }
    });

    // Chart: top 8 instituciones
    const instTop8 = instList.slice(0,8);
    _charts['por-inst'] = new Chart(document.getElementById('chart-por-inst'), {
      type: 'bar',
      data: { labels: instTop8.map(([n]) => n.length > 20 ? n.slice(0,18)+'…' : n), datasets: [{ data: instTop8.map(([,d]) => d.total), backgroundColor: '#1a5ca8', borderRadius: 6, borderSkipped: false }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { family: 'DM Mono', size: 10 } } }, y: { ticks: { font: { family: 'Exo 2', size: 10 } } } } }
    });

    // Chart: por ciudad (dona)
    _charts['por-ciudad'] = new Chart(document.getElementById('chart-por-ciudad'), {
      type: 'doughnut',
      data: { labels: ciudadList.map(([c]) => c), datasets: [{ data: ciudadList.map(([,v]) => v), backgroundColor: BLUE_PALETTE, borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Exo 2', size: 11 }, padding: 10 } } } }
    });

    // Chart: estados (dona)
    _charts['estados'] = new Chart(document.getElementById('chart-estados'), {
      type: 'doughnut',
      data: { labels: ['Aprobados','En revisión','No cumple'], datasets: [{ data: [aprobados, enRevision, noCumple], backgroundColor: ['#0e9f6e','#d97706','#e74c3c'], borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Exo 2', size: 12 }, padding: 12 } } } }
    });

    // Chart: intentos cronómetro
    const cronoCats = ['ins','trp_a','trp_p','sl_a','sl_p','cr'];
    const cronoLabels = cronoCats.map(c => CATS_NOMBRES[c]);
    const cronoData   = cronoCats.map(c => (resultados[c]||[]).length);
    _charts['crono'] = new Chart(document.getElementById('chart-crono'), {
      type: 'bar',
      data: { labels: cronoLabels, datasets: [{ label: 'Intentos', data: cronoData, backgroundColor: '#0891b2', borderRadius: 6, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { font: { family: 'DM Mono', size: 10 } }, beginAtZero: true }, x: { ticks: { font: { family: 'Exo 2', size: 10 }, maxRotation: 30 } } } }
    });

    // Chart: avance del evento (dona)
    _charts['avance'] = new Chart(document.getElementById('chart-avance'), {
      type: 'doughnut',
      data: { labels: ['Finalizadas','En curso','Sin iniciar'], datasets: [{ data: [catsFin, catsActivas, totalCats - catsFin - catsActivas], backgroundColor: ['#1a5ca8','#22c55e','#e5e7eb'], borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Exo 2', size: 12 }, padding: 12 } } } }
    });

    // Chart: cert tipo (dona)
    _charts['cert-tipo'] = new Chart(document.getElementById('chart-cert-tipo'), {
      type: 'doughnut',
      data: { labels: ['Ganador','Subcampeón','Tercer lugar','Participación'], datasets: [{ data: [certGanador, certSub, certTercer, certPart], backgroundColor: ['#d97706','#6b7280','#c2410c','#7c3aed'], borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Exo 2', size: 11 }, padding: 10 } } } }
    });

    // Chart: cert PDF (dona)
    _charts['cert-pdf'] = new Chart(document.getElementById('chart-cert-pdf'), {
      type: 'doughnut',
      data: { labels: ['PDF subido','Sin PDF'], datasets: [{ data: [certConUrl, certSinUrl], backgroundColor: ['#0e9f6e','#e5e7eb'], borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Exo 2', size: 12 }, padding: 12 } } } }
    });

    // Chart: ranking instituciones
    const chartRankInst = document.getElementById('chart-rank-inst');
    if (chartRankInst && rankInst.length > 0) {
      const top8 = rankInst.slice(0,8);
      _charts['rank-inst'] = new Chart(chartRankInst, {
        type: 'bar',
        data: { labels: top8.map(r => r.institucion.length > 20 ? r.institucion.slice(0,18)+'…' : r.institucion), datasets: [{ label: 'Puntos', data: top8.map(r => r.puntos), backgroundColor: ['#d97706','#6b7280','#c2410c','#1a5ca8','#1a5ca8','#1a5ca8','#1a5ca8','#1a5ca8'], borderRadius: 6, borderSkipped: false }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { family: 'DM Mono', size: 10 } }, beginAtZero: true }, y: { ticks: { font: { family: 'Exo 2', size: 10 } } } } }
      });
    }
  }
  </script>
</body>
</html>
