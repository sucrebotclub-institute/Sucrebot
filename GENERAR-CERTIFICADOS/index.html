<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Generar Certificados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    body { background: #ffffff !important; color: #1a1c28 !important; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; min-height: 70vh; }

    .page-hero { padding: 80px 0 32px; margin-bottom: 32px; }
    .page-hero-badge { display: block; width: fit-content; background: #1a5ca8; color: #fff; font-family: 'Orbitron'; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue'; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; position: relative; margin-bottom: 20px; }
    .page-hero h2::after { content:''; position:absolute; bottom:-10px; left:0; width:100%; height:3px; background:linear-gradient(90deg,transparent,#5bc8f0,transparent); border-radius:2px; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; }

    .acceso-denegado { background: linear-gradient(135deg,#ff3b3b,#c41e3a); border-radius: 16px; padding: 60px 40px; text-align: center; max-width: 600px; margin: 60px auto; }
    .acceso-denegado h3 { font-family: 'Orbitron'; font-size: 1.8rem; color: #fff; margin-bottom: 12px; }
    .acceso-denegado p { color: rgba(255,255,255,.9); font-size: 14px; line-height: 1.6; }

    .controles-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; padding:20px; background:#f8f9fb; border-radius:12px; gap:16px; flex-wrap:wrap; }
    .fecha-evento { display:flex; align-items:center; gap:12px; }
    .fecha-evento label { font-family:'Orbitron'; font-size:11px; font-weight:700; color:#4a5568; letter-spacing:1px; }
    .fecha-evento input { padding:10px 14px; border:2px solid #e0e4ea; border-radius:8px; font-family:'Exo 2'; font-size:14px; font-weight:600; color:#1a3a6b; outline:none; }
    .btn-generar-todos { background:linear-gradient(135deg,#1a5ca8,#0f3d75); color:#fff; border:none; padding:12px 24px; border-radius:10px; font-family:'Exo 2'; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; }
    .btn-generar-todos:hover:not(:disabled) { transform:translateY(-2px); }
    .btn-generar-todos:disabled { opacity:.5; cursor:not-allowed; }

    .progreso-wrap { display:none; background:#f8f9fb; border-radius:12px; padding:16px 20px; margin-bottom:20px; border:1px solid #e0e4ea; }
    .progreso-wrap.visible { display:block; }
    .progreso-label { font-family:'Orbitron'; font-size:11px; color:#1a5ca8; margin-bottom:8px; font-weight:700; letter-spacing:1px; }
    .progreso-bar-bg { background:#e0e4ea; border-radius:8px; height:10px; overflow:hidden; }
    .progreso-bar-fill { height:100%; background:linear-gradient(90deg,#1a5ca8,#5bc8f0); border-radius:8px; transition:width .3s; width:0%; }
    .progreso-texto { font-family:'DM Mono'; font-size:11px; color:#7a7a8c; margin-top:6px; }

    .cat-block { margin-bottom: 48px; }
    .cat-block-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding: 14px 20px; background: #1a5ca8; border-radius: 12px; }
    .cat-block-nombre { font-family: 'Bebas Neue'; font-size: 1.4rem; letter-spacing: 2px; color: #fff; flex: 1; }
    .cat-block-counts { display:flex; gap:10px; flex-wrap:wrap; }
    .cat-pill { font-family: 'DM Mono'; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
    .cat-pill.podio       { background: rgba(196,165,255,.25); color: #e9d5ff; border: 1px solid rgba(196,165,255,.4); }
    .cat-pill.pendientes  { background: rgba(253,212,76,.2);   color: #fef3c7; border: 1px solid rgba(253,212,76,.4); }
    .cat-pill.generados   { background: rgba(110,231,183,.2);  color: #d1fae5; border: 1px solid rgba(110,231,183,.4); }

    .subseccion { margin-bottom: 20px; }
    .subseccion-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #e0e4ea; }
    .subseccion-titulo { font-family:'Orbitron'; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
    .subseccion-titulo.podio      { color:#7c3aed; }
    .subseccion-titulo.pendientes { color:#c27803; }
    .subseccion-titulo.generados  { color:#0e9f6e; }
    .subseccion-count { font-family:'DM Mono'; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
    .subseccion-count.podio      { background:#f5f3ff; color:#7c3aed; border:1px solid #c4b5fd; }
    .subseccion-count.pendientes { background:#fff8e6; color:#c27803; border:1px solid #fcd34d; }
    .subseccion-count.generados  { background:#ecfdf5; color:#0e9f6e; border:1px solid #6ee7b7; }

    .tabla { width:100%; border-collapse:separate; border-spacing:0; border:2px solid #e0e4ea; border-radius:12px; overflow:hidden; margin-bottom:8px; }
    .tabla thead { background:linear-gradient(135deg,#1a5ca8,#0f3d75); }
    .tabla.podio thead      { background:linear-gradient(135deg,#7c3aed,#4c1d95); }
    .tabla.generados thead  { background:linear-gradient(135deg,#0e9f6e,#057a55); }
    .tabla th { padding:12px 14px; text-align:left; font-family:'Orbitron'; font-size:10px; font-weight:700; color:#fff; letter-spacing:1px; text-transform:uppercase; }
    .tabla tbody tr { background:#fff; transition:all .2s; }
    .tabla tbody tr:nth-child(even) { background:#f8f9fb; }
    .tabla tbody tr:hover { background:#e8f4ff; }
    .tabla.podio tbody tr:nth-child(even) { background:#faf5ff; }
    .tabla.podio tbody tr:hover { background:#ede9fe; }
    .tabla.generados tbody tr:nth-child(even) { background:#f0fdf4; }
    .tabla.generados tbody tr:hover { background:#dcfce7; }
    .tabla td { padding:12px 14px; font-size:13px; color:#2a3f5f; border-bottom:1px solid #e0e4ea; font-family:'Exo 2'; font-weight:600; vertical-align:middle; }
    .tabla tbody tr:last-child td { border-bottom:none; }
    .tabla tbody tr.fila-miembro { background:#f0f7ff; }
    .tabla tbody tr.fila-miembro:hover { background:#d8ecff; }
    .tabla.podio tbody tr.fila-miembro { background:#faf5ff; }
    .tabla.generados tbody tr.fila-miembro { background:#f0fdf4; }

    .badge-capitan { display:inline-block; background:#1a5ca8; color:#fff; font-size:9px; font-weight:700; letter-spacing:1px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; text-transform:uppercase; }
    .badge-miembro { display:inline-block; background:#5bc8f0; color:#0f3566; font-size:9px; font-weight:700; letter-spacing:1px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; text-transform:uppercase; }
    .badge-podio   { display:inline-block; font-size:9px; font-weight:700; letter-spacing:1px; padding:2px 8px; border-radius:10px; vertical-align:middle; text-transform:uppercase; }
    .badge-ganador { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
    .badge-sub     { background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; }
    .badge-tercero { background:#fff7ed; color:#9a3412; border:1px solid #fdba74; }

    .tipo-select { padding:7px 10px; border:2px solid #e0e4ea; border-radius:8px; font-family:'Exo 2'; font-size:12px; font-weight:600; color:#1a3a6b; cursor:pointer; }
    .btn-preview { background:#e8f4ff; color:#1a5ca8; border:1.5px solid #5bc8f0; padding:7px 12px; border-radius:8px; font-family:'Exo 2'; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; }
    .btn-preview:hover { background:#5bc8f0; color:#0f3566; }
    .btn-generar-uno { background:linear-gradient(135deg,#1a5ca8,#0f3d75); color:#fff; border:none; padding:7px 12px; border-radius:8px; font-family:'Exo 2'; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .btn-generar-uno:hover:not(:disabled) { transform:translateY(-1px); }
    .btn-generar-uno:disabled { opacity:.5; cursor:not-allowed; }
    .btn-generar-podio { background:linear-gradient(135deg,#7c3aed,#4c1d95); color:#fff; border:none; padding:7px 12px; border-radius:8px; font-family:'Exo 2'; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .btn-generar-podio:hover:not(:disabled) { transform:translateY(-1px); }
    .btn-generar-podio:disabled { opacity:.5; cursor:not-allowed; }
    .acciones-cell { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .cert-codigo-tag { font-family:'DM Mono'; font-size:11px; background:#f0f4f8; color:#1a5ca8; padding:3px 8px; border-radius:6px; }
    .cert-link { display:inline-flex; align-items:center; gap:6px; background:#0e9f6e; color:#fff; text-decoration:none; padding:6px 12px; border-radius:8px; font-family:'Exo 2'; font-size:12px; font-weight:700; transition:all .2s; }
    .cert-link:hover { background:#057a55; }
    .vacio-msg { text-align:center; padding:24px 20px; color:#7a7a8c; font-size:13px; }

    .toast { position:fixed; bottom:30px; left:30px; transform:translateY(100px); opacity:0; background:#1e2438; border-radius:12px; border-left:5px solid #3dd68c; color:#f0f4ff; font-family:'Exo 2'; font-size:.84rem; font-weight:600; padding:14px 18px; transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s; z-index:9999; max-width:320px; }
    .toast.show { transform:translateY(0); opacity:1; }

    @media(max-width:768px) {
      .page-hero { padding:40px 0 24px; }
      .page-hero h2 { font-size:1.8rem; }
      .controles-top { flex-direction:column; align-items:stretch; }
      .acciones-cell { flex-direction:column; }
      .cat-block-header { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<div class="wrapper">
  <div class="page-hero">
    <div class="page-hero-badge"><div class="page-hero-badge-dot"></div>SUCREBOT 2026 · STAFF</div>
    <h2>GENERAR <span>CERTIFICADOS</span></h2>
    <p>GENERA CERTIFICADOS PARA PARTICIPANTES APROBADOS — INCLUYE TODOS LOS INTEGRANTES DEL EQUIPO</p>
  </div>

  <div id="acceso-denegado" style="display:none;">
    <div class="acceso-denegado">
      <div style="font-size:72px;margin-bottom:24px;">🔒</div>
      <h3>ACCESO RESTRINGIDO</h3>
      <p>Esta sección solo está disponible para personal autorizado del staff de SucreBot.</p>
    </div>
  </div>

  <div id="contenido-staff" style="display:none;">
    <div class="controles-top">
      <div class="fecha-evento">
        <label>📅 FECHA DEL EVENTO:</label>
        <input type="text" id="fecha-evento" value="16 de julio de 2026" />
      </div>
      <button class="btn-generar-todos" id="btn-generar-todos" onclick="generarTodos()">
        ⚡ Generar todos los pendientes
      </button>
    </div>

    <div class="progreso-wrap" id="progreso-wrap">
      <div class="progreso-label" id="progreso-label">Generando certificados...</div>
      <div class="progreso-bar-bg"><div class="progreso-bar-fill" id="progreso-bar"></div></div>
      <div class="progreso-texto" id="progreso-texto">0 / 0</div>
    </div>

    <div id="categorias-container"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div data-include="../shared/components/footer.html"></div>
<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>
<script src="../shared/js/certificados.js"></script>

<script>
const GAS_URL = CONFIG.GAS_URL();
const STAFF_EMAILS_CERTIFICADOS = [
  'ftipantocta@tecnologicosucre.edu.ec',
  'sucrebotclub@tecnologicosucre.edu.ec',
  'vandrade@tecnologicosucre.edu.ec'
];

let participantesAprobados = [];
let generandoEnMasa        = false;
let categorias = {};

const TIPO_PODIO_MAP = {
  'GANADOR': '1er', 'SUBCAMPEÓN': '2do', 'TERCER LUGAR': '3er',
  'FINALISTA': '2do', 'TERCER_LUGAR': '3er'
};
const TIPO_LABEL = {
  'participacion':'🏅 Participación','1er':'🥇 Primer Lugar','2do':'🥈 Segundo Lugar','3er':'🥉 Tercer Lugar',
  'GANADOR':'🥇 Ganador','SUBCAMPEÓN':'🥈 Subcampeón','TERCER LUGAR':'🥉 3er Lugar',
  'FINALISTA':'🥈 Finalista','TERCER_LUGAR':'🥉 3er Lugar'
};
const BADGE_PODIO = {
  'GANADOR':      '<span class="badge-podio badge-ganador">🥇 Ganador</span>',
  'SUBCAMPEÓN':   '<span class="badge-podio badge-sub">🥈 Subcampeón</span>',
  'TERCER LUGAR': '<span class="badge-podio badge-tercero">🥉 3er Lugar</span>',
  'FINALISTA':    '<span class="badge-podio badge-sub">🥈 Finalista</span>',
  'TERCER_LUGAR': '<span class="badge-podio badge-tercero">🥉 3er Lugar</span>',
};

// ── FIX: normaliza cualquier valor a string limpio o vacío ──
// Evita TypeError: p.miembro2.trim is not a function
// cuando el GAS devuelve null, número u otro tipo no-string
function strVal(v) {
  if (v === null || v === undefined) return '';
  return String(v).trim();
}

document.addEventListener('componentsLoaded', function() {
  const savedUser = localStorage.getItem('sucrebot_user');
  if (!savedUser) { document.getElementById('acceso-denegado').style.display = 'block'; return; }
  try {
    const userData = JSON.parse(savedUser);
    if (!STAFF_EMAILS_CERTIFICADOS.includes(userData.email)) {
      document.getElementById('acceso-denegado').style.display = 'block'; return;
    }
    document.getElementById('contenido-staff').style.display = 'block';
    cargarDatos();
  } catch(e) { document.getElementById('acceso-denegado').style.display = 'block'; }
});

async function cargarDatos() {
  document.getElementById('categorias-container').innerHTML =
    '<div style="text-align:center;padding:40px;color:#7a7a8c;">Cargando...</div>';
  try {
    const [resParts, resCerts] = await Promise.all([
      fetch(GAS_URL + '?action=getParticipantes'),
      fetch(GAS_URL + '?action=obtenerTodosCertificados')
    ]);
    participantesAprobados = (await resParts.json()).filter(p => p.aprobado === 'APROBADO');
    const certsJson = await resCerts.json();
    const todos = Array.isArray(certsJson) ? certsJson : [];

    const certsConPDF = todos.filter(c => c.archivoUrl && c.archivoUrl.trim());
    const certsSinPDF = todos.filter(c =>
      (!c.archivoUrl || !c.archivoUrl.trim()) && c.nombre_completo && c.nombre_completo.trim()
    );

    categorias = {};

    // ── Procesar certs sin PDF (podio) ──
    certsSinPDF.forEach(c => {
      const cat = c.categoria || 'Sin categoría';
      if (!categorias[cat]) categorias[cat] = { nombre: cat, podioGrupos: [], pendientes: [], generados: [] };

      let grupo = categorias[cat].podioGrupos.find(g => g.tipo_certificado === c.tipo_certificado);
      if (!grupo) {
        grupo = { tipo_certificado: c.tipo_certificado, tipo_interno: TIPO_PODIO_MAP[c.tipo_certificado] || '1er', integrantes: [] };
        categorias[cat].podioGrupos.push(grupo);
      }

      const p = participantesAprobados.find(x =>
        (x.nombre || '').toLowerCase().trim() === (c.nombre_completo || '').toLowerCase().trim()
      ) || null;

      grupo.integrantes.push({ nombre: c.nombre_completo, esCapitan: true, p, cert: c });
      // FIX: usar strVal() para evitar .trim() sobre null/number
      if (p) {
        if (strVal(p.miembro2))
          grupo.integrantes.push({ nombre: strVal(p.miembro2), esCapitan: false, p, cert: c });
        if (strVal(p.miembro3))
          grupo.integrantes.push({ nombre: strVal(p.miembro3), esCapitan: false, p, cert: c });
      }
    });

    const ordenPodio = ['GANADOR', 'SUBCAMPEÓN', 'TERCER LUGAR', 'FINALISTA', 'TERCER_LUGAR'];
    Object.values(categorias).forEach(cat => {
      cat.podioGrupos.sort((a, b) =>
        (ordenPodio.indexOf(a.tipo_certificado) ?? 99) - (ordenPodio.indexOf(b.tipo_certificado) ?? 99)
      );
    });

    // ── Procesar participantes aprobados (pendientes) ──
    participantesAprobados.forEach((p, idx) => {
      const cat = p.categoria || 'Sin categoría';
      if (!categorias[cat]) categorias[cat] = { nombre: cat, podioGrupos: [], pendientes: [], generados: [] };

      const miembros = [{ nombre: p.nombre, esCapitan: true }];
      // FIX: usar strVal() para evitar .trim() sobre null/number
      if (strVal(p.miembro2)) miembros.push({ nombre: strVal(p.miembro2), esCapitan: false });
      if (strVal(p.miembro3)) miembros.push({ nombre: strVal(p.miembro3), esCapitan: false });

      miembros.forEach((m, mIdx) => {
        const cert = certsConPDF.find(c =>
          (c.nombre_completo || '').toLowerCase().trim() === m.nombre.toLowerCase().trim()
        );
        const entrada = { nombre: m.nombre, esCapitan: m.esCapitan, robot: p.robot, categoria: cat, institucion: p.institucion, correo: p.correo, idx, mIdx, cert: cert || null };
        if (!cert) categorias[cat].pendientes.push(entrada);
      });
    });

    renderTodo();
  } catch(e) {
    console.error(e);
    showToast('❌ Error al cargar datos: ' + e.message);
  }
}

function renderTodo() {
  const container = document.getElementById('categorias-container');
  const totalPendientes = Object.values(categorias).reduce((a, c) => a + c.pendientes.length, 0);
  document.getElementById('btn-generar-todos').disabled = totalPendientes === 0 || generandoEnMasa;

  const cats = Object.values(categorias).sort((a, b) => a.nombre.localeCompare(b.nombre));

  if (!cats.length) {
    container.innerHTML = '<div class="vacio-msg">No hay participantes aprobados aún.</div>';
    return;
  }

  container.innerHTML = cats.map(cat => renderCatBlock(cat)).join('');
}

function renderCatBlock(cat) {
  const totalPodio      = cat.podioGrupos.reduce((a, g) => a + g.integrantes.length, 0);
  const totalPendientes = cat.pendientes.length;
  if (!totalPodio && !totalPendientes) return '';

  const pillsPodio = totalPodio     ? `<span class="cat-pill podio">🏆 ${totalPodio} podio</span>` : '';
  const pillsPend  = totalPendientes ? `<span class="cat-pill pendientes">⏳ ${totalPendientes} pendientes</span>` : '';

  let podioHTML = '';
  if (cat.podioGrupos.length) {
    const filas = cat.podioGrupos.map((grupo, gi) => {
      const badge = BADGE_PODIO[grupo.tipo_certificado] || `<span class="badge-podio">${grupo.tipo_certificado}</span>`;
      return grupo.integrantes.map((integrante, ii) => {
        const memberBadge = integrante.esCapitan
          ? '<span class="badge-capitan">Capitán</span>'
          : '<span class="badge-miembro">Miembro</span>';
        const robot  = integrante.p?.robot || '—';
        const accion = integrante.esCapitan
          ? `<button class="btn-generar-podio" id="btn-podio-${cat.nombre.replace(/\s/g,'_')}-${gi}" onclick="generarDiplomaPodio('${cat.nombre}',${gi})">🏆 Generar diplomas (${grupo.integrantes.length})</button>`
          : '<span style="color:#aab0be;font-size:11px;">↑ mismo botón</span>';
        return `<tr${integrante.esCapitan ? '' : ' class="fila-miembro"'}>
          <td>${robot}</td>
          <td>${integrante.nombre}${memberBadge}</td>
          <td>${badge}</td>
          <td><span class="cert-codigo-tag">${integrante.cert?.codigo_verificacion || '—'}</span></td>
          <td><div class="acciones-cell">${accion}</div></td>
        </tr>`;
      }).join('');
    }).join('');

    podioHTML = `
      <div class="subseccion">
        <div class="subseccion-header">
          <span class="subseccion-titulo podio">🏆 Podio pendiente de diploma</span>
          <span class="subseccion-count podio">${totalPodio}</span>
        </div>
        <table class="tabla podio">
          <thead><tr><th>ROBOT</th><th>INTEGRANTE</th><th>TIPO</th><th>CÓDIGO</th><th>ACCIONES</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  }

  let pendientesHTML = '';
  if (cat.pendientes.length) {
    const filas = cat.pendientes.map((item, i) => {
      const badge = item.esCapitan ? '<span class="badge-capitan">Capitán</span>' : '<span class="badge-miembro">Miembro</span>';
      const itemKey = `${cat.nombre.replace(/\s/g,'_')}_${i}`;
      return `<tr${item.esCapitan ? '' : ' class="fila-miembro"'} id="fila-pend-${itemKey}">
        <td>${item.robot || '—'}</td>
        <td>${item.nombre}${badge}</td>
        <td>${item.institucion || '—'}</td>
        <td>
          <select class="tipo-select" id="tipo-${item.idx}-${item.mIdx}">
            <option value="participacion">🏅 Participación</option>
            <option value="1er">🥇 Primer Lugar</option>
            <option value="2do">🥈 Segundo Lugar</option>
            <option value="3er">🥉 Tercer Lugar</option>
          </select>
        </td>
        <td>
          <div class="acciones-cell">
            <button class="btn-preview" onclick="previewCertificado(${item.idx},'${item.nombre.replace(/'/g,"\\'")}',null,${item.mIdx})">👁️ Preview</button>
            <button class="btn-generar-uno" id="btn-uno-${itemKey}" onclick="generarUno('${cat.nombre}',${i})">📄 Generar diploma</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    pendientesHTML = `
      <div class="subseccion">
        <div class="subseccion-header">
          <span class="subseccion-titulo pendientes">⏳ Pendientes de diploma</span>
          <span class="subseccion-count pendientes">${cat.pendientes.length}</span>
        </div>
        <table class="tabla">
          <thead><tr><th>ROBOT</th><th>INTEGRANTE</th><th>INSTITUCIÓN</th><th>TIPO</th><th>ACCIONES</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  }

  return `
    <div class="cat-block" id="cat-block-${cat.nombre.replace(/\s/g,'_')}">
      <div class="cat-block-header">
        <div class="cat-block-nombre">${cat.nombre}</div>
        <div class="cat-block-counts">${pillsPodio}${pillsPend}</div>
      </div>
      ${podioHTML}
      ${pendientesHTML}
    </div>`;
}

async function generarDiplomaPodio(catNombre, gi) {
  const cat   = categorias[catNombre];
  const grupo = cat?.podioGrupos[gi];
  if (!grupo) return;

  const btnId = `btn-podio-${catNombre.replace(/\s/g,'_')}-${gi}`;
  const btn   = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando...'; }

  const fechaEvento = document.getElementById('fecha-evento').value;
  const tipoInterno = grupo.tipo_interno;
  let todosOk = true;

  for (const integrante of grupo.integrantes) {
    try {
      let codigo = integrante.cert?.codigo_verificacion;
      const correo = integrante.p?.correo || '';

      if (!integrante.esCapitan) {
        const resp = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'guardarCertificado', correo,
            nombre_completo: integrante.nombre,
            categoria: catNombre,
            institucion: integrante.p?.institucion || '',
            evento: 'SucreBot 2026', fecha_evento: fechaEvento,
            tipo_certificado: grupo.tipo_certificado
          }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await resp.json();
        if (!result.ok) throw new Error('Error Sheets para ' + integrante.nombre);
        codigo = result.codigo;
      }

      if (btn) btn.textContent = `⏳ PDF ${integrante.nombre}...`;
      const pFake = {
        nombre: integrante.nombre, correo,
        categoria: catNombre,
        institucion: integrante.p?.institucion || '',
        robot: integrante.p?.robot || ''
      };
      const driveUrl = await generarYSubirPDF(pFake, tipoInterno, fechaEvento, codigo, integrante.nombre);

      cat.generados.unshift({
        nombre: integrante.nombre, esCapitan: integrante.esCapitan,
        robot: integrante.p?.robot || '—', categoria: catNombre,
        institucion: integrante.p?.institucion || '—', correo,
        idx: -1, mIdx: -1,
        cert: { tipo_certificado: grupo.tipo_certificado, codigo_verificacion: codigo, archivoUrl: driveUrl }
      });
      showToast('✅ Diploma de ' + integrante.nombre + ' listo');
    } catch(e) {
      console.error(e);
      showToast('❌ Error con ' + integrante.nombre + ': ' + e.message);
      todosOk = false;
    }
  }

  if (todosOk) {
    cat.podioGrupos.splice(gi, 1);
  } else {
    if (btn) { btn.disabled = false; btn.textContent = `🏆 Generar diplomas (${grupo.integrantes.length})`; }
  }
  renderTodo();
}

async function generarUno(catNombre, i) {
  const cat  = categorias[catNombre];
  const item = cat?.pendientes[i];
  if (!item) return;

  const itemKey = `${catNombre.replace(/\s/g,'_')}_${i}`;
  const btn = document.getElementById('btn-uno-' + itemKey);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando...'; }

  const p = participantesAprobados[item.idx];
  const tipo = document.getElementById('tipo-' + item.idx + '-' + item.mIdx)?.value || 'participacion';
  const fechaEvento = document.getElementById('fecha-evento').value;

  try {
    const resp = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'guardarCertificado', correo: p.correo,
        nombre_completo: item.nombre, categoria: item.categoria,
        institucion: item.institucion, evento: 'SucreBot 2026',
        fecha_evento: fechaEvento, tipo_certificado: tipo
      }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const result = await resp.json();
    if (!result.ok) throw new Error('Error al guardar en Sheets');

    if (btn) btn.textContent = '⏳ Subiendo PDF...';
    const driveUrl = await generarYSubirPDF(p, tipo, fechaEvento, result.codigo, item.nombre);
    showToast('✅ Diploma de ' + item.nombre + ' generado');

    cat.pendientes.splice(i, 1);
    cat.generados.unshift({ ...item, cert: { tipo_certificado: tipo, codigo_verificacion: result.codigo, archivoUrl: driveUrl } });
    renderTodo();
  } catch(e) {
    console.error(e);
    showToast('❌ Error con ' + item.nombre + ': ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '📄 Generar diploma'; }
  }
}

async function generarTodos() {
  const todosPendientes = Object.entries(categorias).flatMap(([cat, data]) =>
    data.pendientes.map((item, i) => ({ cat, i, item }))
  );
  if (!todosPendientes.length) { showToast('✅ No hay pendientes'); return; }
  if (!confirm(`¿Generar diplomas para ${todosPendientes.length} integrantes pendientes?\n\nEsto puede tomar varios minutos.`)) return;

  generandoEnMasa = true;
  document.getElementById('btn-generar-todos').disabled = true;
  document.getElementById('progreso-wrap').classList.add('visible');

  const total = todosPendientes.length;
  let completados = 0, errores = 0;

  for (let idx = 0; idx < todosPendientes.length; idx++) {
    const { cat: catNombre, item } = todosPendientes[idx];
    const p = participantesAprobados[item.idx];
    const tipo = 'participacion';
    const fechaEvento = document.getElementById('fecha-evento').value;

    document.getElementById('progreso-bar').style.width = Math.round((idx/total)*100) + '%';
    document.getElementById('progreso-label').textContent = 'Generando: ' + item.nombre;
    document.getElementById('progreso-texto').textContent = idx + ' / ' + total;

    try {
      const resp = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'guardarCertificado', correo: p.correo,
          nombre_completo: item.nombre, categoria: item.categoria,
          institucion: item.institucion, evento: 'SucreBot 2026',
          fecha_evento: fechaEvento, tipo_certificado: tipo
        }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      const result = await resp.json();
      if (!result.ok) throw new Error('Error Sheets');
      const driveUrl = await generarYSubirPDF(p, tipo, fechaEvento, result.codigo, item.nombre);
      categorias[catNombre].generados.unshift({ ...item, cert: { tipo_certificado: tipo, codigo_verificacion: result.codigo, archivoUrl: driveUrl } });
      completados++;
    } catch(e) {
      console.error(e); errores++;
    }
  }

  Object.values(categorias).forEach(c => { c.pendientes = []; });

  document.getElementById('progreso-bar').style.width = '100%';
  document.getElementById('progreso-label').textContent = '¡Completado!';
  document.getElementById('progreso-texto').textContent = completados + ' generados' + (errores ? ' · ' + errores + ' errores' : '');
  generandoEnMasa = false;
  renderTodo();
  showToast(`✅ ${completados} diplomas generados${errores ? ' · ⚠️ ' + errores + ' errores' : ''}`);
  setTimeout(() => document.getElementById('progreso-wrap').classList.remove('visible'), 4000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}
</script>
