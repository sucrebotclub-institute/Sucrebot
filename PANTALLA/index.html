<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma · SucreBot 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <script src="../shared/js/config.js"></script>
  <style>
    body { background: #f0f4fa !important; padding-top: 0 !important; }
    main { padding-top: 174px; min-height: 100vh; background: #f0f4fa; }

    /* ── Preview card ── */
    .cronograma-preview {
      background: white; border-radius: 16px; padding: 32px;
      box-shadow: 0 4px 24px rgba(26,92,168,0.10); margin-bottom: 24px;
    }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
    }
    .preview-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #1a5ca8; }
    .preview-sub   { font-size: 13px; color: #666; margin-top: 2px; }
    .btn-fullscreen {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #1a5ca8, #2176d2);
      color: white; border: none; border-radius: 10px; padding: 14px 28px;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer; box-shadow: 0 4px 16px rgba(26,92,168,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-fullscreen:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(26,92,168,0.45); }
    .btn-fullscreen svg { width: 20px; height: 20px; }
    .schedule-preview-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 640px) { .schedule-preview-list { grid-template-columns: 1fr; } }
    .preview-slot {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 8px; background: #f8faff;
      border-left: 3px solid #1a5ca8;
    }
    .preview-slot.cat-apertura    { border-color: #f5c518; }
    .preview-slot.cat-competencia { border-color: #1a5ca8; }
    .preview-slot.cat-tecnico     { border-color: #7e22ce; }
    .preview-slot.cat-descanso    { border-color: #15803d; }
    .preview-slot.cat-clausura    { border-color: #c2410c; }
    .preview-slot.cat-premiacion  { border-color: #f5c518; }
    .preview-time   { font-family:'DM Mono',monospace; font-size:13px; color:#1a5ca8; font-weight:500; min-width:44px; flex-shrink:0; }
    .preview-name   { font-size:13px; font-weight:600; color:#1a2a4a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .preview-detail { font-size:11px; color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ══════════════════════════════════════
       FULLSCREEN OVERLAY — SOLO BLANCO
    ══════════════════════════════════════ */
    #fsOverlay {
      display: none;
      position: fixed; inset: 0; z-index: 99999;
      background: #ffffff;
      font-family: 'Exo 2', sans-serif;
      color: #0e1e3a;
      overflow: hidden;
    }
    #fsOverlay.active { display: flex; flex-direction: column; }

    /* ── header ── */
    .fs-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 52px 18px;
      border-bottom: 2px solid #1a5ca8;
      flex-shrink: 0;
      background: #ffffff;
    }
    .fs-header-left { display: flex; align-items: center; gap: 16px; }
    .fs-logo {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #1a5ca8, #2176d2);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: white;
      flex-shrink: 0;
    }
    .fs-event-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(24px,3vw,40px); letter-spacing: 3px; line-height: 1;
      color: #0e1e3a;
    }
    .fs-event-sub {
      font-size: clamp(9px,1vw,13px); letter-spacing: 2px; text-transform: uppercase;
      margin-top: 2px; font-weight: 300; color: #666;
    }
    .fs-header-right { display: flex; align-items: center; gap: 20px; }
    .fs-date-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px,2.5vw,36px); letter-spacing: 3px; line-height: 1;
      color: #1a5ca8;
    }
    .fs-date-place {
      font-size: clamp(9px,0.9vw,12px); letter-spacing: 2px; text-transform: uppercase;
      margin-top: 3px; text-align:right; color: #666;
    }
    .btn-exit-fs {
      background: white; border: 1px solid #1a5ca8;
      color: #1a5ca8; border-radius: 8px; padding: 8px 16px;
      font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1.5px;
      cursor: pointer; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-exit-fs:hover { background: #f0f4fa; }
    .btn-exit-fs svg { width: 16px; height: 16px; }

    /* ── body ── */
    .fs-body {
      flex: 1; overflow: hidden; padding: 20px 52px 12px;
      display: flex; flex-direction: column;
      background: #ffffff;
    }
    .fs-section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(11px,1.1vw,14px); letter-spacing: 4px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
      color: #1a5ca8;
    }
    .fs-section-label::after {
      content: ''; flex: 1; height: 1px;
      background: #1a5ca8; opacity: 0.2;
    }
    .fs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 28px; }

    /* slots */
    .fs-slot {
      display: flex; align-items: center; gap: 14px;
      padding: 11px 14px; border-radius: 8px;
      background: #f8faff;
      border: 1px solid #e4eaf5;
      border-left: 3px solid #1a5ca8;
    }
    .fs-slot.cat-apertura    { border-left-color: #d4a800; }
    .fs-slot.cat-competencia { border-left-color: #1a5ca8; }
    .fs-slot.cat-tecnico     { border-left-color: #7e22ce; }
    .fs-slot.cat-descanso    { border-left-color: #15803d; }
    .fs-slot.cat-clausura    { border-left-color: #c2410c; }
    .fs-slot.cat-premiacion  { border-left-color: #d4a800; }

    .fs-slot.active {
      background: #dbeafe;
      border-color: #93c5fd;
      border-left-color: #1a5ca8;
    }
    .fs-slot.past { opacity: 0.38; }

    .fs-slot-time {
      font-family: 'DM Mono', monospace;
      font-size: clamp(12px,1.3vw,17px); font-weight: 500;
      min-width: 52px; flex-shrink: 0; color: #1a5ca8;
    }
    .fs-slot-body { flex: 1; min-width: 0; }
    .fs-slot-name {
      font-size: clamp(12px,1.35vw,17px); font-weight: 600; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0e1e3a;
    }
    .fs-slot-detail {
      font-size: clamp(9px,0.9vw,12px); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #666;
    }
    .fs-slot-badge {
      font-size: clamp(8px,0.8vw,10px); font-family: 'DM Mono', monospace;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .fs-slot.cat-apertura    .fs-slot-badge { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
    .fs-slot.cat-competencia .fs-slot-badge { background:#dbeafe; color:#1a5ca8; border:1px solid #bfdbfe; }
    .fs-slot.cat-tecnico     .fs-slot-badge { background:#f3e8ff; color:#7e22ce; border:1px solid #e9d5ff; }
    .fs-slot.cat-descanso    .fs-slot-badge { background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; }
    .fs-slot.cat-clausura    .fs-slot-badge { background:#ffedd5; color:#c2410c; border:1px solid #fdba74; }
    .fs-slot.cat-premiacion  .fs-slot-badge { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }

    /* ── footer ── */
    .fs-footer {
      padding: 10px 52px; display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid #e4eaf5; flex-shrink: 0; background: #ffffff;
    }
    .fs-footer-inst { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #999; }
    .fs-live { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 1px; color: #666; }
    .fs-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; animation: fsPulse 1.8s ease infinite; }
    .fs-clock { font-family: 'DM Mono', monospace; font-size: clamp(14px,1.5vw,20px); letter-spacing: 2px; color: #0e1e3a; }

    @keyframes fsPulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.7); }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper" style="max-width:1200px;margin:0 auto;padding:0 20px 60px">
    <div class="cronograma-preview">
      <div class="preview-header">
        <div>
          <div class="preview-title">CRONOGRAMA · 16 DE JULIO 2026</div>
          <div class="preview-sub">Programa oficial del evento · Club de Robótica Sucre</div>
        </div>
        <button class="btn-fullscreen" onclick="abrirFS()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          PANTALLA COMPLETA
        </button>
      </div>
      <div class="schedule-preview-list" id="previewList"></div>
    </div>
  </div>
</main>

<div data-include="../shared/components/footer.html"></div>

<!-- ══ FULLSCREEN OVERLAY ══ -->
<div id="fsOverlay">
  <div class="fs-header">
    <div class="fs-header-left">
      <div class="fs-logo">SB</div>
      <div>
        <div class="fs-event-title">SucreBot 2026</div>
        <div class="fs-event-sub">Club de Robótica · Instituto Superior Universitario Sucre</div>
      </div>
    </div>
    <div class="fs-header-right">
      <div>
        <div class="fs-date-main">16 · VII · 2026</div>
        <div class="fs-date-place">Quito, Ecuador</div>
      </div>
      <button class="btn-exit-fs" onclick="cerrarFS()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
        </svg>
        SALIR
      </button>
    </div>
  </div>

  <div class="fs-body">
    <div class="fs-section-label">▸ PROGRAMA DEL EVENTO</div>
    <div class="fs-grid" id="fsGrid"></div>
  </div>

  <div class="fs-footer">
    <div class="fs-footer-inst">sucrebotclub-institute.github.io</div>
    <div class="fs-live"><div class="fs-dot"></div> EN VIVO</div>
    <div class="fs-clock" id="fsClock">00:00:00</div>
  </div>
</div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>
<script>
  const SCHEDULE = [
    { time:'08:00', name:'Acreditación y registro',      detail:'Recepción de participantes · Entrega de kits',        cat:'apertura',    badge:'Apertura'     },
    { time:'09:00', name:'Ceremonia de apertura',         detail:'Bienvenida institucional · Presentación del evento',  cat:'apertura',    badge:'Apertura'     },
    { time:'09:30', name:'Insectos',                      detail:'Arena principal · Categoría Amateur',                 cat:'competencia', badge:'Competencia'  },
    { time:'09:30', name:'Seguidor de Línea (Amateur)',   detail:'Pista ST · Categoría Amateur',                       cat:'competencia', badge:'Competencia'  },
    { time:'10:30', name:'Trepador Amateur',              detail:'Estructura de trepada · Arena 2',                    cat:'competencia', badge:'Competencia'  },
    { time:'10:30', name:'Seguidor de Línea (Pro)',       detail:'Pista ST · Categoría Pro',                           cat:'competencia', badge:'Competencia'  },
    { time:'11:30', name:'Receso',                        detail:'Refrigerio · 30 minutos',                            cat:'descanso',    badge:'Descanso'     },
    { time:'12:00', name:'Minisumo Autónomo',             detail:'Arena Minisumo · Fase de grupos',                    cat:'competencia', badge:'Competencia'  },
    { time:'12:00', name:'Minisumo RC',                   detail:'Arena Minisumo · Fase de grupos',                    cat:'competencia', badge:'Competencia'  },
    { time:'13:00', name:'Revisión técnica ESP32',        detail:'Laboratorio · Verificación de hardware',             cat:'tecnico',     badge:'Técnico'      },
    { time:'13:30', name:'Almuerzo',                      detail:'Pausa · 1 hora',                                     cat:'descanso',    badge:'Descanso'     },
    { time:'14:30', name:'Bailarín',                      detail:'Escenario principal · Panel de calificación',        cat:'competencia', badge:'Competencia'  },
    { time:'14:30', name:'Impacto Tecnológico',           detail:'Sala de exposiciones · Presentaciones',              cat:'competencia', badge:'Competencia'  },
    { time:'15:30', name:'Robot Soccer',                  detail:'Cancha principal · Fase eliminatoria',               cat:'competencia', badge:'Competencia'  },
    { time:'15:30', name:'Cubo Rubik',                    detail:'Mesa de cronometraje · Rondas clasificatorias',      cat:'competencia', badge:'Competencia'  },
    { time:'16:30', name:'Lego Kids',                     detail:'Área Kids · Categoría infantil',                     cat:'competencia', badge:'Competencia'  },
    { time:'16:30', name:'Trepador Pro',                  detail:'Estructura de trepada · Categoría Pro',              cat:'competencia', badge:'Competencia'  },
    { time:'17:30', name:'Batalla de Robots',             detail:'Arena principal · Eliminación directa',              cat:'competencia', badge:'Competencia'  },
    { time:'18:00', name:'Semifinales y Finales',         detail:'Todas las categorías · Rondas finales',              cat:'clausura',    badge:'Final'        },
    { time:'19:00', name:'Ceremonia de premiación',       detail:'Auditorio · Entrega de trofeos y diplomas',          cat:'premiacion',  badge:'🏆 Premiación' },
  ];

  function renderPreview() {
    document.getElementById('previewList').innerHTML = SCHEDULE.map(s => `
      <div class="preview-slot cat-${s.cat}">
        <div class="preview-time">${s.time}</div>
        <div><div class="preview-name">${s.name}</div><div class="preview-detail">${s.detail}</div></div>
      </div>`).join('');
  }

  function renderFS() {
    document.getElementById('fsGrid').innerHTML = SCHEDULE.map((s,i) => `
      <div class="fs-slot cat-${s.cat}" id="fss-${i}">
        <div class="fs-slot-time">${s.time}</div>
        <div class="fs-slot-body">
          <div class="fs-slot-name">${s.name}</div>
          <div class="fs-slot-detail">${s.detail}</div>
        </div>
        <div class="fs-slot-badge">${s.badge}</div>
      </div>`).join('');
    updateActive();
  }

  function toMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
  function updateActive() {
    const now = new Date(), cur = now.getHours()*60+now.getMinutes();
    SCHEDULE.forEach((s,i) => {
      const el = document.getElementById(`fss-${i}`); if (!el) return;
      const start = toMin(s.time);
      const next  = i+1 < SCHEDULE.length ? toMin(SCHEDULE[i+1].time) : start+60;
      el.classList.remove('active','past');
      if (cur>=start && cur<next) el.classList.add('active');
      else if (cur>=next)         el.classList.add('past');
    });
  }

  function tick() {
    const n=new Date(), t=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    const el=document.getElementById('fsClock'); if(el) el.textContent=t;
    updateActive();
  }

  function abrirFS() {
    const overlay=document.getElementById('fsOverlay');
    overlay.classList.add('active');
    renderFS();
    (document.documentElement.requestFullscreen?.() ||
     document.documentElement.webkitRequestFullscreen?.());
  }

  function cerrarFS() {
    document.getElementById('fsOverlay').classList.remove('active');
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement)
      document.getElementById('fsOverlay').classList.remove('active');
  });
  document.addEventListener('keydown', e => { if (e.key==='Escape') cerrarFS(); });

  renderPreview();
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
