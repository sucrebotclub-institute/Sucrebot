<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SucreBot — Pantalla en Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  <style>
    :root {
      --bg:       #05060e;
      --surface:  #0c0d1a;
      --surface2: #121428;
      --surface3: #181a35;
      --border:   rgba(255,255,255,0.06);
      --accent:   #1a5ca8;
      --accent-light: #2d7de0;
      --accent2:  #ff6b35;
      --green:    #00ff88;
      --green-dim:#00cc6a;
      --red:      #ff3b3b;
      --gold:     #FFD700;
      --silver:   #C0C0C0;
      --bronze:   #CD7F32;
      --text:     #eaeaf5;
      --muted:    #5a5a78;
      --font-display: 'Orbitron', 'Exo 2', sans-serif;
      --font-mono:    'Exo 2', sans-serif;
      --font-body:    'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    body { overflow-y: auto; }

    /* ── Animated grid background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(26,92,168,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,92,168,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top glow ── */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 1200px; height: 500px;
      background: radial-gradient(ellipse, rgba(26,92,168,0.1) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── PANTALLA WRAPPER ── */
    .pantalla-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    /* ── TOOLBAR ── */
    .pantalla-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 48px;
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, rgba(5,6,14,0.9) 0%, rgba(5,6,14,0.5) 100%);
      border-bottom: 1px solid rgba(26,92,168,0.1);
    }

    .btn-fullscreen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--accent-light);
      background: rgba(26,92,168,0.08);
      border: 1px solid rgba(26,92,168,0.2);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
    }
    .btn-fullscreen:hover {
      background: rgba(26,92,168,0.18);
      border-color: var(--accent-light);
      box-shadow: 0 0 20px rgba(26,92,168,0.15), inset 0 0 20px rgba(26,92,168,0.05);
    }
    .btn-fullscreen svg {
      width: 14px; height: 14px;
      flex-shrink: 0;
    }

    /* ── ESC HINT ── */
    .esc-hint {
      position: fixed;
      top: 18px; right: 18px;
      font-family: var(--font-display);
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--muted);
      background: rgba(12,13,26,0.95);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .esc-hint.show { opacity: 1; }

    /* ── SCREEN ── */
    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 32px 48px 24px;
      min-height: calc(100vh - 200px);
    }

    /* ── FULLSCREEN MODE ── */
    body.pantalla-fullscreen .sticky-header,
    body.pantalla-fullscreen #shared-footer,
    body.pantalla-fullscreen .pantalla-bar {
      display: none !important;
    }
    body.pantalla-fullscreen .screen {
      min-height: 100vh;
      padding-top: 32px;
    }
    body.pantalla-fullscreen { overflow: hidden; }
    body.pantalla-fullscreen .pantalla-wrapper { padding-top: 0; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(26,92,168,0.12);
      position: relative;
      flex-shrink: 0;
    }

    /* Accent line under header */
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-light), transparent);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header-left img {
      width: 52px;
      filter: drop-shadow(0 0 16px rgba(26,92,168,0.5));
    }
    .header-titles {}
    .header-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
    }
    .header-title span {
      color: var(--accent-light);
    }
    .header-sub {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.18em;
      margin-top: 6px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* ── LIVE BADGE ── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--green);
      background: rgba(0,255,136,0.06);
      border: 1px solid rgba(0,255,136,0.2);
      padding: 8px 16px;
      border-radius: 6px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,136,0.6);
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    .ronda-info {
      text-align: right;
    }
    .ronda-label {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
    }
    .cat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent2);
      letter-spacing: 0.08em;
      margin-top: 5px;
    }

    /* ── CATEGORÍAS TABS ── */
    .cat-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      flex-shrink: 0;
      padding: 4px;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .cat-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 9px 16px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .cat-tab.tiene-datos {
      color: var(--text);
    }
    .cat-tab.tiene-datos::after {
      content: '';
      position: absolute;
      top: 6px; right: 6px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent-light);
    }
    .cat-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-light);
      box-shadow: 0 2px 12px rgba(26,92,168,0.3);
    }
    .cat-tab.active::after { display: none; }
    .cat-tab:hover:not(.active) {
      background: var(--surface2);
      border-color: rgba(26,92,168,0.15);
      color: var(--text);
    }

    /* ── TABLA ── */
    .tabla-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: var(--surface2);
    }
    thead th {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      padding: 14px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(26,92,168,0.1);
      text-transform: uppercase;
    }
    thead th:first-child { border-radius: 12px 0 0 0; }
    thead th:last-child  { border-radius: 0 12px 0 0; }
    thead th.c { text-align: center; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(26,92,168,0.04); }

    /* Podium rows */
    tr.pos-1 { background: rgba(255,215,0,0.04); }
    tr.pos-1:hover { background: rgba(255,215,0,0.07); }
    tr.pos-2 { background: rgba(192,192,192,0.03); }
    tr.pos-3 { background: rgba(205,127,50,0.03); }

    td {
      padding: 14px 20px;
      vertical-align: middle;
    }

    /* Position column */
    .td-pos { width: 72px; text-align: center; }
    .pos-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px; height: 42px;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .pc-1 {
      background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.08));
      color: var(--gold);
      border: 1.5px solid rgba(255,215,0,0.4);
      box-shadow: 0 0 20px rgba(255,215,0,0.15);
    }
    .pc-2 {
      background: linear-gradient(135deg, rgba(192,192,192,0.15), rgba(192,192,192,0.06));
      color: var(--silver);
      border: 1.5px solid rgba(192,192,192,0.3);
    }
    .pc-3 {
      background: linear-gradient(135deg, rgba(205,127,50,0.15), rgba(205,127,50,0.06));
      color: var(--bronze);
      border: 1.5px solid rgba(205,127,50,0.3);
    }
    .pc-n {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* Robot column */
    .td-robot { min-width: 200px; }
    .robot-name {
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }
    tr.pos-1 .robot-name {
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255,215,0,0.15);
    }
    .robot-inst {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 3px;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    /* Best time column */
    .td-mejor { text-align: center; min-width: 150px; }
    .tiempo-valor {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--green);
    }
    tr.pos-1 .tiempo-valor {
      font-size: 2rem;
      color: var(--green);
      text-shadow: 0 0 24px rgba(0,255,136,0.4);
    }

    /* Attempts column */
    .td-intentos { min-width: 260px; }
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .chip {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .chip.mejor {
      background: rgba(0,255,136,0.1);
      border-color: rgba(0,255,136,0.25);
      color: var(--green);
    }

    /* ── FOOTER ── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid rgba(26,92,168,0.08);
      flex-shrink: 0;
    }
    .footer-left {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .footer-hora {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-light);
      letter-spacing: 0.12em;
    }

    /* ── LIVE CRONO OVERLAY ── */
    .live-crono {
      position: fixed;
      bottom: 80px; right: 48px;
      background: rgba(12,13,26,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 12px;
      padding: 18px 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 30px rgba(0,255,136,0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 100;
    }
    .live-crono.show {
      opacity: 1;
      transform: translateY(0);
    }
    .live-crono-label {
      font-family: var(--font-display);
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .live-crono-robot {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-light);
      font-family: var(--font-mono);
    }
    .live-crono-tiempo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.06em;
      margin-top: 6px;
      text-shadow: 0 0 20px rgba(0,255,136,0.35);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 320px;
      gap: 20px;
    }
    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .empty-text {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    /* ── Loader animation for empty state ── */
    .loader-bar {
      width: 120px;
      height: 3px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }
    .loader-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      animation: loader-slide 1.5s ease-in-out infinite;
    }
    @keyframes loader-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ── Row entrance animation ── */
    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    tbody tr {
      animation: fadeInRow 0.3s ease-out backwards;
    }
    tbody tr:nth-child(1) { animation-delay: 0.05s; }
    tbody tr:nth-child(2) { animation-delay: 0.10s; }
    tbody tr:nth-child(3) { animation-delay: 0.15s; }
    tbody tr:nth-child(4) { animation-delay: 0.20s; }
    tbody tr:nth-child(5) { animation-delay: 0.25s; }
    tbody tr:nth-child(6) { animation-delay: 0.30s; }
    tbody tr:nth-child(7) { animation-delay: 0.35s; }
    tbody tr:nth-child(8) { animation-delay: 0.40s; }

    /* ── MOBILE ADJUSTMENTS ── */
    @media (max-width: 768px) {
      .pantalla-wrapper { padding-top: 190px; }
      .pantalla-bar { padding: 8px 20px; }
      .screen { padding: 20px 16px; }

      .header {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
      .header::after { left: 50%; transform: translateX(-50%); }
      .header-left {
        flex-direction: column;
        gap: 12px;
      }
      .header-left img { width: 44px; }
      .header-title { font-size: 1.4rem; }
      .header-sub { font-size: 0.6rem; }
      .header-right {
        justify-content: center;
        gap: 16px;
      }
      .ronda-info { text-align: center; }
      .ronda-label { font-size: 1.1rem; }

      .cat-tabs {
        gap: 4px;
        padding: 3px;
      }
      .cat-tab {
        font-size: 0.58rem;
        padding: 7px 10px;
      }

      .tabla-wrap { overflow-x: auto; }
      table { min-width: 680px; }
      thead th { font-size: 0.52rem; padding: 10px 14px; }
      td { padding: 10px 14px; }

      .pos-circle { width: 36px; height: 36px; font-size: 1rem; border-radius: 8px; }
      .robot-name { font-size: 1rem; }
      .robot-inst { font-size: 0.62rem; }
      .tiempo-valor { font-size: 1.3rem; }
      tr.pos-1 .tiempo-valor { font-size: 1.5rem; }
      .chip { font-size: 0.6rem; padding: 3px 8px; }

      .footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
      .footer-left { font-size: 0.56rem; }
      .footer-hora { font-size: 0.62rem; }

      .live-crono {
        bottom: 60px; right: 16px;
        padding: 14px 18px;
      }
      .live-crono-tiempo { font-size: 1.4rem; }

      .btn-fullscreen {
        font-size: 0.55rem;
        padding: 8px 14px;
      }
      .btn-fullscreen svg { width: 12px; height: 12px; }
    }
  </style>
</head>
<body>

<div class="pantalla-wrapper">
  <!-- Componentes compartidos -->
  <div class="sticky-header">
    <div data-include="../shared/components/topbar.html"></div>
    <div data-include="../shared/components/header.html"></div>
    <div data-include="../shared/components/nav.html"></div>
  </div>

  <!-- Barra con botón de pantalla completa -->
  <div class="pantalla-bar" id="pantalla-bar">
    <button class="btn-fullscreen" onclick="entrarPantalla()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      PANTALLA COMPLETA
    </button>
  </div>

  <!-- Hint ESC -->
  <div class="esc-hint" id="esc-hint">ESC — SALIR DE PANTALLA COMPLETA</div>

  <div class="screen">
    <div class="header">
      <div class="header-left">
        <div class="header-titles">
          <div class="header-title">SUCRE<span>BOT</span></div>
          <div class="header-sub">TORNEO DE ROBÓTICA 2026 — RESULTADOS EN VIVO</div>
        </div>
      </div>
      <div class="header-right">
        <div class="live-badge"><span class="live-dot"></span>EN VIVO</div>
        <div class="ronda-info">
          <div class="ronda-label" id="tv-ronda">RONDA 1</div>
          <div class="cat-label" id="tv-cat">—</div>
        </div>
      </div>
    </div>

    <div class="cat-tabs" id="cat-tabs"></div>

    <div class="tabla-wrap" id="tv-tabla-wrap">
      <div class="empty-state">
        <div class="empty-icon">🏁</div>
        <div class="empty-text">CARGANDO RESULTADOS</div>
        <div class="loader-bar"></div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-left">INSTITUTO SUPERIOR UNIVERSITARIO SUCRE • CLUB DE ROBÓTICA</div>
      <div class="footer-hora" id="tv-hora">00:00:00</div>
    </div>
  </div>

  <!-- Live cronómetro -->
  <div class="live-crono" id="live-crono">
    <div class="live-crono-label">COMPITIENDO AHORA</div>
    <div class="live-crono-robot" id="lc-robot">—</div>
    <div class="live-crono-tiempo" id="lc-tiempo">00:00.00</div>
  </div>

  <!-- Footer compartido -->
  <div id="shared-footer" data-include="../shared/components/footer.html"></div>
</div>

<script src="../shared/js/auth.js"></script>
<script src="../shared/js/load-components.js"></script>
<script>
  // ── Pantalla completa ──
  function entrarPantalla() {
    document.body.classList.add('pantalla-fullscreen');
    const hint = document.getElementById('esc-hint');
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 3000);
  }

  function salirPantalla() {
    document.body.classList.remove('pantalla-fullscreen');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') salirPantalla();
  });

  // ── Lógica en vivo ──
  const GAS_URL = CONFIG.GAS_URL();

  // ✅ Mapeo de categorías a rutas (códigos cortos para GAS)
  const RUTAS = {
    // AMATEUR
    'Insectos': 'INS',
    'Trepador (Amateur)': 'TRP_A',
    'Seguidor de línea ST (Amateur)': 'SL_A',
    // PRO
    'Seguidor de línea ST (Pro)': 'SL_P',
    'Minisumo Autónomo': 'MS_A',
    'Minisumo RC': 'MS_RC',
    'Bailarín': 'BAI',
    'Batalla': 'BAT',
    'Trepador (Pro)': 'TRP_P',
    'Robot soccer': 'SOC',
    // EXTRA
    'Cubo Rubik': 'CR'
  };

  const RUTAS_NOMBRE = {
    // AMATEUR
    'Insectos': 'Insectos',
    'Trepador (Amateur)': 'Trepador (Amateur)',
    'Seguidor de línea ST (Amateur)': 'Seguidor ST (Amateur)',
    // PRO
    'Seguidor de línea ST (Pro)': 'Seguidor ST (Pro)',
    'Minisumo Autónomo': 'Minisumo Autónomo',
    'Minisumo RC': 'Minisumo RC',
    'Bailarín': 'Bailarín',
    'Batalla': 'Batalla',
    'Trepador (Pro)': 'Trepador (Pro)',
    'Robot soccer': 'Robot Soccer',
    // EXTRA
    'Cubo Rubik': 'Cubo Rubik'
  };

  function parseTime(t) {
    if (!t || t === '—') return Infinity;
    const p = t.split(':').map(Number);
    return p[0] * 60 + p[1] + p[2] / 100;
  }

  function hora() {
    return new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  setInterval(() => { document.getElementById('tv-hora').textContent = hora(); }, 1000);
  document.getElementById('tv-hora').textContent = hora();

  let todosEstados = {};
  let todosActivos = {};
  let categoriaActiva = null;
  let autoRotarTimer = null;
  let rutasConDatos = [];

  const TIEMPO_ROTACION = 10000;

  function iniciarAutoRotar() {
    if (autoRotarTimer) clearInterval(autoRotarTimer);
    autoRotarTimer = setInterval(() => {
      const activas = rutasConDatos;
      if (activas.length <= 1) return;
      const idx = activas.indexOf(categoriaActiva);
      const siguiente = activas[(idx + 1) % activas.length];
      seleccionarCategoria(siguiente);
    }, TIEMPO_ROTACION);
  }

  function seleccionarCategoria(ruta) {
    categoriaActiva = ruta;
    document.querySelectorAll('.cat-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.ruta === ruta);
    });
    const datos = todosEstados[ruta];
    if (datos && datos.estado) {
      renderizarTabla(datos.estado, ruta);
    } else {
      mostrarVacio();
    }
    actualizarLiveCrono(ruta);
  }

  function actualizarLiveCrono(ruta) {
    const lc = document.getElementById('live-crono');
    const activo = todosActivos[ruta];
    if (!activo || !activo.raw) { lc.classList.remove('show'); return; }
    try {
      const p = JSON.parse(activo.raw);
      if (!p || !p.id) { lc.classList.remove('show'); return; }
      document.getElementById('lc-robot').textContent = p.robot || '—';
      lc.classList.add('show');
    } catch(e) { lc.classList.remove('show'); }
  }

  function renderTabs() {
    const container = document.getElementById('cat-tabs');
    const rutas = Object.keys(RUTAS_NOMBRE);
    container.innerHTML = rutas.map(ruta => {
      const tieneDatos = todosEstados[ruta] &&
        todosEstados[ruta].estado &&
        todosEstados[ruta].estado.rondasData;
      const tieneParticipantes = tieneDatos && Object.values(todosEstados[ruta].estado.rondasData)
        .some(r => r.clasificados && r.clasificados.some(c => c.tiempo && c.tiempo !== '—'));
      return `<button class="cat-tab ${tieneParticipantes ? 'tiene-datos' : ''} ${categoriaActiva === ruta ? 'active' : ''}"
        data-ruta="${ruta}" onclick="seleccionarManual('${ruta}')">
        ${RUTAS_NOMBRE[ruta]}
      </button>`;
    }).join('');
    rutasConDatos = rutas.filter(ruta =>
      todosEstados[ruta] &&
      todosEstados[ruta].estado &&
      Object.values(todosEstados[ruta].estado.rondasData || {})
        .some(r => r.clasificados && r.clasificados.some(c => c.tiempo && c.tiempo !== '—'))
    );
  }

  function seleccionarManual(ruta) {
    if (autoRotarTimer) clearInterval(autoRotarTimer);
    seleccionarCategoria(ruta);
    setTimeout(iniciarAutoRotar, 20000);
  }

  function mostrarVacio() {
    document.getElementById('tv-tabla-wrap').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏁</div>
        <div class="empty-text">ESPERANDO RESULTADOS</div>
        <div class="loader-bar"></div>
      </div>`;
  }

  function renderizarTabla(estado, ruta) {
    if (!estado || !estado.rondasData) { mostrarVacio(); return; }

    const rondas = Object.values(estado.rondasData);
    const clasificados = rondas.flatMap(r => r.clasificados || [])
      .reduce((acc, c) => {
        if (!acc[c.id]) acc[c.id] = { ...c, intentos: [] };
        if (c.tiempo && c.tiempo !== '—') acc[c.id].intentos.push(c.tiempo);
        return acc;
      }, {});

    const lista = Object.values(clasificados)
      .map(c => ({
        ...c,
        mejor: c.intentos.length ? c.intentos.reduce((a, b) => parseTime(a) < parseTime(b) ? a : b) : '—'
      }))
      .filter(c => c.mejor !== '—')
      .sort((a, b) => parseTime(a.mejor) - parseTime(b.mejor));

    if (!lista.length) { mostrarVacio(); return; }

    document.getElementById('tv-ronda').textContent = `RONDA ${estado.rondaActual || 1}`;
    document.getElementById('tv-cat').textContent = RUTAS_NOMBRE[ruta] || ruta;

    const html = `
      <table>
        <thead>
          <tr>
            <th class="c">POS</th>
            <th>ROBOT</th>
            <th class="c">MEJOR TIEMPO</th>
            <th>INTENTOS</th>
          </tr>
        </thead>
        <tbody>
          ${lista.map((c, i) => `
            <tr class="pos-${i + 1}">
              <td class="td-pos">
                <div class="pos-circle pc-${i < 3 ? i + 1 : 'n'}">${i + 1}</div>
              </td>
              <td class="td-robot">
                <div class="robot-name">${c.robot || '—'}</div>
                <div class="robot-inst">${c.institucion || '—'}</div>
              </td>
              <td class="td-mejor">
                <div class="tiempo-valor">${c.mejor}</div>
              </td>
              <td class="td-intentos">
                <div class="chips">
                  ${c.intentos.map(t => `<span class="chip ${t === c.mejor ? 'mejor' : ''}">${t}</span>`).join('')}
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    document.getElementById('tv-tabla-wrap').innerHTML = html;
  }

  async function cargarDatos() {
    try {
      const categorias = Object.keys(RUTAS_NOMBRE);
      await Promise.all(categorias.map(async categoria => {
        const rutaCorta = RUTAS[categoria] || categoria; // usar código corto para GAS
        const qs = new URLSearchParams({ action: 'getEstado', ruta: rutaCorta }).toString();
        const r = await fetch(GAS_URL + '?' + qs, { redirect: 'follow' });
        const data = await r.json();
        todosEstados[categoria] = data; // guardar con nombre completo como key

        const qs2 = new URLSearchParams({ action: 'getActivo', ruta: rutaCorta }).toString();
        const r2 = await fetch(GAS_URL + '?' + qs2, { redirect: 'follow' });
        const data2 = await r2.json();
        todosActivos[categoria] = data2; // guardar con nombre completo como key
      }));

      renderTabs();

      if (!categoriaActiva) {
        const primera = rutasConDatos[0] || Object.keys(RUTAS_NOMBRE)[0];
        seleccionarCategoria(primera);
        iniciarAutoRotar();
      } else {
        seleccionarCategoria(categoriaActiva);
      }
    } catch (error) {
      console.error('Error al cargar datos:', error);
    }
  }

  cargarDatos();
  setInterval(cargarDatos, 5000);
</script>

</body>
</html>
