<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma · SucreBot 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:       #1a5ca8;
      --azul-dark:  #0e3a6e;
      --azul-deep:  #071e3d;
      --azul-glow:  #2176d2;
      --gold:       #f5c518;
      --gold-soft:  #ffd96a;
      --white:      #ffffff;
      --dim:        rgba(255,255,255,0.55);
      --line:       rgba(255,255,255,0.10);
      --card-bg:    rgba(255,255,255,0.04);
      --card-hover: rgba(255,255,255,0.08);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--azul-deep);
      color: var(--white);
      font-family: 'Exo 2', sans-serif;
    }

    /* ── Background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 50%, rgba(26,92,168,0.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 85% 20%, rgba(33,118,210,0.30) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 50% 100%, rgba(7,30,61,0.80) 0%, transparent 70%),
        linear-gradient(160deg, #071e3d 0%, #0d2f5c 50%, #071e3d 100%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* Diagonal accent line */
    .bg-accent {
      position: fixed; z-index: 0;
      top: -10%; left: -5%;
      width: 55%; height: 130%;
      background: linear-gradient(105deg, transparent 0%, rgba(26,92,168,0.12) 40%, transparent 70%);
      transform: skewX(-8deg);
      pointer-events: none;
    }

    /* ── Layout ── */
    .screen {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 64px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(7,30,61,0.6) 0%, transparent 100%);
      animation: fadeDown 0.8s ease both;
    }
    .header-left {
      display: flex; align-items: center; gap: 20px;
    }
    .logo-mark {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--azul), var(--azul-glow));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      color: white;
      box-shadow: 0 0 24px rgba(26,92,168,0.6);
      flex-shrink: 0;
    }
    .header-titles {}
    .event-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(26px, 3.2vw, 42px);
      letter-spacing: 3px;
      color: var(--white);
      line-height: 1;
    }
    .event-sub {
      font-size: clamp(10px, 1.1vw, 14px);
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
      font-weight: 300;
    }
    .header-right {
      text-align: right;
    }
    .event-date {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(22px, 2.8vw, 38px);
      letter-spacing: 3px;
      color: var(--gold);
      line-height: 1;
    }
    .event-place {
      font-size: clamp(10px, 1vw, 13px);
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 300;
    }
    .gold-bar {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-soft), var(--gold), transparent);
      opacity: 0.7;
    }

    /* ── Schedule ── */
    .schedule-wrap {
      overflow: hidden;
      padding: 32px 64px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(11px, 1.1vw, 15px);
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(245,197,24,0.3), transparent);
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 32px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.55s ease forwards;
      transition: background 0.3s;
    }
    .slot::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }
    .slot.cat-apertura::before  { background: var(--gold); }
    .slot.cat-competencia::before { background: #4ea8f5; }
    .slot.cat-tecnico::before   { background: #a855f7; }
    .slot.cat-descanso::before  { background: #22c55e; }
    .slot.cat-clausura::before  { background: #f97316; }
    .slot.cat-premiacion::before { background: var(--gold); box-shadow: 0 0 8px rgba(245,197,24,0.5); }

    .slot-time {
      font-family: 'DM Mono', monospace;
      font-size: clamp(13px, 1.4vw, 18px);
      font-weight: 500;
      color: var(--gold-soft);
      white-space: nowrap;
      min-width: 80px;
      flex-shrink: 0;
    }
    .slot-body { flex: 1; min-width: 0; }
    .slot-name {
      font-size: clamp(13px, 1.45vw, 19px);
      font-weight: 600;
      color: var(--white);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-detail {
      font-size: clamp(10px, 1vw, 13px);
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-badge {
      font-size: clamp(9px, 0.9vw, 11px);
      font-family: 'DM Mono', monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .slot.cat-apertura  .slot-badge { background: rgba(245,197,24,0.15); color: var(--gold); border: 1px solid rgba(245,197,24,0.3); }
    .slot.cat-competencia .slot-badge { background: rgba(78,168,245,0.15); color: #4ea8f5; border: 1px solid rgba(78,168,245,0.3); }
    .slot.cat-tecnico   .slot-badge { background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }
    .slot.cat-descanso  .slot-badge { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .slot.cat-clausura  .slot-badge { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }
    .slot.cat-premiacion .slot-badge { background: rgba(245,197,24,0.2); color: var(--gold); border: 1px solid rgba(245,197,24,0.4); }

    /* ACTIVE highlight */
    .slot.active {
      background: rgba(26,92,168,0.25);
      border-color: rgba(33,118,210,0.5);
      box-shadow: 0 0 20px rgba(26,92,168,0.3);
    }
    .slot.active .slot-name { color: #fff; }
    .slot.past { opacity: 0.4; }

    /* ── Footer ── */
    footer {
      padding: 14px 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(7,30,61,0.5) 0%, transparent 100%);
      animation: fadeUp 0.8s 0.5s ease both;
    }
    .footer-inst {
      font-size: clamp(10px, 1vw, 13px);
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .live-dot {
      display: flex; align-items: center; gap: 8px;
      font-size: clamp(10px, 1vw, 13px);
      color: var(--dim);
      font-family: 'DM Mono', monospace;
      letter-spacing: 1px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s ease infinite;
    }
    .clock-display {
      font-family: 'DM Mono', monospace;
      font-size: clamp(14px, 1.5vw, 20px);
      color: var(--white);
      letter-spacing: 2px;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="bg-grid"></div>
<div class="bg-accent"></div>

<div class="screen">

  <!-- HEADER -->
  <div>
    <header>
      <div class="header-left">
        <div class="logo-mark">SB</div>
        <div class="header-titles">
          <div class="event-title">SucreBot 2026</div>
          <div class="event-sub">Club de Robótica · Instituto Superior Universitario Sucre</div>
        </div>
      </div>
      <div class="header-right">
        <div class="event-date">16 · VII · 2026</div>
        <div class="event-place">Quito, Ecuador</div>
      </div>
    </header>
    <div class="gold-bar"></div>
  </div>

  <!-- SCHEDULE -->
  <div class="schedule-wrap">
    <div class="section-label" style="animation-delay:0.2s">▸ PROGRAMA DEL EVENTO</div>

    <div class="schedule-grid" id="scheduleGrid">
      <!-- JS rendered -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inst">sucrebotclub-institute.github.io</div>
    <div class="live-dot"><div class="dot"></div> EN VIVO</div>
    <div class="clock-display" id="clock">00:00:00</div>
  </footer>

</div>

<script>
  // ── Cronograma ─────────────────────────────────────────────────
  const SCHEDULE = [
    { time: '08:00', name: 'Acreditación y registro', detail: 'Recepción de participantes · Entrega de kits', cat: 'apertura',    badge: 'Apertura'     },
    { time: '09:00', name: 'Ceremonia de apertura',   detail: 'Bienvenida institucional · Presentación del evento', cat: 'apertura', badge: 'Apertura' },
    { time: '09:30', name: 'Insectos',                detail: 'Arena principal · Categoría Amateur',   cat: 'competencia', badge: 'Competencia'  },
    { time: '09:30', name: 'Seguidor de Línea (Amateur)', detail: 'Pista ST · Categoría Amateur',     cat: 'competencia', badge: 'Competencia'  },
    { time: '10:30', name: 'Trepador Amateur',        detail: 'Estructura de trepada · Arena 2',      cat: 'competencia', badge: 'Competencia'  },
    { time: '10:30', name: 'Seguidor de Línea (Pro)', detail: 'Pista ST · Categoría Pro',             cat: 'competencia', badge: 'Competencia'  },
    { time: '11:30', name: 'Receso',                  detail: 'Refrigerio · 30 minutos',              cat: 'descanso',    badge: 'Descanso'     },
    { time: '12:00', name: 'Minisumo Autónomo',       detail: 'Arena Minisumo · Fase de grupos',      cat: 'competencia', badge: 'Competencia'  },
    { time: '12:00', name: 'Minisumo RC',             detail: 'Arena Minisumo · Fase de grupos',      cat: 'competencia', badge: 'Competencia'  },
    { time: '13:00', name: 'Revisión técnica ESP32',  detail: 'Laboratorio · Verificación de hardware', cat: 'tecnico',   badge: 'Técnico'      },
    { time: '13:30', name: 'Almuerzo',                detail: 'Pausa · 1 hora',                       cat: 'descanso',    badge: 'Descanso'     },
    { time: '14:30', name: 'Bailarín',                detail: 'Escenario principal · Panel de calificación', cat: 'competencia', badge: 'Competencia' },
    { time: '14:30', name: 'Impacto Tecnológico',     detail: 'Sala de exposiciones · Presentaciones', cat: 'competencia', badge: 'Competencia'  },
    { time: '15:30', name: 'Robot Soccer',            detail: 'Cancha principal · Fase eliminatoria', cat: 'competencia', badge: 'Competencia'  },
    { time: '15:30', name: 'Cubo Rubik',              detail: 'Mesa de cronometraje · Rondas clasificatorias', cat: 'competencia', badge: 'Competencia' },
    { time: '16:30', name: 'Lego Kids',               detail: 'Área Kids · Categoría infantil',       cat: 'competencia', badge: 'Competencia'  },
    { time: '16:30', name: 'Trepador Pro',            detail: 'Estructura de trepada · Categoría Pro', cat: 'competencia', badge: 'Competencia'  },
    { time: '17:30', name: 'Batalla de Robots',       detail: 'Arena principal · Eliminación directa', cat: 'competencia', badge: 'Competencia'  },
    { time: '18:00', name: 'Semifinales y Finales',   detail: 'Todas las categorías · Rondas finales', cat: 'clausura',   badge: 'Final'        },
    { time: '19:00', name: 'Ceremonia de premiación', detail: 'Auditorio · Entrega de trofeos y diplomas', cat: 'premiacion', badge: '🏆 Premiación' },
  ];

  // ── Render ──────────────────────────────────────────────────────
  function render() {
    const grid = document.getElementById('scheduleGrid');
    grid.innerHTML = SCHEDULE.map((s, i) => `
      <div class="slot cat-${s.cat}" id="slot-${i}"
           style="animation-delay:${0.25 + i * 0.045}s">
        <div class="slot-time">${s.time}</div>
        <div class="slot-body">
          <div class="slot-name">${s.name}</div>
          <div class="slot-detail">${s.detail}</div>
        </div>
        <div class="slot-badge">${s.badge}</div>
      </div>
    `).join('');
  }

  // ── Clock + Active slot highlight ───────────────────────────────
  function toMinutes(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;

    const nowMin = now.getHours() * 60 + now.getMinutes();
    SCHEDULE.forEach((s, i) => {
      const el = document.getElementById(`slot-${i}`);
      if (!el) return;
      const start = toMinutes(s.time);
      const next  = i + 1 < SCHEDULE.length ? toMinutes(SCHEDULE[i + 1].time) : start + 60;
      el.classList.remove('active', 'past');
      if (nowMin >= start && nowMin < next) el.classList.add('active');
      else if (nowMin >= next)              el.classList.add('past');
    });
  }

  render();
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
