<!DOCTYPE html>
<html lang="es">
<head>   
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma · SucreBot 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <script src="../shared/js/config.js"></script>
  <style>
    body { background: #f0f4fa !important; padding-top: 0 !important; }
    main { padding-top: 174px; min-height: 100vh; background: #f0f4fa; }

    /* ── Preview card ── */
    .cronograma-preview {
      background: white; border-radius: 16px; padding: 32px;
      box-shadow: 0 4px 24px rgba(26,92,168,0.10); margin-bottom: 24px;
    }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
    }
    .preview-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #1a5ca8 !important; }
    .preview-sub   { font-size: 13px; color: #555 !important; margin-top: 2px; }
    .btn-fullscreen {
      display: inline-flex !important; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #1a5ca8, #2176d2) !important;
      color: white !important; border: none; border-radius: 10px; padding: 14px 28px;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer; box-shadow: 0 4px 16px rgba(26,92,168,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-fullscreen svg { width: 20px; height: 20px; }
    .schedule-preview-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 640px) { .schedule-preview-list { grid-template-columns: 1fr; } }
    .preview-slot {
      display: flex !important; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 8px; background: #f0f4fb !important;
      border-left: 3px solid #1a5ca8; max-width: none !important;
    }
    .preview-slot.cat-apertura    { border-left-color: #b45309 !important; }
    .preview-slot.cat-competencia { border-left-color: #1a5ca8 !important; }
    .preview-slot.cat-tecnico     { border-left-color: #6b21a8 !important; }
    .preview-slot.cat-descanso    { border-left-color: #166534 !important; }
    .preview-slot.cat-clausura    { border-left-color: #9a3412 !important; }
    .preview-slot.cat-premiacion  { border-left-color: #b45309 !important; }
    .preview-time   { font-family:'DM Mono',monospace; font-size:13px; color:#1a5ca8 !important; font-weight:700; min-width:44px; flex-shrink:0; }
    .preview-name   { font-size:13px; font-weight:700; color:#111827 !important; }
    .preview-detail { font-size:11px; color:#4b5563 !important; }

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<style>
  #fsOverlay {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:999999; overflow:hidden; background:#f0f4fa;
    font-family:'Exo 2',sans-serif;
  }
  #fsOverlay.active { display:flex; flex-direction:column; }
  #fsOverlay * { box-sizing:border-box; }
  .fs-hdr {
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:10px 40px; border-bottom:2px solid #1a5ca8; background:#fff;
  }
  .fs-brand { display:flex; align-items:center; gap:12px; }
  .fs-center { text-align:center; }
  .fs-right  { display:flex; align-items:center; gap:14px; }
  .fs-clock-big {
    font-family:'Orbitron',monospace; font-size:clamp(16px,1.8vw,26px);
    font-weight:700; letter-spacing:2px; color:#0e1e3a;
    background:rgba(26,92,168,0.08); border:2px solid #1a5ca8;
    padding:6px 16px; border-radius:8px;
  }
  .fs-body {
    flex:1; min-height:0; overflow:hidden;
    padding:8px 40px 6px; display:flex; flex-direction:column;
    background:#f0f4fa;
  }
  .fs-col-hdr {
    font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px;
    text-transform:uppercase; color:#fff; background:#1a5ca8;
    padding:6px 10px; border-radius:6px; text-align:center; margin-bottom:5px;
  }
  .fs-ev { border-radius:6px; overflow:hidden; }
  .fs-span {
    border-radius:6px; margin-bottom:6px; background:#1a5ca8;
    border:2px solid #000; display:flex; flex-direction:column;
    padding:6px 16px;
  }
  .fs-span-row { display:flex; align-items:center; gap:16px; }
  .fs-span-time { font-family:'Orbitron',monospace; font-size:14px; font-weight:700; color:#fff; min-width:48px; }
  .fs-span-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; color:#fff; flex:1; }
  .fs-ftr {
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:5px 40px; border-top:1px solid #d1d9ed; background:#fff;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6b7280;
  }
  .now-badge { display:inline-flex; align-items:center; gap:4px; font-size:8px; font-weight:700; letter-spacing:2px; color:#fff; margin-bottom:3px; }
  .now-dot   { width:5px; height:5px; border-radius:50%; background:#fff; animation:dp 1.4s ease infinite; }
  @keyframes dp { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>

<div id="fsOverlay">
  <div class="fs-hdr">
    <div class="fs-brand">
      <img src="https://raw.githubusercontent.com/sucrebotclub-institute/Sucrebot/main/shared/images/club-robotica-fondo-blanco.png" style="height:40px;width:auto;object-fit:contain;">
    </div>
    <div class="fs-center">
      <div style="font-family:'Orbitron',monospace;font-size:clamp(10px,1.1vw,14px);letter-spacing:2px;text-transform:uppercase;color:#1a5ca8;font-weight:700;">4ta Edici&#243;n del Concurso Nacional de Rob&#243;tica SucreBot</div>
      <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#1a5ca8;margin-top:3px;">Ciudad Mitad del Mundo &middot; Quito, Ecuador</div>
    </div>
    <div class="fs-right">
      <img src="https://raw.githubusercontent.com/sucrebotclub-institute/Sucrebot/main/shared/images/logosucre.png" style="height:40px;width:auto;object-fit:contain;">
      <div style="width:1px;height:32px;background:rgba(26,92,168,0.25);"></div>
      <div class="fs-clock-big" id="fsClock">00:00:00</div>
    </div>
  </div>
  <div class="fs-body">
    <div id="fsGrid" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
  </div>
  <div class="fs-ftr">
    <span>sucrebotclub-institute.github.io</span>
    <span style="font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#1a5ca8;letter-spacing:2px;" id="fsClockFtr">00:00:00</span>
    <span id="fsDate"></span>
  </div>
</div>

<script>
  const COLS = ['Auditorio','Escenario 1','Escenario 2','Escenario 3','Escenario 4'];
  const COLOR_MAP = {"Seguidor de Línea Amateur": "#7B2D8B", "Seguidor de Línea Pro": "#7B2D8B", "Minisumo Autónomo": "#9B59B6", "MiniSumo RC Pro": "#F5A623", "Insectos": "#2980B9", "Lego Kids": "#2980B9", "Trepador Pro": "#16A085", "Trepador Amateur": "#1ABC9C", "Bailaín": "#27AE60", "Batalla 3Lb": "#E91E8C", "Robot Soccer – Fase de Grupos": "#E67E22", "Robot Soccer – Finales": "#E67E22", "Cubo Rubik": "#C0C0C0", "Impacto Tecnológico": "#D4AF37"};
  function getEvColor(n) { return COLOR_MAP[n] || '#1a5ca8'; }

  const EVENTS = [
    { start:'08:30', end:'09:00', col:null, name:'Inauguración',                  tipo:'special' },
    { start:'09:00', end:'13:00', col:0,    name:'Impacto Tecnológico',            tipo:'comp'    },
    { start:'09:00', end:'11:00', col:1,    name:'Insectos',                            tipo:'comp'    },
    { start:'09:00', end:'11:00', col:2,    name:'Seguidor de Línea Amateur',       tipo:'comp'    },
    { start:'09:00', end:'11:00', col:3,    name:'Cubo Rubik',                          tipo:'comp'    },
    { start:'09:00', end:'11:00', col:4,    name:'Trepador Pro',                        tipo:'comp'    },
    { start:'11:00', end:'13:00', col:1,    name:'Robot Soccer – Fase de Grupos',   tipo:'comp'    },
    { start:'11:00', end:'13:00', col:2,    name:'Seguidor de Línea Pro',           tipo:'comp'    },
    { start:'11:00', end:'13:00', col:3,    name:'MiniSumo RC Pro',                     tipo:'comp'    },
    { start:'11:00', end:'13:00', col:4,    name:'Bailaín',                         tipo:'comp'    },
    { start:'13:00', end:'14:00', col:null, name:'Receso',                              tipo:'break'   },
    { start:'14:00', end:'16:00', col:0,    name:'Lego Kids',                           tipo:'comp'    },
    { start:'14:00', end:'16:00', col:1,    name:'Robot Soccer – Finales',          tipo:'comp'    },
    { start:'14:00', end:'16:00', col:2,    name:'Batalla 3Lb',                         tipo:'comp'    },
    { start:'14:00', end:'16:00', col:3,    name:'Minisumo Autónomo',               tipo:'comp'    },
    { start:'14:00', end:'16:00', col:4,    name:'Trepador Amateur',                    tipo:'comp'    },
    { start:'16:00', end:'17:00', col:null, name:'Premiación',                      tipo:'award'   },
  ];

  function toMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
  function getState(ev) {
    const now=new Date(), cur=now.getHours()*60+now.getMinutes();
    const s=toMin(ev.start), e=toMin(ev.end);
    if(cur>=s&&cur<e) return 'now'; if(cur>=e) return 'done'; return 'upcoming';
  }

  function buildGrid(targetId, compact) {
    const grid=document.getElementById(targetId); if(!grid) return;
    const bandKeys=[...new Set(EVENTS.filter(e=>e.col!==null).map(e=>e.start))].sort();
    const spanEvs=EVENTS.filter(e=>e.col===null), colEvs=EVENTS.filter(e=>e.col!==null);

    function rowSpan(ev) {
      const s=toMin(ev.start),en=toMin(ev.end);
      let sp=0; bandKeys.forEach(k=>{ if(toMin(k)>=s&&toMin(k)<en) sp++; });
      return Math.max(1,sp);
    }
    const cells={};
    colEvs.forEach(ev=>{ const r=bandKeys.indexOf(ev.start); if(!cells[r])cells[r]={}; cells[r][ev.col]={ev,span:rowSpan(ev)}; });

    const allS=[...new Set([...bandKeys,...spanEvs.map(e=>e.start)])].sort();
    let sections=[],cur=[];
    allS.forEach(t=>{
      const sp=spanEvs.find(e=>e.start===t);
      if(sp){ if(cur.length){sections.push({type:'cols',rows:cur});cur=[];} sections.push({type:'span',ev:sp}); }
      else cur.push(t);
    });
    if(cur.length) sections.push({type:'cols',rows:cur});

    const gap=compact?'5px':'7px';
    const evPad=compact?'8px 10px':'10px 12px';
    const evFS=compact?'15px':'17px';
    const rowH=compact?`calc((100vh - 260px) / 4)`:`130px`;

    // Col headers
    let html=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:${gap};margin-bottom:${gap};flex-shrink:0;">${COLS.map(c=>`<div class="fs-col-hdr">${c}</div>`).join('')}</div>`;

    // Content wrapper fills remaining space
    html+=`<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:${gap};">`;

    sections.forEach(sec=>{
      if(sec.type==='span'){
        const ev=sec.ev, st=getState(ev);
        const isNow=st==='now'?'outline:2px solid rgba(255,255,255,0.6);':'';
        const sponsorRow = ev.tipo==='award' ? `<div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex:1;"><div style="font-family:Orbitron,monospace;font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.5);text-transform:uppercase;white-space:nowrap;flex-shrink:0;">AUSPICIANTES</div><div style="display:flex;gap:5px;flex:1;"><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 1</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 2</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 3</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 4</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 5</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 6</div><div style="flex:1;min-height:36px;border-radius:5px;border:1px dashed rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.45);">Logo 7</div></div></div>` : '';
        html+=`<div class="fs-span" style="flex-shrink:0;${isNow}">
          <div class="fs-span-row">
            <div class="fs-span-time">${ev.start}</div>
            <div class="fs-span-name">${ev.name}</div>
            ${ev.tipo==='award'?'<div style="font-size:18px;">&#127942;</div>':''}
            ${st==='now'?'<div class="now-badge"><div class="now-dot"></div>EN CURSO</div>':''}
          </div>
          ${sponsorRow}
        </div>`;
      } else {
        const rows=sec.rows, claimed={};
        html+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(${rows.length},${rowH});gap:${gap};flex:1;min-height:0;">`;
        for(let r=0;r<rows.length;r++){
          const rc=cells[bandKeys.indexOf(rows[r])]||{};
          for(let c=0;c<5;c++){
            if(claimed[r+'-'+c])continue;
            const cell=rc[c];
            if(!cell){ html+=`<div style="grid-column:${c+1};grid-row:${r+1};"></div>`; continue; }
            const {ev,span}=cell;
            for(let s=1;s<span&&r+s<rows.length;s++) claimed[(r+s)+'-'+c]=true;
            const st=getState(ev), sp=span>1?`grid-row:${r+1} / span ${span};`:`grid-row:${r+1};`;
            const color=getEvColor(ev.name);
            html+=`<div class="fs-ev" style="grid-column:${c+1};${sp}background:${color};border:2px solid #000;padding:${evPad};">
              ${st==='now'?'<div class="now-badge"><div class="now-dot"></div>EN CURSO</div>':''}
              <div style="font-family:Orbitron,monospace;font-size:12px;font-weight:700;color:rgba(255,255,255,0.9);">${ev.start}</div>
              <div style="font-size:${evFS};font-weight:700;color:#fff;margin-top:3px;line-height:1.2;">${ev.name}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.7);margin-top:2px;">${ev.end}</div>
            </div>`;
          }
        }
        html+=`</div>`;
      }
    });

    html+=`</div>`; // close content wrapper

    // Normal page sponsors strip
    if(!compact) {
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0 2px;border-top:1px solid #d1d9ed;margin-top:6px;flex-shrink:0;">
        <div style="font-family:Orbitron,monospace;font-size:8px;letter-spacing:3px;color:#1a5ca8;text-transform:uppercase;white-space:nowrap;flex-shrink:0;">AUSPICIANTES</div>
        <div style="display:flex;gap:8px;flex:1;">${[1,2,3,4,5,6,7].map(i=>`<div style="flex:1;height:34px;border-radius:5px;border:1px dashed rgba(26,92,168,0.25);display:flex;align-items:center;justify-content:center;font-size:9px;color:#9ca3af;">Logo ${i}</div>`).join('')}</div>
      </div>`;
    }

    grid.innerHTML=html;
  }

  function tick() {
    const n=new Date(),t=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    const cl=document.getElementById('fsClock'); if(cl)cl.textContent=t;
    const cl2=document.getElementById('fsClockFtr'); if(cl2)cl2.textContent=t;
    const fd=document.getElementById('fsDate'); if(fd)fd.textContent=n.toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long'});
  }

  function initParticles() {
    const canvas=document.getElementById('fsCanvas'); if(!canvas)return;
    const ctx=canvas.getContext('2d'); let W,H,pts=[];
    const resize=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;};
    const mkPt=()=>{return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()+.5,a:Math.random()*.1+.03};};
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(26,92,168,${p.a})`;ctx.fill();});
      requestAnimationFrame(draw);
    };
    resize();pts=Array.from({length:40},mkPt);draw();
    window.addEventListener('resize',()=>{resize();pts=Array.from({length:40},mkPt);});
  }

  function abrirFS() {
    document.getElementById('fsOverlay').classList.add('active');
    buildGrid('fsGrid',true); tick(); initParticles();
    (document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.());
  }
  function cerrarFS() {
    document.getElementById('fsOverlay').classList.remove('active');
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.getElementById('fsOverlay').classList.remove('active');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarFS();if(e.key==='f'||e.key==='F')abrirFS();});

  setInterval(tick,1000);
  setInterval(()=>{if(document.getElementById('fsOverlay').classList.contains('active'))buildGrid('fsGrid',true);else buildGrid('normalGrid',false);},30000);

  tick();
  setTimeout(()=>buildGrid('normalGrid',false),0);
  setTimeout(()=>buildGrid('normalGrid',false),800);
</script>

</body>
</html>
