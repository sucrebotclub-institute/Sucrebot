<!-- ═══════════════════════════════════════════════════════════════
     TOPBAR - Barra superior con autenticación
     Archivo: /shared/components/topbar.html
     ═══════════════════════════════════════════════════════════════ -->
  
<!-- Script de Google OAuth (cargado globalmente) -->
<script src="https://accounts.google.com/gsi/client" async defer></script> 

<!-- Div requerido por Google OAuth -->
<div id="g_id_onload"
     data-client_id="14154960360-fofn56epv2rsiq882sni5ku0q1idemg4.apps.googleusercontent.com"
     data-callback="handleCredentialResponse"
     data-auto_prompt="false">
</div>

<div class="top-bar">
  <div class="top-pulse"></div>
  
  <!-- Contacto por email -->
  <a href="mailto:sucrebotclub@tecnologicosucre.edu.ec">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m2 7 10 7 10-7"/>
    </svg>
    sucrebotclub@tecnologicosucre.edu.ec
  </a>
  
  <!-- Link al instituto -->
  <a href="https://tecnologicosucre.edu.ec/web/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    Instituto Sucre
  </a>
  
  <!-- Botón de login (visible cuando NO hay sesión) -->
  <button class="btn-login" id="btnLogin" onclick="iniciarLogin()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Iniciar Sesión
  </button>
  
  <!-- Info de usuario (visible cuando HAY sesión) -->
  <div class="user-info" id="userInfo">
    <img class="user-avatar" id="userAvatar" src="" alt="avatar" />
    <span class="user-name" id="userName"></span>
    
    <!-- Botón para cambiar de cuenta -->
    <button class="btn-cambiar" onclick="cambiarCuenta()" title="Cambiar de cuenta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </button>
    
    <!-- Botón de cerrar sesión — solo ✕, con confirmación -->
    <button class="btn-logout" onclick="confirmarCerrarSesion()" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>

<!-- Modal de confirmación de cierre de sesión -->
<div id="modalLogout" class="logout-overlay" onclick="cancelarCerrarSesion(event)">
  <div class="logout-modal">
    <div class="logout-modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <div class="logout-modal-title">¿Cerrar sesión?</div>
    <div class="logout-modal-sub">Se cerrará tu sesión de staff en este dispositivo.</div>
    <div class="logout-modal-btns">
      <button class="logout-btn-cancel" onclick="cancelarCerrarSesion()">Cancelar</button>
      <button class="logout-btn-confirm" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</div>

<style>
/* ═══════════════════════════════════════════════════════════════
   ESTILOS DEL TOPBAR - ALTURA FIJA
   ═══════════════════════════════════════════════════════════════ */

.top-bar {
  background: linear-gradient(135deg, #0d1f42 0%, #1a3a6b 100%);
  padding: 0 40px;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 13px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid rgba(91, 200, 240, 0.3);
  height: 52px;
  min-height: 52px;
  max-height: 52px;
}

.top-pulse {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(91, 200, 240, 0.1), transparent);
  animation: topPulse 3s infinite;
}

@keyframes topPulse {
  0% { left: -100%; }
  100% { left: 100%; }
}

.top-bar a {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  font-weight: 500;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.top-bar a:hover {
  color: #5bc8f0;
  transform: translateY(-1px);
}

.top-bar a svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.btn-login {
  margin-left: auto;
  background: linear-gradient(135deg, #5bc8f0 0%, #3da9d8 100%);
  color: #0f3566;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  font-family: 'Exo 2', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(91, 200, 240, 0.3);
  white-space: nowrap;
  height: 36px;
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(91, 200, 240, 0.5);
  background: linear-gradient(135deg, #90dcff 0%, #5bc8f0 100%);
}

.btn-login svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════
   USER INFO
   ═══════════════════════════════════════════════════════════════ */

.user-info {
  margin-left: auto;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  height: 36px;
  min-height: 36px;
}

.user-info.visible {
  display: flex;
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid #5bc8f0;
  object-fit: cover;
  flex-shrink: 0;
}

.user-name {
  color: #ffffff;
  font-weight: 600;
  font-size: 13px;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════════════
   BOTÓN CAMBIAR CUENTA
   ═══════════════════════════════════════════════════════════════ */

.btn-cambiar {
  background: #5bc8f0;
  color: #0f3566;
  border: none;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: 'Exo 2', sans-serif;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  height: 28px;
}

.btn-cambiar svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.btn-cambiar:hover {
  background: #90dcff;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(91, 200, 240, 0.4);
}

/* ═══════════════════════════════════════════════════════════════
   BOTÓN CERRAR SESIÓN — solo ✕
   ═══════════════════════════════════════════════════════════════ */

.btn-logout {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  padding: 0;
}

.btn-logout svg {
  width: 14px;
  height: 14px;
  stroke: #ffffff;
}

.btn-logout:hover {
  background: rgba(255, 255, 255, 0.25);
  border-color: #ffffff;
  transform: translateY(-1px);
}

/* ═══════════════════════════════════════════════════════════════
   MODAL CONFIRMACIÓN CERRAR SESIÓN
   ═══════════════════════════════════════════════════════════════ */

.logout-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 15, 40, 0.75);
  backdrop-filter: blur(4px);
  z-index: 99999;
  align-items: center;
  justify-content: center;
}

.logout-overlay.visible {
  display: flex;
}

.logout-modal {
  background: linear-gradient(145deg, #0d1f42, #1a3a6b);
  border: 1px solid rgba(91, 200, 240, 0.25);
  border-radius: 16px;
  padding: 32px 28px 24px;
  width: 300px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.logout-modal-icon {
  width: 52px;
  height: 52px;
  background: rgba(255, 77, 77, 0.12);
  border: 1px solid rgba(255, 77, 77, 0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.logout-modal-icon svg {
  width: 26px;
  height: 26px;
  stroke: #ff9999;
}

.logout-modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: #ffffff;
  margin-bottom: 8px;
}

.logout-modal-sub {
  font-family: 'Exo 2', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  margin-bottom: 24px;
  line-height: 1.5;
}

.logout-modal-btns {
  display: flex;
  gap: 10px;
}

.logout-btn-cancel {
  flex: 1;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.75);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 10px;
  font-family: 'Exo 2', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.logout-btn-cancel:hover {
  background: rgba(255,255,255,0.1);
  color: #ffffff;
}

.logout-btn-confirm {
  flex: 1;
  background: rgba(255, 77, 77, 0.2);
  color: #ff9999;
  border: 1px solid rgba(255, 77, 77, 0.4);
  border-radius: 8px;
  padding: 10px;
  font-family: 'Exo 2', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.logout-btn-confirm:hover {
  background: rgba(255, 77, 77, 0.35);
  border-color: rgba(255, 77, 77, 0.7);
  color: #ffffff;
}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */

@media (max-width: 768px) {
  .top-bar {
    padding: 0 20px;
    font-size: 11px;
    gap: 12px;
    height: 48px;
    min-height: 48px;
    max-height: 48px;
  }
  
  .top-bar a:first-of-type {
    display: none;
  }
  
  .user-name {
    max-width: 80px;
    font-size: 12px;
  }
  
  .user-avatar {
    width: 24px;
    height: 24px;
  }
  
  .btn-login {
    font-size: 12px;
    padding: 6px 16px;
    height: 32px;
  }
  
  .user-info {
    height: 32px;
    min-height: 32px;
    padding: 3px 8px;
    gap: 8px;
  }
  
  .btn-cambiar {
    padding: 4px 8px;
    height: 26px;
  }
  
  .btn-cambiar svg {
    width: 12px;
    height: 12px;
  }
  
  .btn-logout {
    width: 26px;
    height: 26px;
  }

  .logout-modal {
    width: calc(100vw - 48px);
    padding: 24px 20px 20px;
  }
}
</style>

<script>
function confirmarCerrarSesion() {
  document.getElementById('modalLogout').classList.add('visible');
}

function cancelarCerrarSesion(event) {
  // Si se hace click en el overlay (fondo), cerrar. Si es en el modal, no.
  if (event && event.target !== document.getElementById('modalLogout')) return;
  document.getElementById('modalLogout').classList.remove('visible');
}
</script>
