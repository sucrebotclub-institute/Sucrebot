<header>
  <div class="logo-wrap">
    <img src="../shared/images/club-robotica-fondo-blanco.png" alt="Club de Robótica Sucre" style="height:72px;width:auto;object-fit:contain;" />
  </div>
  
  <!-- COUNTDOWN INTEGRADO -->
  <div class="countdown-container">
    <div class="countdown-label">SucreBot 2026</div>
    <div class="countdown-timer" id="countdown">
      <div class="time-unit">
        <span class="time-value" id="days">00</span>
        <span class="time-text">Días</span>
      </div>
      <div class="time-separator">:</div>
      <div class="time-unit">
        <span class="time-value" id="hours">00</span>
        <span class="time-text">Horas</span>
      </div>
      <div class="time-separator">:</div>
      <div class="time-unit">
        <span class="time-value" id="minutes">00</span>
        <span class="time-text">Min</span>
      </div>
      <div class="time-separator">:</div>
      <div class="time-unit">
        <span class="time-value" id="seconds">00</span>
        <span class="time-text">Seg</span>
      </div>
    </div>
  </div>
  
  <img src="../shared/images/logosucre.png" alt="Instituto Superior Universitario Sucre" style="height:58px;width:auto;max-width:260px;object-fit:contain;" />
</header>

<style>
.countdown-container {
  text-align: center;
  padding: 8px 0;
  background: #ffffff;
  border-bottom: 1px solid #e0e0e0;
}

.countdown-label {
  font-family: 'Exo 2', sans-serif;
  font-size: 0.65rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
  font-weight: 500;
}

.countdown-timer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.time-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 42px;
  background: #f8f9fa;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #e8e8e8;
}

.time-value {
  font-family: 'Orbitron', monospace;
  font-size: 1.2rem;
  font-weight: 700;
  color: #1a5ca8;
  line-height: 1;
}

.time-text {
  font-family: 'Exo 2', sans-serif;
  font-size: 0.55rem;
  color: #888;
  text-transform: uppercase;
  margin-top: 2px;
  letter-spacing: 0.3px;
  font-weight: 500;
}

.time-separator {
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  color: #1a5ca8;
  font-weight: 600;
  margin: 0 2px;
  line-height: 1;
  padding-bottom: 12px;
}

/* Responsive */
@media (max-width: 768px) {
  .countdown-container {
    padding: 6px 0;
  }
  
  .countdown-label {
    font-size: 0.6rem;
    margin-bottom: 3px;
  }
  
  .countdown-timer {
    gap: 6px;
  }
  
  .time-unit {
    min-width: 36px;
    padding: 3px 5px;
  }
  
  .time-value {
    font-size: 1rem;
  }
  
  .time-text {
    font-size: 0.5rem;
  }
  
  .time-separator {
    font-size: 0.9rem;
    padding-bottom: 10px;
  }
}

@media (max-width: 480px) {
  .countdown-container {
    padding: 5px 0;
  }
  
  .countdown-timer {
    gap: 5px;
  }
  
  .time-unit {
    min-width: 32px;
    padding: 3px 4px;
  }
  
  .time-value {
    font-size: 0.9rem;
  }
  
  .time-text {
    font-size: 0.45rem;
  }
  
  .time-separator {
    font-size: 0.8rem;
    padding-bottom: 8px;
  }
}
</style>

<script>
(function() {
  function updateCountdown() {
    // Fecha objetivo: 16 de julio de 2026, 00:00:00
    const targetDate = new Date('2026-07-16T00:00:00').getTime();
    const now = new Date().getTime();
    const difference = targetDate - now;

    if (difference <= 0) {
      // El evento ya pasó
      document.getElementById('days').textContent = '00';
      document.getElementById('hours').textContent = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      document.querySelector('.countdown-label').textContent = '¡EVENTO EN CURSO!';
      return;
    }

    // Calcular tiempo restante
    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    // Actualizar valores con formato de 2 dígitos
    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  // Iniciar countdown cuando el DOM esté listo
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  } else {
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }
})();
</script>
