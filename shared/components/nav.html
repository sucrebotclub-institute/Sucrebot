<script>
  // ── DROPDOWN EVENTOS ──
  (function() {
    const ne=document.getElementById('navEventos'), me=document.getElementById('menuEventos');
    const ws=document.getElementById('wrapSucrebot'), ms=document.getElementById('menuSucrebot');
    let t1,t2;
    ne.addEventListener('mouseenter',()=>{clearTimeout(t1);me.style.display='block';});
    ne.addEventListener('mouseleave',()=>{t1=setTimeout(()=>{me.style.display='';ms.classList.remove('open');},180);});
    me.addEventListener('mouseenter',()=>clearTimeout(t1));
    me.addEventListener('mouseleave',()=>{t1=setTimeout(()=>{me.style.display='';ms.classList.remove('open');},180);});
    ws.addEventListener('mouseenter',()=>{clearTimeout(t1);clearTimeout(t2);ms.classList.add('open');});
    ws.addEventListener('mouseleave',()=>{t2=setTimeout(()=>ms.classList.remove('open'),180);});
    ms.addEventListener('mouseenter',()=>{clearTimeout(t1);clearTimeout(t2);});
    ms.addEventListener('mouseleave',()=>{t1=setTimeout(()=>{me.style.display='';ms.classList.remove('open');},180);});
    ne.querySelector('a').addEventListener('touchend',(e)=>{e.preventDefault();const o=me.style.display==='block';document.querySelectorAll('.dropdown-menu').forEach(m=>m.style.display='');ms.classList.remove('open');if(!o)me.style.display='block';});
    document.getElementById('btnSucrebot').addEventListener('touchend',(e)=>{e.preventDefault();e.stopPropagation();ms.classList.toggle('open');me.style.display='block';});
  })();

  // ── DROPDOWN PARTICIPANTES (con sesión) ──
  (function() {
    const np=document.getElementById('navPartDropdown'), mp=document.getElementById('menuParticipantes');
    let t;
    np.addEventListener('mouseenter',()=>{clearTimeout(t);mp.style.display='block';});
    np.addEventListener('mouseleave',()=>{t=setTimeout(()=>mp.style.display='',180);});
    mp.addEventListener('mouseenter',()=>clearTimeout(t));
    mp.addEventListener('mouseleave',()=>{t=setTimeout(()=>mp.style.display='',180);});
    document.getElementById('navParticipantesLink').addEventListener('touchend',(e)=>{e.preventDefault();const o=mp.style.display==='block';document.querySelectorAll('.dropdown-menu').forEach(m=>m.style.display='');if(!o)mp.style.display='block';});
  })();

  // ── DROPDOWN STAFF ──
  (function() {
    const ns=document.getElementById('navStaff'), ms=document.getElementById('menuStaff');
    let t;
    ns.addEventListener('mouseenter',()=>{clearTimeout(t);ms.style.display='block';});
    ns.addEventListener('mouseleave',()=>{t=setTimeout(()=>ms.style.display='',180);});
    ms.addEventListener('mouseenter',()=>clearTimeout(t));
    ms.addEventListener('mouseleave',()=>{t=setTimeout(()=>ms.style.display='',180);});
    document.getElementById('navStaffLink').addEventListener('touchend',(e)=>{e.preventDefault();const o=ms.style.display==='block';document.querySelectorAll('.dropdown-menu').forEach(m=>m.style.display='');if(!o)ms.style.display='block';});
  })();

  document.addEventListener('touchend',(e)=>{
    if(!e.target.closest('.nav-dropdown')&&e.target.id!=='navPartLink'){
      document.querySelectorAll('.dropdown-menu').forEach(m=>m.style.display='');
      document.querySelectorAll('.sub-dropdown').forEach(m=>m.classList.remove('open'));
    }
  });
</script>
