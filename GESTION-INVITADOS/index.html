<!DOCTYPE html>
<!-- GESTION-INVITADOS -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Gestión de Invitados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    :root {
      --g-cyan: #5bc8f0; --g-cyan-bright: #90dcff;
      --g-blue: #1a5ca8; --g-blue-dark: #0e2a5a;
      --g-surface: #0f3566; --g-surface-2: #1a4580; --g-surface-3: #2a5a9e;
      --g-success: #00ff88; --g-warning: #f5a623; --g-error: #ff3b3b;
    }
    body { background: #ffffff !important; color: #1a1a2e !important; }
    main { min-height: calc(100vh - 174px); background: #ffffff; }
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }
    .page-hero { padding: 60px 0 28px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--g-blue); color: #fff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; }
    .page-hero h2 span { color: var(--g-blue); }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; margin-top: 6px; }

    .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-mini { flex: 1; min-width: 110px; background: linear-gradient(135deg,var(--g-surface-3) 0%,var(--g-surface-2) 100%); border-radius: 12px; padding: 14px; text-align: center; }
    .stat-mini-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: #fff; line-height: 1; }
    .stat-mini-lbl { font-family: 'DM Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.6); letter-spacing: 0.08em; margin-top: 4px; text-transform: uppercase; }
    .stat-mini-lbl.aprobado { color: var(--g-success); }
    .stat-mini-lbl.revision { color: var(--g-warning); }

    .controles { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
    .filtro-select, .busqueda-input { background: #f0f4f8; border: 1.5px solid #d8e2ee; color: #1a3a6e; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; outline: none; }
    .filtro-select { cursor: pointer; }
    .busqueda-input { flex: 1; min-width: 200px; }
    .filtro-select:focus, .busqueda-input:focus { border-color: var(--g-blue); }

    .lista { display: flex; flex-direction: column; gap: 10px; }
    .inv-card { display: flex; align-items: center; gap: 14px; background: #f8faff; border: 1.5px solid #e0e7ef; border-radius: 12px; padding: 14px 18px; transition: border-color .2s, box-shadow .2s; }
    .inv-card:hover { border-color: var(--g-cyan); box-shadow: 0 4px 16px rgba(91,200,240,0.15); }
    .inv-card-main { flex: 1; min-width: 0; }
    .inv-nombre { font-family: 'Exo 2', sans-serif; font-size: 15px; font-weight: 700; color: #0e2a5a; }
    .inv-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: #6a7a94; margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; }
    .inv-badge { font-family: 'Orbitron', monospace; font-size: 9px; letter-spacing: 1px; padding: 4px 10px; border-radius: 12px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .inv-badge.revision { background: rgba(245,166,35,0.15); color: #c27803; border: 1px solid rgba(245,166,35,0.35); }
    .inv-badge.aprobado { background: rgba(0,217,95,0.12); color: #00a046; border: 1px solid rgba(0,217,95,0.35); }
    .inv-badge.nocumple { background: rgba(255,59,59,0.12); color: #c41e3a; border: 1px solid rgba(255,59,59,0.35); }
    .inv-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    .inv-btn { font-family: 'Exo 2', sans-serif; font-size: 11.5px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer; border: none; transition: opacity .2s; white-space: nowrap; }
    .inv-btn:hover { opacity: 0.85; }
    .inv-btn.aprobar { background: #00d95f; color: #003a1a; }
    .inv-btn.rechazar { background: #ff5757; color: #fff; }
    .inv-btn.reenviar { background: #1a5ca8; color: #fff; }
    .inv-btn.pendiente { background: #f0f4f8; color: #6a7a94; border: 1px solid #d8e2ee; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 3rem; opacity: 0.25; margin-bottom: 12px; }
    .empty-state-text { font-family: 'DM Mono', monospace; font-size: 13px; color: #8a96b0; letter-spacing: 0.1em; }

    .toast { position: fixed; bottom: 30px; left: 30px; transform: translateY(100px); opacity: 0; background: #1e2438; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); border-left: 4px solid #3dd68c; color: #f0f4ff; font-family: 'Exo 2', sans-serif; font-size: 12px; font-weight: 600; padding: 12px 16px; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; z-index: 9999; max-width: 320px; pointer-events: none; box-shadow: 0 3px 12px rgba(0,0,0,0.3); }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      .wrapper { padding: 0 12px 60px; }
      .page-hero { padding: 24px 0 16px; }
      .page-hero h2 { font-size: 1.7rem; }
      .inv-card { flex-direction: column; align-items: stretch; }
      .inv-actions { justify-content: stretch; }
      .inv-btn { flex: 1; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
<div class="wrapper">
  <div class="page-hero">
    <div class="page-hero-badge"><div class="page-hero-badge-dot"></div>STAFF · SUCREBOT 2026</div>
    <h2>GESTIÓN DE <span>INVITADOS</span></h2>
    <p>Aprobación de registros públicos y envío de QR de acceso</p>
  </div>

  <div class="stats-row">
    <div class="stat-mini"><div class="stat-mini-val" id="stat-total">0</div><div class="stat-mini-lbl">Total</div></div>
    <div class="stat-mini"><div class="stat-mini-val" id="stat-revision">0</div><div class="stat-mini-lbl revision">En revisión</div></div>
    <div class="stat-mini"><div class="stat-mini-val" id="stat-aprobados">0</div><div class="stat-mini-lbl aprobado">Aprobados</div></div>
    <div class="stat-mini"><div class="stat-mini-val" id="stat-acompanantes">0</div><div class="stat-mini-lbl">Acompañantes</div></div>
  </div>

  <div class="controles">
    <select class="filtro-select" id="filtro-estado" onchange="renderLista()">
      <option value="todos">Todos los estados</option>
      <option value="EN REVISION" selected>En revisión</option>
      <option value="APROBADO">Aprobados</option>
      <option value="NO CUMPLE">No cumple</option>
    </select>
    <input class="busqueda-input" id="busqueda" placeholder="Buscar por nombre, correo o institución..." oninput="renderLista()">
    <button class="inv-btn pendiente" onclick="cargarInvitados(true)">↻ Actualizar</button>
  </div>

  <div class="lista" id="lista"></div>
</div>
</main>

<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  const STAFF_TOKEN = 'SucreBot2026-CMI-Sucre-x7k9mQ';
  let _invitados = [];
  let toastTimer = null;

  function gasGet(params) { const qs = new URLSearchParams(params).toString(); return fetch(GAS_URL + '?' + qs).then(r => r.json()); }
  async function gasPost(data) {
    const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ ...data, staffToken: STAFF_TOKEN }), redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    return r.json();
  }

  function showToast(msg, error) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderLeftColor = error ? '#e05555' : '#3dd68c';
    if (toastTimer) { clearTimeout(toastTimer); t.classList.remove('show'); }
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    toastTimer = setTimeout(() => { t.classList.remove('show'); toastTimer = null; }, 3000);
  }

  document.addEventListener('componentsLoaded', function() {
    const savedUser = localStorage.getItem('sucrebot_user');
    if (!savedUser) { window.location.href = '../INICIO/'; return; }
    cargarInvitados(false);
  });

  function cargarInvitados(forzar) {
    gasGet({ action: 'getInvitados' }).then(arr => {
      if (Array.isArray(arr)) {
        _invitados = arr;
        actualizarStats();
        renderLista();
        if (forzar) showToast('✅ Lista actualizada');
      }
    }).catch(() => showToast('Error al cargar invitados', true));
  }

  function actualizarStats() {
    document.getElementById('stat-total').textContent = _invitados.length;
    document.getElementById('stat-revision').textContent = _invitados.filter(i => i.aprobado !== 'APROBADO' && i.aprobado !== 'NO CUMPLE').length;
    document.getElementById('stat-aprobados').textContent = _invitados.filter(i => i.aprobado === 'APROBADO').length;
    const totalAcomp = _invitados.reduce((sum, i) => sum + (parseInt(i.acompanantes) || 0), 0);
    document.getElementById('stat-acompanantes').textContent = totalAcomp;
  }

  function renderLista() {
    const filtroEstado = document.getElementById('filtro-estado').value;
    const busqueda = document.getElementById('busqueda').value.trim().toLowerCase();
    let lista = _invitados.slice();

    if (filtroEstado !== 'todos') {
      lista = lista.filter(i => {
        const aprobado = i.aprobado;
        if (filtroEstado === 'EN REVISION') return aprobado !== 'APROBADO' && aprobado !== 'NO CUMPLE';
        return aprobado === filtroEstado;
      });
    }
    if (busqueda) {
      lista = lista.filter(i =>
        String(i.nombre || '').toLowerCase().includes(busqueda) ||
        String(i.correo || '').toLowerCase().includes(busqueda) ||
        String(i.institucion || '').toLowerCase().includes(busqueda)
      );
    }
    lista.sort((a, b) => String(b.fecha_registro || '').localeCompare(String(a.fecha_registro || '')));

    const cont = document.getElementById('lista');
    if (lista.length === 0) {
      cont.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">SIN INVITADOS EN ESTE FILTRO</div></div>';
      return;
    }
    cont.innerHTML = lista.map(i => renderCard(i)).join('');
  }

  function renderCard(i) {
    const aprobado = i.aprobado || 'EN REVISION';
    let badgeClass = 'revision', badgeText = 'EN REVISIÓN';
    if (aprobado === 'APROBADO') { badgeClass = 'aprobado'; badgeText = 'APROBADO'; }
    else if (aprobado === 'NO CUMPLE') { badgeClass = 'nocumple'; badgeText = 'NO CUMPLE'; }

    const acomp = parseInt(i.acompanantes) || 0;
    const meta = [
      i.correo || '',
      i.telefono ? '📱 ' + i.telefono : '',
      i.institucion ? '🏛️ ' + i.institucion : '',
      acomp > 0 ? '👥 +' + acomp : ''
    ].filter(Boolean).join(' · ');

    let actions = '';
    if (aprobado === 'APROBADO') {
      actions = `<button class="inv-btn reenviar" onclick="reenviarQR('${i.id}')">📧 Reenviar QR</button>
                 <button class="inv-btn pendiente" onclick="desaprobarInvitado('${i.id}')">↩ Marcar pendiente</button>`;
    } else {
      actions = `<button class="inv-btn aprobar" onclick="aprobarInvitado('${i.id}', '${escAttr(i.correo)}', '${escAttr(i.nombre)}', '${escAttr(i.institucion)}', ${acomp})">✔ Aprobar y enviar QR</button>
                 <button class="inv-btn rechazar" onclick="noCumpleInvitado('${i.id}')">✖ No cumple</button>`;
    }

    return `<div class="inv-card">
      <div class="inv-card-main">
        <div class="inv-nombre">${esc(i.nombre)}</div>
        <div class="inv-meta">${esc(meta)}</div>
      </div>
      <div class="inv-badge ${badgeClass}">${badgeText}</div>
      <div class="inv-actions">${actions}</div>
    </div>`;
  }

  function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escAttr(s) { return String(s || '').replace(/'/g, "\\'"); }

  async function aprobarInvitado(id, correo, nombre, institucion, acompanantes) {
    try {
      const r = await gasGet({ action: 'aprobarInvitado', id });
      if (!r.ok) throw new Error(r.error || 'Error');
      try {
        await gasPost({
          action: 'enviarQRInvitado',
          correo, nombre, institucion, acompanantes,
          id,
          qrUrl: 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(id),
          modoRevision: false
        });
      } catch(e) { /* no crítico */ }
      showToast('✅ Aprobado — QR enviado a ' + correo);
      cargarInvitados(false);
    } catch(e) { showToast('Error: ' + e.message, true); }
  }

  async function noCumpleInvitado(id) {
    const razon = prompt('Razón (opcional):', '');
    if (razon === null) return;
    try {
      const r = await gasGet({ action: 'noCumpleInvitado', id, razon: razon || 'No especificado' });
      if (!r.ok) throw new Error(r.error || 'Error');
      showToast('Marcado como "No cumple"');
      cargarInvitados(false);
    } catch(e) { showToast('Error: ' + e.message, true); }
  }

  async function desaprobarInvitado(id) {
    try {
      const r = await gasGet({ action: 'desaprobarInvitado', id });
      if (!r.ok) throw new Error(r.error || 'Error');
      showToast('Marcado como pendiente');
      cargarInvitados(false);
    } catch(e) { showToast('Error: ' + e.message, true); }
  }

  async function reenviarQR(id) {
    const inv = _invitados.find(i => i.id === id);
    if (!inv) return;
    try {
      await gasPost({
        action: 'enviarQRInvitado',
        correo: inv.correo, nombre: inv.nombre, institucion: inv.institucion, acompanantes: inv.acompanantes,
        id,
        qrUrl: 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(id),
        modoRevision: false
      });
      showToast('📧 QR reenviado a ' + inv.correo);
    } catch(e) { showToast('Error: ' + e.message, true); }
  }
</script>
</body>
</html>
