<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Manillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../shared/js/config.js"></script>
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/css/mobile-fix.css">
  <style>
    body { background: #f0f4fa !important; padding-top: 0 !important; }
    main { padding-top: 174px; min-height: 100vh; background: #f0f4fa; }
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

    .page-hero { padding: 56px 0 24px; border-bottom: 1px solid rgba(26,92,168,0.15); margin-bottom: 28px; }
    .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a5ca8; color: #fff; font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
    .page-hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .page-hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .page-hero-line { flex: 0 0 40px; height: 3px; background: #1a5ca8; border-radius: 2px; }
    .page-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 3px; color: #1a3a6e; line-height: 1; margin-bottom: 0; }
    .page-hero h2 span { color: #1a5ca8; }
    .page-hero p { font-size: 13px; color: #7a7a8c; letter-spacing: 0.5px; }

    .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-pill { background: #1a5ca8; border: 1px solid #1450a0; border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(26,92,168,0.25); }
    .stat-pill-icon { font-size: 1.2rem; }
    .stat-pill-label { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; text-transform: uppercase; }
    .stat-pill-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: #ffffff; line-height: 1; }
    .stat-pill-value.verde { color: #7fffb0; }
    .stat-pill-value.naranja { color: #ffd980; }

    .controles { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .ctrl-select, .ctrl-input { background: #dce8f7; border: 1.5px solid #b8cfe8; color: #1a3a6e; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 10px; outline: none; transition: border-color 0.2s; }
    .ctrl-select:focus, .ctrl-input:focus { border-color: #1a5ca8; }
    .ctrl-select { cursor: pointer; min-width: 200px; }
    .ctrl-input { flex: 1; min-width: 220px; }
    .ctrl-select option, .ctrl-select optgroup { background: #fff; color: #1a3a6e; }
    .btn-refrescar { background: #1a5ca8; border: none; color: #fff; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-refrescar:hover { background: #0e4a8f; }
    .btn-refrescar:disabled { opacity: 0.5; cursor: not-allowed; }

    /* cache indicator */
    .cache-info { font-family: 'DM Mono', monospace; font-size: 10px; color: #7a7a8c; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .cache-dot { width: 6px; height: 6px; border-radius: 50%; background: #1e8c3a; }
    .cache-dot.viejo { background: #c27803; }

    .lista-container { display: flex; flex-direction: column; gap: 10px; }

    .p-card { background: #1a5ca8; border: 1.5px solid #1450a0; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: all 0.2s; box-shadow: 0 2px 8px rgba(26,92,168,0.25); }
    .p-card.entregada { background: #1e8c3a; border-color: #166d2c; }
    .p-card:hover { box-shadow: 0 4px 16px rgba(26,92,168,0.12); transform: translateY(-1px); }
    .p-avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 1px; }
    .p-card.entregada .p-avatar { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
    .p-info { flex: 1; min-width: 0; }
    .p-robot { font-family: 'Exo 2', sans-serif; font-size: 15px; font-weight: 800; color: #ffffff; }
    .p-nombre { font-family: 'Exo 2', sans-serif; font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
    .p-miembro2 { font-family: 'Exo 2', sans-serif; font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .p-cat { display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 8px; margin-top: 4px; color: #fff; }
    .p-cat.amateur { background: rgba(0,0,0,0.25); }
    .p-cat.pro     { background: rgba(0,0,0,0.25); }
    .p-cat.extra   { background: rgba(0,0,0,0.25); }
    .btn-entregada-label { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; color: #1e8c3a; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
    .btn-entregar { background: linear-gradient(135deg, #1e8c3a, #166d2c); color: #fff; border: none; border-radius: 10px; font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 700; padding: 10px 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
    .btn-entregar:hover { background: linear-gradient(135deg, #25a847, #1e8c3a); transform: translateY(-1px); }
    .btn-entregar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ver más */
    .btn-ver-mas { width: 100%; background: #dce8f7; border: 1.5px solid #b8cfe8; color: #1a5ca8; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 700; padding: 14px; border-radius: 12px; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
    .btn-ver-mas:hover { background: #c5d9f0; border-color: #1a5ca8; }
    .paginacion-info { text-align: center; font-family: 'DM Mono', monospace; font-size: 11px; color: #7a7a8c; margin-top: 8px; }

    .vacio { text-align: center; padding: 60px 20px; color: #7a7a8c; font-family: 'DM Mono', monospace; font-size: 13px; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(0,0,0,0.92); color: #00ff88; padding: 16px 28px; border-radius: 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600; z-index: 10000; opacity: 0; transition: all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55); border: 2px solid rgba(0,255,136,0.4); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      main { padding-top: 174px; }
      .wrapper { padding: 0 12px 40px; }
      .page-hero { padding: 20px 0 16px; }
      .page-hero h2 { font-size: 2rem; }
      .controles { flex-direction: column; }
      .ctrl-select, .ctrl-input, .btn-refrescar { width: 100%; box-sizing: border-box; }
      .p-card { flex-wrap: wrap; gap: 10px; }
      .btn-entregar { width: 100%; justify-content: center; }
      .stats-bar { gap: 10px; }
      .stat-pill { flex: 1; min-width: 120px; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<main>
  <div class="wrapper">
    <div class="page-hero">
      <div class="page-hero-badge">
        <div class="page-hero-badge-dot"></div>
        SUCREBOT 2026 · CONTROL DE ACCESO
      </div>
      <h2>ENTREGA DE <span>MANILLAS</span></h2>
      <div class="page-hero-sub">
        <div class="page-hero-line"></div>
        <p>SOLO PARTICIPANTES APROBADOS · UN CLIC PARA MARCAR COMO ENTREGADA</p>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-pill">
        <div class="stat-pill-icon">👥</div>
        <div>
          <div class="stat-pill-label">Total aprobados</div>
          <div class="stat-pill-value" id="stat-total">—</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-icon">✅</div>
        <div>
          <div class="stat-pill-label">Entregadas</div>
          <div class="stat-pill-value verde" id="stat-entregadas">—</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-icon">⏳</div>
        <div>
          <div class="stat-pill-label">Pendientes</div>
          <div class="stat-pill-value naranja" id="stat-pendientes">—</div>
        </div>
      </div>
    </div>

    <div class="controles">
      <select class="ctrl-select" id="filtro-cat">
        <option value="todos">🏆 Todas las categorías</option>
        <optgroup label="🏅 AMATEUR">
          <option value="Insectos">Insectos</option>
          <option value="Trepador (Amateur)">Trepador (Amateur)</option>
          <option value="Seguidor de línea ST (Amateur)">Seguidor de línea ST (Amateur)</option>
        </optgroup>
        <optgroup label="🏆 PRO">
          <option value="Seguidor de línea ST (Pro)">Seguidor de línea ST (Pro)</option>
          <option value="Minisumo Autónomo">Minisumo Autónomo</option>
          <option value="Minisumo RC">Minisumo RC</option>
          <option value="Bailarín">Bailarín</option>
          <option value="Batalla">Batalla</option>
          <option value="Trepador (Pro)">Trepador (Pro)</option>
          <option value="Robot soccer">Robot soccer</option>
        </optgroup>
        <optgroup label="🌟 OPEN">
          <option value="Cubo Rubik">Cubo Rubik</option>
          <option value="Lego Kids">Lego Kids</option>
          <option value="Impacto Tecnológico">Impacto Tecnológico</option>
        </optgroup>
        <optgroup label="🔍 ESTADO">
          <option value="__pendientes__">⏳ Solo pendientes</option>
          <option value="__entregadas__">✅ Solo entregadas</option>
        </optgroup>
      </select>
      <input type="text" class="ctrl-input" id="busqueda" placeholder="🔍 Buscar por nombre, robot o institución...">
      <button class="btn-refrescar" id="btn-refrescar" onclick="refrescar(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        Refrescar
      </button>
    </div>

    <div class="cache-info" id="cache-info" style="display:none">
      <div class="cache-dot" id="cache-dot"></div>
      <span id="cache-texto"></span>
    </div>

    <div class="lista-container" id="lista"></div>
    <div class="paginacion-info" id="paginacion-info"></div>
  </div>
</main>

<div data-include="../shared/components/footer.html"></div>
<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  const CACHE_KEY      = 'participantes';
  const CACHE_TS_KEY   = 'participantes_ts';
  const CACHE_TTL      = 10 * 60 * 1000; // 10 minutos
  const PAGE_SIZE      = 25;

  const CAT_COLOR = {
    'Insectos':                       '#2980B9',
    'Trepador (Amateur)':             '#16A085',
    'Seguidor de línea ST (Amateur)': '#00BFFF',
    'Seguidor de línea ST (Pro)':     '#7B2D8B',
    'Minisumo Autónomo':              '#9B59B6',
    'Minisumo RC':                    '#F5A623',
    'Bailarín':                       '#27AE60',
    'Batalla':                        '#E91E8C',
    'Impacto Tecnológico':            '#D4AF37',
    'Trepador (Pro)':                 '#E67E22',
    'Robot soccer':                   '#CC0000',
    'Cubo Rubik':                     '#C0C0C0',
    'Lego Kids':                      '#2980B9',
  };
  const NIVEL = {
    'Insectos':'amateur','Trepador (Amateur)':'amateur','Seguidor de línea ST (Amateur)':'amateur',
    'Seguidor de línea ST (Pro)':'pro','Minisumo Autónomo':'pro','Minisumo RC':'pro',
    'Bailarín':'pro','Batalla':'pro','Trepador (Pro)':'pro','Robot soccer':'pro',
    'Cubo Rubik':'extra','Lego Kids':'extra','Impacto Tecnológico':'extra'
  };

  let participantes = [];
  let listaFiltrada = [];
  let paginaActual  = 1;
  let entregando    = new Set();

  async function gasGet(params) {
    const r = await fetch(GAS_URL + '?' + new URLSearchParams(params));
    return r.json();
  }
  async function gasPost(data) {
    const r = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data), redirect:'follow' });
    return r.json();
  }

  document.addEventListener('componentsLoaded', () => {
    const savedUser = localStorage.getItem('sucrebot_user');
    if (!savedUser) { window.location.href = '../INICIO/'; return; }
    refrescar(false); // false = respetar cache
  });

  async function refrescar(forzar = false) {
    const btn = document.getElementById('btn-refrescar');
    btn.disabled = true;
    btn.innerHTML = '⏳ Cargando...';

    const ahora     = Date.now();
    const tsGuardado = parseInt(localStorage.getItem(CACHE_TS_KEY) || '0');
    const cacheValido = !forzar && (ahora - tsGuardado) < CACHE_TTL;

    if (cacheValido) {
      // usar cache
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        try {
          const arr = JSON.parse(raw);
          participantes = arr.filter(p => p.aprobado === 'APROBADO' && !String(p.robot || '').trim().startsWith('[DEV]'));
          mostrarIndicadorCache(tsGuardado, false);
          renderLista();
          btn.disabled = false;
          btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg> Refrescar';
          return;
        } catch(e) {}
      }
    }

    // cargar desde GAS
    try {
      const arr = await gasGet({ action: 'getParticipantes' });
      if (Array.isArray(arr)) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(arr));
        localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
        participantes = arr.filter(p => p.aprobado === 'APROBADO' && !String(p.robot || '').trim().startsWith('[DEV]'));
        mostrarIndicadorCache(Date.now(), false);
        renderLista();
        if (forzar) showToast('✅ Datos actualizados desde el servidor');
      }
    } catch(e) {
      // fallback a cache aunque sea viejo
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        try {
          participantes = JSON.parse(raw).filter(p => p.aprobado === 'APROBADO' && !String(p.robot || '').trim().startsWith('[DEV]'));
          mostrarIndicadorCache(tsGuardado, true);
          renderLista();
          showToast('⚠️ Sin conexión — mostrando datos guardados', true);
        } catch(e2) {}
      } else {
        showToast('Error al cargar datos', true);
      }
    }

    btn.disabled = false;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg> Refrescar';
  }

  function mostrarIndicadorCache(ts, viejo) {
    const info = document.getElementById('cache-info');
    const dot  = document.getElementById('cache-dot');
    const txt  = document.getElementById('cache-texto');
    info.style.display = 'flex';
    dot.className = 'cache-dot' + (viejo ? ' viejo' : '');
    const min = Math.floor((Date.now() - ts) / 60000);
    txt.textContent = min < 1 ? 'Datos actualizados hace menos de 1 min' :
                      `Datos actualizados hace ${min} min${viejo ? ' — desactualizados' : ''}`;
  }

  function renderLista() {
    const filtro   = document.getElementById('filtro-cat').value;
    const busqueda = document.getElementById('busqueda').value.toLowerCase().trim();

    listaFiltrada = participantes;
    if (filtro === '__pendientes__')      listaFiltrada = listaFiltrada.filter(p => p.manilla !== 'ENTREGADA');
    else if (filtro === '__entregadas__') listaFiltrada = listaFiltrada.filter(p => p.manilla === 'ENTREGADA');
    else if (filtro !== 'todos')          listaFiltrada = listaFiltrada.filter(p => p.categoria === filtro);

    if (busqueda) {
      listaFiltrada = listaFiltrada.filter(p =>
        (p.robot||'').toLowerCase().includes(busqueda) ||
        (p.nombre||'').toLowerCase().includes(busqueda) ||
        (p.institucion||'').toLowerCase().includes(busqueda) ||
        (p.miembro2 != null ? String(p.miembro2) : '').toLowerCase().includes(busqueda)
      );
    }

    // pendientes primero
    listaFiltrada.sort((a, b) => {
      const aE = a.manilla === 'ENTREGADA' ? 1 : 0;
      const bE = b.manilla === 'ENTREGADA' ? 1 : 0;
      return aE - bE || (a.categoria||'').localeCompare(b.categoria||'') || (a.robot||'').localeCompare(b.robot||'');
    });

    // stats
    const totalAprobados  = participantes.length;
    const totalEntregadas = participantes.filter(p => p.manilla === 'ENTREGADA').length;
    document.getElementById('stat-total').textContent      = totalAprobados;
    document.getElementById('stat-entregadas').textContent = totalEntregadas;
    document.getElementById('stat-pendientes').textContent = totalAprobados - totalEntregadas;

    paginaActual = 1;
    renderPagina();
  }

  function renderPagina() {
    const container = document.getElementById('lista');
    const infoEl    = document.getElementById('paginacion-info');

    if (!listaFiltrada.length) {
      container.innerHTML = '<div class="vacio">No se encontraron participantes</div>';
      infoEl.textContent = '';
      return;
    }

    const hasta  = paginaActual * PAGE_SIZE;
    const pagina = listaFiltrada.slice(0, hasta);
    const quedan = listaFiltrada.length - hasta;

    container.innerHTML = pagina.map(p => {
      const entregada = p.manilla === 'ENTREGADA';
      const nivel     = NIVEL[p.categoria] || 'pro';
      const iniciales = (p.robot || p.nombre || '?').slice(0, 2).toUpperCase();
      const m2        = (p.miembro2 && String(p.miembro2).trim() && String(p.miembro2).trim() !== '0')
                        ? String(p.miembro2).trim() : null;
      const cardColor = CAT_COLOR[p.categoria] || '#1a5ca8';
      const cardStyle = entregada ? '' : `background:${cardColor};border-color:${cardColor}cc;`;
      return `
        <div class="p-card ${entregada ? 'entregada' : ''}" id="card-${p.id}" style="${cardStyle}">
          <div class="p-avatar">${iniciales}</div>
          <div class="p-info">
            <div class="p-robot">${p.robot || '—'}</div>
            <div class="p-nombre">${p.nombre || '—'} · ${p.institucion || '—'}</div>
            ${m2 ? `<div class="p-miembro2">+ ${m2}</div>` : ''}
            <span class="p-cat ${nivel}">${p.categoria || '—'}</span>
          </div>
          ${entregada
            ? `<div class="btn-entregada-label">✅ Entregada</div>`
            : `<button class="btn-entregar" onclick="entregarManilla('${p.id}')" id="btn-${p.id}">🎫 Entregar</button>`
          }
        </div>`;
    }).join('');

    // botón ver más
    if (quedan > 0) {
      container.innerHTML += `<button class="btn-ver-mas" onclick="verMas()">Ver ${Math.min(quedan, PAGE_SIZE)} más de ${listaFiltrada.length} total</button>`;
    }

    infoEl.textContent = quedan > 0
      ? `Mostrando ${pagina.length} de ${listaFiltrada.length} participantes`
      : `${listaFiltrada.length} participante${listaFiltrada.length !== 1 ? 's' : ''}`;
  }

  function verMas() {
    paginaActual++;
    renderPagina();
    // scroll suave al nuevo contenido
    const cards = document.querySelectorAll('#lista .p-card');
    const nuevaCard = cards[(paginaActual - 1) * PAGE_SIZE];
    if (nuevaCard) nuevaCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function entregarManilla(id) {
    if (entregando.has(id)) return;
    entregando.add(id);
    const btn = document.getElementById('btn-' + id);
    if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
    try {
      const resp = await gasPost({ action: 'marcarManilla', id });
      if (!resp.ok) throw new Error(resp.error || 'Error desconocido');

      // actualizar en memoria
      const p = participantes.find(x => x.id === id);
      if (p) p.manilla = 'ENTREGADA';

      // actualizar cache
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          const idx = arr.findIndex(x => x.id === id);
          if (idx >= 0) arr[idx].manilla = 'ENTREGADA';
          localStorage.setItem(CACHE_KEY, JSON.stringify(arr));
        }
      } catch(e) {}

      // actualizar card visualmente sin re-renderizar todo
      const card = document.getElementById('card-' + id);
      if (card) {
        card.classList.add('entregada');
        const btnEl = document.getElementById('btn-' + id);
        if (btnEl) btnEl.outerHTML = `<div class="btn-entregada-label">✅ Entregada</div>`;
        const avatar = card.querySelector('.p-avatar');
        if (avatar) avatar.style.background = 'linear-gradient(135deg, #1e8c3a, #0f5a24)';
      }

      // stats
      const totalEntregadas = participantes.filter(p => p.manilla === 'ENTREGADA').length;
      document.getElementById('stat-entregadas').textContent = totalEntregadas;
      document.getElementById('stat-pendientes').textContent = participantes.length - totalEntregadas;

      showToast(`✅ Manilla entregada — ${p ? (p.robot || p.nombre) : id}`);
    } catch(e) {
      showToast('Error: ' + e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = '🎫 Entregar'; }
    } finally {
      entregando.delete(id);
    }
  }

  document.getElementById('filtro-cat').addEventListener('change', renderLista);
  document.getElementById('busqueda').addEventListener('input', renderLista);

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = error ? '#ff8080' : '#00ff88';
    t.style.borderColor = error ? 'rgba(255,100,100,0.4)' : 'rgba(0,255,136,0.4)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
