<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SucreBot — Escáner QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="../shared/js/config.js"></script>
  
  <link rel="stylesheet" href="../shared/css/styles.css">
  
  <style>
    :root {
      --cyan: #5bc8f0; --blue: #1a5ca8;
      --text: #ffffff; --text-dark: #0d1f42; --muted: #64748b; 
      --border: #2d4a6e;
      --surface: #0d2847; --surface2: #1a3a6b; --surface-light: #ffffff;
      --accent: #5bc8f0; --accent2: #ff6b35;
      --green: #3dd68c; --red: #ff3b3b;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }
    
    body { 
      background: linear-gradient(135deg, #f0f4f8 0%, #e1e8ed 100%) !important; 
      color: var(--text-dark) !important; 
      min-height: 100vh;
    }

    .esc-wrapper { max-width: 800px; margin: 0 auto; padding: 80px 20px 60px; }
    .esc-title { 
      font-family: var(--font-display); 
      font-size: 2.5rem; 
      letter-spacing: 0.08em; 
      color: var(--surface); 
      margin-bottom: 32px; 
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .cat-selector {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border: 2px solid var(--border);
      border-left: 6px solid var(--cyan);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(13, 40, 71, 0.3);
    }

    .cat-selector label {
      font-size: 0.7rem;
      color: var(--cyan);
      font-family: var(--font-mono);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .cat-selector select {
      width: 100%;
      background: var(--surface-light);
      border: 2px solid #e2e8f0;
      color: var(--surface);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cat-selector select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(91, 200, 240, 0.15);
    }

    .video-container {
      background: linear-gradient(135deg, var(--surface) 0%, #0a1e3a 100%);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(13, 40, 71, 0.4);
      position: relative;
      overflow: hidden;
    }

    #video {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #000;
    }

    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      border: 3px solid var(--cyan);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 30px rgba(91, 200, 240, 0.5);
      animation: pulse-border 2s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: var(--cyan); box-shadow: 0 0 30px rgba(91, 200, 240, 0.5); }
      50% { border-color: var(--green); box-shadow: 0 0 50px rgba(61, 214, 140, 0.7); }
    }

    .scan-status {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(13, 40, 71, 0.25);
    }

    .participante-card {
      background: linear-gradient(135deg, var(--surface-light) 0%, #f8fafc 100%);
      border: 2px solid #e2e8f0;
      border-left: 5px solid var(--cyan);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .participante-card h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--surface);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    .participante-card p {
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-dark);
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .participante-card strong {
      color: var(--surface);
      font-weight: 700;
    }

    .btn-enviar {
      width: 100%;
      background: linear-gradient(135deg, var(--green) 0%, #2ab870 100%);
      border: 2px solid #2ab870;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 16px rgba(61, 214, 140, 0.3);
      margin-bottom: 12px;
    }

    .btn-enviar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(61, 214, 140, 0.5);
    }

    .btn-enviar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-enviar.inactivo {
      background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
      border-color: #64748b;
      box-shadow: 0 4px 16px rgba(100, 116, 139, 0.2);
    }

    .btn-nuevo {
      width: 100%;
      background: linear-gradient(135deg, #e8f4ff 0%, #d0e8ff 100%);
      border: 2px solid var(--cyan);
      color: var(--blue);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      box-shadow: 0 4px 12px rgba(91, 200, 240, 0.2);
    }

    .btn-nuevo:hover {
      background: linear-gradient(135deg, #d0e8ff 0%, #b8dcff 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 200, 240, 0.3);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border: 2px solid var(--green);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 30px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(13, 40, 71, 0.5);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 680px) {
      .esc-wrapper { padding: 60px 10px 40px; }
      .esc-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

<div class="sticky-header">
  <div data-include="../shared/components/topbar.html"></div>
  <div data-include="../shared/components/header.html"></div>
  <div data-include="../shared/components/nav.html"></div>
</div>

<div class="esc-wrapper">
  <h1 class="esc-title">⚡ ESCÁNER QR</h1>

  <div class="cat-selector">
    <label>CATEGORÍA ACTIVA</label>
    <select id="select-categoria">
      <option value="">— Selecciona una categoría —</option>
      <option value="seguidor-velocidad-sin-turbina">Seguidor velocidad sin turbina</option>
      <option value="seguidor-velocidad-con-turbina">Seguidor velocidad con turbina</option>
      <option value="robot-laberinto">Robot laberinto</option>
      <option value="robot-balancin">Robot Balancín</option>
      <option value="robot-trepador">Robot trepador</option>
      <option value="seguidor-destreza">Seguidor destreza</option>
      <option value="drones">Drones</option>
      <option value="insectos">Insectos</option>
    </select>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline></video>
    <div class="scan-overlay"></div>
  </div>

  <div class="scan-status" id="status">Iniciando escáner...</div>

  <div id="participante-info" style="display: none;">
    <div class="participante-card">
      <h3 id="p-robot">—</h3>
      <p><strong>Nombre:</strong> <span id="p-nombre">—</span></p>
      <p><strong>Institución:</strong> <span id="p-institucion">—</span></p>
      <p><strong>Categoría:</strong> <span id="p-categoria">—</span></p>
      <p><strong>ID:</strong> <span id="p-id">—</span></p>
    </div>

    <button class="btn-enviar inactivo" id="btn-enviar" onclick="enviarAlAdmin()">⚡ Enviar al cronómetro</button>
    <button class="btn-nuevo" onclick="nuevoEscaneo()">🔄 Nuevo escaneo</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../shared/js/load-components.js"></script>
<script src="../shared/js/auth.js"></script>

<script>
  const GAS_URL = CONFIG.GAS_URL();
  let codeReader = null;
  let videoStream = null;
  let categoriaActual = null;
  let participanteActual = null;

  // Selección de categoría
  document.getElementById('select-categoria').addEventListener('change', function() {
    categoriaActual = this.value;
    if (categoriaActual) {
      showToast('✓ Categoría seleccionada: ' + categoriaActual);
      document.getElementById('btn-enviar').classList.remove('inactivo');
    } else {
      document.getElementById('btn-enviar').classList.add('inactivo');
    }
  });

  // Iniciar escáner
  async function iniciarScanner() {
    try {
      codeReader = new ZXing.BrowserMultiFormatReader();
      const videoInputDevices = await codeReader.listVideoInputDevices();

      if (videoInputDevices.length === 0) {
        showToast('No se detectaron cámaras', true);
        return;
      }

      // Estrategia de selección de cámara
      let selectedDeviceId = null;

      // Estrategia 1: Buscar por label (back/rear/environment/trasera)
      const backCamera = videoInputDevices.find(device =>
        /back|rear|environment|trasera/i.test(device.label)
      );

      if (backCamera) {
        selectedDeviceId = backCamera.deviceId;
      } else if (videoInputDevices.length > 1) {
        // Estrategia 2: Si hay múltiples cámaras, usar la última (típicamente es la trasera)
        selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
      } else {
        // Estrategia 3: Usar la única cámara disponible
        selectedDeviceId = videoInputDevices[0].deviceId;
      }

      document.getElementById('status').textContent = '📷 Escáner activo - Apunta al código QR';

      codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
        if (result) {
          procesarQR(result.text);
        }
      });

      // Guardar stream para poder detenerlo después
      const video = document.getElementById('video');
      videoStream = video.srcObject;

    } catch (error) {
      console.error('Error al iniciar escáner:', error);
      showToast('Error al iniciar la cámara', true);
    }
  }

  async function procesarQR(qrData) {
    try {
      const participante = JSON.parse(qrData);

      if (!participante.id) {
        showToast('QR inválido - No tiene ID', true);
        return;
      }

      participanteActual = participante;

      // Actualizar UI
      document.getElementById('p-robot').textContent = participante.robot || '—';
      document.getElementById('p-nombre').textContent = participante.nombre || '—';
      document.getElementById('p-institucion').textContent = participante.institucion || '—';
      document.getElementById('p-categoria').textContent = participante.categoria || '—';
      document.getElementById('p-id').textContent = participante.id || '—';

      document.getElementById('participante-info').style.display = 'block';
      document.getElementById('status').textContent = '✓ QR escaneado correctamente';

      // NO detener el escáner aquí - dejar que siga activo
      // El usuario puede escanear otro QR sin tener que reiniciar

      showToast('✓ Participante cargado: ' + participante.robot);

    } catch (error) {
      console.error('Error al procesar QR:', error);
      showToast('QR inválido - Formato incorrecto', true);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ENVIAR AL CRONÓMETRO - CORREGIDO
  // ═══════════════════════════════════════════════════════════
  
  async function enviarAlAdmin() {
    const btn = document.getElementById('btn-enviar');
    if (btn.classList.contains('inactivo')) {
      showToast('⚠️ Selecciona una categoría primero', true);
      return;
    }

    if (!participanteActual) {
      showToast('⚠️ No hay participante escaneado', true);
      return;
    }

    if (!categoriaActual) {
      showToast('⚠️ Selecciona una categoría primero', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Enviando...';

    try {
      // CORRECCIÓN: Usar POST con el participante completo
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'setActivo',
          ruta: categoriaActual,
          participante: participanteActual
        })
      });

      const data = await response.json();

      if (data.ok) {
        showToast('✓ Enviado al cronómetro correctamente');
        btn.textContent = '✓ Enviado';
        
        // CORRECCIÓN: Detener escáner después de enviar exitosamente
        stopScanner();
        
        setTimeout(() => {
          btn.textContent = '⚡ Enviar al cronómetro';
          btn.disabled = false;
        }, 2000);
      } else {
        throw new Error(data.error || 'Error desconocido');
      }
    } catch (error) {
      showToast('Error al enviar: ' + error.message, true);
      btn.textContent = '⚡ Enviar al cronómetro';
      btn.disabled = false;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // DETENER ESCÁNER - LIMPIEZA COMPLETA
  // ═══════════════════════════════════════════════════════════
  
  function stopScanner() {
    // Detener el lector de códigos ZXing
    if (codeReader) {
      codeReader.reset();
    }

    // Detener todos los tracks del stream de video
    if (videoStream) {
      const tracks = videoStream.getTracks();
      tracks.forEach(track => track.stop());
      videoStream = null;
    }

    // Limpiar el elemento de video
    const video = document.getElementById('video');
    if (video.srcObject) {
      video.srcObject = null;
    }

    document.getElementById('status').textContent = '📷 Escáner detenido';
  }

  function nuevoEscaneo() {
    participanteActual = null;
    document.getElementById('participante-info').style.display = 'none';
    document.getElementById('status').textContent = '📷 Escáner activo - Apunta al código QR';
    
    // Reiniciar el escáner
    if (!codeReader) {
      iniciarScanner();
    }
    
    showToast('🔄 Listo para nuevo escaneo');
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = error ? '#ff3b3b' : var(--green);
    t.style.color = error ? '#ff3b3b' : var(--green);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Iniciar al cargar
  document.addEventListener('componentsLoaded', function() {
    const savedUser = localStorage.getItem('sucrebot_user');
    if (!savedUser) {
      window.location.href = '../INICIO/';
      return;
    }

    iniciarScanner();
  });
</script>

</body>
</html>
